server {
    listen 80;

    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;

    types {
        application/javascript js jsx;
    }

    absolute_redirect off;

    location = / {
        return 301 /portal/;
    }

    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
