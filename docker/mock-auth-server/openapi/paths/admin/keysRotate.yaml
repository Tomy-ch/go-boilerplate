post:
  operationId: AdminRotateKeys
  tags:
    - admin
  summary: 署名鍵ローテーション
  description: >
    宣言的操作（add-key / promote / retire）で provider の署名鍵状態を遷移する。
    JWKS の公開集合と現署名鍵を分離管理し、新旧 Token の並行検証・旧鍵退役を再現する。
    Phase1 への復帰は POST /admin/reset。dev-gate 限定。
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/KeyRotationRequest.yaml'
  responses:
    '200':
      description: 操作後の鍵状態
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/KeyState.yaml'
    '400':
      description: 不正な操作（未知 / 退役不能 kid・不正遷移・不正リクエスト）
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/OAuthError.yaml'
