post:
  operationId: OidcToken
  tags:
    - oidc
  summary: トークンエンドポイント（authorization_code + PKCE 検証）
  description: >
    form-urlencoded で受け取り、code の単回 consume・PKCE(S256) code_verifier 検証・redirect_uri 完全一致を行う。
    成功時に access_token + id_token を発行する。public client のため client 認証は none。
  security: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - grant_type
            - code
            - redirect_uri
            - client_id
            - code_verifier
          properties:
            grant_type:
              type: string
              enum:
                - authorization_code
            code:
              type: string
              description: authorize で発行した認可コード（単回使用）。
            redirect_uri:
              type: string
              format: uri
              description: authorize 時と完全一致する必要がある。
            client_id:
              type: string
            code_verifier:
              type: string
              description: PKCE の code_verifier（S256 で code_challenge と照合）。
  responses:
    '200':
      description: トークン発行成功
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/TokenResponse.yaml'
    '400':
      description: grant / code / PKCE 検証に失敗
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/OAuthError.yaml'
