openapi: 3.0.3
info:
  title: Mock Auth Server (OIDC Provider)
  version: 1.0.0
  description: |
    ローカル開発用の疑似 OIDC Provider。Authorization Code Flow + PKCE(S256) を最小構成で提供する。

    本サービスは go-boilerplate 本体とは別サービスであり、OpenAPI をこのディレクトリ配下にローカルで持つ
    （主 API 契約 `openapi/` は汚さない）。エンドポイントは 3 系統に分かれる:

    - `/oidc/*` — OAuth2 / OIDC 標準エンドポイント（authorize / token / userinfo / logout）。
    - `/bypass/*` — テスト用ショートカット（固定 Profile での token / session 発行）。dev-gate 限定。
    - `/admin/*` — 運用補助（fixture reset / users 一覧 / key rotate スタブ）。dev-gate 限定。

    パラメータ・フィールドは OAuth2(RFC 6749) / PKCE(RFC 7636) / RFC 9068 / OIDC Core に従い snake_case。
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:4000
    description: Local development server
security: []
tags:
  - name: discovery
    description: OIDC Discovery / JWKS（公開メタデータ）。
  - name: health
    description: ヘルスチェック（liveness）。
  - name: oidc
    description: OAuth2 / OIDC 標準エンドポイント（Authorization Code Flow + PKCE）。
  - name: bypass
    description: テスト用ショートカット（固定 Profile 発行）。dev-gate 限定。
  - name: admin
    description: 運用補助（fixture reset / users 一覧 / key rotate）。dev-gate 限定。
paths:
  /health:
    get:
      operationId: GetHealth
      tags:
        - health
      summary: ヘルスチェック
      security: []
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /.well-known/openid-configuration:
    get:
      operationId: GetOpenidConfiguration
      tags:
        - discovery
      summary: OIDC Discovery 文書の取得
      security: []
      responses:
        '200':
          description: OIDC Discovery 文書
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfiguration'
  /.well-known/jwks.json:
    get:
      operationId: GetJwks
      tags:
        - discovery
      summary: JWK Set の取得
      security: []
      responses:
        '200':
          description: 署名検証用の公開鍵一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
  /oidc/authorize:
    get:
      operationId: OidcAuthorize
      tags:
        - oidc
      summary: 認可リクエスト（Authorization Code Flow + PKCE S256）
      description: |
        client_id / redirect_uri を完全一致で検証する。両者が不正でリダイレクト不能な場合のみ 400（JSON）、 それ以外の不正は redirect_uri へ 302 の error redirect（state を反映）で返す。成功時は code を付与して 302。
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: nonce
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum:
              - S256
      responses:
        '302':
          description: code 発行、または redirect_uri への OAuth error redirect
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '400':
          description: client_id / redirect_uri が不正でリダイレクト不能な場合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /oidc/token:
    post:
      operationId: OidcToken
      tags:
        - oidc
      summary: トークンエンドポイント（authorization_code + PKCE 検証）
      description: |
        form-urlencoded で受け取り、code の単回 consume・PKCE(S256) code_verifier 検証・redirect_uri 完全一致を行う。 成功時に access_token + id_token を発行する。public client のため client 認証は none。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - code
                - redirect_uri
                - client_id
                - code_verifier
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                code:
                  type: string
                  description: authorize で発行した認可コード（単回使用）。
                redirect_uri:
                  type: string
                  format: uri
                  description: authorize 時と完全一致する必要がある。
                client_id:
                  type: string
                code_verifier:
                  type: string
                  description: PKCE の code_verifier（S256 で code_challenge と照合）。
      responses:
        '200':
          description: トークン発行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: grant / code / PKCE 検証に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /oidc/userinfo:
    get:
      operationId: OidcUserinfo
      tags:
        - oidc
      summary: UserInfo エンドポイント
      description: |
        Bearer access token を必須とし、対応する subject の claim を whitelist で返す。 ID Token（typ != at+jwt）は拒否する。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: UserInfo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Bearer 不正・欠如、または access token でない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /oidc/logout:
    post:
      operationId: OidcLogout
      tags:
        - oidc
      summary: ログアウト（RP-Initiated Logout）
      description: |
        session を破棄し、post_logout_redirect_uri が登録済みなら 302 で戻す（state 反映）。 未登録の redirect や不正時は 400。
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token_hint:
                  type: string
                  description: ログアウト対象を示す ID Token（任意）。
                post_logout_redirect_uri:
                  type: string
                  format: uri
                  description: 登録済みの post-logout リダイレクト先。
                state:
                  type: string
      responses:
        '302':
          description: post_logout_redirect_uri への redirect
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '400':
          description: post_logout_redirect_uri が未登録・不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /bypass/token:
    post:
      operationId: BypassToken
      tags:
        - bypass
      summary: 固定 Profile での access token 発行（テスト用）
      description: |
        Authorization Code Flow を経ずに、subject と固定 Profile から access token を直接発行する。 異常系 Profile（expired / wrong-issuer 等）で Go 側検証を試験する。dev-gate 限定。旧 POST /test/token の移行先。
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: 発行対象の subject。省略時は fixture 先頭。
                profile:
                  type: string
                  description: 発行 Profile。異常系を固定 Profile として選択する。
                  enum:
                    - valid
                    - expired
                    - not-yet-valid
                    - wrong-issuer
                    - wrong-audience
                    - missing-subject
                    - invalid-signature
                    - unsupported-algorithm
                    - id-token
      responses:
        '200':
          description: 発行した access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: 未知の Profile 等
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /bypass/session:
    post:
      operationId: BypassSession
      tags:
        - bypass
      summary: 疑似ログインセッションの直接発行（テスト用）
      description: |
        authorize の UI を経ずに、subject に対するログイン済み session を直接作成する。 logout / RP-Initiated Logout の試験に使う。dev-gate 限定。
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: ログインさせる subject。省略時は fixture 先頭。
      responses:
        '200':
          description: 作成した session
          content:
            application/json:
              schema:
                type: object
                required:
                  - session_id
                  - subject
                properties:
                  session_id:
                    type: string
                    description: 発行された session 識別子。
                  subject:
                    type: string
        '400':
          description: 不正なリクエスト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /admin/users:
    get:
      operationId: AdminListUsers
      tags:
        - admin
      summary: 固定 User Fixture の一覧取得
      description: 登録済みの疑似ユーザー一覧を返す。dev-gate 限定。旧 GET /test/users の移行先。
      security: []
      responses:
        '200':
          description: ユーザー一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersResponse'
  /admin/reset:
    post:
      operationId: AdminReset
      tags:
        - admin
      summary: 揮発ストアのリセット
      description: 発行済み code / session 等の揮発ストアを初期化する。fixture（users / clients）は再読込する。dev-gate 限定。
      security: []
      responses:
        '200':
          description: リセット完了
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - reset
                    example: reset
  /admin/keys/rotate:
    post:
      operationId: AdminRotateKeys
      tags:
        - admin
      summary: 署名鍵ローテーション（未実装スタブ）
      description: |
        署名鍵のローテーション契約のみを定義する。実ローテーションは #605(#585-C) で実装するため、 本 PBI では 501 Not Implemented を返す。dev-gate 限定。
      security: []
      responses:
        '501':
          description: 未実装（契約のみ）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      description: UserInfo 取得に access token（Bearer）を用いる。
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OAuthError:
      type: object
      description: |
        OAuth2 / OIDC のエラーレスポンス（RFC 6749）。リダイレクト不能時は JSON body として、 リダイレクト可能時は error / error_description / state を query に載せて 302 で返す。
      required:
        - error
      properties:
        error:
          type: string
          description: 機械可読なエラーコード（RFC 6749）。
          example: invalid_request
        error_description:
          type: string
          description: 人間可読の補足説明。
          example: code_challenge is required
        error_uri:
          type: string
          format: uri
          description: エラー詳細ドキュメントの URI（任意）。
        state:
          type: string
          description: リクエストの state を反映する（CSRF 対策・任意）。
    TokenResponse:
      type: object
      description: |
        トークンレスポンス（RFC 6749 / OIDC Core）。access_token は RFC 9068（typ=at+jwt）、 id_token は OIDC の ID Token。bypass 経路では固定 Profile の access_token を返す。
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: |
            RS256 署名の JWT アクセストークン（正常時は typ=at+jwt）。/bypass/token の異常系 Profile （id-token / wrong-issuer 等）ではこのフィールドに typ / aud / exp / 署名が意図的に改変された トークンが入る（Go 側検証の試験用）。
        token_type:
          type: string
          enum:
            - Bearer
          description: トークン種別。常に Bearer。
        expires_in:
          type: integer
          format: int32
          description: access_token の有効期間（秒）。
          example: 300
        scope:
          type: string
          description: 付与されたスコープ（スペース区切り）。
          example: openid profile email api.read api.write
        id_token:
          type: string
          description: OIDC ID Token（openid スコープ時のみ）。
    OidcConfiguration:
      type: object
      description: |
        OIDC Discovery 文書（OIDC Discovery）。issuer / jwks_uri は Go 側認証が依存する契約であり不変に保つ。 endpoint URL は /oidc/* を指す。
      required:
        - issuer
        - jwks_uri
        - authorization_endpoint
        - token_endpoint
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
        - code_challenge_methods_supported
      properties:
        issuer:
          type: string
          format: uri
          description: 発行者識別子。token の iss と厳密一致する（不変）。
          example: http://localhost:4000
        jwks_uri:
          type: string
          format: uri
          description: JWK Set の URL（不変）。
          example: http://localhost:4000/.well-known/jwks.json
        authorization_endpoint:
          type: string
          format: uri
          example: http://localhost:4000/oidc/authorize
        token_endpoint:
          type: string
          format: uri
          example: http://localhost:4000/oidc/token
        userinfo_endpoint:
          type: string
          format: uri
          example: http://localhost:4000/oidc/userinfo
        end_session_endpoint:
          type: string
          format: uri
          example: http://localhost:4000/oidc/logout
        response_types_supported:
          type: array
          items:
            type: string
          example:
            - code
        grant_types_supported:
          type: array
          items:
            type: string
          example:
            - authorization_code
        subject_types_supported:
          type: array
          items:
            type: string
          example:
            - public
        id_token_signing_alg_values_supported:
          type: array
          description: 署名アルゴリズムは RS256 のみ。alg=none は発行しない。
          items:
            type: string
            enum:
              - RS256
          example:
            - RS256
        scopes_supported:
          type: array
          items:
            type: string
          example:
            - openid
            - profile
            - email
        token_endpoint_auth_methods_supported:
          type: array
          description: public client（PKCE）のみを許可するため none。
          items:
            type: string
            enum:
              - none
          example:
            - none
        code_challenge_methods_supported:
          type: array
          description: PKCE は S256 のみ。plain は許可しない。
          items:
            type: string
            enum:
              - S256
          example:
            - S256
        claims_supported:
          type: array
          items:
            type: string
          example:
            - sub
            - iss
            - aud
            - exp
            - iat
            - nbf
            - email
            - name
    Jwks:
      type: object
      description: |
        JSON Web Key Set（RFC 7517）。公開鍵のみを含む。Go 側の署名検証が依存する契約であり、 鍵（kid=mock-key-1 / RS256）はバイト等価で不変に保つ。
      required:
        - keys
      properties:
        keys:
          type: array
          description: 署名検証用の公開鍵一覧。
          items:
            type: object
            required:
              - kty
              - kid
              - alg
              - 'n'
              - e
            properties:
              kty:
                type: string
                example: RSA
              kid:
                type: string
                example: mock-key-1
              use:
                type: string
                example: sig
              alg:
                type: string
                example: RS256
              'n':
                type: string
                description: RSA modulus（base64url）。
              e:
                type: string
                description: RSA exponent（base64url）。
                example: AQAB
    UserInfo:
      type: object
      description: |
        UserInfo レスポンス（OIDC Core）。返却フィールドは whitelist に限定し、 additionalProperties: false で余剰クレームの漏洩を防ぐ。
      additionalProperties: false
      required:
        - sub
      properties:
        sub:
          type: string
          description: Subject 識別子。
          example: user-john-doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        email_verified:
          type: boolean
          example: true
        given_name:
          type: string
          example: John
        family_name:
          type: string
          example: Doe
        name:
          type: string
          example: John Doe
    AdminUsersResponse:
      type: object
      description: 固定 User Fixture の一覧（運用補助）。
      required:
        - users
      properties:
        users:
          type: array
          description: 登録済みの疑似ユーザー一覧。
          items:
            type: object
            required:
              - subject
              - email
              - given_name
              - family_name
              - name
              - status
            properties:
              subject:
                type: string
                example: user-john-doe
              email:
                type: string
                format: email
                example: john.doe@example.com
              given_name:
                type: string
                example: John
              family_name:
                type: string
                example: Doe
              name:
                type: string
                example: John Doe
              status:
                type: string
                description: fixture 上の状態（active / deleted 等）。
                example: active
    HealthStatus:
      type: object
      description: ヘルスチェックの結果。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
