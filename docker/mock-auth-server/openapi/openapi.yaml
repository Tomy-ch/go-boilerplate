openapi: 3.0.3
info:
  title: Mock Auth Server (OIDC Provider)
  version: 1.0.0
  description: |
    ローカル開発用の疑似 OIDC Provider。Authorization Code Flow + PKCE(S256) を最小構成で提供する。

    本サービスは go-boilerplate 本体とは別サービスであり、OpenAPI をこのディレクトリ配下にローカルで持つ
    （主 API 契約 `openapi/` は汚さない）。エンドポイントは 3 系統に分かれる:

    - `/oidc/*` — OAuth2 / OIDC 標準エンドポイント（authorize / token / userinfo / logout）。
    - `/bypass/*` — テスト用ショートカット（固定 Profile での token / session 発行）。dev-gate 限定。
    - `/admin/*` — 運用補助（fixture reset / users 一覧 / key rotate スタブ）。dev-gate 限定。

    パラメータ・フィールドは OAuth2(RFC 6749) / PKCE(RFC 7636) / RFC 9068 / OIDC Core に従い snake_case。
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:4000
    description: Local development server
tags:
  - name: discovery
    description: OIDC Discovery / JWKS（公開メタデータ）。
  - name: health
    description: ヘルスチェック（liveness）。
  - name: oidc
    description: OAuth2 / OIDC 標準エンドポイント（Authorization Code Flow + PKCE）。
  - name: bypass
    description: テスト用ショートカット（固定 Profile 発行）。dev-gate 限定。
  - name: admin
    description: 運用補助（fixture reset / users 一覧 / key rotate）。dev-gate 限定。
security: []
paths:
  /health:
    $ref: './paths/health.yaml'
  /.well-known/openid-configuration:
    $ref: './paths/wellKnown/openidConfiguration.yaml'
  /.well-known/jwks.json:
    $ref: './paths/wellKnown/jwks.yaml'
  /oidc/authorize:
    $ref: './paths/oidc/authorize.yaml'
  /oidc/token:
    $ref: './paths/oidc/token.yaml'
  /oidc/userinfo:
    $ref: './paths/oidc/userinfo.yaml'
  /oidc/logout:
    $ref: './paths/oidc/logout.yaml'
  /bypass/token:
    $ref: './paths/bypass/token.yaml'
  /bypass/session:
    $ref: './paths/bypass/session.yaml'
  /admin/users:
    $ref: './paths/admin/users.yaml'
  /admin/reset:
    $ref: './paths/admin/reset.yaml'
  /admin/keys/rotate:
    $ref: './paths/admin/keysRotate.yaml'
components:
  securitySchemes:
    BearerAuth:
      $ref: './components/schemas/BearerAuth.yaml'
  schemas:
    OAuthError:
      $ref: './components/schemas/OAuthError.yaml'
    TokenResponse:
      $ref: './components/schemas/TokenResponse.yaml'
    OidcConfiguration:
      $ref: './components/schemas/OidcConfiguration.yaml'
    Jwks:
      $ref: './components/schemas/Jwks.yaml'
    KeyRotationRequest:
      $ref: './components/schemas/KeyRotationRequest.yaml'
    KeyState:
      $ref: './components/schemas/KeyState.yaml'
    UserInfo:
      $ref: './components/schemas/UserInfo.yaml'
    AdminUsersResponse:
      $ref: './components/schemas/AdminUsersResponse.yaml'
    HealthStatus:
      $ref: './components/schemas/HealthStatus.yaml'
