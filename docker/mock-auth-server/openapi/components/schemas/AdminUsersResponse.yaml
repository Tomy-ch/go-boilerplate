type: object
description: 固定 User Fixture の一覧（運用補助）。
required:
  - users
properties:
  users:
    type: array
    description: 登録済みの疑似ユーザー一覧。
    items:
      type: object
      required:
        - subject
        - email
        - given_name
        - family_name
        - name
        - status
      properties:
        subject:
          type: string
          example: user-john-doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        given_name:
          type: string
          example: John
        family_name:
          type: string
          example: Doe
        name:
          type: string
          example: John Doe
        status:
          type: string
          description: fixture 上の状態（active / deleted 等）。
          example: active
