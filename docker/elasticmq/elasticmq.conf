// ローカル開発用 ElasticMQ（SQS 互換ブローカー）のキュー定義。
// キューは起動時にこのファイルから作成されるため、初期化用の one-shot コンテナを持たない。
// 接続先・キュー名は Go 側の env と一致していなければならないが、ElasticMQ の設定は
// 環境変数を展開しないため、ここでは値を直書きし env/README.md 側に対応を明記する。

include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  // AWS SDK が本番 SQS と同じ制約で動くことを確かめたいので strict にする。
  sqs-limits = strict
}

queues {
  // DLQ を先に宣言する（redrive 先が未定義だと参照側の作成が失敗するため）。
  gobp-events-dlq {
    defaultVisibilityTimeout = 30 seconds
  }

  gobp-events {
    defaultVisibilityTimeout = 30 seconds
    // maxReceiveCount 超過で DLQ へ退避する。worker の FailureHandler とは別レイヤで、
    // Handler が Permanent を返さないまま繰り返し失敗する poison message の最終防波堤。
    deadLettersQueue {
      name = "gobp-events-dlq"
      maxReceiveCount = 5
    }
  }
}
