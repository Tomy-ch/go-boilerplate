# gitleaks 設定
# https://github.com/gitleaks/gitleaks#configuration
[extend]
useDefault = true

[allowlist]
description = "生成ファイルは機械生成で秘密の置き場所ではないため除外する"
paths = [
  '''.*\.gen\.go$''',
  '''.*\.sql\.go$''',
  '''.*_mock\.go$''',
  '''.*/mock_.*\.go$''',
  '''openapi/openapi\.gen\.yaml$''',
  # graphify の抽出キャッシュ。内容アドレス指定の索引で、SHA-256 の羅列が generic-api-key に
  # 当たる。gitignore 済みでコミットされ得ないため、ここを外しても走査範囲は狭まらない
  # （追跡する graphify-out/ の成果物は対象のまま）。gitleaks の dir 走査は gitignore を見ない。
  '''graphify-out/cache/''',
  # pnpm のパッケージストア。内容アドレス指定でファイル名が SHA の羅列になり、同梱物と
  # あわせて generic-api-key / jwt に当たる。gitignore 済みでコミットされ得ないため、
  # graphify のキャッシュと同じ理由でここを外しても走査範囲は狭まらない。
  '''\.pnpm-store/''',
  '''docs/openapi/''',
  '''docs/coverage/''',
  '''docs/db-schema/''',
  '''docs/godoc/''',
  '''docs/portal/docs\.json$''',
  '''docs/portal/guides/''',
]
