# リポジトリ補助スクリプト（scripts/）とドキュメント系ツールの依存解決設定。
# このディレクトリで閉じた 1 パッケージとして宣言し、tool-runner イメージも CI もここを install 先に指す。

packages:
  - "."

# ----- 時間差防御 -----
# 公開直後の版を解決対象から外す。docs-viewer と窓を揃える（pnpm は分指定。7 日 = 10080 分）。
minimumReleaseAge: 10080
# 緊急のセキュリティ修正は、影響を受ける特定バージョンだけを一時的に例外化する。(パッケージ名だけの例外は禁止)
minimumReleaseAgeExclude:
  - js-yaml@4.3.1 # 2026-08-08 02:40 JST 以降に削除する。GHSA-5p4m-2wfm-xmqj の修正版で、tool-runner 内のビルド時にのみ動く。
# 冷却期間を満たす版が無ければ解決を失敗させる。
minimumReleaseAgeStrict: true
# 公開日時を返さないレジストリの依存は解決を失敗させる。
minimumReleaseAgeIgnoreMissingTime: false

# 依存状態が lockfile と一致しないままスクリプトを実行しない。
verifyDepsBeforeRun: error

# mise.toml[SSOT] と同じ Node.js 版を依存の engine 判定にも使う。
nodeVersion: 24.18.0
# Node.js の対応範囲外を宣言する依存の導入を拒否する。
engineStrict: true

# ----- 実行制御 -----
# 未レビューの依存ライフサイクルスクリプトを install エラーにする。
strictDepBuilds: true
# 依存ライフサイクルスクリプトの実行可否をパッケージ単位で明示する。
allowBuilds:
  '@scarf/scarf': false
  esbuild: false

# ----- 公開元の信頼性 -----
# 間接依存による Git・URL などの非標準ソースを拒否する。
blockExoticSubdeps: true
# 過去より弱い provenance に下がった版の導入を拒否する。
trustPolicy: no-downgrade
# 公開から180日を過ぎた版は provenance 情報不足だけでは拒否しない。
trustPolicyIgnoreAfter: 259200
# provenance の後退は、影響を受ける特定バージョンだけを一時的に例外化する。(パッケージ名だけの例外は禁止)
trustPolicyExclude:
  - rollup@2.80.0 # 2026-08-21 以降に削除する。spectral が引く v2 系の保守リリースで、npm 時代の lockfile が解決していた版と同一。

# ----- 依存の差し替え -----
# pnpm は親子の直接辺しか指せないため、親ではなく「解決結果がこの版域に落ちたら」で書く。
overrides:
  # 解析器を 1 実装へ揃える。複数版が同居すると Lint 結果が呼び出し経路で変わる。
  js-yaml: 4.3.1
  # spectral が引く巨大な spec 束を 1 版へ寄せ、重複展開を避ける。
  "@asyncapi/specs": 6.11.1
  # v1 系のみ DoS 修正版を下限にする。1.1.17 は中間配列の膨張（CVE-2026-69152）が残る。
  "brace-expansion@1": ">=1.1.18 <2"
  "lodash@<4.18.0": 4.18.0
  # authority の backslash を経路区切りと読む実装差（CVE-2026-18446）を塞ぐ。
  "fast-uri@<3.1.5": ">=3.1.5 <4"
  "dompurify@<3.4.12": ">=3.4.12 <4"
