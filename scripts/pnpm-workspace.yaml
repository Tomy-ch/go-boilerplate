# リポジトリ補助スクリプト（scripts/）とドキュメント系ツールの依存解決設定。
# このディレクトリで閉じた 1 パッケージとして宣言する。

packages:
  - "."

# ----- 時間差防御 -----
# 公開直後の版を解決対象から外す（pnpm は分指定。7 日 = 10080 分）。窓の設計は docs/design/security.md。
minimumReleaseAge: 10080
# 緊急のセキュリティ修正は特定バージョンだけを一時的に例外化する（package@version 必須。パッケージ名だけの例外は禁止）。
# 期限は .github/pnpm-cooldown-bypass.toml が持つ。ここへ足したら向こうにも expires / issue / reason を
# 書くこと。期限の無い例外・期限切れ・上限 3 ヶ月超過・lockfile が解決していない版は
# make pnpm-cooldown-check が落とす。
minimumReleaseAgeExclude: []
# 冷却期間を満たす版が無ければ解決を失敗させる。
minimumReleaseAgeStrict: true
# 公開日時を返さないレジストリの依存は解決を失敗させる。
minimumReleaseAgeIgnoreMissingTime: false

# 依存状態が lockfile と一致しないままスクリプトを実行しない。
verifyDepsBeforeRun: error

# mise.toml[SSOT] と同じ Node.js 版を依存の engine 判定にも使う。
nodeVersion: 24.18.0
# Node.js の対応範囲外を宣言する依存の導入を拒否する。
engineStrict: true

# ----- 実行制御 -----
# 未レビューの依存ライフサイクルスクリプトを install エラーにする。
strictDepBuilds: true
# 依存ライフサイクルスクリプトの実行可否をパッケージ単位で明示する。
allowBuilds:
  '@scarf/scarf': false
  esbuild: false

# ----- 公開元の信頼性 -----
# 間接依存による Git・URL などの非標準ソースを拒否する。
blockExoticSubdeps: true
# 過去より弱い provenance に下がった版の導入を拒否する。
trustPolicy: no-downgrade
# 公開から180日を過ぎた版は provenance 情報不足だけでは拒否しない。
trustPolicyIgnoreAfter: 259200
# provenance の後退も特定バージョンだけを一時的に例外化する（package@version 必須。パッケージ名だけの例外は禁止）。
trustPolicyExclude:
  - rollup@2.80.0 # 2026-08-21 以降に削除する。spectral が引く v2 系の保守リリースで、npm 時代の lockfile が解決していた版と同一。

# ----- 依存の差し替え -----
# pnpm は親子の直接辺しか指せないため、親ではなく「解決結果がこの版域に落ちたら」で書く。
overrides:
  # size が 0 のとき custom generator が無限ループする（GHSA-2v37-7h3g-55p8）。postcss が引く。
  "nanoid@3": ">=3.3.18 <4"
  # 解析器を 1 実装へ揃える。複数版が同居すると Lint 結果が呼び出し経路で変わる。
  js-yaml: 4.3.2
  # spectral が引く巨大な spec 束を 1 版へ寄せ、重複展開を避ける。
  "@asyncapi/specs": 6.11.1
  # v1 系の DoS 修正版を下限にする。1.1.17 は中間配列の膨張（CVE-2026-69152）、1.1.18 は
  # parseCommaParts の無制限再帰（GHSA-6j4f-fj2g-mc7p）が残る。
  "brace-expansion@1": ">=1.1.19 <2"
  # parseCommaParts の無制限再帰による DoS（GHSA-6j4f-fj2g-mc7p）。minimatch が引く。
  "brace-expansion@5": ">=5.0.10 <6"
  # linkify 有効時の二乗時間経路による DoS（GHSA-253c-mchw-3w2r）と、複数行の link reference
  # definition 1 つで描画が二乗時間になる DoS（GHSA-gfr2-rv44-r23c）。typedoc が引く。
  "markdown-it@<14.3.3": ">=14.3.3 <15"
  # 制約付きコレクションの検証で巨大な入力がメモリを使い切る（GHSA-mrhx-c7xc-m3w5）。@scalar/types が引く。
  "zod@<4.6.6": ">=4.6.6 <5"
  # Windows で launch-editor の存在確認を迂回される（GHSA-587h-7wmj-h5pm ほか）。vitest が引く。
  "vite@<8.2.4": ">=8.2.4 <9"
  "lodash@<4.18.0": 4.18.0
  # authority の backslash を経路区切りと読む実装差（CVE-2026-18446）に加え、IDN 正規化の
  # スキップと percent-encode されたスキームによる host 混同、および malformed / 反復
  # authority を経由した SSRF（GHSA-5jgf-p345-68v8 / f65p-4m7j-42xc / fph4-wmhf-6fwf /
  # jqff-g426-hqxp）と、閉じない角括弧による host 混同（GHSA-58mr-gqgx-xq4g）を塞ぐ。
  "fast-uri@<3.1.7": ">=3.1.7 <4"
  # IN_PLACE で node を除去する afterSanitize hook が切り離された部分木を実行可能なまま残す
  # （GHSA-55q2-fjhq-7xh7 / GHSA-p98j-92pf-mc4p / GHSA-mrv2-3pqr-j5jr）と、SAFE_FOR_TEMPLATES が
  # shadow root 内で分割された template 式を残す（GHSA-cg2g-xh64-v4q7）。mermaid が引く。
  "dompurify@<3.4.17": ">=3.4.17 <4"
  # 過剰な content-encoding の未処理エラーによる DoS（GHSA-xjj6-f33q-929c）。@scalar/json-magic が引く。
  "undici@<7.30.1": ">=7.30.1 <8"
  # indexed source map の section offset によるイベントループの DoS（GHSA-68fv-2mgg-jv7q）。magicast が引く。
  "source-map-js@<1.2.2": ">=1.2.2 <2"
  # settings 経由のプロトタイプ汚染で trust 制限を迂回される（GHSA-238p-pmpm-9mq7）。mermaid が引く。
  # mermaid の宣言は ^0.16 だが、0.18 系の破壊的変更は CSS クラスの接頭辞化と内部 API だけで、
  # mermaid が呼ぶ renderToString には及ばない。
  "katex@<0.18.2": ">=0.18.2 <0.19"
