# Codex loads this project configuration after the project is trusted.
# Detailed command and path constraints remain canonical in AGENTS.md.

# Keep work autonomous inside the trusted workspace.
sandbox_mode = "workspace-write"
approval_policy = "never"
allow_login_shell = false

[sandbox_workspace_write]
exclude_slash_tmp = true
exclude_tmpdir_env_var = true
network_access = true

[features]
# Repository skills delegate independent read-only reviews to .codex/agents/.
multi_agent = true
