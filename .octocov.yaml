coverage:
  paths:
    - coverage.out
codeToTestRatio:
  # production code 判定は .makefiles/go/test.mk の除外集合
  # (gen|cmd|mock|apperror|scripts) と一致させる。cli はコア純粋層としてテスト対象に含めるため除外しない。
  # ディレクトリ除外はセグメント横断のため '**/<dir>/**/*.go' 形に統一する。
  code:
    - '**/*.go'
    - '!**/*_test.go'
    - '!**/*.gen.go'
    - '!**/mock_*.go'
    - '!**/gen/**/*.go'
    - '!**/cmd/**/*.go'
    - '!**/mock/**/*.go'
    - '!**/apperror/**/*.go'
    - '!**/scripts/**/*.go'
  test:
    - '**/*_test.go'
testExecutionTime:
  if: true
comment:
  if: is_pull_request
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
