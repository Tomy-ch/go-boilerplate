# Grype ignore policy.
#
# Same rule as .trivyignore.yaml and .github/zizmor.yml: nothing is switched off wholesale.
# Every entry names the vulnerability or the package it excuses, carries the evidence that
# makes it a false positive here, and says what would have to be re-checked for it to stop
# being one. Remove an entry once the underlying condition changes rather than keeping it
# as a permanent allowlist.
ignore:
  # github.com/docker/docker is not a dependency of this module. It appears in go.sum only,
  # reached through the module graph of golang-migrate's own test binaries (dktest), and
  # `go list -deps ./...` returns it zero times — nothing this repository builds links it.
  # Grype catalogs go.sum, so it reports it anyway.
  #
  # Scoped to the package rather than to the advisory ids, because the claim being made is
  # "this code is never compiled in", not "these particular findings are harmless" — a list
  # of ids would need editing every time upstream publishes another one while the reason
  # stayed identical. What that costs: a docker/docker vulnerability would stay silent if
  # this ever became a real dependency, so re-check with `go list -deps ./...` before
  # trusting this entry after any change to the golang-migrate dependency.
  - package:
      name: github.com/docker/docker
