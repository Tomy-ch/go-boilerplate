description: |
  ユーザー情報の基本入力スキーマ。
  POST / PUT / PATCH は allOf でこのスキーマを継承し required リストのみを兄弟スキーマで足す
  （新規プロパティは追加しない）ため、この基底に additionalProperties: false を置いても
  兄弟の追加プロパティと衝突せず、未知フィールドを全 consumer で一律に拒否できる。
additionalProperties: false
properties:
  firstName:
    description: 名前
    type: string
    example: "Alice"
    maxLength: 50
  lastName:
    description: 苗字
    type: string
    example: "Smith"
    maxLength: 50
  email:
    description: メールアドレス
    type: string
    format: email
    maxLength: 100
    example: "alice.smith@example.com"
  phone:
    description: 電話番号
    type: string
    pattern: '^\+?[0-9]{10,15}$'
    example: "09012345678"
  postalCode:
    description: 郵便番号
    type: string
    pattern: '^[0-9]{3}-[0-9]{4}$'
    example: "150-0041"
  prefecture:
    description: 都道府県
    type: string
    example: "東京都"
    maxLength: 100
  city:
    description: 市区町村
    type: string
    example: "Shibuya"
    maxLength: 100
  street:
    description: 丁目・番地
    type: string
    example: "1-2-3 Jinnan"
    maxLength: 200
  building:
    description: 建物名・部屋番号
    type: string
    example: "Shibuya Building 101"
    maxLength: 200
    nullable: true
