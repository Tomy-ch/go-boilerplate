description: |
  ユーザー情報の基本入力スキーマ。
  allOf 継承（POST が password を兄弟スキーマで追加）と additionalProperties:false は
  JSON Schema 上で非互換（基底側が兄弟の追加プロパティを拒否する）ため、
  additionalProperties は指定しない。未知フィールドは生成型のバインドで無視される。
properties:
  firstName:
    description: 名前
    type: string
    example: "Alice"
    maxLength: 50
  lastName:
    description: 苗字
    type: string
    example: "Smith"
    maxLength: 50
  email:
    description: メールアドレス
    type: string
    format: email
    maxLength: 100
    example: "alice.smith@example.com"
  phone:
    description: 電話番号
    type: string
    pattern: '^\+?[0-9]{10,15}$'
    example: "09012345678"
  postalCode:
    description: 郵便番号
    type: string
    pattern: '^[0-9]{3}-[0-9]{4}$'
    example: "150-0041"
  prefecture:
    description: 都道府県
    type: string
    example: "東京都"
    maxLength: 100
  city:
    description: 市区町村
    type: string
    example: "Shibuya"
    maxLength: 100
  street:
    description: 丁目・番地
    type: string
    example: "1-2-3 Jinnan"
    maxLength: 200
  building:
    description: 建物名・部屋番号
    type: string
    example: "Shibuya Building 101"
    maxLength: 200
    nullable: true
