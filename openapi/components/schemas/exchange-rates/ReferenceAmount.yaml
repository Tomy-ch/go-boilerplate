type: object
nullable: true
description: |
  表示通貨での参考換算額です。`displayCurrency` 指定時のみ算出し、非永続で返します。
  保存値はあくまで USD セント整数であり、本フィールドは参考表示専用です。
  レート取得に失敗した場合は degrade として null を返します。
required:
  - currency
  - amount
  - rate
  - rateDate
properties:
  currency:
    type: string
    description: 参考換算額の通貨コード
    example: JPY
  amount:
    type: integer
    format: int64
    description: 参考換算額。通貨の最小単位（JPY は円）の丸め後整数です。
    example: 15050
  rate:
    type: string
    pattern: '^\d+(\.\d+)?$'
    description: 換算に用いたレート（base 1 単位あたりの表示通貨換算値）。正確な十進量を保つため decimal 文字列で表します。
    example: "150.5"
  rateDate:
    type: string
    description: レートの基準日（外部レートサービスの公表日）
    example: "2026-07-21"
