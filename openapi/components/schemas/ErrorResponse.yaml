type: object
description: エラーレスポンスの共通スキーマ
required:
  - code
  - message
  - requestId
properties:
  code:
    type: string
    description: 機械的に処理可能なエラーコード
    example: "EXAMPLE_ERROR"
  message:
    type: string
    description: 人間が読めるエラーメッセージ
    example: "定義されたエラーメッセージ"
  requestId:
    type: string
    description: リクエストID
    example: "abcdefghijklmnopqrstuvwxyz"
  details:
    type: array
    description: エラーの詳細情報(任意)
    items:
      type: string
    example:
      - "エラーの詳細の文章1"
      - "エラーの詳細の文章2"
