type: object
description: エラーレスポンスの共通スキーマ
required:
  - code
  - message
  - requestId
properties:
  code:
    type: string
    description: 機械的に処理可能なエラーコード
    example: "EXAMPLE_ERROR"
  message:
    type: string
    description: 人間が読めるエラーメッセージ
    example: "定義されたエラーメッセージ"
  requestId:
    type: string
    description: リクエストID
    example: "abcdefghijklmnopqrstuvwxyz"
  details:
    type: array
    description: エラー詳細を示す公開可能な識別子(任意)。検証エラーでは不正なフィールド名が入る
    items:
      type: string
    example:
      - "firstName"
      - "email"
