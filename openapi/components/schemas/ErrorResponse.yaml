type: object
description: >
  エラーレスポンスの共通スキーマ（base）。
  details は返さない。details を返すエンドポイントは ErrorResponseWithDetails を参照する。
required:
  - code
  - message
  - requestId
properties:
  code:
    type: string
    description: 機械的に処理可能なエラーコード
    example: "EXAMPLE_ERROR"
  message:
    type: string
    description: 人間が読めるエラーメッセージ
    example: "定義されたエラーメッセージ"
  requestId:
    type: string
    description: リクエストID
    example: "abcdefghijklmnopqrstuvwxyz"
