type: object
description: >-
  readiness に加わる依存 1 つの状態です。ここに並ぶのは、落ちていても通常の HTTP 応答を続けられる
  依存だけで、不可欠な依存は起動時に fail-fast します。
required:
  - name
  - status
properties:
  name:
    type: string
    description: 依存する subsystem の名前
    example: "realtime"
  status:
    type: string
    enum: [ok, degraded]
    description: その subsystem の状態
    example: "ok"
