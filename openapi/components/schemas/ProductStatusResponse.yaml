type: object
description: 商品ステータスマスタ 1 件分のレスポンスです。
allOf:
  - $ref: './ProductStatusRef.yaml'
  - type: object
    description: 商品ステータスマスタの詳細情報です。
    required:
      - code
      - sortKey
    properties:
      code:
        type: integer
        description: 商品ステータスコード（正の SMALLINT）
        example: 1
      sortKey:
        type: integer
        description: 表示順（sortKey 昇順で一覧を並べる。code とは非連動）
        example: 5
