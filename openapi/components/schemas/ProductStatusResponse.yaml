type: object
description: 商品ステータスマスタ 1 件分のレスポンスです。
required:
  - id
  - code
  - name
  - sort_key
properties:
  id:
    type: string
    format: uuid
    description: 商品ステータスID
    example: "093170fb-83a2-4864-a2b3-53236eaf3597"
  code:
    type: integer
    description: 商品ステータスコード（正の SMALLINT）
    example: 1
  name:
    type: string
    description: 商品ステータス名
    example: "在庫あり"
  sort_key:
    type: integer
    description: 表示順（sort_key 昇順で一覧を並べる。code とは非連動）
    example: 5
