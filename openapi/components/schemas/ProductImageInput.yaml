type: object
description: |
  商品へ紐付ける画像 1 件。imagePath には画像アップロード（POST /v1/products/images）で得たパスを渡します。
additionalProperties: false
required:
  - imagePath
  - displaySort
properties:
  imagePath:
    type: string
    description: >-
      画像パス。画像アップロード（POST /v1/products/images）で得たパスを渡します。
      アップロード API が採番したキーだけを受け付けるよう形式を固定しています。未参照オブジェクトの回収（product-image-gc）は、この値がストレージのキーと完全一致することを前提に孤児を判定するためです。UUID を小文字に限るのは、categoryId / statusId と違いこの値が UUID として解釈されず文字列のまま突き合わされるためで、大文字表記を許すと同じキーを指しながら一致せず、生きている画像を孤児と誤判定します。
    pattern: '^products/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(png|jpg|webp)$'
    example: "products/b1d4e0f2-3c5a-4b6d-8e7f-1a2b3c4d5e6f.png"
  displaySort:
    type: integer
    format: int32
    minimum: 1
    maximum: 32767
    description: >-
      同一商品内での表示順。1 から数えます。同じ商品の中で重複する値を送ると業務不変条件違反として 422 を返します。
      欠番は許容し、送られた値をそのまま保持します。
    example: 1
