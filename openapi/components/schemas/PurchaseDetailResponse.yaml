type: object
description: 購入明細のレスポンス。unitPrice は購入時点の価格スナップショットです。
required:
  - productId
  - quantity
  - unitPrice
properties:
  productId:
    type: string
    format: uuid
    description: 商品ID
    example: "5266f905-1af4-477a-bc7c-e69729e22a2b"
  quantity:
    type: integer
    format: int32
    description: 購入数量
    example: 2
  unitPrice:
    type: integer
    format: int32
    description: |
      購入時点の単価スナップショット。USD セント単位の整数です（例 1999 は 19.99 ドル相当）。
      購入成立後に商品価格が変わっても本値は不変です。
    example: 80000
