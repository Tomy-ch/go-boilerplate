type: object
description: |
  購入履歴一覧の概要要素スキーマ。一覧はカード表示前提で概要のみを返し、明細は含みません
  （明細は購入詳細 API で取得します）。status は購入ステータスマスタの名称で解決済みです。
required:
  - code
  - totalAmount
  - status
  - orderedAt
properties:
  code:
    type: string
    description: 購入コード（UUIDv7 文字列・一意）
    example: "0190b0d4-7b1a-7c2e-9f3a-1b2c3d4e5f60"
  totalAmount:
    type: integer
    format: int64
    description: 合計（小計 + 税額 + 送料）。USD セント単位の整数です。
    example: 176500
  status:
    type: string
    description: 購入ステータスの名称（購入ステータスマスタで解決済み）。
    example: "完了"
  orderedAt:
    type: string
    format: date-time
    description: 注文日時
    example: "2026-07-23T00:00:00Z"
