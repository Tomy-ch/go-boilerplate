name: X-Cart-Session
in: header
description: |
  ゲストカートのセッショントークン。所有者が未確定のカートへ到達する唯一の手段で、
  未認証の呼び出し側はこのヘッダで自分のカートを指定する。
  認証済みの呼び出し側では無視される（カートは内部 UserID から解決されるため）。
  値は 256 ビットを base64url（パディング無し）で表現した 43 文字。
required: false
schema:
  type: string
  pattern: '^[A-Za-z0-9_-]{43}$'
  minLength: 43
  maxLength: 43
  example: "b3JnLWV4YW1wbGUtc2Vzc2lvbi10b2tlbi1zYW1wbGUtMDE"
