name: Idempotency-Key
in: header
description: |
  冪等キー。同一 (認証主体, キー) の再送を初回結果のリプレイとして扱う。
  このヘッダを宣言する操作は、ハンドラが必ず idempotency.Run 経由で処理する契約（完全性テストで機械検証）。

  キーの一意性は認証主体ごとに判定し、全操作で共通です。再送の扱いは次のとおりです。
  - 初回が成功していれば、同じキーと同じ本文の再送には初回の応答をそのまま返します。
  - 同じキーを別の操作や別の本文に使うと 422 です。
  - 失敗した応答（4xx / 5xx）はキーを消費しません。本文を直して同じキーで再送すれば、新しく実行されます。
  - 初回の処理中に同じキーで再送すると 409 です。時間をおいて再送してください。
  - キーは最初の要求を受け付けてから少なくとも 24 時間保持します。保持期間を過ぎて掃除された後の再送は、新しい実行として扱います。
  - 形式に違反するキーと、キーの欠落は 400 です。

  **この操作では必須です。** 必須になる理由は 2 通りあり、どちらかに当たれば必須です。ひとつは、
  重複が取り消せない金銭的価値の配布になること。クーポンの発行・一括発行・コードによる受け取りが
  これで、配り終えたクーポンを回収する経路は持ちません。もうひとつは、重複そのものは一意制約で
  弾かれるものの、返る 409 から初回の結果を辿れないこと。キャンペーンの定義がこれで、コードで
  引く操作が無いため一覧を辿るほかありません。

  キーが任意の操作では、重複を許容できます。二度目が弾かれる（同じ主体の二度目の登録は 409 で、
  初回の結果は GET /v1/users/me から辿れます）、状態が収束する（廃番済みの商品は再度廃番にならず
  200 を返します）、事後に取り消せる（購入はキャンセルできます）、重複が残っても新たな価値を
  生まない（問い合わせメッセージの追記）のいずれかです。
required: true
schema:
  type: string
  pattern: '^[\x21-\x7E]+$'
  minLength: 1
  maxLength: 255
example: "3f0c2d21-6c1e-4a2f-9f8b-4b1e7f0a2c11"
