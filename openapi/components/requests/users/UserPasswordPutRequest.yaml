description: ユーザーのパスワード変更（現パスワード照合あり）
additionalProperties: false
properties:
  currentPassword:
    description: 現在のパスワード（照合用）
    type: string
    format: password
    minLength: 8
    example: "P@ssw0rd!"
  newPassword:
    description: 新しいパスワード
    type: string
    format: password
    minLength: 8
    example: "N3wP@ssw0rd!"
required:
  - currentPassword
  - newPassword
