description: |
  認証ユーザー自身の購入集計のレスポンススキーマ。件数・合計金額・ステータス別内訳のみを返し、
  購入一覧・明細は含みません。金額は USD セント単位の整数です。
type: object
required:
  - totalCount
  - totalAmount
  - statusBreakdown
properties:
  totalCount:
    type: integer
    format: int64
    description: 購入総件数（キャンセル済みを含む）。購入がない場合は 0 です。
    example: 12
  totalAmount:
    type: integer
    format: int64
    description: 購入金額の合計（キャンセル済みを含む）。USD セント単位の整数です。購入がない場合は 0 です。
    example: 2118000
  statusBreakdown:
    type: array
    description: |
      ステータス別の内訳（購入ステータスマスタの表示順）。購入に出現したステータスのみを含むため、
      購入がない場合は空配列です。
    items:
      $ref: '../../schemas/PurchaseStatusBreakdownResponse.yaml'
