type: object
description: |
  まとめて発送してよい購入の組。同一の購入者宛てであることを軸に分けます。
  組は算出結果であり永続化しないため、組そのものの識別子は持ちません。
required:
  - userId
  - purchases
properties:
  userId:
    type: string
    format: uuid
    description: 組に含まれる購入の購入者 ID。組の中では全件が同一です。
    example: "0190b0d4-7b1a-7c2e-9f3a-1b2c3d4e5f60"
  purchases:
    type: array
    minItems: 1
    description: 組に含まれる購入。注文日時の古い順（同時刻は購入 ID の昇順）で並びます。
    items:
      $ref: './PurchaseShippableItemResponse.yaml'
