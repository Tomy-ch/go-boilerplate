type: object
description: サーバーのレディネスチェック用のレスポンスです。
required:
  - status
  - applicationTime
  - dbRespondedAt
  - dbLatencyMs
properties:
  status:
    type: string
    enum: [ok, degraded, unhealthy]
    description: サーバーのレディネス状態
    example: "ok"
  applicationTime:
    type: string
    format: date-time
    description: アプリケーションサーバーの現在時刻
    example: "2024-06-01T12:00:01Z"
  dbRespondedAt:
    type: string
    format: date-time
    description: データベースが最後に正常に応答した日時
    example: "2024-06-01T12:00:00Z"
  dbLatencyMs:
    type: integer
    format: int64
    description: データベース応答までの時間（ミリ秒）
    example: 8
  dependencies:
    type: array
    description: >-
      通常の HTTP 応答は続けられるが、落ちていれば縮退する依存の状態です。
      該当する依存が結線されていなければ現れません。
    items:
      $ref: '../../schemas/ReadyDependency.yaml'
