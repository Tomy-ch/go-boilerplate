type: object
description: 為替換算結果のレスポンスです。
required:
  - base
  - quote
  - amount
  - converted
  - referenceAmount
properties:
  base:
    type: string
    description: 換算元の通貨コード
    example: USD
  quote:
    type: string
    description: 換算先の通貨コード
    example: JPY
  amount:
    type: number
    format: double
    description: 換算元の金額
    example: 100
  converted:
    type: number
    format: double
    description: 換算後の金額
    example: 15050
  referenceAmount:
    $ref: '../../schemas/exchange-rates/ReferenceAmount.yaml'
