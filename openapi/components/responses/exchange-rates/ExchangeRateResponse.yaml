type: object
description: 為替換算結果のレスポンスです。
required:
  - base
  - quote
  - amount
  - converted
  - reference_amount
properties:
  base:
    type: string
    description: 換算元の通貨コード
    example: USD
  quote:
    type: string
    description: 換算先の通貨コード
    example: JPY
  amount:
    type: number
    format: double
    description: 換算元の金額
    example: 100
  converted:
    type: number
    format: double
    description: 換算後の金額
    example: 15050
  reference_amount:
    nullable: true
    allOf:
      - $ref: '../../schemas/exchange-rates/ReferenceAmount.yaml'
    description: |
      表示通貨での参考換算額。`display_currency` 未指定時、およびレート取得失敗による
      degrade 時は null になります。
