type: object
description: 為替換算結果のレスポンスです。
required:
  - base
  - quote
  - amount
  - converted
  - referenceAmount
properties:
  base:
    type: string
    description: 換算元の通貨コード
    example: USD
  quote:
    type: string
    description: 換算先の通貨コード
    example: JPY
  amount:
    type: string
    pattern: '^\d+(\.\d+)?$'
    description: 換算元の金額。正確な十進量を保つため decimal 文字列で表します。
    example: "100"
  converted:
    type: string
    pattern: '^-?\d+(\.\d+)?$'
    description: 換算後の金額。正確な十進量を保つため decimal 文字列で表します。
    example: "15050"
  referenceAmount:
    $ref: '../../schemas/exchange-rates/ReferenceAmount.yaml'
