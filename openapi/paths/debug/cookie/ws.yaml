get:
  operationId: GetDebugCookieRawWs
  tags:
    - debug/cookie
  summary: |
    Debug - WebSocket / Hijack 経路確認
    このエンドポイントはクッキー周りの動作確認用であり、サービス作成時には削除してください。
  description: |
    WebSocket に Upgrade します（内部で Hijack が関与する実装を想定）。
    OpenAPI 3.0 では WebSocket を厳密に表現できないため、101 と説明で表します。
    動作確認は wscat 等で行ってください。
  responses:
    "101":
      description: Switching Protocols (WebSocket)
      headers:
        Upgrade:
          schema:
            type: string
            example: websocket
        Connection:
          schema:
            type: string
            example: Upgrade
        Sec-WebSocket-Accept:
          schema:
            type: string
    "400":
      description: Bad Request (Upgrade 失敗)
