patch:
  operationId: PatchPurchasesShip
  tags:
    - v1/purchases/detail/ship
  summary: 購入の発送
  description: |
    購入を発送済みへ遷移させます。認証必須で、管理者（admin）のみ実行できます。
    支払い済みからのみ遷移でき、status を「発送済み」へ更新し shippedAt をセットします。
    未払い相当（未処理 / 受付中 / 確認中 / 処理中）・完了・キャンセル済み・配達済みの購入は 409（不正遷移）、
    既に発送済みの購入も 409（二重発送）で拒否します。配送追跡（追跡番号 / 配送業者 / 追跡 URL）は扱いません。
    購入者本人であっても管理者でなければ 403 で拒否します。金額はすべて USD セント単位の整数です。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../../../components/parameters/purchase/PurchaseIdParam.yaml'
  responses:
    '200':
      description: 購入の発送に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/PurchaseShipResponse.yaml'
    '400':
      $ref: '../../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../../../components/schemas/errors/Forbidden403.yaml'
    '404':
      $ref: '../../../../components/schemas/errors/NotFound404.yaml'
    '409':
      $ref: '../../../../components/schemas/errors/Conflict409.yaml'
    '500':
      $ref: '../../../../components/schemas/errors/InternalServerError500.yaml'
