get:
  operationId: GetCartsMe
  tags:
    - v1/carts
  summary: 自分のカートの取得（明細ごとの再評価つき）
  description: |
    呼び出し主体のカートを、明細ごとの再評価つきで取得します。
    主体は認証済みユーザー（Bearer トークンの内部 UserID）か、ゲスト（X-Cart-Session ヘッダ）の
    いずれかで、両方が提示された場合は認証済みユーザーが優先されます。
    パスに他者の識別子を持たないため、他人のカートは取得できません。
    認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
    （ADR-0019 (optional-authentication-fail-closed)）。
    明細ごとに商品の現在値を突き合わせ、買えないもの・値の変わったものに issues を立てます。
    問題のある明細があっても 200 で返します。取得は成功しており、問題があるのは明細であって
    要求ではないためで、エラーにすると買える明細が何であったかを利用者に見せられなくなります。
    在庫は押さえず、商品行もロックしません。再評価は参考情報であり、返した瞬間から古くなります。
    カートがまだ無い主体、および有効期限を過ぎたカートの主体には、空のカートを 200 で返します。
    **この操作はカート行を作りません**（したがって sessionToken は常に null、expiresAt は
    カートが無ければ null です）。
    本 op 自体は DB の SELECT / UPDATE のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
    一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
  security:
    - BearerAuth: []
    - {}
  parameters:
    - $ref: '../../../components/parameters/cart/CartSessionParam.yaml'
  responses:
    '200':
      description: 自分のカートの取得に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/carts/CartResponse.yaml'
    '400':
      $ref: '../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../components/schemas/errors/Unauthorized401.yaml'
    '405':
      $ref: '../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
delete:
  operationId: DeleteCartsMe
  tags:
    - v1/carts
  summary: 自分のカートを空にする
  description: |
    呼び出し主体のカートから、明細をすべて取り除きます。カート画面の「カートを空にする」に当たります。
    **カートの行と有効期限は残ります**。空のカートは正当な状態であり、行ごと消すと直後の操作で
    セッショントークンが発行し直され、利用者の同一性が切れます。カート行そのものの削除は
    期限切れの掃除とログイン時のマージ後の破棄に限り、API としては公開しません。
    主体の決まり方は取得（GET）と同じで、両方が提示された場合は認証済みユーザーが優先されます。
    認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
    （ADR-0019 (optional-authentication-fail-closed)）。
    **既に空のカートを空にしても、カートを持たない主体が呼んでも成功します**。カートを持たない
    主体にカートを作ることはなく、提示されたセッショントークンでカートを引けなかった場合も
    採番し直しません（応答が本文を持たないため、新しいトークンを返す場所がありません）。
    **明細ごとの再評価を行いません**。この応答は本文を持たず価格を 1 つも提示していないため、
    提示価格を記録すると次の取得で立つはずの priceIncreased を消してしまいます。
    有効期限は延びます（空にするのも利用のため）。
    本 op 自体は DB の SELECT / UPDATE / DELETE のみで外部依存を持ちませんが、認証段
    （外部 IdP の JWKS 参照）の一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
  security:
    - BearerAuth: []
    - {}
  parameters:
    - $ref: '../../../components/parameters/cart/CartSessionParam.yaml'
  responses:
    '204':
      description: カートを空にしました（既に空だった場合とカートが無い場合を含みます）
    '400':
      $ref: '../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../components/schemas/errors/Unauthorized401.yaml'
    '405':
      $ref: '../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
