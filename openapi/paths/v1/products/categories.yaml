get:
  operationId: GetProductCategories
  tags:
    - v1/products/categories
  summary: 商品カテゴリマスタ一覧の取得
  description: |
    商品カテゴリマスタの全件を sortKey（表示順）昇順で返します。
    認証不要の公開エンドポイントであり、ページネーションは行いません（全件を返します）。
  security: []
  responses:
    '200':
      description: 商品カテゴリマスタの一覧（sortKey 昇順）
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/products/category/ProductsCategoriesResponse.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
