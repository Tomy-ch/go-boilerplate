get:
  operationId: GetProductsDetail
  tags:
    - v1/products/detail
  summary: 単一商品の取得
  description: |
    指定された UUID に該当する商品の詳細情報を取得します。認証は任意です。
    既定の母集団は公開済みの商品のみで、公開日時が未設定（未公開）の商品と存在しない商品は
    いずれも 404 を返し、存在を秘匿します。
    includeUnpublished=true を指定すると未公開の商品も取得できます。
    指定できるのは管理者（admin）だけで、未認証は 401、管理者でなければ 403 を返します。
    拒否は商品の存在を調べる前に判定するため、403 から商品の存在有無は分かりません。
    price は USD ドル建ての decimal 文字列です。statusId / categoryId の名称はマスタ API で解決します。
    認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
    （ADR-0021 (optional-authentication-fail-closed)）。
  security:
    - BearerAuth: []
    - {}
  parameters:
    - $ref: '../../../components/parameters/product/ProductIdParam.yaml'
    - $ref: '../../../components/parameters/product/IncludeUnpublishedParam.yaml'
  responses:
    '200':
      description: 商品の詳細取得に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/ProductResponse.yaml'
    '400':
      $ref: '../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../../components/schemas/errors/Forbidden403.yaml'
    '404':
      $ref: '../../../components/schemas/errors/NotFound404.yaml'
    '405':
      $ref: '../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
patch:
  operationId: PatchProductsDetail
  tags:
    - v1/products/detail
  summary: 単一商品の部分更新
  description: |
    指定された UUID に該当する商品の属性を部分更新します。admin のみ実行できます（非 admin は 403）。
    送信されたフィールドのみを更新し、未送信のフィールドは現在値を据え置きます。
    description / stockWarningThreshold / publishedAt / images は null を明示するとクリアします。
    公開日時そのものを更新対象とするため、取得系と異なり未公開商品も更新できます。
    version が DB の現在値と一致しない場合は他者の更新と競合したものとして 409 を返します。
    409 は再送では解消しないため、クライアントは再取得してから送り直してください。
    **廃番の商品に公開日時を設定することはできません**（422、details に publishedAt）。
    廃番は取り消せないため、この 422 は再取得しても再送しても解消しません。
    409 と違い他者の更新との競合ではないので、両者は取り違えられません。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../../components/parameters/product/ProductIdParam.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/requests/products/ProductPatchRequest.yaml'
  responses:
    '200':
      description: 商品の部分更新に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/ProductResponse.yaml'
    '400':
      $ref: '../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../../components/schemas/errors/Forbidden403.yaml'
    '404':
      $ref: '../../../components/schemas/errors/NotFound404.yaml'
    '405':
      $ref: '../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '409':
      $ref: '../../../components/schemas/errors/Conflict409.yaml'
    '422':
      $ref: '../../../components/schemas/errors/UnprocessableEntity422.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
