get:
  operationId: GetProductsRankingAmount
  tags:
    - v1/products/ranking
  summary: 売上金額による商品ランキングの取得
  description: |
    購入明細を商品単位で集計し、売上金額（単価 × 数量の総和）の多い順に商品ランキングを返します。
    認証必須です。販売数量と違い実売上額を露出するため、認証なしでは引けません
    （GET /v1/dashboard/summary の salesAmount と同じ扱い）。
    集計の母集団は「公開済み（published_at 非 NULL）の商品」×「キャンセルされていない購入」の明細です。
    未払いの購入は集計に含みます。
    この母集団は GET /v1/dashboard/summary の salesAmount とは一致しません。salesAmount は購入の
    支払金額（小計 + 税額 + 送料）を商品の公開状態に関わらず合計するのに対し、こちらは明細を
    公開済み商品に限って集計するためです。
    集計対象期間は orderedAfter / orderedBefore が指す半開区間 [orderedAfter, orderedBefore) です。
    いずれも省略でき、両方省略した場合は全期間を集計します。orderedBefore が orderedAfter 以前
    （同値を含む）の場合は 400 を返します。
    同一売上金額の商品は商品 ID の昇順で安定的に並びます。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../../../components/parameters/period/OrderedAfterParam.yaml'
    - $ref: '../../../../components/parameters/period/OrderedBeforeParam.yaml'
    - $ref: '../../../../components/parameters/product/RankingLimitParam.yaml'
  responses:
    '200':
      description: 売上金額の降順で取得した商品ランキング
      content:
        application/json:
          schema:
            $ref: '../../../../components/responses/products/ranking/ProductAmountRankingResponse.yaml'
    '400':
      $ref: '../../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../../components/schemas/errors/Unauthorized401.yaml'
    '405':
      $ref: '../../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '500':
      $ref: '../../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../../components/schemas/errors/ServiceUnavailable503.yaml'
