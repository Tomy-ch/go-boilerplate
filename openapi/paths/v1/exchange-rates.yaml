get:
  operationId: GetExchangeRates
  tags:
    - v1/exchange-rates
  summary: 為替レートで金額を換算します。
  description: |
    base 通貨建ての amount を quote 通貨へ換算した結果を返します。
    外部の為替レートサービスを gateway（DTO モード）経由で利用するサンプルエンドポイントです。
  parameters:
    - name: base
      in: query
      required: true
      description: 換算元の通貨コード
      schema:
        type: string
        example: USD
    - name: quote
      in: query
      required: true
      description: 換算先の通貨コード
      schema:
        type: string
        example: JPY
    - name: amount
      in: query
      required: true
      description: 換算する金額（base 通貨建て）
      schema:
        type: number
        format: double
        example: 100
  responses:
    '200':
      description: 換算結果を返します。
      content:
        application/json:
          schema:
            $ref: '../../components/responses/exchange-rates/ExchangeRateResponse.yaml'
    '400':
      $ref: '../../components/schemas/errors/BadRequest400.yaml'
    '500':
      $ref: '../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../components/schemas/errors/ServiceUnavailable503.yaml'
