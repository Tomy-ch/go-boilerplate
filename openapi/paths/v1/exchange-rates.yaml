get:
  operationId: GetExchangeRates
  tags:
    - v1/exchange-rates
  summary: 為替レートで金額を換算します。
  description: |
    base 通貨建ての amount を quote 通貨へ換算した結果を返します。
    外部の為替レートサービスを gateway（DTO モード）経由で利用するサンプルエンドポイントです。
  security: []
  parameters:
    - name: base
      in: query
      required: true
      description: 換算元の通貨コード
      schema:
        type: string
        example: USD
    - name: quote
      in: query
      required: true
      description: 換算先の通貨コード
      schema:
        type: string
        example: JPY
    - name: amount
      in: query
      required: true
      description: |
        換算する金額（base 通貨建て）。正確な十進量を保つため decimal 文字列で受け付けます。
        JSON number は IEEE754 double として復元され精度を失うため、金額・レート経路では文字列で表現します。
      schema:
        type: string
        # 桁数を有界にし、巨大入力による big.Int 十進解析（O(n^2)）を用いた未認証 DoS を防ぐ。
        maxLength: 40
        pattern: '^\d{1,20}(\.\d{1,18})?$'
        example: "100"
    - name: displayCurrency
      in: query
      required: false
      description: |
        指定時のみ、その通貨での参考換算額を referenceAmount として返します（非永続）。
        現状は JPY のみサポートします。
      schema:
        type: string
        enum:
          - JPY
        example: JPY
  responses:
    '200':
      description: 換算結果を返します。
      content:
        application/json:
          schema:
            $ref: '../../components/responses/exchange-rates/ExchangeRateResponse.yaml'
    '400':
      $ref: '../../components/schemas/errors/BadRequest400.yaml'
    '405':
      $ref: '../../components/schemas/errors/MethodNotAllowed405.yaml'
    '500':
      $ref: '../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../components/schemas/errors/ServiceUnavailable503.yaml'
