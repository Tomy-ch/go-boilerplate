put:
  operationId: PutUsersMePassword
  tags:
    - v1/users/detail
  summary: 認証ユーザー自身のパスワード変更
  description: 認証中のユーザー自身のパスワードを変更します。現在のパスワードを照合し、一致した場合のみ更新します。
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../../components/requests/users/UserPasswordPutRequest.yaml'
  responses:
    '204':
      description: パスワードの変更に成功しました
    '400':
      $ref: '../../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../../components/schemas/errors/Unauthorized401.yaml'
    '404':
      $ref: '../../../../components/schemas/errors/NotFound404.yaml'
    '422':
      description: 現在のパスワードが一致しません。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
    '500':
      $ref: '../../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../../components/schemas/errors/ServiceUnavailable503.yaml'
