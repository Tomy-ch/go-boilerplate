put:
  operationId: PutUsersMePassword
  tags:
    - v1/users/detail
  summary: 認証ユーザー自身のパスワード変更
  description: 認証中のユーザー自身のパスワードを変更します。現在のパスワードを照合し、一致した場合のみ更新します。
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../../components/requests/users/UserPasswordPutRequest.yaml'
  responses:
    '204':
      description: パスワードの変更に成功しました
    '400':
      description: リクエストが不正です。必要な情報が不足している場合に返されます。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
    '401':
      description: パスワードの変更には認証が必要です。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
    '404':
      description: 認証ユーザーに該当するアカウントが存在しません。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
    '422':
      description: 現在のパスワードが一致しません。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
    '500':
      description: サーバーエラーが発生しました。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
