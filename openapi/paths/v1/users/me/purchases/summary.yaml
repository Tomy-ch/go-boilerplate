get:
  operationId: GetUsersMePurchasesSummary
  tags:
    - v1/users/me/purchases
  summary: 認証ユーザー自身の購入集計の取得
  description: |
    認証コンテキスト（Bearer トークン）の内部 UserID に該当するユーザー自身の購入を集計して取得します。
    マイページの集計カード表示を想定した集計で、購入一覧そのものは返しません（履歴は購入履歴一覧 API）。
    パスに他者の識別子を持たないため、他ユーザーの集計は取得できません。
    集計対象期間は orderedAfter / orderedBefore が指す半開区間 [orderedAfter, orderedBefore) です。
    いずれも省略でき、両方省略した場合は全期間を集計します。orderedBefore が orderedAfter 以前
    （同値を含む）の場合は 400 を返します。
    キャンセル済みの購入はすべての集計値から除外します（ステータス別内訳にもキャンセルは現れません）。
    金額は 2 種類返します。totalAmount は支払金額（小計 + 税額 + 送料）の合計、itemsTotal は明細金額
    （単価 × 数量）の合計で、税額・送料は明細に按分できないため両者は一致しません。
    groupBy を指定すると itemsTotal をその単位へ分解した groups を返します（未指定なら groups を返しません）。
    対象の購入が 1 件もない場合はエラーではなくゼロ値（件数 0・合計 0・内訳は空配列）を返します。
    本 op 自体は DB の集計 SELECT のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
    一時障害で応答不能となり得るため、認証必須 op の先例に倣い 503 を宣言します。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../../../../components/parameters/period/OrderedAfterParam.yaml'
    - $ref: '../../../../../components/parameters/period/OrderedBeforeParam.yaml'
    - $ref: '../../../../../components/parameters/purchase/PurchaseGroupByParam.yaml'
  responses:
    '200':
      description: 認証ユーザー自身の購入集計の取得に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../../../components/responses/purchases/PurchaseAggregateResponse.yaml'
    '400':
      $ref: '../../../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../../../components/schemas/errors/Unauthorized401.yaml'
    '405':
      $ref: '../../../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '500':
      $ref: '../../../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../../../components/schemas/errors/ServiceUnavailable503.yaml'
