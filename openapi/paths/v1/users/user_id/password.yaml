put:
  operationId: PutUsersPassword
  tags:
    - v1/users/detail
  summary: ユーザーのパスワード変更
  description: 指定されたUUIDに該当するユーザーのパスワードを変更します。現在のパスワードを照合し、一致した場合のみ更新します。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../../../components/parameters/user/UserIdParam.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../../components/requests/users/UserPasswordPutRequest.yaml'
  responses:
    '204':
      description: パスワードの変更に成功しました
    '400':
      description: リクエストが不正です。必要な情報が不足している場合に返されます。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
    '401':
      description: 認証が必要、または現在のパスワードが一致しません。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
    '403':
      description: パスワードの変更には権限が必要です。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
    '404':
      description: 指定されたUUIDに該当するユーザーが存在しません。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
    '500':
      description: サーバーエラーが発生しました。
      content:
        application/json:
          schema:
            $ref: '../../../../components/schemas/ErrorResponse.yaml'
