      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/ErrorResponse.yaml'
    '403':
      description: ユーザーの更新には権限が必要です。
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/ErrorResponse.yaml'
    '404':
      description: 指定されたUUIDに該当するユーザーが存在しません。
      content:
        application/json:
