get:
  operationId: GetUsersDetail
  tags:
    - v1/users/detail
  summary: 単一ユーザーの取得
  description: 指定されたUUIDに該当するユーザーの詳細情報を取得します。
  parameters:
    - $ref: '../../../components/parameters/user/UserIdParam.yaml'
  responses:
    '200':
      description: ユーザーの取得に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/UserResponse.yaml'
    '400':
      description: リクエストが不正です。UUIDの形式が正しくない場合に返されます。
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/ErrorResponse.yaml'
    '401':
      description: ユーザーの取得には認証が必要です。
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/ErrorResponse.yaml'
    '403':
      description: ユーザーの取得には権限が必要です。
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/ErrorResponse.yaml'
    '404':
      description: 指定されたUUIDに該当するユーザーが存在しません。
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/ErrorResponse.yaml'
    '500':
      description: サーバーエラーが発生しました。
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/ErrorResponse.yaml'
