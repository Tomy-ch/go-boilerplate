get:
  operationId: GetUsersDetail
  tags:
    - v1/users/detail
  summary: 単一ユーザーの取得
  description: 指定されたUUIDに該当するユーザーの詳細情報を取得します。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../../components/parameters/user/UserIdParam.yaml'
  responses:
    '200':
      description: ユーザーの取得に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/UserResponse.yaml'
    '400':
      $ref: '../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../../components/schemas/errors/Forbidden403.yaml'
    '404':
      $ref: '../../../components/schemas/errors/NotFound404.yaml'
    '405':
      $ref: '../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
put:
  operationId: PutUsersDetail
  tags:
    - v1/users/detail
  summary: 単一ユーザーの更新
  description: 指定されたUUIDに該当するユーザーの情報を更新します。必要な情報をリクエストボディに含めてください。
  security:
    - BearerAuth: []
  parameters:
  - $ref: '../../../components/parameters/user/UserIdParam.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/requests/users/UserPutRequest.yaml'
  responses:
    '200':
      description: ユーザーの更新に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/UserResponse.yaml'
    '400':
      $ref: '../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../../components/schemas/errors/Forbidden403.yaml'
    '404':
      $ref: '../../../components/schemas/errors/NotFound404.yaml'
    '405':
      $ref: '../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '409':
      $ref: '../../../components/schemas/errors/Conflict409.yaml'
    '422':
      $ref: '../../../components/schemas/errors/UnprocessableEntity422.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
patch:
  operationId: PatchUsersDetail
  tags:
    - v1/users/detail
  summary: 単一ユーザーの部分更新
  description: 指定されたUUIDに該当するユーザーの情報を部分的に更新します。必要な情報をリクエストボディに含めてください。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../../components/parameters/user/UserIdParam.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/requests/users/UserPatchRequest.yaml'
  responses:
    '200':
      description: ユーザーの部分更新に成功しました
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/UserResponse.yaml'
    '400':
      $ref: '../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../../components/schemas/errors/Forbidden403.yaml'
    '404':
      $ref: '../../../components/schemas/errors/NotFound404.yaml'
    '405':
      $ref: '../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '409':
      $ref: '../../../components/schemas/errors/Conflict409.yaml'
    '422':
      $ref: '../../../components/schemas/errors/UnprocessableEntity422.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
delete:
  operationId: DeleteUsersDetail
  tags:
    - v1/users/detail
  summary: ユーザーの退会
  description: |
    ユーザーを退会させます。認証必須で、管理者（admin）または本人のみ実行できます。
    ユーザーを論理削除し、同時に退会イベントを発行します（両者は同一トランザクションで、
    退会だけが成立してイベントが失われることはありません）。
    退会に伴う関連データの後始末は、このイベントを受け取る側で結果整合として行います。
    進行中の購入（完了 / キャンセル / 配達済みのいずれでもない購入）が 1 件でも残っている場合は
    409 で拒否します。退会済みユーザーおよび存在しないユーザーは 404 を返します。
    管理者でない主体が他ユーザーを退会させようとした場合は 403 で拒否します。
  security:
    - BearerAuth: []
  parameters:
    - $ref: '../../../components/parameters/user/UserIdParam.yaml'
  responses:
    '204':
      description: ユーザーの退会に成功しました
    '400':
      $ref: '../../../components/schemas/errors/BadRequest400.yaml'
    '401':
      $ref: '../../../components/schemas/errors/Unauthorized401.yaml'
    '403':
      $ref: '../../../components/schemas/errors/Forbidden403.yaml'
    '404':
      $ref: '../../../components/schemas/errors/NotFound404.yaml'
    '405':
      $ref: '../../../components/schemas/errors/MethodNotAllowed405.yaml'
    '409':
      $ref: '../../../components/schemas/errors/Conflict409.yaml'
    '500':
      $ref: '../../../components/schemas/errors/InternalServerError500.yaml'
    '503':
      $ref: '../../../components/schemas/errors/ServiceUnavailable503.yaml'
