openapi: 3.0.3
info:
  title: Boilerplate Go with Onion Architecture, Echo and SQLC
  termsOfService: https://github.com/Tomy-ch/go-boilerplate-echo-oapi-sqlc
  contact:
    name: TomyC258460
    url: https://x.com/TomyC258460
  version: 0.1.0
  description: |
    This API is built on a modular, layered architecture using Go, Echo, and PostgreSQL.
    It follows the Onion Architecture and is designed to be testable, maintainable, and scalable.

    The project is structured around domain-driven principles, with clean separation between interfaces,
    use cases, domain entities, and infrastructure. All handlers are generated from the OpenAPI specification
    using oapi-codegen, and strict typing is enforced across the system.

    This API is intended as a production-ready boilerplate that balances performance,
    flexibility, and developer experience.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server (replace with actual URL)
  - url: https://staging.api.example.com
    description: Staging server (replace with actual URL)
  - url: https://development.api.example.com
    description: Versioned API endpoint (replace with actual URL)
paths:
  # Operation handlers
  /health:
    $ref: './paths/health.yaml'
  /healthz:
    $ref: './paths/healthz.yaml'
  /metrics:
    $ref: './paths/metrics.yaml'
  /ready:
    $ref: './paths/ready.yaml'
  /version:
    $ref: './paths/version.yaml'
  # For error type generation
  /_internal/types/error-response:
    $ref: './paths/internal/types/error_response.yaml'
  # sample-api:begin
  # サンプルAPI用のパス
  /v1/users:
    $ref: './paths/v1/users.yaml'
  /v1/users/{user_id}:
    $ref: './paths/v1/users/user_id.yaml'
  /v1/users/me/password:
    $ref: './paths/v1/users/me/password.yaml'
  /v1/users/search:
    $ref: './paths/v1/users/search.yaml'
  /v1/users/feed:
    $ref: './paths/v1/users/feed.yaml'
  # sample-api:end
components:
  parameters:
    PageParam:
      $ref: './components/parameters/pagination/PageParam.yaml'
    PerPageParam:
      $ref: './components/parameters/pagination/PerPageParam.yaml'
    CursorAfterParam:
      $ref: './components/parameters/pagination/CursorAfterParam.yaml'
    CursorFirstParam:
      $ref: './components/parameters/pagination/CursorFirstParam.yaml'
    # sample-api:begin
    # サンプルAPI用のパラメーター定義
    KeywordParam:
      $ref: './components/parameters/search/KeywordParam.yaml'
    ActiveParam:
      $ref: './components/parameters/search/ActiveParam.yaml'
    UserIdParam:
      $ref: './components/parameters/user/UserIdParam.yaml'
    # sample-api:end
  securitySchemes:
    BearerAuth:
      $ref: './components/schemas/BearerAuth.yaml'
    BasicAuth:
      $ref: './components/schemas/BasicAuth.yaml'
  schemas:
    ErrorResponse:
      $ref: './components/schemas/ErrorResponse.yaml'
    ResponseHealth:
      $ref: './components/responses/health-check/HealthResponse.yaml'
    ResponseReady:
      $ref: './components/responses/health-check/ReadyResponse.yaml'
    ResponseVersion:
      $ref: './components/responses/version/VersionResponse.yaml'
    # sample-api:begin
    # サンプルAPI用の型定義
    UserBaseInputRequest:
      $ref: './components/schemas/UserBaseInputRequest.yaml'
    UserResponse:
      $ref: './components/schemas/UserResponse.yaml'
    UsersSearchResponse:
      $ref: './components/responses/users/UsersSearchResponse.yaml'
    UsersFeedResponse:
      $ref: './components/responses/users/UsersFeedResponse.yaml'
    CursorPaginationMetadataResponse:
      $ref: './components/schemas/CursorPaginationMetadataResponse.yaml'
    UserSearchResponseItem:
      $ref: './components/responses/users/UsersSearchResponseItem.yaml'
    ResponseV1User:
      $ref: './components/schemas/UserResponse.yaml'
    ResponseV1Users:
      $ref: './components/responses/users/UsersResponse.yaml'
    RequestPostV1Users:
      $ref: './components/requests/users/UsersPostRequest.yaml'
    RequestPutV1User:
      $ref: './components/requests/users/UserPutRequest.yaml'
    RequestPatchV1User:
      $ref: './components/requests/users/UserPatchRequest.yaml'
    # sample-api:end
