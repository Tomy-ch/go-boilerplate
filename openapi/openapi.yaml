openapi: 3.0.3
info:
  title: Boilerplate Go with Onion Architecture, Echo and SQLC
  termsOfService: https://github.com/Tomy-ch/go-boilerplate-echo-oapi-sqlc
  contact:
    name: TomyC258460
    url: https://x.com/TomyC258460
  version: 2.2.0
  description: |
    This API is built on a modular, layered architecture using Go, Echo, and PostgreSQL.
    It follows the Onion Architecture and is designed to be testable, maintainable, and scalable.

    The project is structured around domain-driven principles, with clean separation between interfaces,
    use cases, domain entities, and infrastructure. All handlers are generated from the OpenAPI specification
    using oapi-codegen, and strict typing is enforced across the system.

    This API is intended as a production-ready boilerplate that balances performance,
    flexibility, and developer experience.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server (replace with actual URL)
  - url: https://staging.api.example.com
    description: Staging server (replace with actual URL)
  - url: https://development.api.example.com
    description: Development server (replace with actual URL)
tags:
  - name: health
    description: ヘルスチェック（liveness）。
  - name: healthz
    description: ヘルスチェック（Kubernetes 互換の liveness）。
  - name: ready
    description: レディネスチェック（依存先を含む readiness）。
  - name: version
    description: アプリケーションのバージョン情報。
  - name: metrics
    description: Prometheus メトリクス。
  - name: v1/users
    description: ユーザーリソース（一覧取得・作成）。
  - name: v1/users/detail
    description: 単一ユーザー（取得・更新・部分更新・削除）。
  - name: v1/users/feed
    description: ユーザーフィード（cursor ページネーション）。
  - name: v1/users/search
    description: ユーザー検索（キーワード）。
  - name: v1/prefectures
    description: 都道府県マスタ一覧（認証不要の参照系サンプル）。
  - name: v1/product-statuses
    description: 商品ステータスマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/product-categories
    description: 商品カテゴリマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products
    description: 商品一覧（認証不要・cursor ページネーション + フィルタ + キーワード検索 + 並び替え）。
  - name: v1/exchange-rates
    description: 為替レート換算（外部 gateway 利用サンプル）。
  - name: v1/addresses
    description: 郵便番号→住所補完（外部 gateway 利用サンプル・degrade）。
  - name: internal/types/error-response
    description: （内部用）型生成専用のタグ。実エンドポイントではない。
# ここで設定した認証が全体で適用される。
security: []
paths:
  # Operation handlers
  /health:
    $ref: './paths/health.yaml'
  /healthz:
    $ref: './paths/healthz.yaml'
  /metrics:
    $ref: './paths/metrics.yaml'
  /ready:
    $ref: './paths/ready.yaml'
  /version:
    $ref: './paths/version.yaml'
  # For error type generation
  /_internal/types/error-response:
    $ref: './paths/internal/types/error_response.yaml'
  # sample-api:begin
  # サンプルAPI用のパス
  /v1/users:
    $ref: './paths/v1/users.yaml'
  /v1/users/{userId}:
    $ref: './paths/v1/users/userId.yaml'
  /v1/users/me:
    $ref: './paths/v1/users/me.yaml'
  /v1/users/search:
    $ref: './paths/v1/users/search.yaml'
  /v1/users/feed:
    $ref: './paths/v1/users/feed.yaml'
  /v1/prefectures:
    $ref: './paths/v1/prefectures.yaml'
  /v1/product-statuses:
    $ref: './paths/v1/product-statuses.yaml'
  /v1/product-categories:
    $ref: './paths/v1/product-categories.yaml'
  /v1/products:
    $ref: './paths/v1/products.yaml'
  /v1/exchange-rates:
    $ref: './paths/v1/exchange-rates.yaml'
  /v1/addresses:
    $ref: './paths/v1/addresses.yaml'
  # sample-api:end
components:
  parameters:
    PageParam:
      $ref: './components/parameters/pagination/PageParam.yaml'
    PerPageParam:
      $ref: './components/parameters/pagination/PerPageParam.yaml'
    CursorAfterParam:
      $ref: './components/parameters/pagination/CursorAfterParam.yaml'
    CursorFirstParam:
      $ref: './components/parameters/pagination/CursorFirstParam.yaml'
    IdempotencyKeyParam:
      $ref: './components/parameters/idempotency/IdempotencyKeyParam.yaml'
    # sample-api:begin
    # サンプルAPI用のパラメーター定義
    KeywordParam:
      $ref: './components/parameters/search/KeywordParam.yaml'
    ActiveParam:
      $ref: './components/parameters/search/ActiveParam.yaml'
    UserIdParam:
      $ref: './components/parameters/user/UserIdParam.yaml'
    CategoryIdParam:
      $ref: './components/parameters/product/CategoryIdParam.yaml'
    StatusIdParam:
      $ref: './components/parameters/product/StatusIdParam.yaml'
    SortParam:
      $ref: './components/parameters/product/SortParam.yaml'
    PostalCodeParam:
      $ref: './components/parameters/address/PostalCodeParam.yaml'
    # sample-api:end
  securitySchemes:
    BearerAuth:
      $ref: './components/schemas/BearerAuth.yaml'
    BasicAuth:
      $ref: './components/schemas/BasicAuth.yaml'
  schemas:
    ErrorResponse:
      $ref: './components/schemas/ErrorResponse.yaml'
    ResponseHealth:
      $ref: './components/responses/health-check/HealthResponse.yaml'
    ResponseReady:
      $ref: './components/responses/health-check/ReadyResponse.yaml'
    ResponseVersion:
      $ref: './components/responses/version/VersionResponse.yaml'
    # sample-api:begin
    # サンプルAPI用の型定義
    UserBaseInputRequest:
      $ref: './components/schemas/UserBaseInputRequest.yaml'
    UserResponse:
      $ref: './components/schemas/UserResponse.yaml'
    UsersSearchResponse:
      $ref: './components/responses/users/UsersSearchResponse.yaml'
    UsersFeedResponse:
      $ref: './components/responses/users/UsersFeedResponse.yaml'
    CursorPaginationMetadataResponse:
      $ref: './components/schemas/CursorPaginationMetadataResponse.yaml'
    UserSearchResponseItem:
      $ref: './components/responses/users/UsersSearchResponseItem.yaml'
    ResponseV1User:
      $ref: './components/schemas/UserResponse.yaml'
    ResponseV1Users:
      $ref: './components/responses/users/UsersResponse.yaml'
    RequestPostV1Users:
      $ref: './components/requests/users/UsersPostRequest.yaml'
    RequestPutV1User:
      $ref: './components/requests/users/UserPutRequest.yaml'
    RequestPatchV1User:
      $ref: './components/requests/users/UserPatchRequest.yaml'
    ResponseV1ExchangeRate:
      $ref: './components/responses/exchange-rates/ExchangeRateResponse.yaml'
    PrefectureResponse:
      $ref: './components/schemas/PrefectureResponse.yaml'
    ResponseV1Prefectures:
      $ref: './components/responses/prefecture/PrefecturesResponse.yaml'
    ProductStatusResponse:
      $ref: './components/schemas/ProductStatusResponse.yaml'
    ResponseV1ProductStatuses:
      $ref: './components/responses/product-status/ProductStatusesResponse.yaml'
    ProductCategoryResponse:
      $ref: './components/schemas/ProductCategoryResponse.yaml'
    ResponseV1ProductCategories:
      $ref: './components/responses/product-category/ProductCategoriesResponse.yaml'
    ProductResponse:
      $ref: './components/schemas/ProductResponse.yaml'
    ProductListResponse:
      $ref: './components/responses/products/ProductListResponse.yaml'
    AddressCandidate:
      $ref: './components/schemas/addresses/AddressCandidate.yaml'
    ResponseV1Addresses:
      $ref: './components/responses/addresses/AddressCandidatesResponse.yaml'
    # sample-api:end
