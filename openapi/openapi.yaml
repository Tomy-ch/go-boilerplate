openapi: 3.0.3
info:
  title: Go Boilerplate API
  termsOfService: https://github.com/Tomy-ch/go-boilerplate-echo-oapi-sqlc
  contact:
    name: TomyC258460
    url: https://x.com/TomyC258460
  version: 2.2.0
  description: |
    Handlers (oapi-codegen) and the published reference documentation are both generated from this
    file, so every endpoint change starts here.
    Replace this text with a description of the API you are shipping: it is published to your API
    consumers exactly as written.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development server
    x-internal: true
  - url: https://api.example.com
    description: Production server (replace with actual URL)
    x-internal: false
  - url: https://staging.api.example.com
    description: Staging server (replace with actual URL)
    x-internal: false
  - url: https://development.api.example.com
    description: Development server (replace with actual URL)
    x-internal: true
tags:
  - name: health
    description: ヘルスチェック（liveness）。
  - name: healthz
    description: ヘルスチェック（Kubernetes 互換の liveness）。
  - name: ready
    description: レディネスチェック（依存先を含む readiness）。
  - name: version
    description: アプリケーションのバージョン情報。
  - name: metrics
    description: Prometheus メトリクス。
  - name: internal/types/error-response
    description: （内部用）型生成専用のタグ。実エンドポイントではない。
security: []
paths:
  /health:
    $ref: './paths/health.yaml'
  /healthz:
    $ref: './paths/healthz.yaml'
  /metrics:
    $ref: './paths/metrics.yaml'
  /ready:
    $ref: './paths/ready.yaml'
  /version:
    $ref: './paths/version.yaml'
  /_internal/types/error-response:
    $ref: './paths/internal/types/error_response.yaml'
components:
  parameters:
    PageParam:
      $ref: './components/parameters/pagination/PageParam.yaml'
    PerPageParam:
      $ref: './components/parameters/pagination/PerPageParam.yaml'
    CursorAfterParam:
      $ref: './components/parameters/pagination/CursorAfterParam.yaml'
    CursorFirstParam:
      $ref: './components/parameters/pagination/CursorFirstParam.yaml'
    IdempotencyKeyParam:
      $ref: './components/parameters/idempotency/IdempotencyKeyParam.yaml'
  securitySchemes:
    BasicAuth:
      $ref: './components/schemas/BasicAuth.yaml'
  schemas:
    ErrorResponse:
      $ref: './components/schemas/ErrorResponse.yaml'
    ResponseHealth:
      $ref: './components/responses/health-check/HealthResponse.yaml'
    ResponseReady:
      $ref: './components/responses/health-check/ReadyResponse.yaml'
    ResponseVersion:
      $ref: './components/responses/version/VersionResponse.yaml'
