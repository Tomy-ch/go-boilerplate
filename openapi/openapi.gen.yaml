  /v1/purchases:
    get:
      operationId: GetPurchases
      tags:
        - v1/purchases
      summary: 購入履歴一覧の取得
      description: |
        認証主体（自分）の購入履歴を cursor ページネーションで取得します。認証必須です。
        注文日時の降順（orderedAt DESC, id DESC）で安定して並び、前ページのレスポンスに含まれる
        nextCursor を after に渡して次ページを取得します（無限スクロール）。
        一覧は概要（code / totalAmount / status / orderedAt）のみを返し、明細は含みません。
        他ユーザーの購入は返しません（所有権フィルタで閉じるため、対象がなければ空一覧です）。
        period で注文日時の対象期間を絞り込めます（既定は全期間）。month / range / recent の境界は
        サーバのタイムゾーン（Asia/Tokyo）の暦日基準で算出し、両端の暦日を含みます。区分ごとの必須
        パラメータ（month / from と to / days）の欠落、および to が from より前の場合は 400 を返します。
        ページ送りの間は同じ絞り込み条件を渡してください（条件が変わると keyset の連続性は保証されません）。
        totalAmount は USD セント単位の整数です。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorAfterParam'
        - $ref: '#/components/parameters/CursorFirstParam'
        - $ref: '#/components/parameters/PurchasePeriodParam'
        - $ref: '#/components/parameters/PurchaseFromParam'
        - $ref: '#/components/parameters/PurchaseToParam'
        - $ref: '#/components/parameters/PurchaseMonthParam'
        - $ref: '#/components/parameters/PurchaseRecentDaysParam'
      responses:
        '200':
          description: cursor ページネーションで取得した自分の購入履歴一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      operationId: PostPurchases
      tags:
        - v1/purchases
      summary: 購入の作成
      description: |
        明細（商品IDと数量）の配列から購入を作成します。認証必須です。
        在庫減算・購入作成・明細作成を単一トランザクションで原子的に行い、在庫不足（売り越し）は 409 で
        購入を成立させません。明細の空配列・同一 productId の重複は 422 です。
        退会が確定済みのユーザーは認証の時点で 401 です。受付から成立までの間に退会が確定した場合のみ 409 になります。
        Idempotency-Key により二重 POST を冪等化します。金額はすべて USD セント単位の整数です。
        displayCurrency 指定時は合計金額の参考換算額（referenceAmount）を返します（非永続・レート障害時は null）。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
        - $ref: '#/components/parameters/DisplayCurrencyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchasesPostRequest'
      responses:
        '201':
          description: 購入の作成に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/purchases/shippable:
    get:
      operationId: GetPurchasesShippable
      tags:
        - v1/purchases/shippable
      summary: 発送待ち購入のまとめ発送一覧の取得
      description: |
        発送可能な購入を、まとめて発送してよい組に分けて返します。認証必須で、
        管理者（admin）のみ実行できます。管理者でなければ 403 で拒否します。
        発送可能とは支払いを終え、まだ発送していない状態です。
        まとめる軸は同一の購入者で、同じ購入者宛ての購入が 1 つの組になります。購入が 1 件だけの購入者も
        その 1 件からなる組になります。
        組の中は注文日時の古い順（同時刻は購入 ID の昇順）、組同士はその組の最も古い購入の同じ順序で並びます。
        limit は読み出す購入の件数で、まとめ判定はその範囲の中で行います。範囲の外にある同一購入者の購入は
        別の便になります。ページネーションは行わず、上位 limit 件のみを対象とします。
        発送待ちの購入がない場合はエラーではなく空配列を返します。
        発送の実行は購入 1 件ずつ `POST /v1/purchases/{purchaseId}/ship` で行います。
        本 op 自体は DB の SELECT のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
        一時障害で応答不能となり得るため、認証必須 op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShippableLimitParam'
      responses:
        '200':
          description: まとめて発送してよい組に分けた発送待ち購入の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseShippableResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
