        明細 unitPrice）はすべて USD セント単位の整数です。
      required:
        - id
        - code
        - userId
        - statusId
        - subtotalAmount
        - taxAmount
        - shippingFee
        - totalAmount
        - details
        - orderedAt
        - referenceAmount
