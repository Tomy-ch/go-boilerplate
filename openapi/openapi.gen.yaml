openapi: 3.0.3
info:
  title: Go Boilerplate API
  termsOfService: https://github.com/Tomy-ch/go-boilerplate-echo-oapi-sqlc
  contact:
    name: TomyC258460
    url: https://x.com/TomyC258460
  version: 2.2.0
  description: |
    Reference specification for the sample API (users, products, purchases). It exercises every layer
    of the Onion Architecture end to end: cursor and offset pagination, creation and partial update,
    soft delete, idempotency keys, and role-based authorization.

    Handlers (oapi-codegen) and the published reference documentation are both generated from this
    file, so every endpoint change starts here.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development server
    x-internal: true
  - url: https://api.example.com
    description: Production server (replace with actual URL)
    x-internal: false
  - url: https://staging.api.example.com
    description: Staging server (replace with actual URL)
    x-internal: false
  - url: https://development.api.example.com
    description: Development server (replace with actual URL)
    x-internal: true
security: []
tags:
  - name: health
    description: ヘルスチェック（liveness）。
  - name: healthz
    description: ヘルスチェック（Kubernetes 互換の liveness）。
  - name: ready
    description: レディネスチェック（依存先を含む readiness）。
  - name: version
    description: アプリケーションのバージョン情報。
  - name: metrics
    description: Prometheus メトリクス。
  - name: v1/users
    description: ユーザーリソース（一覧取得・作成）。
  - name: v1/users/detail
    description: 単一ユーザー（取得・更新・部分更新・削除）。
  - name: v1/users/feed
    description: ユーザーフィード（cursor ページネーション）。
  - name: v1/users/search
    description: ユーザー検索（キーワード）。
  - name: v1/users/me/purchases
    description: 認証主体自身の購入集計（認証必須・自分絞り込み / query_service サンプル）。
  - name: v1/users/me/roles
    description: 認証主体自身のロール（認証必須・自分絞り込み / クライアントの楽観的な権限分岐用）。
  - name: v1/prefectures
    description: 都道府県マスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products
    description: 商品一覧（認証不要・cursor ページネーション + フィルタ + キーワード検索 + 並び替え）。
  - name: v1/products/count
    description: 公開商品検索の一致件数（認証不要・商品一覧と同じ検索条件）。
  - name: v1/products/statuses
    description: 商品ステータスマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products/categories
    description: 商品カテゴリマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products/detail
    description: 単一商品（認証不要・公開商品の詳細取得。未存在・非公開は 404 で存在を秘匿）。
  - name: v1/products/ranking
    description: 商品売上ランキング（認証不要・購入明細の集計 / query_service サンプル）。
  - name: v1/products/low-stock
    description: 在庫僅少商品一覧（admin のみ・在庫警告閾値以下の top-N・非 admin は 403）。
  - name: v1/exchange-rates
    description: 為替レート換算（外部 gateway 利用サンプル）。
  - name: v1/addresses
    description: 郵便番号→住所補完（外部 gateway 利用サンプル・degrade）。
  - name: v1/purchases
    description: 購入作成（CommandService 正例・原子性/売り越し禁止・冪等）。
  - name: v1/purchases/shippable
    description: 発送待ち購入のまとめ発送一覧（admin のみ・単一集約 Domain Service サンプル・非 admin は 403）。
  - name: v1/purchases/detail
    description: 単一購入の詳細取得（本人のみ・集約跨ぎ QueryService・明細に商品名/未存在は 404 で秘匿）。
  - name: v1/purchases/detail/cancel
    description: 購入のキャンセル（本人のみ・状態機械/不正遷移 409・在庫復元）。
  - name: v1/purchases/detail/pay
    description: 購入の支払い（本人のみ・状態機械/不正遷移 409・擬似決済）。
  - name: v1/purchases/detail/ship
    description: 購入の発送（admin のみ・状態機械/不正遷移 409・非 admin は 403）。
  - name: v1/purchases/detail/deliver
    description: 購入の配達完了（admin のみ・状態機械/不正遷移 409・非 admin は 403）。
  - name: v1/dashboard
    description: admin ダッシュボードの横断集計（admin のみ・backend 合成/1画面1API・非 admin は 403）。
  - name: v1/carts
    description: 自分のカート（任意認証サンプル・ゲストと認証済みの双方が主体になれる / 明細ごとの再評価）。
  - name: v1/carts/items
    description: カート明細の設定と削除（任意認証・自然キー upsert による冪等サンプル・Idempotency-Key を要さない）。
  - name: v1/carts/merge
    description: ログイン時のカート引き継ぎ（認証必須・所有権の遷移サンプル・Idempotency-Key を採る）。
  - name: internal/types/error-response
    description: （内部用）型生成専用のタグ。実エンドポイントではない。
paths:
  /health:
    get:
      operationId: GetHealth
      tags:
        - health
      summary: サーバーのヘルスチェック
      description: サーバーが正常に稼働しているかを確認するためのECSやALB向けのヘルスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /healthz:
    get:
      operationId: GetHealthz
      tags:
        - healthz
      summary: サーバーのヘルスチェック
      description: サーバーが正常に稼働しているかを確認するためのEKS向けのヘルスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /metrics:
    get:
      operationId: GetMetrics
      tags:
        - metrics
      security:
        - BasicAuth: []
      summary: サーバーのメトリクス取得
      description: サーバーのメトリクス情報を取得するためのエンドポイントです。
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            text/plain:
              schema:
                type: string
                description: メトリクス情報を含むプレーンテキスト
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /ready:
    get:
      operationId: GetReady
      tags:
        - ready
      summary: サーバー全体のレディネスチェック
      description: サーバー全体がリクエストを受け付ける準備ができているかを確認するためのレディネスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーはリクエストを受け付ける準備ができています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /version:
    get:
      operationId: GetVersion
      tags:
        - version
      summary: サーバーのバージョン情報を取得します。
      description: サーバーのバージョン情報を取得するためのエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーのバージョン情報を返します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /_internal/types/error-response:
    get:
      summary: （内部用）ErrorResponse型生成用エンドポイント
      description: |
        このエンドポイントは Goコード生成のためだけに存在します。 実際には実装・公開されません。
      tags:
        - internal/types/error-response
      operationId: GenerateErrorSchema
      security: []
      responses:
        '200':
          description: このレスポンスの型を生成するためです。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithDetails'
  /v1/users:
    get:
      operationId: GetUsers
      tags:
        - v1/users
      summary: ユーザー一覧の取得
      description: ユーザーの一覧を取得します。ページネーションを指定できます。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActiveParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: 取得に成功したユーザー一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      operationId: PostUsers
      tags:
        - v1/users
      summary: ユーザーの作成
      description: 新しいユーザーを作成します。必要な情報をリクエストボディに含めてください。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersPostRequest'
      responses:
        '201':
          description: ユーザーの作成に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/{userId}:
    get:
      operationId: GetUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの取得
      description: 指定されたUUIDに該当するユーザーの詳細情報を取得します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: ユーザーの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    put:
      operationId: PutUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの更新
      description: 指定されたUUIDに該当するユーザーの情報を更新します。必要な情報をリクエストボディに含めてください。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPutRequest'
      responses:
        '200':
          description: ユーザーの更新に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    patch:
      operationId: PatchUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの部分更新
      description: 指定されたUUIDに該当するユーザーの情報を部分的に更新します。必要な情報をリクエストボディに含めてください。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: ユーザーの部分更新に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    delete:
      operationId: DeleteUsersDetail
      tags:
        - v1/users/detail
      summary: ユーザーの退会
      description: |
        ユーザーを退会させます。認証必須で、管理者（admin）または本人のみ実行できます。
        ユーザーを論理削除し、同時に退会イベントを発行します（両者は同一トランザクションで、
        退会だけが成立してイベントが失われることはありません）。
        退会に伴う関連データの後始末は、このイベントを受け取る側で結果整合として行います。
        進行中の購入（完了 / キャンセル / 配達済みのいずれでもない購入）が 1 件でも残っている場合は
        409 で拒否します。退会済みユーザーおよび存在しないユーザーは 404 を返します。
        管理者でない主体が他ユーザーを退会させようとした場合は 403 で拒否します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: ユーザーの退会に成功しました
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/me:
    get:
      operationId: GetUsersMe
      tags:
        - v1/users/detail
      summary: 認証ユーザー自身の取得
      description: 認証コンテキスト（Bearer トークン）の内部 UserID に該当するユーザー自身の詳細情報を取得します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ユーザーの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '404':
          $ref: '#/components/responses/NotFound404'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/me/purchases/summary:
    get:
      operationId: GetUsersMePurchasesSummary
      tags:
        - v1/users/me/purchases
      summary: 認証ユーザー自身の購入集計の取得
      description: |
        認証コンテキスト（Bearer トークン）の内部 UserID に該当するユーザー自身の購入を集計して取得します。
        マイページの集計カード表示を想定した集計で、購入一覧そのものは返しません（履歴は購入履歴一覧 API）。
        パスに他者の識別子を持たないため、他ユーザーの集計は取得できません。
        集計対象期間は period で切り替えます（既定は全期間）。month / range / recent の境界はサーバの
        タイムゾーン（Asia/Tokyo）の暦日基準で算出し、両端の暦日を含みます。実際に用いた期間は要求した区分に
        関わらず period として返すため、クライアントは相対指定を自前で解決する必要がありません。
        区分ごとの必須パラメータ（month / from と to / days）の欠落、および to が from より前の場合は 400 を返します。
        キャンセル済みの購入はすべての集計値から除外します（ステータス別内訳にもキャンセルは現れません）。
        金額は 2 種類返します。totalAmount は支払金額（小計 + 税額 + 送料）の合計、itemsTotal は明細金額
        （単価 × 数量）の合計で、税額・送料は明細に按分できないため両者は一致しません。
        groupBy を指定すると itemsTotal をその単位へ分解した groups を返します（未指定なら groups を返しません）。
        対象の購入が 1 件もない場合はエラーではなくゼロ値（件数 0・合計 0・内訳は空配列）を返します。
        本 op 自体は DB の集計 SELECT のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
        一時障害で応答不能となり得るため、認証必須 op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchasePeriodParam'
        - $ref: '#/components/parameters/PurchaseFromParam'
        - $ref: '#/components/parameters/PurchaseToParam'
        - $ref: '#/components/parameters/PurchaseMonthParam'
        - $ref: '#/components/parameters/PurchaseRecentDaysParam'
        - $ref: '#/components/parameters/PurchaseGroupByParam'
      responses:
        '200':
          description: 認証ユーザー自身の購入集計の取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseAggregateResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/me/roles:
    get:
      operationId: GetUsersMeRoles
      tags:
        - v1/users/me/roles
      summary: 認証ユーザー自身のロールの取得
      description: |
        認証コンテキスト（Bearer トークン）の内部 UserID に該当するユーザー自身に割り当てられたロールを取得します。
        パスに他者の識別子を持たないため、他ユーザーのロールは取得できません。
        用途はクライアント側の楽観的な権限分岐（管理者向け導線を表示するかどうか等）であり、
        確定的な認可判断はサーバーが各操作で行います。したがって本 op が返すロールは、
        クライアントが権限のある操作を組み立てるための材料であって、操作の可否そのものではありません。
        ロールが 1 つも割り当てられていない場合はエラーではなく空配列を返します。
        本 op 自体は DB の SELECT のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
        一時障害で応答不能となり得るため、認証必須 op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 認証ユーザー自身のロールの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRolesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/search:
    get:
      operationId: GetUsersSearch
      tags:
        - v1/users/search
      summary: ユーザー一覧の取得
      description: 検索条件に基づいてユーザーの一覧を取得します。ページネーションを指定できます。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/KeywordParam'
