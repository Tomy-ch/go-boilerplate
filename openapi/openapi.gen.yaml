    PurchaseStatusBreakdownResponse:
      type: object
      description: |
        購入集計のステータス別内訳の 1 要素。status は ID・名称を事前解決済みで、別途の名称解決は不要です。
      required:
        - status
        - count
        - totalAmount
      properties:
        status:
          $ref: '#/components/schemas/PurchaseStatusRef'
        count:
          type: integer
          format: int64
          description: 当該ステータスの購入件数
          example: 4
        totalAmount:
          type: integer
          format: int64
          description: 当該ステータスの購入金額の合計。USD セント単位の整数です。
          example: 706000
    PurchaseAggregateResponse:
      description: |
        認証ユーザー自身の購入集計のレスポンススキーマ。対象期間・件数・合計金額・ステータス別内訳と、
        グループ化を指定した場合はその内訳のみを返し、購入一覧・明細は含みません。金額は USD セント単位の整数です。
        すべての集計値はキャンセル済みを除外した同一の母集団から算出します。
      type: object
      required:
        - period
        - totalCount
        - totalAmount
        - itemsTotal
        - statusBreakdown
      properties:
        period:
          $ref: '#/components/schemas/PurchasePeriodResponse'
        totalCount:
          type: integer
          format: int64
          description: |
            対象期間の購入件数（キャンセル済みを除く）。statusBreakdown の count の総和と一致します。
            対象がない場合は 0 です。
          example: 12
        totalAmount:
          type: integer
          format: int64
          description: |
            対象期間の支払金額の合計（小計 + 税額 + 送料、キャンセル済みを除く）。
            statusBreakdown の totalAmount の総和と一致します。USD セント単位の整数です。対象がない場合は 0 です。
          example: 2118000
        itemsTotal:
          type: string
          description: |
            対象期間の明細金額の合計（単価 × 数量の総和、キャンセル済みを除く）。税額・送料は明細に按分できない
            ため含まず、totalAmount とは一致しません。groups の itemsTotal の総和と正確に一致します。
            価格スケール（USD ドルの正確な decimal）を文字列で表現します。決済スケール（セント整数）の
            totalAmount とは尺度が異なる点に注意してください。対象がない場合は "0" です。
          example: '19200.00'
        statusBreakdown:
          type: array
          description: |
            ステータス別の内訳（購入ステータスマスタの表示順）。対象期間に出現したステータスのみを含むため、
            対象がない場合は空配列です。キャンセル済みは集計対象外のため、キャンセルのステータスは現れません。
          items:
            $ref: '#/components/schemas/PurchaseStatusBreakdownResponse'
        groups:
          type: object
          description: |
            groupBy で指定した最上位のグループ化単位ごとのノード。groupBy 未指定の場合は含みません。
            キーはグループ化単位の識別子（category はカテゴリ名称、product は商品 ID）です。
            対象がない場合は空オブジェクトです。
          additionalProperties:
            $ref: '#/components/schemas/PurchaseGroupResponse'
    DashboardPurchaseStatusCountResponse:
      type: object
      description: |
        購入ステータス別件数の 1 要素。status は ID・名称を事前解決済みで、別途の名称解決は不要です。
      required:
        - status
        - count
      properties:
        status:
          $ref: '#/components/schemas/PurchaseStatusRef'
        count:
          type: integer
          format: int64
          description: 集計対象期間に注文された、当該ステータスの購入件数
          example: 4
    DashboardSummaryResponse:
      description: |
        admin ダッシュボードの横断集計レスポンススキーマ。売上・購入ステータス別件数・商品数を 1 レスポンスに
        合成して返し、購入・商品の一覧そのものは含みません。金額は USD セント単位の整数です。
        指標ごとに集計母集団が異なるため、各プロパティの description を参照してください。
      type: object
      required:
        - salesAmount
        - salesCount
        - purchaseStatusCounts
        - totalProductCount
        - publishedProductCount
      properties:
        salesAmount:
          type: integer
          format: int64
          description: |
            集計対象期間の売上合計。USD セント単位の整数です。キャンセル済みの購入は除外し、未払いの購入は含みます
            （商品売上ランキングと同一の母集団）。対象がない場合は 0 です。
          example: 2118000
        salesCount:
          type: integer
          format: int64
          description: |
            salesAmount に算入した購入の件数。salesAmount と同一の母集団（キャンセル除外・未払いを含む）です。
            キャンセルを含む purchaseStatusCounts の総和とは一致しません。対象がない場合は 0 です。
          example: 12
        purchaseStatusCounts:
          type: array
          description: |
            集計対象期間に注文された購入のステータス別件数（購入ステータスマスタの表示順）。
            salesAmount / salesCount とは異なりキャンセル済みも 1 ステータスとして含みます。
            期間内に購入が出現したステータスのみを含むため、購入がない場合は空配列です。
          items:
            $ref: '#/components/schemas/DashboardPurchaseStatusCountResponse'
        totalProductCount:
          type: integer
          format: int64
          description: 登録済みの商品総数（未公開を含む）。マスタの現在値であり集計対象期間の影響を受けません。
          example: 120
        publishedProductCount:
          type: integer
          format: int64
          description: 公開済みの商品数。マスタの現在値であり集計対象期間の影響を受けません。
          example: 98
    CartItemIssue:
      type: string
      description: |
        カート明細の再評価結果。取得のたびに商品の現在値と突き合わせて判定される。
        1 つの明細に複数同時に立ちうるが、notFound は単独で立ち（商品が引けない以上、在庫も価格も
        判定材料が無い）、outOfStock と insufficientStock は排他（在庫 0 は「不足」ではなく「無い」）。
        いずれの値もカートの取得を失敗にしない。買えない明細があることは要求の不正ではないため。
      enum:
        - notFound
        - unpublished
        - outOfStock
        - insufficientStock
        - priceIncreased
        - priceDecreased
      example: outOfStock
    CartItemResponse:
      type: object
      description: |
        カート明細 1 件。商品の現在値との突き合わせ結果を issues に添える。
        カートは商品の名前も価格も保持しないため、productName / unitPrice は取得時点の商品の値であり、
        購入時の金額を拘束しない（請求額を確定するのは購入明細のスナップショット）。
      required:
        - productId
        - quantity
        - issues
      properties:
        productId:
          type: string
          format: uuid
          description: 商品 ID。カート内で明細を一意に指す自然キー。
          example: 0198a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        productName:
          type: string
          nullable: true
          description: 商品名。商品を引けなかった場合（issues に notFound）は null です。
          example: エルゴノミクスチェア
        quantity:
          type: integer
          format: int32
          description: カートに入れた数量。
          example: 2
        unitPrice:
          type: string
          pattern: ^\d+(\.\d+)?$
          nullable: true
          description: |
            取得時点の商品の単価。サブセント精度を保持する decimal 文字列（USD ドル）で表します（例 "19.99"）。
            商品を引けなかった場合（issues に notFound）は null です。
            JSON number は IEEE754 double として復元され精度を失うため、文字列で表現します。
          example: '19.99'
        issues:
          type: array
          description: |
            この明細の再評価結果。空配列なら現時点で購入可能です。
            subtotalAmount の合算対象になるのは、この配列が空の明細だけです。
          items:
            $ref: '#/components/schemas/CartItemIssue'
        availableQuantity:
          type: integer
          format: int32
          nullable: true
          description: |
            issues に insufficientStock がある場合の、今買える上限（商品の在庫数）。
            それ以外の場合は null です。
          example: 1
    CartResponse:
      description: |
        カートのレスポンススキーマ。カート参照・投入・削除の各操作で共有します。
        カートは在庫を押さえず、確定単価も持ちません。買うつもりの控えであって、
        売り越しの禁止も請求額の確定も購入成立時の関心です。
      type: object
      required:
        - items
        - subtotalAmount
      properties:
        sessionToken:
          type: string
          nullable: true
          description: |
            ゲストカートのセッショントークン。以降のリクエストで X-Cart-Session ヘッダに載せます。
            所有者が確定済みのカート、および新規発行が起きなかった操作では null です。
            値が入るのは、その操作がゲストカートを新しく作った場合だけです
            （取得はカート行を作らないため、常に null になります）。
          example: b3JnLWV4YW1wbGUtc2Vzc2lvbi10b2tlbi1zYW1wbGU
        items:
          type: array
          description: |
            カートの明細。1 件も入っていない場合、およびカートがまだ無い場合は空配列です。
          items:
            $ref: '#/components/schemas/CartItemResponse'
        subtotalAmount:
          type: integer
          format: int64
          description: |
            小計。issues が空の明細（現時点で購入可能なもの）だけを単価×数量で合算した参考値で、
            USD セント単位の整数です。請求額ではありません。
            合算は decimal のまま行い、最後に一度だけ最小単位へ丸めます。
            合算対象が 1 件も無い場合は 0 です。
          example: 3998
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            カートの有効期限。操作のたびに延長されます。
            カートがまだ無い場合は行そのものが存在しないため null です
            （明細を空にしただけの場合はカート行が残るため null になりません）。
          example: '2026-09-13T00:00:00Z'
    HealthResponse:
      type: object
      description: サーバーのヘルスチェック用のレスポンスです。
      required:
        - status
      properties:
        status:
          type: string
          description: サーバーの現在のステータスを示します。
          example: ok
    ReadyResponse:
      type: object
      description: サーバーのレディネスチェック用のレスポンスです。
