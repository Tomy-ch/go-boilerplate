    CartItemPutRequest:
      type: object
      description: |
        カート明細の数量設定リクエスト（application/json）。対象の商品はパスで指定します。
        数量は加算ではなく設定です。同じ要求を 2 回送っても結果は変わりません。
        0 は削除ではなく範囲外として 400 を返します（削除は DELETE が担い、1 つの操作に 2 つの意味を持たせません）。
      additionalProperties: false
      required:
        - quantity
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          description: 設定する数量。現在の数量に加算するのではなく、この値で置き換えます。 範囲外の値はドメインに届く前に 400 で拒否されます。
          example: 2
    CartMergeResponse:
      description: |
        ログイン時のカート引き継ぎの結果。**引き継ぎで失われた分だけ**を報告します。
        引き継ぎ後のカートの中身は含めません。取得（GET /v1/carts/me）でいつでも引ける一方、
        ここで失われた分はこの応答でしか得られないためです。
      type: object
      required:
        - clamped
        - dropped
      properties:
        clamped:
          type: array
          description: |
            数量を合算した結果が 1 明細あたりの上限を超え、上限へ丸めた商品の ID。
            引き継ぎは失敗させないため、超過分は捨てて成功として返します。
          items:
            type: string
            format: uuid
          example:
            - b1d4e0f2-3c5a-4b6d-8e7f-1a2b3c4d5e6f
        dropped:
          type: array
          description: |
            明細数が上限を超えたため取り込まれなかった商品の ID。
            先にカートへ入っていたものを優先して残し、後から来たものを切り捨てます。
          items:
            type: string
            format: uuid
          example: []
  responses:
    MethodNotAllowed405:
      description: 許可されていないリクエスト方法です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest400:
      description: リクエストが不正です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized401:
      description: 認証が必要です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden403:
      description: 権限が必要です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError500:
      description: サーバーエラーが発生しました。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable503:
      description: サービスが一時的に利用できません。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict409:
      description: リソースが競合しています。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity422:
      description: 入力値が要件を満たしていません。details に不正なフィールド名が入ります。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseWithDetails'
    NotFound404:
      description: 指定されたリソースが存在しません。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge413:
      description: ファイルサイズが大きすぎます。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType415:
      description: サポートされていないファイル形式です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
