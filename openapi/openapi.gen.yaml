openapi: 3.0.3
info:
  title: Go Boilerplate API
  termsOfService: https://github.com/Tomy-ch/go-boilerplate-echo-oapi-sqlc
  contact:
    name: TomyC258460
    url: https://x.com/TomyC258460
  version: 2.2.0
  description: |
    This API is built on a modular, layered architecture using Go, Echo, and PostgreSQL.
    It follows the Onion Architecture and is designed to be testable, maintainable, and scalable.

    The project is structured around domain-driven principles, with clean separation between interfaces,
    use cases, domain entities, and infrastructure. All handlers are generated from the OpenAPI specification
    using oapi-codegen, and strict typing is enforced across the system.

    This API is intended as a production-ready boilerplate that balances performance,
    flexibility, and developer experience.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server (replace with actual URL)
  - url: https://staging.api.example.com
    description: Staging server (replace with actual URL)
  - url: https://development.api.example.com
    description: Development server (replace with actual URL)
security: []
tags:
  - name: health
    description: ヘルスチェック（liveness）。
  - name: healthz
    description: ヘルスチェック（Kubernetes 互換の liveness）。
  - name: ready
    description: レディネスチェック（依存先を含む readiness）。
  - name: version
    description: アプリケーションのバージョン情報。
  - name: metrics
    description: Prometheus メトリクス。
  - name: v1/users
    description: ユーザーリソース（一覧取得・作成）。
  - name: v1/users/detail
    description: 単一ユーザー（取得・更新・部分更新・削除）。
  - name: v1/users/feed
    description: ユーザーフィード（cursor ページネーション）。
  - name: v1/users/search
    description: ユーザー検索（キーワード）。
  - name: v1/prefectures
    description: 都道府県マスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products
    description: 商品一覧（認証不要・cursor ページネーション + フィルタ + キーワード検索 + 並び替え）。
  - name: v1/products/statuses
    description: 商品ステータスマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products/categories
    description: 商品カテゴリマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products/detail
    description: 単一商品（認証不要・公開商品の詳細取得。未存在・非公開は 404 で存在を秘匿）。
  - name: v1/products/ranking
    description: 商品売上ランキング（認証不要・購入明細の集計 / query_service サンプル）。
  - name: v1/exchange-rates
    description: 為替レート換算（外部 gateway 利用サンプル）。
  - name: v1/addresses
    description: 郵便番号→住所補完（外部 gateway 利用サンプル・degrade）。
  - name: v1/purchases
    description: 購入作成（CommandService 正例・原子性/売り越し禁止・冪等）。
  - name: v1/purchases/detail
    description: 単一購入の詳細取得（本人のみ・集約跨ぎ QueryService・明細に商品名/未存在は 404 で秘匿）。
  - name: v1/purchases/detail/cancel
    description: 購入のキャンセル（本人のみ・状態機械/不正遷移 409・在庫復元）。
  - name: v1/purchases/detail/pay
    description: 購入の支払い（本人のみ・状態機械/不正遷移 409・擬似決済）。
  - name: internal/types/error-response
    description: （内部用）型生成専用のタグ。実エンドポイントではない。
paths:
  /health:
    get:
      operationId: GetHealth
      tags:
        - health
      summary: サーバーのヘルスチェック
      description: サーバーが正常に稼働しているかを確認するためのECSやALB向けのヘルスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /healthz:
    get:
      operationId: GetHealthz
      tags:
        - healthz
      summary: サーバーのヘルスチェック
      description: サーバーが正常に稼働しているかを確認するためのEKS向けのヘルスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      operationId: GetMetrics
      tags:
        - metrics
      security:
        - BasicAuth: []
      summary: サーバーのメトリクス取得
      description: サーバーのメトリクス情報を取得するためのエンドポイントです。
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            text/plain:
              schema:
                type: string
                description: メトリクス情報を含むプレーンテキスト
  /ready:
    get:
      operationId: GetReady
      tags:
        - ready
      summary: サーバー全体のレディネスチェック
      description: サーバー全体がリクエストを受け付ける準備ができているかを確認するためのレディネスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーはリクエストを受け付ける準備ができています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /version:
    get:
      operationId: GetVersion
      tags:
        - version
      summary: サーバーのバージョン情報を取得します。
      description: サーバーのバージョン情報を取得するためのエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーのバージョン情報を返します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /_internal/types/error-response:
    get:
      summary: （内部用）ErrorResponse型生成用エンドポイント
      description: |
        このエンドポイントは Goコード生成のためだけに存在します。 実際には実装・公開されません。
      tags:
        - internal/types/error-response
      operationId: GenerateErrorSchema
      security: []
      responses:
        '200':
          description: このレスポンスの型を生成するためです。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithDetails'
  /v1/users:
    get:
      operationId: GetUsers
      tags:
        - v1/users
      summary: ユーザー一覧の取得
      description: ユーザーの一覧を取得します。ページネーションを指定できます。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActiveParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: 取得に成功したユーザー一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      operationId: PostUsers
      tags:
        - v1/users
      summary: ユーザーの作成
      description: 新しいユーザーを作成します。必要な情報をリクエストボディに含めてください。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersPostRequest'
      responses:
        '201':
          description: ユーザーの作成に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/{userId}:
    get:
      operationId: GetUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの取得
      description: 指定されたUUIDに該当するユーザーの詳細情報を取得します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: ユーザーの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    put:
      operationId: PutUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの更新
      description: 指定されたUUIDに該当するユーザーの情報を更新します。必要な情報をリクエストボディに含めてください。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPutRequest'
      responses:
        '200':
          description: ユーザーの更新に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    patch:
      operationId: PatchUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの部分更新
      description: 指定されたUUIDに該当するユーザーの情報を部分的に更新します。必要な情報をリクエストボディに含めてください。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: ユーザーの部分更新に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    delete:
      operationId: DeleteUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの削除
      description: 指定されたUUIDに該当するユーザーを削除します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: ユーザーの削除に成功しました
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/Conflict409'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/me:
    get:
      operationId: GetUsersMe
      tags:
        - v1/users/detail
      summary: 認証ユーザー自身の取得
      description: 認証コンテキスト（Bearer トークン）の内部 UserID に該当するユーザー自身の詳細情報を取得します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ユーザーの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/search:
    get:
      operationId: GetUsersSearch
      tags:
        - v1/users/search
      summary: ユーザー一覧の取得
      description: 検索条件に基づいてユーザーの一覧を取得します。ページネーションを指定できます。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/KeywordParam'
        - $ref: '#/components/parameters/ActiveParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: 検索条件に基づいて取得したユーザー一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/feed:
    get:
      operationId: GetUsersFeed
      tags:
        - v1/users/feed
      summary: ユーザーフィードの取得
      description: 未削除のユーザーを作成日時の降順（cursor ページネーション）で取得します。先頭ページは after を省略し、以降は前ページのレスポンスに含まれる nextCursor を after に指定します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorAfterParam'
        - $ref: '#/components/parameters/CursorFirstParam'
      responses:
        '200':
          description: cursor ページネーションで取得したユーザーフィード
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersFeedResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/prefectures:
    get:
      operationId: GetPrefectures
      tags:
        - v1/prefectures
      summary: 都道府県マスタ一覧の取得
      description: |
        都道府県マスタの全件を code 昇順で返します。
        認証不要の公開エンドポイントであり、ページネーションは行いません（全 47 件を返します）。
      security: []
      responses:
        '200':
          description: 都道府県マスタの一覧（code 昇順）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefecturesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/products/statuses:
    get:
      operationId: GetProductStatuses
      tags:
        - v1/products/statuses
      summary: 商品ステータスマスタ一覧の取得
      description: |
        商品ステータスマスタの全件を sort_key（表示順）昇順で返します。
        認証不要の公開エンドポイントであり、ページネーションは行いません（全 10 件を返します）。
      security: []
      responses:
        '200':
          description: 商品ステータスマスタの一覧（sort_key 昇順）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsStatusesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/products/categories:
    get:
      operationId: GetProductCategories
      tags:
        - v1/products/categories
      summary: 商品カテゴリマスタ一覧の取得
      description: |
        商品カテゴリマスタの全件を sort_key 昇順で返します。
        認証不要の公開エンドポイントであり、ページネーションは行いません（全件を返します）。
      security: []
      responses:
        '200':
          description: 商品カテゴリマスタの一覧（sort_key 昇順）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsCategoriesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/products:
    get:
      operationId: GetProducts
      tags:
        - v1/products
      summary: 商品一覧の取得
      description: |
        公開済みの商品を cursor ページネーションで取得します。認証不要の公開エンドポイントです。
        既定では公開日時の降順（publishedAt DESC, id DESC）で並び、sort=publishedAt で昇順に切り替えられます。
        categoryId / statusId でフィルタ、keyword で商品名・説明の部分一致検索ができます。
        公開日時が未設定（未公開）の商品は返しません。ステータスによる可視範囲の絞り込みは今後対応予定です。
        price は USD セント単位の整数です。
      security: []
      parameters:
        - $ref: '#/components/parameters/CursorAfterParam'
        - $ref: '#/components/parameters/CursorFirstParam'
        - $ref: '#/components/parameters/CategoryIdParam'
        - $ref: '#/components/parameters/StatusIdParam'
        - $ref: '#/components/parameters/KeywordParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: cursor ページネーションで取得した公開商品一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      operationId: PostProducts
      tags:
        - v1/products
      summary: 商品の作成
      description: |
        商品を作成します。認証必須（admin のみ・非 admin は 403）。
        description はリッチテキスト HTML を許容し、そのまま格納します（表示側でサニタイズします）。
        imagePath には画像アップロード（POST /v1/products/images）で得たパスを渡します。
        price の非数値は 400、負価格・負在庫・名称長超過などの業務不変条件違反は 422 を返します。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductsPostRequest'
      responses:
        '201':
          description: 商品の作成に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/products/{productId}:
    get:
      operationId: GetProductsDetail
      tags:
        - v1/products/detail
      summary: 単一商品の取得
      description: |
        指定された UUID に該当する公開済み商品の詳細情報を取得します。認証不要の公開エンドポイントです。
        公開日時が未設定（未公開）の商品、および存在しない商品はいずれも 404 を返し、存在を秘匿します。
        price は USD セント単位の整数です。statusId / categoryId の名称はマスタ API で解決します。
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
      responses:
        '200':
          description: 公開済み商品の詳細取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/products/ranking:
    get:
      operationId: GetProductsRanking
      tags:
        - v1/products/ranking
      summary: 商品売上ランキングの取得
      description: |
        購入明細を集計し、販売数量の多い順に商品ランキングを返します。認証不要の公開エンドポイントです。
        キャンセル済み（canceled_at が設定済み）の購入は集計から除外します。未払いの購入は集計に含みます。
        period=30d の場合は注文日時（ordered_at）が直近30日以内の購入のみを集計します。
        同一販売数量の商品は商品 ID の昇順で安定的に並びます。
      security: []
      parameters:
        - $ref: '#/components/parameters/RankingPeriodParam'
        - $ref: '#/components/parameters/RankingLimitParam'
      responses:
        '200':
          description: 販売数量の降順で取得した商品ランキング
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRankingResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/products/images:
    post:
      operationId: PostProductsImages
      tags:
        - v1/products
      summary: 商品画像のアップロード
      description: |
        admin が商品画像をアップロードし、格納先のパスを取得します。認証必須（admin のみ・非 admin は 403）。
        返却された imagePath を商品作成 / 更新の imagePath に渡します。表示 URL はフロントが配信ベース URL と
        組み立てます。対応形式は png / jpeg / webp、サイズ上限は OBJECT_STORAGE_MAX_UPLOAD_BYTES です
        （超過は 413、非対応形式は 415、空ファイル等は 422）。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductImagePostRequest'
      responses:
        '201':
          description: 画像のアップロードに成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImageResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '413':
          $ref: '#/components/responses/PayloadTooLarge413'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType415'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/exchange-rates:
    get:
      operationId: GetExchangeRates
      tags:
        - v1/exchange-rates
      summary: 為替レートで金額を換算します。
      description: |
        base 通貨建ての amount を quote 通貨へ換算した結果を返します。
        外部の為替レートサービスを gateway（DTO モード）経由で利用するサンプルエンドポイントです。
      security: []
      parameters:
        - name: base
          in: query
          required: true
          description: 換算元の通貨コード
          schema:
            type: string
            example: USD
        - name: quote
          in: query
          required: true
          description: 換算先の通貨コード
          schema:
            type: string
            example: JPY
        - name: amount
          in: query
          required: true
          description: |
            換算する金額（base 通貨建て）。正確な十進量を保つため decimal 文字列で受け付けます。
            JSON number は IEEE754 double として復元され精度を失うため、金額・レート経路では文字列で表現します。
          schema:
            type: string
            maxLength: 40
            pattern: ^\d{1,20}(\.\d{1,18})?$
            example: '100'
        - name: displayCurrency
          in: query
          required: false
          description: |
            指定時のみ、その通貨での参考換算額を referenceAmount として返します（非永続）。
            現状は JPY のみサポートします。
          schema:
            type: string
            enum:
              - JPY
            example: JPY
      responses:
        '200':
          description: 換算結果を返します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/addresses:
    get:
      operationId: GetAddresses
      tags:
        - v1/addresses
      summary: 郵便番号から住所候補を補完します。
      description: |
        郵便番号（postal_code）から住所候補（都道府県・市区町村・町域）を補完して返します。
        外部の郵便番号 lookup サービスを gateway（DTO モード）経由で利用するサンプルエンドポイントです。
        登録画面（郵便番号入力→住所オートフィル）で利用するため認証不要で、外部 lookup 障害時は
        503 ではなく `200 + 空 candidates + is_fallback: true` で degrade します（外部が落ちても登録を止めない）。
      security: []
      parameters:
        - $ref: '#/components/parameters/PostalCodeParam'
      responses:
        '200':
          description: 住所候補（degrade 時は空 candidates + is_fallback:true）を返します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressCandidatesResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/purchases:
    get:
      operationId: GetPurchases
      tags:
        - v1/purchases
      summary: 購入履歴一覧の取得
      description: |
        認証主体（自分）の購入履歴を cursor ページネーションで取得します。認証必須です。
        注文日時の降順（orderedAt DESC, id DESC）で安定して並び、前ページのレスポンスに含まれる
        nextCursor を after に渡して次ページを取得します（無限スクロール）。
        一覧は概要（code / totalAmount / status / orderedAt）のみを返し、明細は含みません。
        他ユーザーの購入は返しません（所有権フィルタで閉じるため、対象がなければ空一覧です）。
        totalAmount は USD セント単位の整数です。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorAfterParam'
        - $ref: '#/components/parameters/CursorFirstParam'
      responses:
        '200':
          description: cursor ページネーションで取得した自分の購入履歴一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      operationId: PostPurchases
      tags:
        - v1/purchases
      summary: 購入の作成
      description: |
        明細（商品IDと数量）の配列から購入を作成します。認証必須です。
        在庫減算・購入作成・明細作成を単一トランザクションで原子的に行い、在庫不足（売り越し）は 409 で
        購入を成立させません。明細の空配列・同一 productId の重複は 422 です。
        Idempotency-Key により二重 POST を冪等化します。金額はすべて USD セント単位の整数です。
        displayCurrency 指定時は合計金額の参考換算額（referenceAmount）を返します（非永続・レート障害時は null）。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
        - $ref: '#/components/parameters/DisplayCurrencyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchasesPostRequest'
      responses:
        '201':
          description: 購入の作成に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/purchases/{purchaseId}:
    get:
      operationId: GetPurchasesDetail
      tags:
        - v1/purchases/detail
      summary: 購入詳細の取得
      description: |
        認証主体（本人）の購入 1 件を明細込みで取得します。認証必須です。
        status は ID・名称を事前解決済みで、明細には商品名（products との結合で解決した現在名）を含みます。
        他ユーザーの購入・不存在はいずれも 404 で存在を秘匿します。
        金額（subtotalAmount / taxAmount / shippingFee / totalAmount）はすべて USD セント単位の整数、
        明細 unitPrice は購入時点の単価スナップショット（USD ドルの decimal 文字列）です。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseIdParam'
      responses:
        '200':
          description: 購入詳細の取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseGetDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/purchases/{purchaseId}/cancel:
    patch:
      operationId: PatchPurchasesCancel
      tags:
        - v1/purchases/detail/cancel
      summary: 購入のキャンセル
      description: |
        認証主体（本人）の購入をキャンセルします。認証必須です。
        キャンセル可能状態（未処理 / 受付中 / 確認中 / 処理中 / 支払い済み）からのみ遷移でき、
        status を「キャンセル」へ更新し canceledAt をセットします。完了・キャンセル済み、および
        発送済み（shippedAt）・配達済み（deliveredAt）の購入は 409 で拒否します。
        キャンセル時に購入明細分の在庫を復元します（作成時の在庫減算と対称・同一トランザクションで強整合）。
        他ユーザーの購入は 404 で存在を秘匿します。金額はすべて USD セント単位の整数です。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseIdParam'
      responses:
        '200':
          description: 購入のキャンセルに成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseCancelResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/Conflict409'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/purchases/{purchaseId}/pay:
    patch:
      operationId: PatchPurchasesPay
      tags:
        - v1/purchases/detail/pay
      summary: 購入の支払い
      description: |
        認証主体（本人）の購入を支払い済みへ遷移させます。認証必須です。
        決済 SDK / PSP 連携は行わず、paidAt のセットと status の「支払い済み」への更新で擬似決済を代替します
        （金額・決済結果の検証は行いません）。未払い相当（未処理 / 受付中 / 確認中 / 処理中）からのみ遷移でき、
        既に支払い済みの購入は 409（二重支払い）、キャンセル済み・完了・発送済み・配達済みの購入は 409（不正遷移）で拒否します。
        他ユーザーの購入は 404 で存在を秘匿します。金額はすべて USD セント単位の整数です。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseIdParam'
      responses:
        '200':
          description: 購入の支払いに成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePayResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/Conflict409'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
components:
  parameters:
    PageParam:
      name: page
      in: query
      description: ページ番号（1から始まる）
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    PerPageParam:
      name: perPage
      in: query
      description: 1ページあたりの取得件数
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    CursorAfterParam:
      name: after
      in: query
      description: 次ページ取得用の不透明カーソル。先頭ページを取得する場合は省略します。
      required: false
      schema:
        type: string
    CursorFirstParam:
      name: first
      in: query
      description: 取得件数の上限
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        example: 50
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      description: |
        冪等キー。非冪等な変更操作（作成系など）で、同一キーによるリトライを重複実行なく
        安全にするための識別子。サーバは同一 (認証主体, キー) の再送を初回結果のリプレイとして扱う。
        このヘッダを宣言する操作は、ハンドラが必ず idempotency.Run 経由で処理する契約（完全性テストで機械検証）。
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    KeywordParam:
      name: keyword
      in: query
      description: 全文検索キーワード
      required: false
      schema:
        type: string
        example: example keyword
    ActiveParam:
      name: active
      in: query
      description: 有効なデータのみを対象とする場合はtrue、無効なデータのみを対象とする場合はfalse、全てのデータを対象とする場合は指定しない
      required: false
      schema:
        type: boolean
        example: true
    UserIdParam:
      name: userId
      in: path
      required: true
      description: ユーザーのUUID
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
    CategoryIdParam:
      name: categoryId
      in: query
      description: 商品カテゴリIDでフィルタします。指定しない場合は全カテゴリを対象とします。
      required: false
      schema:
        type: string
        format: uuid
        example: 5dd52d84-78eb-4a52-ba0b-2e11c95c2af2
    StatusIdParam:
      name: statusId
      in: query
      description: 商品ステータスIDでフィルタします。指定しない場合は全ステータスを対象とします。
      required: false
      schema:
        type: string
        format: uuid
        example: 093170fb-83a2-4864-a2b3-53236eaf3597
    SortParam:
      name: sort
      in: query
      description: |
        並び順。`-publishedAt`（既定）は公開日時の降順、`publishedAt` は公開日時の昇順です。
        いずれも同一公開日時の商品は ID で安定ソートします。
      required: false
      schema:
        type: string
        enum:
          - '-publishedAt'
          - publishedAt
        default: '-publishedAt'
        example: '-publishedAt'
    PostalCodeParam:
      name: postalCode
      in: query
      required: true
      description: |
        検索対象の郵便番号。ハイフンあり（`123-4567`）・なし（`1234567`）の両方を受け付けます。
        ハイフン除去の正規化は handler が行い、内層（usecase / gateway）へは 7 桁の数字列を渡します。
      schema:
        type: string
        pattern: ^[0-9]{3}-?[0-9]{4}$
        minLength: 7
        maxLength: 8
        example: 100-0001
    DisplayCurrencyParam:
      name: displayCurrency
      in: query
      description: |
        指定時のみ、購入合計金額（totalAmount）のその通貨での参考換算額を referenceAmount として返します（非永続）。
        現状は JPY のみサポートします。レート取得に失敗した場合は referenceAmount = null で degrade し、購入自体は成立させます。
      required: false
      schema:
        type: string
        enum:
          - JPY
        example: JPY
    ProductIdParam:
      name: productId
      in: path
      required: true
      description: 商品のUUID
      schema:
        type: string
        format: uuid
        example: b1d4e0f2-3c5a-4b6d-8e7f-1a2b3c4d5e6f
    RankingPeriodParam:
      name: period
      in: query
      description: |
        集計対象期間。`all`（既定）は全期間、`30d` は注文日時（ordered_at）が直近30日以内の購入のみを集計します。
      required: false
      schema:
        type: string
        enum:
          - all
          - 30d
        default: all
        example: all
    RankingLimitParam:
      name: limit
      in: query
      description: 取得する上位件数。売上数量の降順で上位 limit 件を返します。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    PurchaseIdParam:
      name: purchaseId
      in: path
      required: true
      description: 購入のUUID
      schema:
        type: string
        format: uuid
        example: 0190b0d4-7b1a-7c2e-9f3a-1b2c3d4e5f60
  securitySchemes:
    BearerAuth:
      type: http
      description: 認証にBearerトークンを使用することを示します。
      scheme: bearer
      bearerFormat: JWT
    BasicAuth:
      type: http
      description: 認証にBasic認証を使用することを示します。
      scheme: basic
  schemas:
    ErrorResponse:
      type: object
      description: |
        エラーレスポンスの共通スキーマ（base）。 details は返さない。details を返すエンドポイントは ErrorResponseWithDetails を参照する。
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: 機械的に処理可能なエラーコード
          example: EXAMPLE_ERROR
        message:
          type: string
          description: 人間が読めるエラーメッセージ
          example: 定義されたエラーメッセージ
        requestId:
          type: string
          description: リクエストID
          example: abcdefghijklmnopqrstuvwxyz
    ResponseHealth:
      $ref: '#/components/schemas/HealthResponse'
    ResponseReady:
      $ref: '#/components/schemas/ReadyResponse'
    ResponseVersion:
      $ref: '#/components/schemas/VersionResponse'
    UserBaseInputRequest:
      description: |
        ユーザー情報の基本入力スキーマ。
        POST / PUT / PATCH は allOf でこのスキーマを継承し required リストのみを兄弟スキーマで足す
        （新規プロパティは追加しない）ため、この基底に additionalProperties: false を置いても
        兄弟の追加プロパティと衝突せず、未知フィールドを全 consumer で一律に拒否できる。
      additionalProperties: false
      properties:
        firstName:
          description: 名前
          type: string
          example: Alice
          maxLength: 50
        lastName:
          description: 苗字
          type: string
          example: Smith
          maxLength: 50
        email:
          description: メールアドレス
          type: string
          format: email
          maxLength: 100
          example: alice.smith@example.com
        phone:
          description: 電話番号
          type: string
          pattern: ^\+?[0-9]{10,15}$
          example: '09012345678'
        postalCode:
          description: 郵便番号
          type: string
          pattern: ^[0-9]{3}-[0-9]{4}$
          example: 150-0041
        prefecture:
          description: 都道府県
          type: string
          example: 東京都
          maxLength: 100
        city:
          description: 市区町村
          type: string
          example: Shibuya
          maxLength: 100
        street:
          description: 丁目・番地
          type: string
          example: 1-2-3 Jinnan
          maxLength: 200
        building:
          description: 建物名・部屋番号
          type: string
          example: Shibuya Building 101
          maxLength: 200
          nullable: true
    UserResponse:
      type: object
      description: ユーザー情報の基本レスポンススキーマ
      required:
        - firstName
        - lastName
        - phone
        - email
        - postalCode
        - prefecture
        - city
        - street
        - deletedAt
      properties:
        firstName:
          description: 名前
          type: string
          example: John
          maxLength: 100
        lastName:
          description: 苗字
          type: string
          example: Doe
          maxLength: 100
        email:
          type: string
          description: メールアドレス
          format: email
          example: john.doe@example.com
        phone:
          type: string
          description: 電話番号
          pattern: ^\+?[0-9]{10,15}$
          example: '09012345678'
        postalCode:
          description: 郵便番号
          type: string
          pattern: ^[0-9]{3}-[0-9]{4}$
          example: 150-0041
        prefecture:
          description: 都道府県
          type: string
          example: Tokyo
          maxLength: 100
        city:
          description: 市区町村
          type: string
          example: Shibuya
          maxLength: 100
        street:
