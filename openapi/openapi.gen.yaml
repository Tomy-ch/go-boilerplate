  /v1/carts/me:
    get:
      operationId: GetCartsMe
      tags:
        - v1/carts
      summary: 自分のカートの取得（明細ごとの再評価つき）
      description: |
        呼び出し主体のカートを、明細ごとの再評価つきで取得します。
        主体は認証済みユーザー（Bearer トークンの内部 UserID）か、ゲスト（X-Cart-Session ヘッダ）の
        いずれかで、両方が提示された場合は認証済みユーザーが優先されます。
        パスに他者の識別子を持たないため、他人のカートは取得できません。
        認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
        （ADR-0020 (optional-authentication-fail-closed)）。
        明細ごとに商品の現在値を突き合わせ、買えないもの・値の変わったものに issues を立てます。
        問題のある明細があっても 200 で返します。取得は成功しており、問題があるのは明細であって
        要求ではないためで、エラーにすると買える明細が何であったかを利用者に見せられなくなります。
        在庫は押さえず、商品行もロックしません。再評価は参考情報であり、返した瞬間から古くなります。
        カートがまだ無い主体、および有効期限を過ぎたカートの主体には、空のカートを 200 で返します。
        **この操作はカート行を作りません**（したがって sessionToken は常に null、expiresAt は
        カートが無ければ null です）。
        本 op 自体は DB の SELECT / UPDATE のみで外部依存を持ちませんが、認証段（外部 IdP の JWKS 参照）の
        一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CartSessionParam'
      responses:
        '200':
          description: 自分のカートの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    delete:
      operationId: DeleteCartsMe
      tags:
        - v1/carts
      summary: 自分のカートを空にする
      description: |
        呼び出し主体のカートから、明細をすべて取り除きます。カート画面の「カートを空にする」に当たります。
        **カートの行と有効期限は残ります**。空のカートは正当な状態であり、行ごと消すと直後の操作で
        セッショントークンが発行し直され、利用者の同一性が切れます。カート行そのものの削除は
        期限切れの掃除とログイン時のマージ後の破棄に限り、API としては公開しません。
        主体の決まり方は取得（GET）と同じで、両方が提示された場合は認証済みユーザーが優先されます。
        認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
        （ADR-0020 (optional-authentication-fail-closed)）。
        **既に空のカートを空にしても、カートを持たない主体が呼んでも成功します**。カートを持たない
        主体にカートを作ることはなく、提示されたセッショントークンでカートを引けなかった場合も
        採番し直しません（応答が本文を持たないため、新しいトークンを返す場所がありません）。
        **明細ごとの再評価を行いません**。この応答は本文を持たず価格を 1 つも提示していないため、
        提示価格を記録すると次の取得で立つはずの priceIncreased を消してしまいます。
        有効期限は延びます（空にするのも利用のため）。
        本 op 自体は DB の SELECT / UPDATE / DELETE のみで外部依存を持ちませんが、認証段
        （外部 IdP の JWKS 参照）の一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CartSessionParam'
      responses:
        '204':
          description: カートを空にしました（既に空だった場合とカートが無い場合を含みます）
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/carts/me/items/{productId}:
    put:
      operationId: PutCartsMeItem
      tags:
        - v1/carts/items
      summary: 自分のカートへの明細の設定（数量の upsert）
      description: |
        呼び出し主体のカートに、指定した商品の数量を設定します。加算ではなく設定なので、
        同じ要求を何回送っても結果は変わりません。**冪等性は明細の自然キー (cart_id, product_id) から
        来るため、Idempotency-Key を必要としません**（自然キーを持たない POST /v1/purchases との対比）。
        主体は認証済みユーザー（Bearer トークンの内部 UserID）か、ゲスト（X-Cart-Session ヘッダ）の
        いずれかで、両方が提示された場合は認証済みユーザーが優先されます。
        認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
        （ADR-0020 (optional-authentication-fail-closed)）。
        **カートがまだ無い主体にはこの操作がカートを作ります**。ゲストの場合はセッショントークンを
        発行して sessionToken に載せて返すので、以降のリクエストで X-Cart-Session に載せてください。
        提示されたトークンでカートを引けなかった場合、その値では作らず新しい値を発行します
        （トークンの秘匿だけがゲストカートへの到達を守っているため、値をクライアントに選ばせません）。
        **有効期限を過ぎたカートは空から始まります**。所有者が確定したカートは行を保ったまま明細を捨て、
        ゲストは新しいカートを作ります。いずれも取得（GET）が期限切れを空のカートとして見せる契約と一致します。
        設定後、応答はカート全体を明細ごとの再評価つきで返します（GET と同じ内容です）。
        在庫は押さえません。在庫不足は投入を拒む理由ではなく、明細の issues として現れます。
        本 op 自体は DB の SELECT / INSERT / UPDATE のみで外部依存を持ちませんが、認証段
        （外部 IdP の JWKS 参照）の一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
        - $ref: '#/components/parameters/CartSessionParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemPutRequest'
      responses:
        '200':
          description: 明細の設定に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    delete:
      operationId: DeleteCartsMeItem
      tags:
        - v1/carts/items
      summary: 自分のカートからの明細の削除
      description: |
        呼び出し主体のカートから、指定した商品の明細を取り除きます。
        **対象の明細が無くても成功します**。「無かった」と「消した」を呼び出し側に区別させないため、
        404 を持ちません。主体の決まり方は設定（PUT）と同じで、両方が提示された場合は認証済みユーザーが
        優先されます。認証は任意ですが、**提示された資格情報が無効な場合は匿名として通さず 401 を返します**
        （ADR-0020 (optional-authentication-fail-closed)）。
        **カートを持たない主体が呼んでもカートは作りません**。提示されたセッショントークンでカートを
        引けなかった場合も採番し直さず、何もせずに成功を返します（応答が本文を持たないため、新しい
        トークンを返す場所がありません）。
        **商品の存在も公開状態も確認しません**。非公開になった商品こそカートから外したいので、ここで
        拒むと再評価で unpublished が立った明細を利用者が取り除けなくなります（設定は 422 で拒むのに対し、
        こちらは取り除けます）。
        **明細ごとの再評価を行いません**。この応答は本文を持たず価格を 1 つも提示していないため、提示価格を
        記録すると、次の取得で立つはずの priceIncreased を消してしまいます。
        有効期限は延びます（削除も利用のため）。明細が 0 件になってもカート自体は残ります。
        本 op 自体は DB の SELECT / UPDATE / DELETE のみで外部依存を持ちませんが、認証段
        （外部 IdP の JWKS 参照）の一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
        - $ref: '#/components/parameters/CartSessionParam'
      responses:
        '204':
          description: 明細を取り除きました（対象が無かった場合を含みます）
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/carts/me/merge:
    post:
      operationId: PostCartsMeMerge
      tags:
        - v1/carts/merge
      summary: ゲストカートの引き継ぎ（所有者の確定）
      description: |
        ログイン直後に、ゲストカートを認証済みユーザーへ引き継ぎます。
        引き継ぎ元はヘッダの X-Cart-Session、引き継ぎ先は Bearer トークンの主体で、要求本文を持ちません。
        **この操作だけが認証必須です**（所有者を確定させる操作のため、匿名では成り立ちません）。
        **引き継ぎは失敗しません**。同一商品の数量合算が上限を超えたら上限へ丸め、明細数が上限を超えたら
        先に入っていたものを優先して残し、後から来たものを切り捨てます。ログインは認証の成否で決まるべきで、
        カートの都合で失敗させません。**失われた分は clamped / dropped として報告します**。
        ユーザー側にカートが無い場合は所有者を付け替えるだけで、明細の内容は変わりません。
        引き継ぎ元のゲストカートが引けない場合（既に引き継ぎ済み、期限切れ、未知のトークン）は、
        clamped と dropped がいずれも空の成功として返します。
        **引き継ぎ後、元のセッショントークンでそのカートへ到達する経路は状態として残りません**
        （所有者の確定とトークンの破棄は不可分に行われ、合流時はゲストカートの行ごと消えます）。
        応答に引き継ぎ後のカートは含めません。カートの中身は取得（GET /v1/carts/me）でいつでも引けますが、
        clamped / dropped はこの応答でしか得られないためです。
        **Idempotency-Key を受け付けます**。同一キーの再送は初回の結果をそのまま返し、報告が失われません。
        同一キーを内容の異なる要求で使い回した場合は 422 で拒否します（冪等性の一般的な扱いであり、
        引き継ぎそのものの失敗ではありません）。
        カートの 5 つの操作でこれを採るのはここだけで、他は明細の自然キーが冪等性を供給します。
        本 op 自体は DB の SELECT / UPDATE / DELETE のみで外部依存を持ちませんが、認証段
        （外部 IdP の JWKS 参照）の一時障害で応答不能となり得るため、認証を伴う op の先例に倣い 503 を宣言します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartSessionRequiredParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: 引き継ぎに成功しました（引き継ぐカートが無かった場合を含みます）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartMergeResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
components:
  parameters:
    PageParam:
      name: page
      in: query
      description: ページ番号（1から始まる）。上限を超えた場合は 400 を返します。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
        example: 1
    PerPageParam:
      name: perPage
      in: query
      description: 1ページあたりの取得件数
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    CursorAfterParam:
      name: after
      in: query
      description: 次ページ取得用の不透明カーソル。先頭ページを取得する場合は省略します。
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
        maxLength: 512
    CursorFirstParam:
      name: first
      in: query
      description: 取得件数の上限
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        example: 50
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      description: |
        冪等キー。非冪等な変更操作（作成系など）で、同一キーによるリトライを重複実行なく
        安全にするための識別子。サーバは同一 (認証主体, キー) の再送を初回結果のリプレイとして扱う。
        このヘッダを宣言する操作は、ハンドラが必ず idempotency.Run 経由で処理する契約（完全性テストで機械検証）。
      required: false
      schema:
        type: string
        pattern: ^[\x21-\x7E]+$
        minLength: 1
        maxLength: 255
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    KeywordParam:
      name: keyword
      in: query
      description: 全文検索キーワード。商品名・商品説明への部分一致で絞り込みます。
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: example keyword
    ActiveParam:
      name: active
      in: query
      description: 有効なデータのみを対象とする場合はtrue、無効なデータのみを対象とする場合はfalse、全てのデータを対象とする場合は指定しない
      required: false
      schema:
        type: boolean
        example: true
    UserIdParam:
      name: userId
      in: path
      required: true
      description: ユーザーのUUID
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
        example: 123e4567-e89b-12d3-a456-426614174000
    CategoryIdParam:
      name: categoryId
      in: query
      description: |
        商品カテゴリIDでフィルタします。指定しない場合は全カテゴリを対象とします。
        後継は categoryCodes で、マスタ行を指すのは UUID ではなく code です。categoryCodes と
        同時に指定した場合は 400 を返します。
      required: false
      deprecated: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
        example: 5dd52d84-78eb-4a52-ba0b-2e11c95c2af2
    StatusIdParam:
      name: statusId
      in: query
      description: |
        商品ステータスIDでフィルタします。指定しない場合は全ステータスを対象とします。
        後継は statusCodes で、マスタ行を指すのは UUID ではなく code です。statusCodes と
        同時に指定した場合は 400 を返します。
      required: false
      deprecated: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
        example: 093170fb-83a2-4864-a2b3-53236eaf3597
    SortParam:
      name: sort
      in: query
      description: |
        並び順。`-publishedAt`（既定）は公開日時の降順、`publishedAt` は公開日時の昇順です。
        いずれも同一公開日時の商品は ID で安定ソートします。
      required: false
      schema:
        type: string
        enum:
          - '-publishedAt'
          - publishedAt
        default: '-publishedAt'
        example: '-publishedAt'
    PostalCodeParam:
      name: postalCode
      in: query
      required: true
      description: |
        検索対象の郵便番号。ハイフンあり（`123-4567`）・なし（`1234567`）の両方を受け付けます。
        ハイフン除去の正規化は handler が行い、内層（usecase / gateway）へは 7 桁の数字列を渡します。
      schema:
        type: string
        pattern: ^[0-9]{3}-?[0-9]{4}$
        minLength: 7
        maxLength: 8
        example: 100-0001
    DisplayCurrencyParam:
      name: displayCurrency
      in: query
      description: |
        指定時のみ、購入合計金額（totalAmount）のその通貨での参考換算額を referenceAmount として返します（非永続）。
        現状は JPY のみサポートします。レート取得に失敗した場合は referenceAmount = null で degrade し、購入自体は成立させます。
      required: false
      schema:
        type: string
        enum:
          - JPY
        example: JPY
    DashboardPeriodParam:
      name: period
      in: query
      description: |
        集計対象期間の区分。`today`（既定）は今日、`month` は今月、`range` は `from` / `to` で指定した期間を集計します。
        `today` / `month` の境界はサーバのタイムゾーン（Asia/Tokyo）基準で算出します。
        `range` を指定した場合は `from` / `to` が必須で、欠落時は 400 を返します。
      required: false
      schema:
        type: string
        enum:
          - today
          - month
          - range
        default: today
        example: today
    DashboardFromParam:
      name: from
      in: query
      description: |
        集計対象期間の開始日（この日を含みます）。`period=range` のときのみ必須で、それ以外の区分では無視します。
        日付はサーバのタイムゾーン（Asia/Tokyo）の暦日として解釈します。
      required: false
      schema:
        type: string
        format: date
        example: '2026-07-01'
    DashboardToParam:
      name: to
      in: query
      description: |
        集計対象期間の終了日（この日を含みます）。`period=range` のときのみ必須で、それ以外の区分では無視します。
        日付はサーバのタイムゾーン（Asia/Tokyo）の暦日として解釈します。`from` より前の日付を指定した場合は 400 を返します。
      required: false
      schema:
        type: string
        format: date
        example: '2026-07-31'
    CartSessionParam:
      name: X-Cart-Session
      in: header
      description: |
        ゲストカートのセッショントークン。所有者が未確定のカートへ到達する唯一の手段で、
        未認証の呼び出し側はこのヘッダで自分のカートを指定する。
        認証済みの呼び出し側では無視される（カートは内部 UserID から解決されるため）。
        値は 256 ビットを base64url（パディング無し）で表現した 43 文字。
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
        minLength: 43
        maxLength: 43
        example: b3JnLWV4YW1wbGUtc2Vzc2lvbi10b2tlbi1zYW1wbGU
    PurchasePeriodParam:
      name: period
      in: query
      description: |
        集計・絞り込み対象期間の区分。`all`（既定）は全期間、`month` は `month` で指定した暦月、
        `range` は `from` / `to` で指定した期間、`recent` は今日から `days` 日前までを対象とします。
        各区分の境界はサーバのタイムゾーン（Asia/Tokyo）の暦日基準で算出し、両端の暦日を含みます。
        区分ごとの必須パラメータ（`month` / `from` と `to` / `days`）が欠落している場合は 400 を返します。
      required: false
      schema:
        type: string
        enum:
          - all
          - month
          - range
          - recent
        default: all
        example: recent
    PurchaseFromParam:
      name: from
      in: query
      description: |
        対象期間の開始日（この日を含みます）。`period=range` のときのみ必須で、それ以外の区分では無視します。
        日付はサーバのタイムゾーン（Asia/Tokyo）の暦日として解釈します。
      required: false
      schema:
        type: string
        format: date
        example: '2026-01-21'
    PurchaseToParam:
      name: to
      in: query
      description: |
        対象期間の終了日（この日を含みます）。`period=range` のときのみ必須で、それ以外の区分では無視します。
        日付はサーバのタイムゾーン（Asia/Tokyo）の暦日として解釈します。`from` より前の日付を指定した場合は 400 を返します。
      required: false
      schema:
        type: string
        format: date
        example: '2026-01-31'
    PurchaseMonthParam:
      name: month
      in: query
      description: |
        対象とする暦月（`YYYY-MM`）。`period=month` のときのみ必須で、それ以外の区分では無視します。
        月初日から月末日までを、サーバのタイムゾーン（Asia/Tokyo）の暦日基準で対象とします。
      required: false
      schema:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
        example: 2026-01
    PurchaseRecentDaysParam:
      name: days
      in: query
      description: |
        今日から遡る日数。`period=recent` のときのみ必須で、それ以外の区分では無視します。
        今日を終了日、今日の `days` 日前を開始日とし、両端の暦日を含みます
        （2026-01-31 に `days=10` を指定した場合の対象は 2026-01-21 〜 2026-01-31 です）。
        暦日はサーバのタイムゾーン（Asia/Tokyo）基準です。
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 365
        example: 10
    PurchaseGroupByParam:
      name: groupBy
      in: query
      description: |
        集計のグループ化単位（複数指定は同じ名前を繰り返します: `groupBy=category&groupBy=product`）。
        指定順がそのままネストの階層順になります（上の例ならカテゴリで分け、その中を商品で分けます）。
        未指定の場合はグループ化せず、レスポンスに groups を含めません。同じ単位を 2 回指定した場合は 400 を返します。
      required: false
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 2
        items:
          type: string
          enum:
            - category
            - product
        example:
          - category
          - product
    CategoryCodesParam:
      name: categoryCodes
      in: query
      description: |
        商品カテゴリコードでフィルタします（複数指定は同じ名前を繰り返します: `categoryCodes=1&categoryCodes=2`）。
        指定したコードのいずれかに一致する商品を返します。
        指定しない場合は全カテゴリを対象とします。存在しないコードは 0 件として扱い、エラーにはしません。
        コードは商品カテゴリマスタ（GET /v1/products/categories）が返す code で、マスタ行を指す静的な別名です。
        非推奨の categoryId と同時に指定した場合は 400 を返します。
      required: false
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 32
        items:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        example:
          - 1
          - 2
    StatusCodesParam:
      name: statusCodes
      in: query
      description: |
        商品ステータスコードでフィルタします（複数指定は同じ名前を繰り返します: `statusCodes=1&statusCodes=5`）。
        指定したコードのいずれかに一致する商品を返します。
        指定しない場合は全ステータスを対象とします。存在しないコードは 0 件として扱い、エラーにはしません。
        コードは商品ステータスマスタ（GET /v1/products/statuses）が返す code で、マスタ行を指す静的な別名です。
        非推奨の statusId と同時に指定した場合は 400 を返します。
      required: false
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 32
        items:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        example:
          - 1
          - 5
    MinPriceParam:
      name: minPrice
      in: query
      required: false
      description: 最低価格（この値以上）。負でない十進文字列で指定します。
      schema:
        type: string
        maxLength: 40
        pattern: ^\d{1,20}(\.\d{1,18})?$
      example: '10.00'
    MaxPriceParam:
      name: maxPrice
      in: query
      required: false
      description: 最高価格（この値以下）。負でない十進文字列で指定します。
      schema:
        type: string
        maxLength: 40
        pattern: ^\d{1,20}(\.\d{1,18})?$
      example: '100.00'
    MinQuantityParam:
      name: minQuantity
      in: query
      required: false
      description: 最低在庫数（この値以上）。
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 1
    MaxQuantityParam:
      name: maxQuantity
      in: query
      required: false
      description: 最高在庫数（この値以下）。
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 100
    ProductIdParam:
      name: productId
      in: path
      required: true
      description: 商品のUUID
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
        example: b1d4e0f2-3c5a-4b6d-8e7f-1a2b3c4d5e6f
    RankingPeriodParam:
      name: period
      in: query
      description: |
        集計対象期間。`all`（既定）は全期間、`30d` は注文日時が直近30日以内の購入のみを集計します。
      required: false
      schema:
        type: string
        enum:
          - all
          - 30d
        default: all
        example: all
    RankingLimitParam:
      name: limit
      in: query
      description: 取得する上位件数。売上数量の降順で上位 limit 件を返します。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    LowStockLimitParam:
      name: limit
      in: query
      description: 取得する上位件数。在庫の少ない順で上位 limit 件を返します。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    ShippableLimitParam:
      name: limit
      in: query
      description: |
        読み出す発送待ち購入の件数。注文日時の古い順で上位 limit 件を読み、まとめ判定はその範囲の中で行います。
        範囲の外にある同一購入者の購入は別の便になります。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    PurchaseIdParam:
      name: purchaseId
      in: path
      required: true
      description: 購入のUUID
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
        example: 0190b0d4-7b1a-7c2e-9f3a-1b2c3d4e5f60
    CartSessionRequiredParam:
      name: X-Cart-Session
      in: header
      description: |
        引き継ぎ元のゲストカートのセッショントークン。
        ログイン前に持っていた値をそのまま渡す。
        値は 256 ビットを base64url（パディング無し）で表現した 43 文字。

        必須である点が CartSessionParam との違い。引き継ぎ元を指定しない引き継ぎは要求として成り立たず、
        省略を許すと「引き継ぐものが無い」と「引き継ぎ元を書き忘れた」を区別できなくなる。
        OpenAPI 3.0 は $ref の兄弟キーを無視するため、共有定義に required を上書きすることはできない。
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
        minLength: 43
        maxLength: 43
        example: b3JnLWV4YW1wbGUtc2Vzc2lvbi10b2tlbi1zYW1wbGU
  securitySchemes:
    BearerAuth:
      type: http
      description: |
        認証にBearerトークンを使用することを示します。
        JWT の検証は RFC8725（JSON Web Token Best Current Practices）に従います。
        署名アルゴリズムは許可リストで固定し、`alg: none` と鍵の混同を拒否します。
      scheme: bearer
      bearerFormat: JWT
    BasicAuth:
      type: http
      description: 認証にBasic認証を使用することを示します。
      scheme: basic
  schemas:
    ErrorResponse:
      type: object
      description: |
        エラーレスポンスの共通スキーマ（base）。 details は返さない。details を返すエンドポイントは ErrorResponseWithDetails を参照する。
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: 機械的に処理可能なエラーコード
          example: EXAMPLE_ERROR
        message:
          type: string
          description: 人間が読めるエラーメッセージ
          example: 定義されたエラーメッセージ
        requestId:
          type: string
          description: リクエストID
          example: abcdefghijklmnopqrstuvwxyz
    ResponseHealth:
      $ref: '#/components/schemas/HealthResponse'
    ResponseReady:
      $ref: '#/components/schemas/ReadyResponse'
    ResponseVersion:
      $ref: '#/components/schemas/VersionResponse'
    UserBaseInputRequest:
      description: |
        ユーザー情報の基本入力スキーマ。
        POST / PUT / PATCH は allOf でこのスキーマを継承し required リストのみを兄弟スキーマで足す
        （新規プロパティは追加しない）ため、この基底に additionalProperties: false を置いても
        兄弟の追加プロパティと衝突せず、未知フィールドを全 consumer で一律に拒否できる。
      additionalProperties: false
      properties:
        firstName:
          description: 名前
          type: string
          example: Alice
          maxLength: 50
        lastName:
          description: 苗字
          type: string
          example: Smith
          maxLength: 50
        email:
          description: メールアドレス
          type: string
          format: email
          maxLength: 100
          example: alice.smith@example.com
        phone:
          description: 電話番号
          type: string
          pattern: ^\+?[0-9]{10,15}$
          example: '09012345678'
        postalCode:
          description: 郵便番号
          type: string
          pattern: ^[0-9]{3}-[0-9]{4}$
          example: 150-0041
        prefecture:
          description: 都道府県
          type: string
          example: 東京都
          maxLength: 100
        city:
          description: 市区町村
          type: string
          example: Shibuya
          maxLength: 100
        street:
          description: 丁目・番地
          type: string
          example: 1-2-3 Jinnan
          maxLength: 200
        building:
          description: 建物名・部屋番号
          type: string
          example: Shibuya Building 101
          maxLength: 200
          nullable: true
    UserResponse:
      type: object
      description: ユーザー情報の基本レスポンススキーマ
      required:
        - id
        - firstName
        - lastName
        - phone
        - email
        - postalCode
        - prefecture
        - city
        - street
        - deletedAt
      properties:
        id:
          type: string
          format: uuid
          description: ユーザーID
          example: 123e4567-e89b-12d3-a456-426614174000
        firstName:
          description: 名前
          type: string
          example: John
          maxLength: 100
        lastName:
          description: 苗字
          type: string
          example: Doe
          maxLength: 100
        email:
          type: string
          description: メールアドレス
          format: email
          example: john.doe@example.com
        phone:
          type: string
          description: 電話番号
          pattern: ^\+?[0-9]{10,15}$
          example: '09012345678'
        postalCode:
          description: 郵便番号
          type: string
          pattern: ^[0-9]{3}-[0-9]{4}$
          example: 150-0041
        prefecture:
          description: 都道府県
          type: string
          example: Tokyo
          maxLength: 100
        city:
          description: 市区町村
          type: string
          example: Shibuya
          maxLength: 100
        street:
          description: 丁目・番地
          type: string
          example: 1-2-3 Jinnan
          maxLength: 255
        building:
          description: 建物名・部屋番号
          type: string
          example: Shibuya Building 101
          maxLength: 255
        deletedAt:
          description: ユーザーが削除された日時。削除されていない場合はnull。
          type: string
          format: date-time
