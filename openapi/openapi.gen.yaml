openapi: 3.0.3
info:
  title: Go Boilerplate API
  termsOfService: https://github.com/Tomy-ch/go-boilerplate-echo-oapi-sqlc
  contact:
    name: TomyC258460
    url: https://x.com/TomyC258460
  version: 2.2.0
  description: |
    Handlers (oapi-codegen) and the published reference documentation are both generated from this
    file, so every endpoint change starts here.
    Replace this text with a description of the API you are shipping: it is published to your API
    consumers exactly as written.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development server
    x-internal: true
  - url: https://api.example.com
    description: Production server (replace with actual URL)
    x-internal: false
  - url: https://staging.api.example.com
    description: Staging server (replace with actual URL)
    x-internal: false
  - url: https://development.api.example.com
    description: Development server (replace with actual URL)
    x-internal: true
security: []
tags:
  - name: health
    description: ヘルスチェック（liveness）。
  - name: healthz
    description: ヘルスチェック（Kubernetes 互換の liveness）。
  - name: ready
    description: レディネスチェック（依存先を含む readiness）。
  - name: version
    description: アプリケーションのバージョン情報。
  - name: metrics
    description: Prometheus メトリクス。
  - name: internal/types/error-response
    description: （内部用）型生成専用のタグ。実エンドポイントではない。
paths:
  /health:
    get:
      operationId: GetHealth
      tags:
        - health
      summary: サーバーのヘルスチェック
      description: サーバーが正常に稼働しているかを確認するためのECSやALB向けのヘルスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /healthz:
    get:
      operationId: GetHealthz
      tags:
        - healthz
      summary: サーバーのヘルスチェック
      description: サーバーが正常に稼働しているかを確認するためのEKS向けのヘルスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /metrics:
    get:
      operationId: GetMetrics
      tags:
        - metrics
      security:
        - BasicAuth: []
      summary: サーバーのメトリクス取得
      description: サーバーのメトリクス情報を取得するためのエンドポイントです。
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            text/plain:
              schema:
                type: string
                description: メトリクス情報を含むプレーンテキスト
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /ready:
    get:
      operationId: GetReady
      tags:
        - ready
      summary: サーバー全体のレディネスチェック
      description: サーバー全体がリクエストを受け付ける準備ができているかを確認するためのレディネスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーはリクエストを受け付ける準備ができています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /version:
    get:
      operationId: GetVersion
      tags:
        - version
      summary: サーバーのバージョン情報を取得します。
      description: サーバーのバージョン情報を取得するためのエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーのバージョン情報を返します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed405'
  /_internal/types/error-response:
    get:
      summary: （内部用）ErrorResponse型生成用エンドポイント
      description: |
        このエンドポイントは Goコード生成のためだけに存在します。 実際には実装・公開されません。
      tags:
        - internal/types/error-response
      operationId: GenerateErrorSchema
      security: []
      responses:
        '200':
          description: このレスポンスの型を生成するためです。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithDetails'
components:
  parameters:
    PageParam:
      name: page
      in: query
      description: ページ番号（1から始まる）。上限を超えた場合は 400 を返します。
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
        example: 1
    PerPageParam:
      name: perPage
      in: query
      description: 1ページあたりの取得件数
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    CursorAfterParam:
      name: after
      in: query
      description: 次ページ取得用の不透明カーソル。先頭ページを取得する場合は省略します。
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
        maxLength: 512
    CursorFirstParam:
      name: first
      in: query
      description: 取得件数の上限
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        example: 50
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      description: |
        冪等キー。非冪等な変更操作（作成系など）で、同一キーによるリトライを重複実行なく
        安全にするための識別子。サーバは同一 (認証主体, キー) の再送を初回結果のリプレイとして扱う。
        このヘッダを宣言する操作は、ハンドラが必ず idempotency.Run 経由で処理する契約（完全性テストで機械検証）。
      required: false
      schema:
        type: string
        pattern: ^[\x21-\x7E]+$
        minLength: 1
        maxLength: 255
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  securitySchemes:
    BasicAuth:
      type: http
      description: 認証にBasic認証を使用することを示します。
      scheme: basic
  schemas:
    ErrorResponse:
      type: object
      description: |
        エラーレスポンスの共通スキーマ（base）。 details は返さない。details を返すエンドポイントは ErrorResponseWithDetails を参照する。
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: 機械的に処理可能なエラーコード
          example: EXAMPLE_ERROR
        message:
          type: string
          description: 人間が読めるエラーメッセージ
          example: 定義されたエラーメッセージ
        requestId:
          type: string
          description: リクエストID
          example: abcdefghijklmnopqrstuvwxyz
    ResponseHealth:
      $ref: '#/components/schemas/HealthResponse'
    ResponseReady:
      $ref: '#/components/schemas/ReadyResponse'
    ResponseVersion:
      $ref: '#/components/schemas/VersionResponse'
    HealthResponse:
      type: object
      description: サーバーのヘルスチェック用のレスポンスです。
      required:
        - status
      properties:
        status:
          type: string
          description: サーバーの現在のステータスを示します。
          example: ok
    ReadyResponse:
      type: object
      description: サーバーのレディネスチェック用のレスポンスです。
      required:
        - status
        - applicationTime
        - dbRespondedAt
        - dbLatencyMs
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unhealthy
          description: サーバーのレディネス状態
          example: ok
        applicationTime:
          type: string
          format: date-time
          description: アプリケーションサーバーの現在時刻
          example: '2024-06-01T12:00:01Z'
        dbRespondedAt:
          type: string
          format: date-time
          description: データベースが最後に正常に応答した日時
          example: '2024-06-01T12:00:00Z'
        dbLatencyMs:
          type: integer
          format: int64
          description: データベース応答までの時間（ミリ秒）
          example: 8
    VersionResponse:
      type: object
      description: サーバーのバージョン情報用のレスポンスです。
      required:
        - version
        - revision
        - buildDate
        - environment
        - service
      properties:
        version:
          type: string
          description: アプリケーションのバージョン
          example: 1.5.0
        revision:
          type: string
          description: アプリケーションのリビジョン
          example: a1b2c3d
        buildDate:
          type: string
          format: date-time
          description: アプリケーションのビルド日時
          example: '2026-01-01T00:00:00Z'
        environment:
          type: string
          description: 実行環境
          example: production
        service:
          type: string
          description: サービス名
          example: go-boilerplate
    ErrorResponseWithDetails:
      type: object
      description: |
        詳細識別子付きエラーレスポンススキーマ。 この schema を error レスポンスに宣言したエンドポイントだけが details を返せる（opt-in）。 未宣言のエンドポイントでは errorhandler が details を fail-closed で落とす。
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: 機械的に処理可能なエラーコード
          example: EXAMPLE_ERROR
        message:
          type: string
          description: 人間が読めるエラーメッセージ
          example: 定義されたエラーメッセージ
        requestId:
          type: string
          description: リクエストID
          example: abcdefghijklmnopqrstuvwxyz
        details:
          type: array
          description: エラー詳細を示す公開可能な識別子(任意)。検証エラーでは不正なフィールド名が入る
          items:
            type: string
          example:
            - firstName
            - email
  responses:
    MethodNotAllowed405:
      description: 許可されていないリクエスト方法です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
