openapi: 3.0.3
info:
  title: Boilerplate Go with Onion Architecture, Echo and SQLC
  termsOfService: https://github.com/Tomy-ch/go-boilerplate-echo-oapi-sqlc
  contact:
    name: TomyC258460
    url: https://x.com/TomyC258460
  version: 2.1.0
  description: |
    This API is built on a modular, layered architecture using Go, Echo, and PostgreSQL.
    It follows the Onion Architecture and is designed to be testable, maintainable, and scalable.

    The project is structured around domain-driven principles, with clean separation between interfaces,
    use cases, domain entities, and infrastructure. All handlers are generated from the OpenAPI specification
    using oapi-codegen, and strict typing is enforced across the system.

    This API is intended as a production-ready boilerplate that balances performance,
    flexibility, and developer experience.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server (replace with actual URL)
  - url: https://staging.api.example.com
    description: Staging server (replace with actual URL)
  - url: https://development.api.example.com
    description: Development server (replace with actual URL)
security: []
tags:
  - name: health
    description: ヘルスチェック（liveness）。
  - name: healthz
    description: ヘルスチェック（Kubernetes 互換の liveness）。
  - name: ready
    description: レディネスチェック（依存先を含む readiness）。
  - name: version
    description: アプリケーションのバージョン情報。
  - name: metrics
    description: Prometheus メトリクス。
  - name: v1/users
    description: ユーザーリソース（一覧取得・作成）。
  - name: v1/users/detail
    description: 単一ユーザー（取得・更新・部分更新・削除・パスワード変更）。
  - name: v1/users/feed
    description: ユーザーフィード（cursor ページネーション）。
  - name: v1/users/search
    description: ユーザー検索（キーワード）。
  - name: v1/prefectures
    description: 都道府県マスタ一覧（認証不要の参照系サンプル）。
  - name: v1/product-statuses
    description: 商品ステータスマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/product-categories
    description: 商品カテゴリマスタ一覧（認証不要の参照系サンプル）。
  - name: v1/products
    description: 商品一覧（認証不要・cursor ページネーション + フィルタ + キーワード検索 + 並び替え）。
  - name: v1/exchange-rates
    description: 為替レート換算（外部 gateway 利用サンプル）。
  - name: internal/types/error-response
    description: （内部用）型生成専用のタグ。実エンドポイントではない。
paths:
  /health:
    get:
      operationId: GetHealth
      tags:
        - health
      summary: サーバーのヘルスチェック
      description: サーバーが正常に稼働しているかを確認するためのECSやALB向けのヘルスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /healthz:
    get:
      operationId: GetHealthz
      tags:
        - healthz
      summary: サーバーのヘルスチェック
      description: サーバーが正常に稼働しているかを確認するためのEKS向けのヘルスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      operationId: GetMetrics
      tags:
        - metrics
      security:
        - BasicAuth: []
      summary: サーバーのメトリクス取得
      description: サーバーのメトリクス情報を取得するためのエンドポイントです。
      responses:
        '200':
          description: サーバーは正常に稼働しています。
          content:
            text/plain:
              schema:
                type: string
                description: メトリクス情報を含むプレーンテキスト
  /ready:
    get:
      operationId: GetReady
      tags:
        - ready
      summary: サーバー全体のレディネスチェック
      description: サーバー全体がリクエストを受け付ける準備ができているかを確認するためのレディネスチェックエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーはリクエストを受け付ける準備ができています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /version:
    get:
      operationId: GetVersion
      tags:
        - version
      summary: サーバーのバージョン情報を取得します。
      description: サーバーのバージョン情報を取得するためのエンドポイントです。
      security: []
      responses:
        '200':
          description: サーバーのバージョン情報を返します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /_internal/types/error-response:
    get:
      summary: （内部用）ErrorResponse型生成用エンドポイント
      description: |
        このエンドポイントは Goコード生成のためだけに存在します。 実際には実装・公開されません。
      tags:
        - internal/types/error-response
      operationId: GenerateErrorSchema
      security: []
      responses:
        '200':
          description: このレスポンスの型を生成するためです。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithDetails'
  /v1/users:
    get:
      operationId: GetUsers
      tags:
        - v1/users
      summary: ユーザー一覧の取得
      description: ユーザーの一覧を取得します。ページネーションを指定できます。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActiveParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: 取得に成功したユーザー一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      operationId: PostUsers
      tags:
        - v1/users
      summary: ユーザーの作成
      description: 新しいユーザーを作成します。必要な情報をリクエストボディに含めてください。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersPostRequest'
      responses:
        '201':
          description: ユーザーの作成に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/{userId}:
    get:
      operationId: GetUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの取得
      description: 指定されたUUIDに該当するユーザーの詳細情報を取得します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: ユーザーの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    put:
      operationId: PutUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの更新
      description: 指定されたUUIDに該当するユーザーの情報を更新します。必要な情報をリクエストボディに含めてください。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPutRequest'
      responses:
        '200':
          description: ユーザーの更新に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    patch:
      operationId: PatchUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの部分更新
      description: 指定されたUUIDに該当するユーザーの情報を部分的に更新します。必要な情報をリクエストボディに含めてください。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: ユーザーの部分更新に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/Conflict409'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    delete:
      operationId: DeleteUsersDetail
      tags:
        - v1/users/detail
      summary: 単一ユーザーの削除
      description: 指定されたUUIDに該当するユーザーを削除します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: ユーザーの削除に成功しました
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/Conflict409'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/me:
    get:
      operationId: GetUsersMe
      tags:
        - v1/users/detail
      summary: 認証ユーザー自身の取得
      description: 認証コンテキスト（Bearer トークン）の内部 UserID に該当するユーザー自身の詳細情報を取得します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ユーザーの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/me/password:
    put:
      operationId: PutUsersMePassword
      tags:
        - v1/users/detail
      summary: 認証ユーザー自身のパスワード変更
      description: 認証中のユーザー自身のパスワードを変更します。現在のパスワードを照合し、一致した場合のみ更新します。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordPutRequest'
      responses:
        '204':
          description: パスワードの変更に成功しました
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          description: 現在のパスワードが一致しません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/search:
    get:
      operationId: GetUsersSearch
      tags:
        - v1/users/search
      summary: ユーザー一覧の取得
      description: 検索条件に基づいてユーザーの一覧を取得します。ページネーションを指定できます。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/KeywordParam'
        - $ref: '#/components/parameters/ActiveParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: 検索条件に基づいて取得したユーザー一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/users/feed:
    get:
      operationId: GetUsersFeed
      tags:
        - v1/users/feed
      summary: ユーザーフィードの取得
      description: 未削除のユーザーを作成日時の降順（cursor ページネーション）で取得します。先頭ページは after を省略し、以降は前ページのレスポンスに含まれる nextCursor を after に指定します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorAfterParam'
        - $ref: '#/components/parameters/CursorFirstParam'
      responses:
        '200':
          description: cursor ページネーションで取得したユーザーフィード
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersFeedResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/prefectures:
    get:
      operationId: GetPrefectures
      tags:
        - v1/prefectures
      summary: 都道府県マスタ一覧の取得
      description: |
        都道府県マスタの全件を code 昇順で返します。
        認証不要の公開エンドポイントであり、ページネーションは行いません（全 47 件を返します）。
      security: []
      responses:
        '200':
          description: 都道府県マスタの一覧（code 昇順）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefecturesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/product-statuses:
    get:
      operationId: GetProductStatuses
      tags:
        - v1/product-statuses
      summary: 商品ステータスマスタ一覧の取得
      description: |
        商品ステータスマスタの全件を sort_key（表示順）昇順で返します。
        認証不要の公開エンドポイントであり、ページネーションは行いません（全 10 件を返します）。
      security: []
      responses:
        '200':
          description: 商品ステータスマスタの一覧（sort_key 昇順）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductStatusesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/product-categories:
    get:
      operationId: GetProductCategories
      tags:
        - v1/product-categories
      summary: 商品カテゴリマスタ一覧の取得
      description: |
        商品カテゴリマスタの全件を sort_key 昇順で返します。
        認証不要の公開エンドポイントであり、ページネーションは行いません（全件を返します）。
      security: []
      responses:
        '200':
          description: 商品カテゴリマスタの一覧（sort_key 昇順）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategoriesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/products:
    get:
      operationId: GetProducts
      tags:
        - v1/products
      summary: 商品一覧の取得
      description: |
        公開済みの商品を cursor ページネーションで取得します。認証不要の公開エンドポイントです。
        既定では公開日時の降順（publishedAt DESC, id DESC）で並び、sort=publishedAt で昇順に切り替えられます。
        categoryId / statusId でフィルタ、keyword で商品名・説明の部分一致検索ができます。
        公開日時が未設定（未公開）の商品は返しません。ステータスによる可視範囲の絞り込みは今後対応予定です。
        price は USD セント単位の整数です。
      security: []
      parameters:
        - $ref: '#/components/parameters/CursorAfterParam'
        - $ref: '#/components/parameters/CursorFirstParam'
        - $ref: '#/components/parameters/CategoryIdParam'
        - $ref: '#/components/parameters/StatusIdParam'
        - $ref: '#/components/parameters/KeywordParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: cursor ページネーションで取得した公開商品一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /v1/exchange-rates:
    get:
      operationId: GetExchangeRates
      tags:
        - v1/exchange-rates
      summary: 為替レートで金額を換算します。
      description: |
        base 通貨建ての amount を quote 通貨へ換算した結果を返します。
        外部の為替レートサービスを gateway（DTO モード）経由で利用するサンプルエンドポイントです。
      security: []
      parameters:
        - name: base
          in: query
          required: true
          description: 換算元の通貨コード
          schema:
            type: string
            example: USD
        - name: quote
          in: query
          required: true
          description: 換算先の通貨コード
          schema:
            type: string
            example: JPY
        - name: amount
          in: query
          required: true
          description: 換算する金額（base 通貨建て）
          schema:
            type: number
            format: double
            example: 100
      responses:
        '200':
          description: 換算結果を返します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/InternalServerError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
components:
  parameters:
    PageParam:
      name: page
      in: query
      description: ページ番号（1から始まる）
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    PerPageParam:
      name: perPage
      in: query
      description: 1ページあたりの取得件数
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    CursorAfterParam:
      name: after
      in: query
      description: 次ページ取得用の不透明カーソル。先頭ページを取得する場合は省略します。
      required: false
      schema:
        type: string
    CursorFirstParam:
      name: first
      in: query
      description: 取得件数の上限
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        example: 50
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      description: |
        冪等キー。非冪等な変更操作（作成系など）で、同一キーによるリトライを重複実行なく
        安全にするための識別子。サーバは同一 (認証主体, キー) の再送を初回結果のリプレイとして扱う。
        このヘッダを宣言する操作は、ハンドラが必ず idempotency.Run 経由で処理する契約（完全性テストで機械検証）。
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    KeywordParam:
      name: keyword
      in: query
      description: 全文検索キーワード
      required: false
      schema:
        type: string
        example: example keyword
    ActiveParam:
      name: active
      in: query
      description: 有効なデータのみを対象とする場合はtrue、無効なデータのみを対象とする場合はfalse、全てのデータを対象とする場合は指定しない
      required: false
      schema:
        type: boolean
        example: true
    UserIdParam:
      name: userId
      in: path
      required: true
      description: ユーザーのUUID
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
    CategoryIdParam:
      name: categoryId
      in: query
      description: 商品カテゴリIDでフィルタします。指定しない場合は全カテゴリを対象とします。
      required: false
      schema:
        type: string
        format: uuid
        example: 5dd52d84-78eb-4a52-ba0b-2e11c95c2af2
    StatusIdParam:
      name: statusId
      in: query
      description: 商品ステータスIDでフィルタします。指定しない場合は全ステータスを対象とします。
      required: false
      schema:
        type: string
        format: uuid
        example: 093170fb-83a2-4864-a2b3-53236eaf3597
    SortParam:
      name: sort
      in: query
      description: |
        並び順。`-publishedAt`（既定）は公開日時の降順、`publishedAt` は公開日時の昇順です。
        いずれも同一公開日時の商品は ID で安定ソートします。
      required: false
      schema:
        type: string
        enum:
          - '-publishedAt'
          - publishedAt
        default: '-publishedAt'
        example: '-publishedAt'
  securitySchemes:
    BearerAuth:
      type: http
      description: 認証にBearerトークンを使用することを示します。
      scheme: bearer
      bearerFormat: JWT
    BasicAuth:
      type: http
      description: 認証にBasic認証を使用することを示します。
      scheme: basic
  schemas:
    ErrorResponse:
      type: object
      description: |
        エラーレスポンスの共通スキーマ（base）。 details は返さない。details を返すエンドポイントは ErrorResponseWithDetails を参照する。
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: 機械的に処理可能なエラーコード
          example: EXAMPLE_ERROR
        message:
          type: string
          description: 人間が読めるエラーメッセージ
          example: 定義されたエラーメッセージ
        requestId:
          type: string
          description: リクエストID
          example: abcdefghijklmnopqrstuvwxyz
    ResponseHealth:
      $ref: '#/components/schemas/HealthResponse'
    ResponseReady:
      $ref: '#/components/schemas/ReadyResponse'
    ResponseVersion:
      $ref: '#/components/schemas/VersionResponse'
    UserBaseInputRequest:
      description: |
        ユーザー情報の基本入力スキーマ。
        allOf 継承（POST が password を兄弟スキーマで追加）と additionalProperties:false は
        JSON Schema 上で非互換（基底側が兄弟の追加プロパティを拒否する）ため、
        additionalProperties は指定しない。未知フィールドは生成型のバインドで無視される。
      properties:
        firstName:
          description: 名前
          type: string
          example: Alice
          maxLength: 50
        lastName:
          description: 苗字
          type: string
          example: Smith
          maxLength: 50
        email:
          description: メールアドレス
          type: string
          format: email
          maxLength: 100
          example: alice.smith@example.com
        phone:
          description: 電話番号
          type: string
          pattern: ^\+?[0-9]{10,15}$
          example: '09012345678'
        postalCode:
          description: 郵便番号
          type: string
          pattern: ^[0-9]{3}-[0-9]{4}$
          example: 150-0041
        prefecture:
          description: 都道府県
          type: string
          example: 東京都
          maxLength: 100
        city:
          description: 市区町村
          type: string
          example: Shibuya
          maxLength: 100
        street:
          description: 丁目・番地
          type: string
          example: 1-2-3 Jinnan
          maxLength: 200
        building:
          description: 建物名・部屋番号
          type: string
          example: Shibuya Building 101
          maxLength: 200
          nullable: true
    UserResponse:
      type: object
      description: ユーザー情報の基本レスポンススキーマ
      required:
        - firstName
        - lastName
        - phone
        - email
        - postalCode
        - prefecture
        - city
        - street
        - deletedAt
      properties:
        firstName:
          description: 名前
          type: string
          example: John
          maxLength: 100
        lastName:
          description: 苗字
          type: string
          example: Doe
          maxLength: 100
        email:
          type: string
          description: メールアドレス
          format: email
          example: john.doe@example.com
        phone:
          type: string
          description: 電話番号
          pattern: ^\+?[0-9]{10,15}$
          example: '09012345678'
        postalCode:
          description: 郵便番号
          type: string
          pattern: ^[0-9]{3}-[0-9]{4}$
          example: 150-0041
        prefecture:
          description: 都道府県
          type: string
          example: Tokyo
          maxLength: 100
        city:
          description: 市区町村
          type: string
          example: Shibuya
          maxLength: 100
        street:
          description: 丁目・番地
          type: string
          example: 1-2-3 Jinnan
          maxLength: 255
        building:
          description: 建物名・部屋番号
          type: string
          example: Shibuya Building 101
          maxLength: 255
        deletedAt:
          description: ユーザーが削除された日時。削除されていない場合はnull。
          type: string
          format: date-time
          nullable: true
    UsersSearchResponse:
      description: ユーザー検索のレスポンススキーマ
      allOf:
        - type: object
          required:
            - users
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/UsersSearchResponseItem'
        - $ref: '#/components/schemas/PaginationMetadataResponse'
    UsersFeedResponse:
      description: ユーザーフィード（cursor ページネーション）のレスポンススキーマ
      allOf:
        - type: object
          required:
            - users
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/UserResponse'
        - $ref: '#/components/schemas/CursorPaginationMetadataResponse'
    CursorPaginationMetadataResponse:
      type: object
      required:
        - nextCursor
        - hasNext
      properties:
        nextCursor:
          type: string
          nullable: true
          description: 次ページ取得用のカーソル。最終ページの場合は null です。
          example: eyJrMCI6IjIwMjYtMDEtMDFUMDA6MDA6MDBaIn0
        hasNext:
          type: boolean
          description: 次ページが存在するかどうか
          example: true
    UserSearchResponseItem:
      $ref: '#/components/schemas/UsersSearchResponseItem'
    ResponseV1User:
      $ref: '#/components/schemas/UserResponse'
    ResponseV1Users:
      $ref: '#/components/schemas/UsersResponse'
    RequestPostV1Users:
      $ref: '#/components/schemas/UsersPostRequest'
    RequestPutV1User:
      $ref: '#/components/schemas/UserPutRequest'
    RequestPatchV1User:
      $ref: '#/components/schemas/UserPatchRequest'
    ResponseV1ExchangeRate:
      $ref: '#/components/schemas/ExchangeRateResponse'
    PrefectureResponse:
      type: object
      description: 都道府県マスタ 1 件分のレスポンスです。
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
          description: 都道府県ID
          example: 101caa1e-84e7-4ceb-9108-50d40b6be1a3
        code:
          type: integer
          description: JIS X 0401 都道府県コード（1〜47）
          example: 13
        name:
          type: string
          description: 都道府県名
          example: 東京都
    ResponseV1Prefectures:
      $ref: '#/components/schemas/PrefecturesResponse'
    ProductStatusResponse:
      type: object
      description: 商品ステータスマスタ 1 件分のレスポンスです。
      required:
        - id
        - code
        - name
        - sortKey
      properties:
        id:
          type: string
          format: uuid
          description: 商品ステータスID
          example: 093170fb-83a2-4864-a2b3-53236eaf3597
        code:
          type: integer
          description: 商品ステータスコード（正の SMALLINT）
          example: 1
        name:
          type: string
          description: 商品ステータス名
          example: 在庫あり
        sortKey:
          type: integer
          description: 表示順（sortKey 昇順で一覧を並べる。code とは非連動）
          example: 5
    ResponseV1ProductStatuses:
      $ref: '#/components/schemas/ProductStatusesResponse'
    ProductCategoryResponse:
      type: object
      description: 商品カテゴリマスタ 1 件分のレスポンスです。
      required:
        - id
        - code
        - name
        - sortKey
      properties:
        id:
          type: string
          format: uuid
          description: 商品カテゴリID
          example: 5dd52d84-78eb-4a52-ba0b-2e11c95c2af2
        code:
          type: integer
          description: 商品カテゴリコード
          example: 1
        name:
          type: string
          description: 商品カテゴリ名
          example: 電子機器
        sortKey:
          type: integer
          description: 表示順
          example: 1
    ResponseV1ProductCategories:
      $ref: '#/components/schemas/ProductCategoriesResponse'
    ProductResponse:
      type: object
      description: 商品情報のレスポンススキーマ
      required:
        - id
        - name
        - description
        - price
        - quantity
        - stockWarningThreshold
        - statusId
        - categoryId
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
          description: 商品ID
          example: b1d4e0f2-3c5a-4b6d-8e7f-1a2b3c4d5e6f
        name:
          type: string
          description: 商品名
          maxLength: 255
          example: ワイヤレスイヤホン
        description:
          type: string
          nullable: true
          description: 商品説明。未設定の場合は null です。
          example: ノイズキャンセリング対応の Bluetooth イヤホン
        price:
          type: integer
          format: int32
          description: 価格。USD セント単位の整数で表します（例 1999 は 19.99 ドル相当）。
          example: 1999
        quantity:
          type: integer
          format: int32
          description: 在庫数
          example: 100
        stockWarningThreshold:
          type: integer
          format: int32
          nullable: true
          description: 在庫警告閾値。未設定の場合は null です。
          example: 10
        statusId:
          type: string
          format: uuid
          description: 商品ステータスID。名称は商品ステータスマスタ API で解決します。
          example: 093170fb-83a2-4864-a2b3-53236eaf3597
        categoryId:
          type: string
          format: uuid
          description: 商品カテゴリID。名称は商品カテゴリマスタ API で解決します。
          example: 5dd52d84-78eb-4a52-ba0b-2e11c95c2af2
        publishedAt:
          type: string
          format: date-time
          description: 公開日時。本エンドポイントは公開済みの商品のみを返すため、常に非 null です。
          example: '2026-01-01T00:00:00Z'
    ProductListResponse:
      description: 商品一覧（cursor ページネーション）のレスポンススキーマ
      allOf:
        - type: object
          required:
            - products
          properties:
            products:
              type: array
              items:
                $ref: '#/components/schemas/ProductResponse'
        - $ref: '#/components/schemas/CursorPaginationMetadataResponse'
    HealthResponse:
      type: object
      description: サーバーのヘルスチェック用のレスポンスです。
      required:
        - status
      properties:
        status:
          type: string
          description: サーバーの現在のステータスを示します。
          example: ok
    ReadyResponse:
      type: object
      description: サーバーのレディネスチェック用のレスポンスです。
      required:
        - status
        - applicationTime
        - dbRespondedAt
        - dbLatencyMs
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unhealthy
          description: サーバーのレディネス状態
          example: ok
        applicationTime:
          type: string
          format: date-time
          description: アプリケーションサーバーの現在時刻
          example: '2024-06-01T12:00:01Z'
        dbRespondedAt:
          type: string
          format: date-time
          description: データベースが最後に正常に応答した日時
          example: '2024-06-01T12:00:00Z'
        dbLatencyMs:
          type: integer
          format: int64
          description: データベース応答までの時間（ミリ秒）
          example: 8
    VersionResponse:
      type: object
      description: サーバーのバージョン情報用のレスポンスです。
      required:
        - version
        - revision
        - buildDate
        - environment
        - service
      properties:
        version:
          type: string
          description: アプリケーションのバージョン
          example: 1.5.0
        revision:
          type: string
          description: アプリケーションのリビジョン
          example: a1b2c3d
        buildDate:
          type: string
          format: date-time
          description: アプリケーションのビルド日時
          example: '2026-01-01T00:00:00Z'
        environment:
          type: string
          description: 実行環境
          example: production
        service:
          type: string
          description: サービス名
          example: go-boilerplate
    ErrorResponseWithDetails:
      type: object
      description: |
        詳細識別子付きエラーレスポンススキーマ。 この schema を error レスポンスに宣言したエンドポイントだけが details を返せる（opt-in）。 未宣言のエンドポイントでは errorhandler が details を fail-closed で落とす。
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: 機械的に処理可能なエラーコード
          example: EXAMPLE_ERROR
        message:
          type: string
          description: 人間が読めるエラーメッセージ
          example: 定義されたエラーメッセージ
        requestId:
          type: string
          description: リクエストID
          example: abcdefghijklmnopqrstuvwxyz
        details:
          type: array
          description: エラー詳細を示す公開可能な識別子(任意)。検証エラーでは不正なフィールド名が入る
          items:
            type: string
          example:
            - firstName
            - email
    PaginationMetadataResponse:
      type: object
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
          format: int64
          description: 全件数
          example: 100
        limit:
          type: integer
          description: 1ページあたりの件数
          example: 10
        offset:
          type: integer
          description: 現在のオフセット
          example: 0
    UsersResponse:
      description: ユーザー情報のリストを返すレスポンスです。
      allOf:
        - type: object
          required:
            - users
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/UserResponse'
        - $ref: '#/components/schemas/PaginationMetadataResponse'
    UsersPostRequest:
      description: ユーザー情報の新規作成
      allOf:
        - $ref: '#/components/schemas/UserBaseInputRequest'
        - properties:
            password:
              description: ユーザーのパスワード
              type: string
              format: password
              minLength: 8
              maxLength: 64
              example: P@ssw0rd!
          required:
            - firstName
            - lastName
            - email
            - password
            - phone
            - prefecture
            - city
            - street
            - postalCode
            - building
    UserPatchRequest:
      description: ユーザー情報の部分更新
      allOf:
        - $ref: '#/components/schemas/UserBaseInputRequest'
    UserPutRequest:
      description: ユーザー情報の更新
      allOf:
        - $ref: '#/components/schemas/UserPatchRequest'
        - required:
            - firstName
            - lastName
            - email
            - postalCode
            - phone
            - prefecture
            - city
            - street
            - building
    UserPasswordPutRequest:
      description: ユーザーのパスワード変更（現パスワード照合あり）
      additionalProperties: false
      properties:
        currentPassword:
          description: 現在のパスワード（照合用）
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: P@ssw0rd!
        newPassword:
          description: 新しいパスワード
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: N3wP@ssw0rd!
      required:
        - currentPassword
        - newPassword
    UsersSearchResponseItem:
      description: 検索条件に基づいて取得したユーザー情報
      allOf:
        - $ref: '#/components/schemas/UserResponse'
        - type: object
          required:
            - registeredAt
          properties:
            registeredAt:
              description: 登録日時
              type: string
              format: date-time
    PrefecturesResponse:
      type: array
      description: 都道府県マスタの一覧（code 昇順）。全件を返し、ページネーションは行いません。
      items:
        $ref: '#/components/schemas/PrefectureResponse'
    ProductStatusesResponse:
      type: array
      description: 商品ステータスマスタの一覧（sort_key 昇順）。全件を返し、ページネーションは行いません。
      items:
        $ref: '#/components/schemas/ProductStatusResponse'
    ProductCategoriesResponse:
      type: array
      description: 商品カテゴリマスタの一覧（sort_key 昇順）。全件を返し、ページネーションは行いません。
      items:
        $ref: '#/components/schemas/ProductCategoryResponse'
    ExchangeRateResponse:
      type: object
      description: 為替換算結果のレスポンスです。
      required:
        - base
        - quote
        - amount
        - converted
      properties:
        base:
          type: string
          description: 換算元の通貨コード
          example: USD
        quote:
          type: string
          description: 換算先の通貨コード
          example: JPY
        amount:
          type: number
          format: double
          description: 換算元の金額
          example: 100
        converted:
          type: number
          format: double
          description: 換算後の金額
          example: 15050
  responses:
    BadRequest400:
      description: リクエストが不正です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized401:
      description: 認証が必要です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden403:
      description: 権限が必要です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError500:
      description: サーバーエラーが発生しました。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable503:
      description: サービスが一時的に利用できません。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict409:
      description: リソースが競合しています。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity422:
      description: 入力値が要件を満たしていません。details に不正なフィールド名が入ります。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseWithDetails'
    NotFound404:
      description: 指定されたリソースが存在しません。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
