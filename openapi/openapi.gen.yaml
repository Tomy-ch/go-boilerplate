        code:
          type: string
          description: 購入コード（UUIDv7 文字列・一意）
          example: 0190b0d4-7b1a-7c2e-9f3a-1b2c3d4e5f60
        userId:
          type: string
          format: uuid
          description: 購入したユーザーのID
