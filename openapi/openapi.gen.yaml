          example: 1
    ProductImageInput:
      type: object
      description: |
        商品へ紐付ける画像 1 件。imagePath には画像アップロード（POST /v1/products/images）で得たパスを渡します。
      required:
        - imagePath
        - displaySort
      properties:
        imagePath:
          type: string
          description: 画像パス。画像アップロード（POST /v1/products/images）で得たパスを渡します。 アップロード API が採番したキーだけを受け付けるよう形式を固定しています。未参照オブジェクトの回収（product-image-gc）は、この値がストレージのキーと完全一致することを前提に孤児を判定するためです。UUID を小文字に限るのは、categoryId / statusId と違いこの値が UUID として解釈されず文字列のまま突き合わされるためで、大文字表記を許すと同じキーを指しながら一致せず、生きている画像を孤児と誤判定します。
          pattern: ^products/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(png|jpg|webp)$
          example: products/b1d4e0f2-3c5a-4b6d-8e7f-1a2b3c4d5e6f.png
        displaySort:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
          description: 同一商品内での表示順。1 から数えます。同じ商品の中で重複する値を送ると業務不変条件違反として 422 を返します。 欠番は許容し、送られた値をそのまま保持します。
          example: 1
    ProductsPostRequest:
      type: object
      description: |
        商品作成リクエスト（application/json）。admin のみ実行できます（非 admin は 403）。
        price は負値・非数値を除く十進文字列で受け取り、負価格・負在庫・名称長超過などの業務不変条件違反は 422 を返します。
        images には画像アップロード（POST /v1/products/images）で得たパスと表示順を渡します。表示 URL はフロントが組み立てます。
      required:
        - name
        - price
        - quantity
        - categoryId
        - statusId
      properties:
        name:
          type: string
          maxLength: 255
          description: 商品名
          example: ワイヤレスイヤホン
        description:
          type: string
          nullable: true
          description: 商品説明（リッチテキスト HTML を許容）。未設定の場合は null です。
          example: <p>ノイズキャンセリング対応の Bluetooth イヤホン</p>
        price:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: 価格。サブセント精度を保持する decimal 文字列で表します（例 "19.99"）。 非数値は 400、負値は業務不変条件違反として 422 を返します。
          example: '19.99'
        quantity:
          type: integer
          format: int32
          description: 在庫数。負値は業務不変条件違反として 422 を返します。
          example: 100
        stockWarningThreshold:
          type: integer
          format: int32
          nullable: true
          description: 在庫警告閾値。未設定の場合は null です。
          example: 10
        categoryId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          maxLength: 36
          description: 商品カテゴリ ID
          example: b1d4e0f2-3c5a-4b6d-8e7f-1a2b3c4d5e6f
        statusId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          maxLength: 36
          description: 商品ステータス ID
          example: c2e5f1a3-4d6b-5c7e-9f80-2b3c4d5e6f7a
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: 公開日時。未公開の場合は null です。
          example: '2026-01-01T00:00:00Z'
        images:
          type: array
          description: 商品画像。未指定の場合は画像を持たない商品として作成します。 同じ商品の中で displaySort が重複する場合は業務不変条件違反として 422 を返します。
