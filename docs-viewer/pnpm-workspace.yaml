# docs-viewer の依存解決設定。
# リポジトリ直下ではなく docs-viewer/ に置くのは、ビューアーが引いた依存を Go 側のツールチェーンへ広げないため。

packages:
  - "."

# ----- 時間差防御 -----
# 公開直後の版を解決対象から外す。scripts と窓を揃える（pnpm は分指定。7 日 = 10080 分）。
minimumReleaseAge: 10080
# 緊急のセキュリティ修正は、影響を受ける特定バージョンだけを一時的に例外化する。(パッケージ名だけの例外は禁止)
minimumReleaseAgeExclude:
  - mermaid@11.16.1 # 2026-08-12 00:09 JST 以降に削除する。CVE-2026-50159 / 71436 / 71437 / 71438 / 71439 の修正版で、ビューアーに同梱され閲覧者のブラウザで動く。
# 冷却期間を満たす版が無ければ解決を失敗させる。
minimumReleaseAgeStrict: true
# 公開日時を返さないレジストリの依存は解決を失敗させる。
minimumReleaseAgeIgnoreMissingTime: false

# 依存状態が lockfile と一致しないままスクリプトを実行しない。
verifyDepsBeforeRun: error

# mise.toml[SSOT] と同じ Node.js 版を依存の engine 判定にも使う。
nodeVersion: 24.18.0
# Node.js の対応範囲外を宣言する依存の導入を拒否する。
engineStrict: true

# ----- 実行制御 -----
# 未レビューの依存ライフサイクルスクリプトを install エラーにする。
strictDepBuilds: true
# 依存ライフサイクルスクリプトの実行可否をパッケージ単位で明示する。
allowBuilds:
  esbuild: false
  msw: false

# ----- 公開元の信頼性 -----
# 間接依存による Git・URL などの非標準ソースを拒否する。
blockExoticSubdeps: true
# 過去より弱い provenance に下がった版の導入を拒否する。
trustPolicy: no-downgrade
# 公開から180日を過ぎた版は provenance 情報不足だけでは拒否しない。
trustPolicyIgnoreAfter: 259200
# provenance の後退は、影響を受ける特定バージョンだけを一時的に例外化する。(パッケージ名だけの例外は禁止)
trustPolicyExclude: []

# ----- 依存の差し替え -----
# pnpm は親子の直接辺しか指せないため、親ではなく「解決結果がこの版域に落ちたら」で書く。
overrides:
  # IN_PLACE hook 除去後に切り離された部分木が実行可能なまま残る（GHSA-55q2-fjhq-7xh7）。mermaid が引く。
  "dompurify@<3.4.13": ">=3.4.13 <4"
  # size が 0 のとき custom generator が無限ループする（GHSA-2v37-7h3g-55p8）。postcss が引く。
  "nanoid@3": ">=3.3.17 <4"
  # rolldown が引く @napi-rs/wasm-runtime の peer が `^1.7.1 || ^2.0.0-alpha.3` で、pnpm は高い方＝ alpha を採る。
  # プレリリースを解決結果へ入れない理由は docs/design/security.md が持つ。
  "@emnapi/core": "^1.11.1"
  "@emnapi/runtime": "^1.11.1"
  "@emnapi/wasi-threads": "^1.2.2"
