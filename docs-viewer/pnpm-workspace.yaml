# docs-viewer の依存解決設定。pnpm 10 系以降は install の挙動をこのファイルが持つ。
#
# このディレクトリで閉じた 1 パッケージとして宣言する。リポジトリ直下ではなく docs-viewer/ に
# 置くのは、ビューアーが引いた依存を Go 側のツールチェーン（docker/tools は npm）へ広げないため。

packages:
  - "."

# ----- 時間差防御 -----
# 公開直後の版を解決対象から外し、悪意ある publish を lockfile へ取り込む窓を塞ぐ。
# scripts/pnpm-workspace.yaml と窓を揃える。pnpm は分で指定する（7 日 = 10080 分）。
minimumReleaseAge: 10080
# 冷却期間を満たす版が無ければ、窓を黙って外さず解決を失敗させる。
minimumReleaseAgeStrict: true
# 公開日時を返さないレジストリの依存は、経過日数を判定できないため解決を失敗させる。
minimumReleaseAgeIgnoreMissingTime: false

# 依存状態が lockfile と一致しないままスクリプトを実行しない。
verifyDepsBeforeRun: error

# mise.toml[SSOT] と同じ Node.js 版を依存の engine 判定に使う。
nodeVersion: 24.18.0
# Node.js の対応範囲外を宣言する依存の導入を拒否する。
engineStrict: true

# ----- 実行制御 -----
# 未レビューの依存ライフサイクルスクリプトを install エラーにする。
strictDepBuilds: true
# 依存ライフサイクルスクリプトの実行可否をパッケージ単位で明示する。いずれも build を必要と
# しないため、供給網攻撃の主要な RCE 経路である postinstall を全て閉じる。
allowBuilds:
  esbuild: false
  msw: false

# ----- 公開元の信頼性 -----
# 間接依存による Git・URL などの非標準ソースを拒否する。
blockExoticSubdeps: true
# 過去より弱い provenance に下がった版の導入を拒否する。
trustPolicy: no-downgrade
# 公開から 180 日を過ぎた版は provenance 情報の不足だけでは拒否しない。
trustPolicyIgnoreAfter: 259200
