version: "2"

linters:
  default: none
  enable:
    # Enabled by Default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Disabled by Default
    # - arangolint # ArangoDBクライアントの推奨される使い方をチェックします
    # - asasalint # ユニバーサルインターフェースを扱うときの潜在的なバグを防ぐチェックです
    # - asciicheck # ASCII以外の文字を変数名などで使用しているかをチェックします
    # - bidichk # バイディレクショナルテキストのチェックをします
    # - bodyclose # HTTPレスポンスのボディが閉じられているかをチェックします
    # - canonicalheader # HTTPヘッダーの正規化をチェックします
    # - clickhouselint # ClickHouseのネイティブGoドライバAPIの典型的な誤用を検出します
    # - containedctx # context.Contextが構造体に含まれているかをチェックします
    # - contextcheck # context.Contextの伝播が破棄されていないかをチェックします
    # - copyloopvar # ループ変数のコピーをチェックします
    # - cyclop # 関数+パッケージ単位での複雑度を計算します
    - decorder # constやvarなどの宣言順序をチェックします
    - depguard # 外部ライブラリの使用を制限します
    # - dogsled # _ が複数使用されているかをチェックします
    # - dupl # 重複コードの検出を行います
    # - dupword # 重複した単語を検出します
    # - durationcheck # time.Duration型同士を掛け算してしまう誤用を静的分析で検出する
    # - embeddedstructfieldcheck # 埋め込み構造体フィールドのチェックを行います
    # - err113 # エラーチェックのベストプラクティスかをチェックします
    # - errchkjson # JSON エンコーディングに関する 安全性をチェックします
    # - errname # エラー名の命名規則をチェックします
    # - errorlint # エラー内容の検証(As/Is)のベストプラクティスをチェックします
    # - exhaustive # enum型の全ての値を網羅しているかをチェックします
    # - exhaustruct_v5 # 構造体のフィールドが全て初期化されているかをチェックします
    # - exptostd # 標準ライブラリの使用を推奨します
    # - fatcontext # context.Contextがループで設定されているかをチェックします
    # - forbidigo # 識別子の使用禁止ルールを設定します
    # - forcetypeassert # 型アサーションの強制をチェックします
    - funcorder # 構造体に関連する関数・メソッドの配置順序をチェックします
    - funlen # 関数の長さを制限して、冗長性と複雑さを減らします
    # - ginkgolinter # Ginkgo/Gomegaのテストのベストプラクティスをチェックします
    - gocheckcompilerdirectives # コンパイラディレクティブのチェックを行います
    # - gochecknoglobals # グローバル変数の使用をチェックします
    # - gochecknoinits # init() 関数が存在しないかを検出する
    # - gochecksumtype # 合併型／タグ付き列挙型の網羅性を静的にチェックします
    - gocognit # 人間の理解難度を測る指標として、関数・メソッドの認知的複雑度を算出します
    # - goconst # 定数の使用を推奨します
    - gocritic # Goコードの高級な静的解析を行います
    # - gocyclo # 関数単位での複雑度を計算します
    # - godoclint # godocの記法・作法をチェックします
    # - godot # Goのコメント末尾に必ずピリオドをつけるスタイルをチェックする静的解析ツール
    - godox # 特定のコメントキーワード（たとえば TODO, FIXME, BUG, OPTIMIZE など）を検出します
    # - goheader # Goファイルのヘッダーコメントをチェックします
    # - gomoddirectives # go.modファイルのディレクティブをチェックします
    # - gomodguard_v2 # go.modの直接依存に対する許可・禁止リストをチェックします
    # - goprintffuncname # Printfライクな引数を取る関数が「f」で終わる名前になっているかをチェックします
    - gosec # セキュリティ上の脆弱性を検出します
    # - gosmopolitan # i18n（国際化）やlocale（地域対応）の落とし穴になりやすいアンチパターンを検出します
    # - grouper # グループ化されたコードのスタイルをチェックします
    # - iface # インターフェースの不適切な使用を検出します
    # - importas # import文におけるエイリアス（別名）の使い方に対して一貫性を強制します
    # - inamedparam # インターフェースのメソッド定義において「名前なしパラメータ」が使われていないかを検出します
    # - interfacebloat # 1つのインターフェースにメソッドが多すぎる場合に警告を出します
    # - intrange # 書き換えられる“for”ループ構造を検出し、最適な書き方を提案します
    # - iotamixing # constブロック内でiotaと非iota宣言が混在していないかをチェックします
    # - ireturn # 関数がインターフェースを返していないかを検出します
    - lll # 行の長さを制限します
    # - loggercheck # ログ呼び出しでキーと値の奇数組合せを静的に検出し、もし不一致があれば警告を出します
    # - maintidx # メンテナンス性の低いコードを検出します
    # - makezero # make()でのスライス初期化に関するバグを防ぐためのチェックを行います
    # - mirror # 文字列とバイトスライスの変換を最適化するパターンを検出します
    - misspell # スペルミスを検出します
    # - mnd # マジックナンバーの使用を検出します
    - modernize # モダンなGo言語・標準ライブラリ機能への簡素化を提案します
    # - musttag # Marshal/Unmarshalする際に、エクスポート対象フィールドにタグがついていないことを検出します
    # - nakedret # 名前付き戻り値を持つ関数で、naked return文が使用されていないかを検出します
    # - nestif # ネストされたif文の深さを制限します
    # - nilerr # エラーチェックでnilが返されているかを検出します
    # - nilnesserr # 正しいエラーが返されているかを検出します
    # - nilnil # nilチェックの冗長性を検出します
    # - nlreturn # 関数の戻り値がnilnilなどの冗長な値を返していないかを検出します
    # - noctx # context.Contextを使用していない非推奨なコードを検出します
    # - noinlineerr # エラーを返す関数がインライン化されていないかを検出します
    - nolintlint # nolintコメントの使用をチェックします
    # - nonamedreturns # 名前付きリターン値を全部検出して警告します
    # - nosprintfhostport # IPv6 アドレスを含むホスト名とポートの文字列化にfmt.Sprintfを使っていないかを検出します
    # - paralleltest # テスト関数が並列実行されることを確認します
    # - perfsprint # fmt.Sprintfのパフォーマンスに関する問題を検出します
    # - prealloc # スライスの事前割り当てを推奨します
    # - predeclared # 予約語の使用をチェックします
    # - promlinter # Prometheusのメトリクスに関するベストプラクティスをチェックします
    # - protogetter # Protocol BuffersのGetterメソッドの使用をチェックします
    # - reassign # グローバル変数の再代入を検出します
    # - recvcheck # 関数のレシーバーが統一的に使用されているかをチェックします
    - revive # Goコードの静的解析を行うツールで、特にコードの品質とスタイルに焦点を当てています
    # - rowserrcheck # sql系のインスタンスで、行の取得やエラー処理が正しく行われているかをチェックします
    # - sloglint # ログの書き方をスタイル的観点で静的チェックします
    - spancheck # OpenTelemetryのSpanの使用をチェックします
    # - sqlclosecheck # SQLの接続やトランザクションのクローズ処理をチェックします
    # - tagalign # 構造体タグの整列をチェックします
    # - tagliatelle # 構造体タグのスタイルをチェックします
    # - testableexamples # Example関数の末尾に出力内容に関するコメントがあるかをチェックします
    # - testifylint # Testifyのアサーションやモックの使用をチェックします
    # - testpackage # テストパッケージを作成することで、ブラックボックステストを行うことを推奨します
    # - thelper # テストヘルパー関数の使用をチェックします
    # - tparallel # テスト関数が並列実行されることを確認します
    # - unconvert # 型が既に同じなのに再度キャストしている冗長コードを検出します
    # - unparam # 使用されていない関数のパラメータを検出します
    # - unqueryvet # SQLクエリ/ビルダー内のSELECT *を検出し、明示的なカラム指定を促します
    # - usestdlibvars # 標準ライブラリの変数を使用しているかをチェックします
    # - usetesting # テストコードで誤った標準ライブラリの関数を使っていないかを検出します
    # - varnamelen # 変数名の長さを制限します
    # - wastedassign # 不要な代入を検出します
    # - whitespace # 不要な空白を検出します
    # - wrapcheck # エラーメッセージのラップをチェックします
    # - wsl_v5 # コード中の空行（改行）の追加・削除に関するルール整備を行うツール
    # - zerologlint # zerolog の使い方において間違いや抜けを防止するための静的解析ツール

  settings:
    staticcheck:
      checks:
        - all
    decorder:
      dec-order:
        - "const"
        - "var"
        - "type"
        - "func"
      ignore-underscore-vars: false
      disable-dec-order-check: false
      disable-init-func-first-check: false
    depguard:
      # pkg/ の薄いラッパー経由での利用を強制する規則群（方針の理由: ADR-0001 (avoid-lock-in)）。
      rules:
        only_the_original_error_is_permitted:
          files:
            - "**/*.go"
            - "!**/pkg/xerrors/**.go" # pkg/xerrors配下ではアプリケーション全体で使用するエラーラッパーを実装するため許可します
          list-mode: lax
          deny:
            - pkg: github.com/cockroachdb/errors
              desc: "スタックトレース用として導入したライブラリです。
                代わりに pkg/xerrors を使用してください。"
            - pkg: errors
              desc: "標準の errors パッケージは直接使用しないでください。
                pkg/xerrors の New / Wrap / Join / Is / As を使用してください。"
        only_the_original_uuid_is_permitted:
          files:
            - "**/*.go"
            - "!**/pkg/uuid/**.go" # pkg/uuid配下ではアプリケーション全体で使用するuuidライブラリのラッパーを実装するため許可します
            - "!**/internal/infrastructure/rdb/conv/**.go" # conv配下ではORMの型変換のためuuidライブラリの使用を許可します
          list-mode: lax
          deny:
            - pkg: github.com/google/uuid
              desc: "uuid作成用として導入したライブラリです。
                代わりに pkg/uuid を使用してください。"
        # DDDの境界侵食を防ぐためのルール
        # 特定のライブラリの禁止設定は、.golangci-full.yamlで行っています。
        # 
        # domain層では外部ライブラリの直接使用を全面的に禁止し、pkg経由での使用を強く推奨します。
        # 緩める場合はそのライブラリが陳腐化しにくいか、メンテナンスコストが低いかかつ必要性が高いかを考慮してください。
        # 例： Decimal系のライブラリなど
        maintain_a_sound_domain:
          files:
            - "**/internal/domain/**.go"
          list-mode: lax
          deny:
            - pkg: go-boilerplate/internal/usecase/
              desc: "domain層でusecase層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/controller/
              desc: "domain層でcontroller層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "domain層でinfrastructure層を参照することは禁止です。"
            - pkg: go-boilerplate/pkg/fs
              desc: "domain層でファイルシステム I/O を行わないでください。FS アクセスは外側の層の責務です。"
            - pkg: go-boilerplate/pkg/exec
              desc: "domain層で外部プロセス実行を行わないでください。プロセス実行は外側の層の責務です。"
            - pkg: go-boilerplate/pkg/envutil
              desc: "環境変数の書き換えは外側の層の責務です。本層からの参照は禁止です。"
        # usecase層では外界とのやり取りのライブラリの使用を禁止します。
        # それ以外のライブラリの利用は許可されます。
        # ただし、外部ライブラリの直接使用は避け、pkg経由での使用を強く推奨します。
        maintain_a_sound_usecase:
          files:
            - "**/internal/usecase/**.go"
          list-mode: lax
          deny:
            - pkg: go-boilerplate/internal/controller/
              desc: "usecase層でcontroller層を参照することは禁止です。"
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "usecase層でinfrastructure層を参照することは禁止です。"
            - pkg: go-boilerplate/pkg/fs
              desc: "usecase層でファイルシステム I/O を行わないでください。FS アクセスは外側の層の責務です。"
            - pkg: go-boilerplate/pkg/exec
              desc: "usecase層で外部プロセス実行を行わないでください。プロセス実行は外側の層の責務です。"
            - pkg: go-boilerplate/pkg/envutil
              desc: "環境変数の書き換えは外側の層の責務です。本層からの参照は禁止です。"
        # controller層では、主にHTTPリクエストを扱うライブラリの使用を許可します。
        # ただし、永続化を行うライブラリの使用は禁止します。(主にdatabase/sqlなど)
        maintain_a_sound_controller:
          files:
            - "**/internal/controller/**.go"
          list-mode: lax
          deny:
            - pkg: go-boilerplate/internal/infrastructure/
              desc: "controller層でinfrastructure層を参照することは禁止です。"
        # infrastructure層では、主に永続化を行うライブラリの使用を許可します。
        # ただし、HTTPリクエストを扱うライブラリの使用は禁止します。(主にnet/httpなど)
        maintain_a_sound_infrastructure:
          files:
            - "**/internal/infrastructure/**.go"
          list-mode: lax
          deny:
            - pkg: go-boilerplate/internal/controller/
              desc: "infrastructure層でcontroller層を参照することは禁止です。"
        # Realtime Delivery の feature 中立性（規約①）の depguard 側。architest 側は
        # internal/architest/realtime_isolation_test.go で、両方を維持することが二重検査の前提。
        # 規約②（InstanceLeaseStore の allowlist）はシンボル単位のためここには置けない。
        # 設計理由と二重検査の意図: docs/design/realtime-delivery.md §3.1
        maintain_realtime_feature_neutrality:
          files:
            - "**/internal/usecase/boundary/realtime/**.go"
            - "**/internal/usecase/realtime/**.go"
            - "**/internal/infrastructure/eventlog/**.go"
            - "**/internal/infrastructure/streamticket/**.go"
            - "**/internal/infrastructure/instancelease/**.go"
            - "**/internal/infrastructure/realtimesecret/**.go"
            - "**/internal/infrastructure/realtime/**.go"
            - "**/internal/controller/stream/**.go"
            - "**/internal/controller/realtime/**.go"
          list-mode: lax
          # lax では deny より長い prefix の allow が勝つため、機構自身の 2 package はここで戻します。
          allow:
            - go-boilerplate/internal/usecase/boundary/
            - go-boilerplate/internal/usecase/realtime
          deny:
            - pkg: go-boilerplate/internal/domain/
              desc: "Realtime Delivery の機構側から feature の domain を参照することは禁止です。
                配送機構は feature に対して中立でなければなりません。"
            - pkg: go-boilerplate/internal/usecase/
              desc: "Realtime Delivery の機構側から feature の usecase を参照することは禁止です。
                機構が使ってよいのは usecase/boundary 配下と usecase/realtime だけです。"
    funcorder:
      constructor: true
      struct-method: true
      alphabetical: false
    funlen:
      # 関数内の行数チェックは無効にします。
      lines: -1
      # 関数内のステートメント数を制限します。
      statements: 50
    gocognit:
      min-complexity: 20
    godox:
      keywords:
        - TODO
        - FIXME
    lll:
      line-length: 150
    misspell:
      locale: US
      ignore-rules:
        - "importas"
    modernize:
      disable:
        # 埋め込みフィールドの型指定を省く書き換え（Go 1.27 の新機能）は、この repo が
        # 「基底 + 別軸」の構成を表すために使っている埋め込みを、呼び出し側から見えなくする。
        # user.Attributes は Profile に監査時刻を足した集合で Profile は検証へ値として渡る
        # 単位であり、response.HTTPErrorResponse は生成型 gen.ErrorResponseWithDetails に
        # 転送用フィールドを足したものなので、平坦化すると契約が決めたフィールドと手書きの
        # フィールドが呼び出し側で区別できなくなる。modernize は構文が使えるかを見るもので、
        # 埋め込まれた型が名前を持った概念かどうかは知らない。
        - embedlit
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported # exported な宣言にはドキュメントコメントを必須とする
          arguments:
            - "disableStutteringCheck" # 命名の stutter 検査は行わない
        - name: var-naming
          arguments:
            - []
            - []
            - [{ skipPackageNameChecks: true }] # 変数名の命名規則をチェックしますが、パッケージ名のチェックはスキップします。これにより、パッケージ名が変数名と同じ場合でもエラーにならなくなります。

  exclusions:
    paths:
      - vendor
      # npm が展開する依存ツリー。`flatted` のように Go 実装を同梱するパッケージがあり、
      # そこは第三者のコードなので指摘しても直せない（pnpm 側は `.pnpm` 配下で go が自ら飛ばす）。
      - node_modules
    rules:
      - path: (.+)_test\.go
        linters:
          - lll

run:
  timeout: "30s"
  tests: true
  allow-parallel-runners: true
  allow-serial-runners: true
  relative-path-mode: wd
  concurrency: 4

formatters:
  enable:
    - goimports
    - gofumpt
    - gofmt
    - golines
    - swaggo
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - "go-boilerplate"
    gofumpt:
      # extra 規則は 3 つとも有効にする。旧 extra-rules: true が意味していたのは
      # 「既定で無効な追加規則を使う」ことで、規則が個別キーへ分割された後もその意図は
      # 変わらない。1 つだけ落とすと、なぜそれが外れているのかを読み手が推測することになる。
      module-path: "go-boilerplate"
      extra:
        # 同じ型で隣接する引数をまとめる（a int, b int → a, b int）。
        group-params: true
        # 開き括弧が行末で終わる複数行の呼び出しで、閉じ括弧を独立行に置く。
        # 引数を足し引きしても差分が 1 行で済む。
        balance-calls: true
        # 名前付き返り値を持つ関数の裸の return に値を書き出す（return → return err）。
        clothe-returns: true
    golines:
      max-len: 150
      tab-len: 4
      shorten-comments: false
      reformat-tags: true
      chain-split-dots: true
  exclusions:
    paths:
      - ".*\\.gen\\.go$"
      - ".*\\.sql\\.go$"
      - ".*mock_.*\\.go$"
      - "vendor/.*"
      - "node_modules/.*"
