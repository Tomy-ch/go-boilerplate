version: "2"
sql:
  - engine: postgresql
    schema: database/gen/schema.gen.sql
    queries: database/gen/
    strict_function_checks: true
    gen:
      go:
        sql_package: pgx/v5
        out: internal/infrastructure/rdb/sqlc/gen/
        package: gen
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: true
        emit_empty_slices: false
        emit_exported_queries: false
        emit_json_tags: false
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_sql_as_comment: true
        output_batch_file_name: batch.gen.go
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_querier_file_name: querier.gen.go
        output_copyfrom_file_name: copyfrom.gen.go
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: "pg_catalog.numeric"
            go_type:
              import: github.com/shopspring/decimal
              type: Decimal
              pointer: true
            nullable: true
          - db_type: uuid
            go_type:
              import: go-boilerplate/pkg/uuid
              package: uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: go-boilerplate/pkg/uuid
              package: uuid
              type: UUID
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: time
              type: Time
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
