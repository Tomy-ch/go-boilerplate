name: Upsert PR comment
description: Detect an existing comment by marker and update / create it (PR comment upsert)

inputs:
  github-token:
    required: true
    description: Token used to post the comment; must post as a bot (GITHUB_TOKEN or a GitHub App token), because the existing comment is matched on a bot author
  marker:
    required: true
    description: HTML comment marker used to detect the same comment
  status:
    required: false
    default: ""
    description: The caller's verdict. The literal `success` is the only value that suppresses creating a comment; every other value — including the empty default, which is what a cut-off job produces — posts one
  body-file:
    required: true
    description: Path to the file read as the comment body; a missing file is reported as a cut-off job rather than failing the step
  title:
    required: false
    default: ""
    description: Heading prepended to the body (optional)
  details-summary:
    required: false
    default: ""
    description: When set, the summary text used to fold the body into a details block with a code block
  max-length:
    required: false
    default: "45000"
    description: Maximum body length in characters (the excess is truncated)

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        MARKER: ${{ inputs.marker }}
        STATUS: ${{ inputs.status }}
        BODY_FILE: ${{ inputs.body-file }}
        TITLE: ${{ inputs.title }}
        DETAILS_SUMMARY: ${{ inputs.details-summary }}
        MAX_LENGTH: ${{ inputs.max-length }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          const marker = process.env.MARKER;
          const status = process.env.STATUS || '';
          const bodyFile = process.env.BODY_FILE;
          const title = process.env.TITLE || '';
          const detailsSummary = process.env.DETAILS_SUMMARY || '';
          const maxLength = Number(process.env.MAX_LENGTH || '45000');

          const pr = context.payload.pull_request?.number;
          if (!pr) {
            core.setFailed('Not a PR context');
            return;
          }
          // A cut-off job can stop before the step that writes the body file runs, so a missing
          // file is the normal shape of the very case this comment has to stay visible for.
          // Failing the step instead would leave the pull request with no trace of the cut-off at
          // all, which is exactly what the `always()` guard on every calling step exists to
          // prevent. The cost is that a miswired path surfaces as a cut-off notice on a green run
          // rather than as a step failure; that is loud enough to catch, and silence is not.
          // A step that was cut off *while* writing the file leaves one behind, so absence is not
          // the whole test — the caller's `title` carries the other half (see below).
          const cutOff = !fs.existsSync(bodyFile);
          if (cutOff) {
            core.warning(`${bodyFile} not found; reporting the job as cut off`);
          }

          let content = cutOff
            ? `No result was produced: the job did not reach the step that writes \`${bodyFile}\`. See the run log for how far it got.`
            : fs.readFileSync(bodyFile, 'utf8').trimEnd();
          if (content.length > maxLength) {
            content = content.slice(0, maxLength) + '\n... (truncated)';
          }

          // With no body there is nothing the caller's heading can still be describing, so the
          // cut-off heading replaces it rather than filling in for a missing one — a literal
          // title like "Trivy Image Scan" over a cut-off notice reads as a scan that ran. The
          // wording names no cause: a body can also be missing because an earlier step failed
          // outright, and only the run log distinguishes that from a timeout. Folding one line
          // behind a details block would hide the only thing left to say.
          const heading = cutOff
            ? '## ⚠️ CUT OFF (no result produced)'
            : title;
          const summary = cutOff ? '' : detailsSummary;

          const updatedAtJST = new Date().toLocaleString('ja-JP', {
            timeZone: 'Asia/Tokyo',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
          });

          const headSha =
            (context.payload.pull_request?.head?.sha)
            || process.env.GITHUB_SHA
            || context.sha;
          const shortSha = headSha.slice(0, 7);

          const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
          const commitUrl = `${repoUrl}/commit/${headSha}`;
          const commitLine = `🔖 Commit: [\`${shortSha}\`](${commitUrl})`;
          const updatedLine = `🕒 UpdatedAt: ${updatedAtJST} (JST)`;

          // A body reproduced verbatim inside a fixed three-backtick fence can close that
          // fence itself: a linter or compiler echoes source lines, so a pull request author
          // controls what lands here, and everything after a ``` line would render as live
          // Markdown — mentions notifying third parties, fabricated headings and links posted
          // under the CI bot's name. Fencing with one more backtick than the longest run in
          // the body leaves no run able to close it.
          const fenceFor = (text) => {
            const longestRun = (text.match(/`+/g) || [])
              .reduce((max, run) => Math.max(max, run.length), 0);
            return '`'.repeat(Math.max(3, longestRun + 1));
          };

          const fence = fenceFor(content);
          const main = summary
            ? [`<details><summary>${summary}</summary>`, '', fence, content, fence, '', '</details>'].join('\n')
            : content;

          const parts = [marker];
          if (heading) parts.push(heading, '');
          parts.push(main, '', commitLine, '', updatedLine);
          const body = parts.join('\n');

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr,
            per_page: 100,
          });

          // Anyone can post a comment carrying the marker on a public repository, and every
          // workflow here comments under the same bot, so a marker found anywhere in a body
          // identifies nothing: a pull request author who gets one workflow to echo another's
          // marker into its log steers that other workflow onto the wrong comment. A body this
          // action wrote always opens with the marker, which the planted one never does.
          const existing = comments.find(
            c => (c.body || '').startsWith(marker) && c.user?.type === 'Bot',
          );

          // A pull request here runs some thirty checks, so a comment per passing one buries the
          // one that did not pass under the ones that need nothing. What gets suppressed is
          // *creating* a comment, not updating one: a check that failed and was then fixed still
          // overwrites its own red comment with the green result, in place, so the pull request
          // never keeps a failure that no longer holds — and never states a pass no one asked for.
          // A cut-off produces no status at all, which is not `success` and therefore still posts.
          const quiet = !cutOff && status === 'success';

          if (!existing && quiet) {
            core.info(`status=success and no existing ${marker} comment; nothing to post`);
            return;
          }

          // The one comment that is removed rather than overwritten. A cut-off notice records no
          // verdict — only that a run ended without reaching one — so a later `success` does not
          // supersede a finding, it answers a question that was left open, and overwriting would
          // leave a permanent green comment on the pull request for a cancellation. That is not a
          // rare case: `cancel-in-progress` cancels the previous run on every quick second push,
          // and each cancelled job that pipes its output leaves a half-written body behind, so the
          // notice is created and then frozen green. The cancellation stays in the run history
          // either way. Recognition is by heading, because a job cut off mid-write has a body and
          // reaches the action's own notice only when it has none; every caller's heading carries
          // this phrase, which `make actions-cutoff-lint` is what keeps true. A refused delete
          // falls back to the overwrite rather than leaving a stale cut-off standing on a green run.
          const headingLine = (existing?.body || '').split('\n')[1] || '';
          const staleCutOff = quiet
            && headingLine.startsWith('## ')
            && headingLine.includes('CUT OFF (no result produced)');

          if (existing && staleCutOff) {
            try {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
              core.info(`removed the stale cut-off ${marker} comment`);
              return;
            } catch (error) {
              core.warning(`could not delete the stale cut-off comment (${error.message}); updating it instead`);
            }
          }

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
          }
