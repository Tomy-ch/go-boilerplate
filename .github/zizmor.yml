# zizmor configuration — static analysis for GitHub Actions definitions.
# Consumed by .github/workflows/zizmor.yaml.
#
# Policy for this file:
#   - No audit is disabled. Every entry below is either a documented false
#     positive or an explicitly accepted baseline for a pre-existing finding.
#   - `ignore` is file-scoped, so a NEW workflow hitting the same audit still
#     fails CI. Remove an entry once its finding is actually fixed.
#   - `remap` is used where the finding class is repository-wide and inherent to
#     the toolchain: the audit keeps running and every finding stays in the SARIF
#     uploaded to code scanning, it just no longer trips the CI gate (which fires
#     on high severity only).

rules:
  # Composite-action findings cannot be ignored per file (zizmor limitation), so
  # the severity is remapped instead of listing the file.
  # .github/actions/setup-postgres appends to $GITHUB_PATH using its own
  # `pg_version` input, which is supplied by the calling workflow and never by
  # untrusted event data — zizmor itself rates this detection "low confidence".
  github-env:
    remap:
      severity: medium

  # Fires on any workflow that combines a caching setup action (mise / setup-go)
  # with a trigger set zizmor associates with publishing, which is nearly every
  # workflow here — a file list would rot on every addition. Detection is "low
  # confidence" and the caches are branch-scoped, so it is kept as an alert
  # rather than a gate. deploy-app.yaml, which really does publish images, is
  # still worth an explicit review.
  cache-poisoning:
    remap:
      severity: medium

  # The version comment trailing a pinned SHA is this repository's declared tag line, and
  # `make pin-actions-resolve` writes a moving major tag (`# v1`) into it wherever that
  # tag's head was already past the supply-chain quarantine window — 13 of the 24 entries
  # in .github/actions-pin.toml are of that form. The SHA beside it is what the tag pointed
  # at when it was resolved, so it lags the tag's head by design and zizmor reads that gap
  # as a mismatched comment.
  #
  # The audit is not wrong about what it sees: `# v1` is less specific than the SHA it
  # annotates, and Grype mis-scored the same line for the same reason (see .grype.yaml).
  # Whether the resolver should write exact versions instead is a decision about the
  # pinning convention, taken in /actions-pin and not here. Until it is, the three files
  # below are listed one by one, so a fourth action adopting a moving major tag surfaces
  # rather than being absorbed.
  ref-version-mismatch:
    ignore:
      - claude.yaml
      - deploy-app.yaml
      - image-scan.yaml

  # The cooldown windows in .github/dependabot.yml are a deliberate, documented
  # supply-chain policy (Go modules: patch 5 / minor 7 / major 30 days; Docker and
  # GitHub Actions: a flat 5 days; security updates bypass the cooldown by design),
  # not an oversight.
  dependabot-cooldown:
    ignore:
      - dependabot.yml
