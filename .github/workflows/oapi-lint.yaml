name: OpenAPI Lint

on:
  pull_request:
    paths:
      - 'openapi/**'
      - 'redocly.yaml'
      - '.makefiles/openapi/**'
      - '.github/workflows/oapi-lint.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oapi-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run redocly lint
        run: make lint-oapi
