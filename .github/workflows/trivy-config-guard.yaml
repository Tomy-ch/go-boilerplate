name: Config Scan (required-check guard)

# Skip-guard companion for trivy-config.yaml: reports the `trivy-config` required check as an immediate
# success on the complementary set (`paths-ignore` mirrors the filter on trivy-config.yaml).
# Both files' filters must be edited together — see README.md § Required-check guard companions.

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/trivy-config.yaml'
      - '.makefiles/security/trivy.mk'
      - '.trivyignore.yaml'
      - 'docker/**/Dockerfile'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: No Dockerfile changed — satisfy the required context
        run: echo "No Dockerfile-related path changed; the required 'trivy-config' context is satisfied by this guard."
