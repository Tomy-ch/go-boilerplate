name: Deploy Docs

# The viewer's build output (`docs/portal/dist/`) is generated here rather than committed, so
# `docs-viewer/**` has to trigger a deploy too: a change confined to the viewer produces no diff
# under `docs/` and would otherwise never reach Pages.
on:
  push:
    branches:
      - production
    paths:
      - "docs/**"
      - "docs-viewer/**"
      - ".makefiles/docs/gen.mk"
      - ".github/workflows/deploy-docs.yaml"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # The versions are pinned in mise.toml (SSOT) — never duplicated here. Same pair the
      # node_tool_runner image installs, so CI and the container run the same toolchain.
      - name: Install node and pnpm
        run: mise install node npm:pnpm

      # `docs/portal/index.html` and `docs/portal/dist/` are both gitignored: the viewer's build
      # output is produced here rather than committed. Publishing without this step would upload a
      # `docs/portal/` with no entry point at all. The `-ci` target runs the tools directly;
      # the non-suffixed one would build the whole tool image to reach a package that needs none
      # of it. `--frozen-lockfile` keeps the build from resolving anything the lockfile does not name.
      - name: Build the portal viewer
        run: make gen-portal-build-ci

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job talks to the Pages deployment API: `pages: write` creates the
    # deployment and `id-token: write` mints the OIDC token actions/deploy-pages
    # uses to prove its origin. The build job needs neither.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
