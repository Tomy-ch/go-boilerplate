name: Actions Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - 'docker/tools/Dockerfile'
      - 'mise.toml'
      - '.makefiles/github/lint.mk'
      - 'scripts/pr-comment-secret-lint.mjs'
      - 'scripts/pr-comment-fence-lint.mjs'
      - 'scripts/actions-cutoff-lint.mjs'
      - 'scripts/actions-shellcheck/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # node runs the PR-comment secret check, which actionlint cannot express.
      - name: Install actionlint, shellcheck and node
        run: mise install actionlint shellcheck node

      - name: Run Actions lint
        id: actions-lint
        shell: bash
        run: |
          set +e

          make actions-lint-ci 2>&1 | tee /tmp/actions-lint.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Actions lint: PASS (actionlint + composite-action shellcheck + pr-comment-secret-lint + pr-comment-fence-lint + actions-cutoff-lint)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Actions lint: FAIL (actionlint + composite-action shellcheck + pr-comment-secret-lint + pr-comment-fence-lint + actions-cutoff-lint)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment Actions lint result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- actions-lint-result -->'
          title: ${{ steps.actions-lint.outputs.title }}
          body-file: /tmp/actions-lint.log
          details-summary: 'Actions lint log'

      - name: Fail if Actions lint failed
        if: always() && steps.actions-lint.outputs.status != 'success'
        run: exit 1
