name: Actions Lint

on:
  pull_request:
    paths:
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - 'docker/tools/Dockerfile'
      - 'mise.toml'
      - '.makefiles/github/lint.mk'
      - 'scripts/pr-comment-secret-lint/index.ts'
      - 'scripts/pr-comment-fence-lint/index.ts'
      - 'scripts/actions-cutoff-lint/index.ts'
      - 'scripts/actions-mise-pin-lint/**'
      # The decision logic lives in lib/; filtering on the entry points alone would miss it.
      - 'scripts/lib/workflow.ts'
      - 'scripts/pr-comment-secret-lint/secret.ts'
      - 'scripts/pr-comment-fence-lint/fence.ts'
      - 'scripts/actions-cutoff-lint/cutoff.ts'
      - 'scripts/package.json'
      - 'scripts/pnpm-lock.yaml'
      - 'scripts/pnpm-workspace.yaml'
      - 'scripts/actions-shellcheck/**'
      - '**/*.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
            ::1
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: actionlint shellcheck node npm:pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # actionlint で表現できない Node 検査群は TypeScript で実行するため、pnpm も導入する。

      # The tree is the one `scripts/pnpm-lock.yaml` pins, so CI and the container resolve the
      # same versions.
      - name: Install the script tree for scripts/
        run: pnpm install --dir scripts --frozen-lockfile

      - name: Run Actions lint
        id: actions-lint
        shell: bash
        run: |
          set +e

          make actions-lint-ci 2>&1 | tee /tmp/actions-lint.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Actions lint: PASS (actionlint + composite-action shellcheck + Node 検査群)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Actions lint: FAIL (actionlint + composite-action shellcheck + Node 検査群)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment Actions lint result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- actions-lint-result -->'
          status: ${{ steps.actions-lint.outputs.status }}
          title: "${{ steps.actions-lint.outputs.title || '## ⚠️ Actions Lint: CUT OFF (no result produced)' }}"
          body-file: /tmp/actions-lint.log
          details-summary: 'Actions lint log'

      - name: Fail if Actions lint failed
        if: always() && steps.actions-lint.outputs.status != 'success'
        run: exit 1
