name: Actions Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - 'docker/tools/Dockerfile'
      - 'mise.toml'
      - '.makefiles/github/lint.mk'
      - 'scripts/pr-comment-secret-lint/index.ts'
      - 'scripts/pr-comment-fence-lint/index.ts'
      - 'scripts/actions-cutoff-lint/index.ts'
      # The decision logic lives in lib/; filtering on the entry points alone would miss it.
      - 'scripts/lib/workflow.ts'
      - 'scripts/pr-comment-secret-lint/secret.ts'
      - 'scripts/pr-comment-fence-lint/fence.ts'
      - 'scripts/actions-cutoff-lint/cutoff.ts'
      - 'scripts/package.json'
      - 'scripts/pnpm-lock.yaml'
      - 'scripts/pnpm-workspace.yaml'
      - 'scripts/actions-shellcheck/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            aquaproj.github.io:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # node runs the three checks actionlint cannot express (PR-comment secrets, fences,
      # cut-off behaviour). They are TypeScript and run through `tsx`, hence pnpm as well.
      - name: Install actionlint, shellcheck, node and pnpm
        run: mise install actionlint shellcheck node npm:pnpm

      # The tree is the one `scripts/pnpm-lock.yaml` pins, so CI and the container resolve the
      # same versions.
      - name: Install the script tree for scripts/
        run: pnpm install --dir scripts --frozen-lockfile

      - name: Run Actions lint
        id: actions-lint
        shell: bash
        run: |
          set +e

          make actions-lint-ci 2>&1 | tee /tmp/actions-lint.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Actions lint: PASS (actionlint + composite-action shellcheck + pr-comment-secret-lint + pr-comment-fence-lint + actions-cutoff-lint)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Actions lint: FAIL (actionlint + composite-action shellcheck + pr-comment-secret-lint + pr-comment-fence-lint + actions-cutoff-lint)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment Actions lint result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- actions-lint-result -->'
          status: ${{ steps.actions-lint.outputs.status }}
          title: "${{ steps.actions-lint.outputs.title || '## ⚠️ Actions Lint: CUT OFF (no result produced)' }}"
          body-file: /tmp/actions-lint.log
          details-summary: 'Actions lint log'

      - name: Fail if Actions lint failed
        if: always() && steps.actions-lint.outputs.status != 'success'
        run: exit 1
