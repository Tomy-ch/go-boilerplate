name: Actions Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install actionlint
        run: mise install actionlint

      - name: Run actionlint
        id: actionlint
        shell: bash
        run: |
          set +e

          actionlint 2>&1 | tee /tmp/actionlint.log

          code=${PIPESTATUS[0]}

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment Actions lint result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const marker = '<!-- actions-lint-result -->';
            const status = '${{ steps.actionlint.outputs.status }}';
            const code = '${{ steps.actionlint.outputs.exit_code }}';

            const updatedAtJST = new Date().toLocaleString('ja-JP', {
              timeZone: 'Asia/Tokyo',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
            });

            const headSha =
              (context.payload.pull_request?.head?.sha)
              || process.env.GITHUB_SHA
              || context.sha;
            const shortSha = headSha.slice(0, 7);

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const commitUrl = `${repoUrl}/commit/${headSha}`;

            const read = (p) => {
              try { return fs.readFileSync(p, 'utf8').trim(); }
              catch (e) { return '(log not found)'; }
            };

            const trimLog = (txt) => {
              const MAX = 45000;
              if (txt.length <= MAX) return txt;
              return txt.slice(0, MAX) + '\n... (truncated)';
            };

            const title = status === 'success'
              ? '✅ Actions lint: PASS (actionlint)'
              : '❌ Actions lint: FAIL (actionlint)';

            const line = (code) =>
              (code === '0')
                ? '- ✅ actionlint has completed successfully.'
                : '- ❌ Issues have been detected by actionlint. Please make the necessary corrections locally and commit the changes.';

            const icon = (code) => (code === '0' ? '✅' : '🚨');

            const body = [
              marker,
              `## ${title}`,
              '',
              line(code),
              '',
              `- 🔖 Commit: [\`${shortSha}\`](${commitUrl})`,
              `- 🕒 UpdatedAt: ${updatedAtJST} (JST)`,
              '',
              `<details><summary> ${icon(code)} actionlint log</summary>`,
              '',
              '```text',
              trimLog(read('/tmp/actionlint.log')),
              '```',
              '</details>',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Fail if actionlint failed
        if: always() && steps.actionlint.outputs.status != 'success'
        run: exit 1
