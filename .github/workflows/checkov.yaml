name: Checkov Scan

# Report-only. The Dockerfile verdict is trivy-config.yaml's, and the workflow-definition
# verdict is zizmor.yaml's — see Overlapping surfaces in README.md.

on:
  push:
    branches:
      - 'release/*'
      - develop
      - staging
      - production
    paths:
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
      - '.github/actions/**'
      - 'docker/**/Dockerfile'
  pull_request:
    paths:
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
      - '.github/actions/**'
      - 'docker/**/Dockerfile'
  schedule:
    # A rule set the scanner ships can grow without the files changing.
    - cron: '15 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:bridgecrewio/checkov
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The version is pinned in mise.toml (SSOT) — never duplicated here.

      - name: Checkov scan
        run: |
          checkov -d . \
            --framework github_actions dockerfile \
            --skip-path vendor \
            --skip-path node_modules \
            --compact \
            --quiet \
            --soft-fail \
            -o json -o sarif \
            --output-file-path checkov-out
        shell: bash

      - name: Create Checkov summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          # checkov writes one result object per framework, and wraps them in an array only
          # when more than one ran. Normalising first keeps the count correct if the
          # framework list above ever shrinks to one.
          jq -s '[.[] | if type == "array" then .[] else . end]' \
            checkov-out/results_json.json > checkov-normalized.json

          COUNT=$(jq '[.[] | .summary.failed] | add // 0' checkov-normalized.json)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "title=## ✅ Checkov: PASS (no failed check)" >> "$GITHUB_OUTPUT"
            echo "No failed check." > checkov-summary.md
            exit 0
          fi

          echo "title=## 🚨 Checkov: FOUND (${COUNT})" >> "$GITHUB_OUTPUT"

          jq -r '
            .[]
            | .check_type as $type
            | (.results.failed_checks // [])[]
            | "- [\($type)] \(.check_id) `\(.file_path)`:\(.file_line_range[0]) — \(.check_name)"
          ' checkov-normalized.json > checkov-summary.md
        shell: bash

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checkov
          path: |
            checkov-out
            checkov-summary.md

      - name: Comment Checkov result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- checkov-result -->'
          status: "${{ steps.summarize.outputs.count == '0' && 'success' || 'findings' }}"
          title: "${{ steps.summarize.outputs.title || '## ⚠️ Checkov Scan: CUT OFF (no result produced)' }}"
          body-file: checkov-summary.md
          details-summary: '📄 Summary'

      # A `#checkov:skip=<id>:<reason>` comment removes a check from checkov's own verdict
      # (`summary.failed` drops to 0) but NOT from its SARIF: the result is still written,
      # carrying a `suppressions` entry with the reason. GitHub does not close an alert on
      # that entry, so every skip this repository takes reappears in code scanning as an
      # open alert that only a manual dismissal can clear — one per skip, forever, and a
      # dismissal that has to be repeated by hand is a suppression nobody can review.
      #
      # Dropping them here is what makes the two surfaces agree: the reason stays in the
      # Dockerfile next to the instruction it excuses, which is where it can be read and
      # go stale visibly, and code scanning shows what checkov actually failed on.
      #
      # There is no setting that removes this step. checkov's only suppression knobs are
      # `--skip-check` (an id, everywhere) and `--skip-path` (a path, every check), and both
      # are too coarse for what is being said here: `CKV_DOCKER_3` is excused for the three
      # images that never ship and must keep failing for docker/server/Dockerfile, which is
      # the one that does. The inline comment is the only per-file mechanism checkov offers,
      # and it does not reach the SARIF. Nor does the receiving end help — GitHub does not
      # close an alert on the `suppressions` entry, which is how these came to need a manual
      # dismissal each. So the filter is not a workaround for a setting nobody looked for; it
      # is the only place the two halves can be joined.
      - name: Drop suppressed results from the Checkov SARIF
        if: always()
        run: |
          set -euo pipefail

          jq '.runs[]?.results |= map(select((.suppressions // []) | length == 0))' \
            checkov-out/results_sarif.sarif > checkov-sarif-filtered.json
          mv checkov-sarif-filtered.json checkov-out/results_sarif.sarif

          echo "results after filtering: $(jq '[.runs[]?.results[]?] | length' checkov-out/results_sarif.sarif)"
        shell: bash

      - name: Upload Checkov SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: checkov-out/results_sarif.sarif
          category: checkov

  # See README.md § Notification triggers (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: checkov
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.checkov.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: checkov
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
