name: Generated Go Artifacts Check

on:
  pull_request:
    paths:
      - '.github/workflows/gen-go-artifacts-check.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.makefiles/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-go-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
    steps:
      - name: Fetch & Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go generators
        run: make gen-go-code

      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi

      # PR の source（`.go` 配下、ただし *.gen.go / *_mock.go 等の生成物は除外）が
      # 触られているかを判定。触られていない場合は generator 側ドリフトの可能性が高い。
      - name: Detect source modifications in this PR
        id: source_mod
        if: github.event_name == 'pull_request' && steps.gen_diff.outputs.has_diff == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=200 origin "${{ github.event.pull_request.base.ref }}" || true
          changed="$(git diff --name-only "$base_sha" "$head_sha" || true)"
          # 生成物自身は source から除外
          if echo "$changed" | grep -E '\.go$' | grep -vE '\.gen\.go$|_mock\.go$|/mock_.+\.go$' | grep -q .; then
            echo "source_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment changed files on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const marker = '<!-- generated-go-artifacts-filelist -->';
            const hasDiff = ('${{ steps.gen_diff.outputs.has_diff }}' === 'true');
            const sourceModified = '${{ steps.source_mod.outputs.source_modified }}' === 'true';

            let files = [];
            if (hasDiff) {
              try {
                const raw = fs.readFileSync('/tmp/changed_files.txt', 'utf8').trim();
                files = raw ? raw.split('\n').filter(Boolean) : [];
              } catch (e) {
                files = ['(Failed to read changed_files.txt)'];
              }
            }

            const updatedAtJST = new Date().toLocaleString('ja-JP', {
              timeZone: 'Asia/Tokyo',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
            });

            const headSha =
              (context.payload.pull_request?.head?.sha)
              || process.env.GITHUB_SHA
              || context.sha;
            const shortSha = headSha.slice(0, 7);

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const commitUrl = `${repoUrl}/commit/${headSha}`;

            // 例: 🔖 Commit: [`1a2b3c4`](https://github.com/.../commit/1a2b3c4...)
            const commitLine = `🔖 Commit: [\`${shortSha}\`](${commitUrl})`;
            const updatedLine = `🕒 UpdatedAt: ${updatedAtJST} (JST)`;

            const diffTitle = sourceModified
              ? '## 🧾 Differences in Go generated output have been detected (list of modified files)'
              : '## ⚠️ Go 生成物のドリフトを検知（本 PR で `.go` source は触られていません）';
            const diffAction = sourceModified
              ? 'Please run `make gen-go-code` (or `make gen`) locally and commit the changes.'
              : '本 PR では `.go` source が変更されていないため、generator 側のドリフト（mockgen / oapi-codegen の依存バージョン差 / base 側の古い生成物 等）の可能性があります。`make gen-go-code` をローカル実行してコミットするか、`auto-generate-docs` 経由で base 側を更新してから rebase / merge してください。';
            const body = hasDiff
              ? [
                  marker,
                  diffTitle,
                  '',
                  commitLine,
                  '',
                  ...(files.length ? files.map(f => `- \`${f}\``) : ['(no changed files)']),
                  '',
                  diffAction,
                  '',
                  updatedLine,
                ].join('\n')
              : [
                  marker,
                  '## ✅ No differences in Go generated output were detected',
                  '',
                  commitLine,
                  '',
                  'No differences in Go generated output were detected.',
                  '',
                  updatedLine,
                ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
