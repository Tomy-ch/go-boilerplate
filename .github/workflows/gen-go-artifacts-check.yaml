name: Generated Go Artifacts Check

on:
  pull_request:
    paths:
      - '.github/workflows/gen-go-artifacts-check.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.makefiles/**'
      - 'openapi/**/*.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-go-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go generators
        run: make gen-go-code

      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi

      # Determine whether the PR touched the source (`.go` files, excluding generated output such as
      # *.gen.go / *_mock.go). If it did not, generator-side drift is the likely cause.
      - name: Detect source modifications in this PR
        id: source_mod
        if: github.event_name == 'pull_request' && steps.gen_diff.outputs.has_diff == 'true'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=200 origin "${BASE_REF}" || true
          changed="$(git diff --name-only "$base_sha" "$head_sha" || true)"
          # Exclude the generated output itself from the source set
          if echo "$changed" | grep -E '\.go$' | grep -vE '\.gen\.go$|\.sql\.go$|_mock\.go$|/mock_.+\.go$' | grep -q .; then
            echo "source_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR comment body
        id: comment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/gen-go-comment.md
          if [ "${{ steps.gen_diff.outputs.has_diff }}" != "true" ]; then
            echo "title=## ✅ No differences in Go generated output were detected" >> "$GITHUB_OUTPUT"
            echo "No differences in Go generated output were detected." > "$out"
            exit 0
          fi
          # Disable SC2016: `make ...` in the notification message is shown literally (must not expand)
          # shellcheck disable=SC2016
          if [ "${{ steps.source_mod.outputs.source_modified }}" = "true" ]; then
            echo "title=## 🧾 Differences in Go generated output have been detected" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Run \`make gen-go-code\` (or \`make gen\`) locally and commit the changes." > "$out"
          else
            echo "title=## ⚠️ Drift in Go generated output detected (.go source unchanged)" >> "$GITHUB_OUTPUT"
            printf '%s\n' "This PR does not modify any \`.go\` source, so this may be generator-side drift (mockgen / oapi-codegen dependency version differences, stale generated artifacts on the base, etc.). Run \`make gen-go-code\` locally and commit, or update the base via \`auto-generate-docs\` and then rebase / merge." > "$out"
          fi
          # Disable SC2016: the `%s` that renders the filename as markdown code is literal (must not expand)
          # shellcheck disable=SC2016
          {
            echo ""
            while IFS= read -r f; do
              [ -n "$f" ] && printf -- "- \`%s\`\n" "$f"
            done < /tmp/changed_files.txt
          } >> "$out"

      - name: Comment generated artifacts result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- generated-go-artifacts-filelist -->'
          title: ${{ steps.comment.outputs.title }}
          body-file: /tmp/gen-go-comment.md

      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
