name: Generated Go Artifacts Check

on:
  pull_request:
    paths:
      - '.github/workflows/gen-go-artifacts-check.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.makefiles/**'
      - 'openapi/**/*.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-go-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go generators
        run: make gen-go-code

      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi

      # PR の source（`.go` 配下、ただし *.gen.go / *_mock.go 等の生成物は除外）が
      # 触られているかを判定。触られていない場合は generator 側ドリフトの可能性が高い。
      - name: Detect source modifications in this PR
        id: source_mod
        if: github.event_name == 'pull_request' && steps.gen_diff.outputs.has_diff == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=200 origin "${{ github.event.pull_request.base.ref }}" || true
          changed="$(git diff --name-only "$base_sha" "$head_sha" || true)"
          # 生成物自身は source から除外
          if echo "$changed" | grep -E '\.go$' | grep -vE '\.gen\.go$|\.sql\.go$|_mock\.go$|/mock_.+\.go$' | grep -q .; then
            echo "source_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR comment body
        id: comment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/gen-go-comment.md
          if [ "${{ steps.gen_diff.outputs.has_diff }}" != "true" ]; then
            echo "title=## ✅ No differences in Go generated output were detected" >> "$GITHUB_OUTPUT"
            echo "No differences in Go generated output were detected." > "$out"
            exit 0
          fi
          if [ "${{ steps.source_mod.outputs.source_modified }}" = "true" ]; then
            echo "title=## 🧾 Differences in Go generated output have been detected" >> "$GITHUB_OUTPUT"
            printf '%s\n' '`make gen-go-code`（または `make gen`）をローカルで実行し、変更をコミットしてください。' > "$out"
          else
            echo "title=## ⚠️ Go 生成物のドリフトを検知（.go source 未変更）" >> "$GITHUB_OUTPUT"
            printf '%s\n' '本 PR では `.go` source が変更されていないため、generator 側のドリフト（mockgen / oapi-codegen の依存バージョン差・base 側の古い生成物 等）の可能性があります。`make gen-go-code` をローカル実行してコミットするか、`auto-generate-docs` 経由で base 側を更新してから rebase / merge してください。' > "$out"
          fi
          {
            echo ""
            while IFS= read -r f; do
              [ -n "$f" ] && printf -- '- `%s`\n' "$f"
            done < /tmp/changed_files.txt
          } >> "$out"

      - name: Comment generated artifacts result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- generated-go-artifacts-filelist -->'
          title: ${{ steps.comment.outputs.title }}
          body-file: /tmp/gen-go-comment.md

      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
