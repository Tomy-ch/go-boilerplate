name: Module Tidy Check

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
  push:
    paths:
      - '.github/workflows/tidy-check.yaml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod-tidy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy (check only)
        id: tidy
        shell: bash
        run: |
          set +e
          mkdir -p /tmp

          go mod tidy
          git diff --no-color -- go.mod go.sum > /tmp/go-mod-tidy.diff
          code=$?

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ go mod tidy: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ go mod tidy: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment tidy result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- go-mod-tidy-check-result -->'
          title: ${{ steps.tidy.outputs.title }}
          body-file: /tmp/go-mod-tidy.diff
          details-summary: '📄 go.mod / go.sum diff'

      - name: Fail if tidy check failed
        if: always()
        shell: bash
        run: |
          code='${{ steps.tidy.outputs.exit_code }}'
          if [ "$code" != "0" ]; then
            echo "::error::go.mod/go.sum show differences after running `go mod tidy`"
            exit 1
          fi
