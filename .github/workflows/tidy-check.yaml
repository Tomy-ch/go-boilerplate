name: Module Tidy Check

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
  push:
    paths:
      - '.github/workflows/tidy-check.yaml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod-tidy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # cache: false — this job holds security-events: write, so it must not
          # restore a tool cache that a less privileged workflow could have written.
          cache: false

      # `go mod verify` only checks modules already present in the local download
      # cache, and it neither downloads what is missing nor reads go.sum. On its own
      # it would report "all modules verified" here and mean nothing: this job's path
      # filter fires when go.sum changes, which is exactly when setup-go's cache key
      # (a hash of go.sum) misses and the cache is empty.
      #
      # `go mod download` is therefore what makes the check real — it fetches every
      # module named in go.mod and fails if one does not match its go.sum hash.
      # `go mod verify` then re-checks the fetched cache for tampering after the fact.
      #
      # Scope worth knowing: neither command inspects the committed vendor/ tree, and
      # builds here run in vendor mode. This verifies that go.sum still describes the
      # real upstream modules; it does NOT prove vendor/ matches them.
      - name: Verify module checksums
        run: |
          go mod download
          go mod verify
        shell: bash

      - name: Tidy (check only)
        id: tidy
        shell: bash
        run: |
          set +e
          mkdir -p /tmp

          go mod tidy
          git diff --no-color -- go.mod go.sum > /tmp/go-mod-tidy.diff
          code=$?

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ go mod tidy: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ go mod tidy: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment tidy result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- go-mod-tidy-check-result -->'
          title: ${{ steps.tidy.outputs.title }}
          body-file: /tmp/go-mod-tidy.diff
          details-summary: '📄 go.mod / go.sum diff'

      - name: Fail if tidy check failed
        if: always()
        shell: bash
        run: |
          code='${{ steps.tidy.outputs.exit_code }}'
          if [ "$code" != "0" ]; then
            echo "::error::go.mod/go.sum show differences after running \`go mod tidy\`"
            exit 1
          fi
