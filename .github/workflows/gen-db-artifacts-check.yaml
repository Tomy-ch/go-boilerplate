name: Generated Database Artifacts Check

on:
  pull_request:
    paths:
      - '.github/workflows/gen-db-artifacts-check.yaml'
      - 'database/**/*.sql'
      - 'docker/database/**/*.sql'
      - '.makefiles/**/*.mk'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-db-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password

    services:
      database:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB }}
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sqlc
        run: mise install sqlc
      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql
      - name: Materialize ci env for embedding
        run: make materialize-env
      - name: Initialize Database Table
        run: make db-migrate-ci-up DB=${{ env.DB }}
      - name: Dump schema
        run: make dump-schema-ci work-dir="."
      - name: Merge DML
        run: make merge-dml-ci work-dir="."
      - name: Remove generated SQLC code
        run: make remove-generated-sqlc-ci
      - name: Generate SQLC code
        run: make sqlc-generate-ci
      - name: Format generated code
        run: make fmt
      # 材料化した env/.env は生成物ではないため、ドリフト判定の対象から外す。
      - name: Restore embedded env
        run: make restore-env
      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi
      # PR の source（database/**/*.sql / docker/database/**/*.sql）が触られているかを判定。
      # 触られていない場合は generator 側（sqlc）のドリフトの可能性が高い。
      - name: Detect source modifications in this PR
        id: source_mod
        if: github.event_name == 'pull_request' && steps.gen_diff.outputs.has_diff == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=200 origin "${{ github.event.pull_request.base.ref }}" || true
          changed="$(git diff --name-only "$base_sha" "$head_sha" || true)"
          if echo "$changed" | grep -qE '^(database|docker/database)/.*\.sql$'; then
            echo "source_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_modified=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build PR comment body
        id: comment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/gen-db-comment.md
          if [ "${{ steps.gen_diff.outputs.has_diff }}" != "true" ]; then
            echo "title=## ✅ No differences in database output were detected" >> "$GITHUB_OUTPUT"
            echo "No differences in database output were found." > "$out"
            exit 0
          fi
          if [ "${{ steps.source_mod.outputs.source_modified }}" = "true" ]; then
            echo "title=## 🧾 Differences in database output have been detected" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Run the database generation command (e.g. \`make gen\` / \`make gen-query\`) locally and commit the changes." > "$out"
          else
            echo "title=## ⚠️ Drift in DB generated output detected (SQL source unchanged)" >> "$GITHUB_OUTPUT"
            printf '%s\n' "This PR does not modify any SQL source, so this may be generator-side drift (sqlc version differences, stale generated artifacts on the base, etc.). Run \`make gen-query\` locally and commit, or update the base via \`auto-generate-docs\` and then rebase / merge." > "$out"
          fi
          {
            echo ""
            while IFS= read -r f; do
              [ -n "$f" ] && printf -- "- \`%s\`\n" "$f"
            done < /tmp/changed_files.txt
          } >> "$out"

      - name: Comment generated artifacts result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- generated-artifacts-filelist -->'
          title: ${{ steps.comment.outputs.title }}
          body-file: /tmp/gen-db-comment.md
      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
