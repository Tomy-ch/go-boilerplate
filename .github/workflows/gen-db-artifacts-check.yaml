name: Generated Database Artifacts Check

on:
  pull_request:
    paths:
      - '.github/workflows/gen-db-artifacts-check.yaml'
      - 'database/**/*.sql'
      - 'docker/database/**/*.sql'
      - '.makefiles/**/*.mk'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-db-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password

    services:
      database:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB }}
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sqlc
        run: mise install sqlc
      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql
      - name: Initialize Database Table
        run: make db-migrate-ci-up DB=${{ env.DB }}
      - name: Dump schema
        run: make dump-schema-ci work-dir="."
      - name: Merge DML
        run: make merge-dml-ci work-dir="."
      - name: Remove generated SQLC code
        run: make remove-generated-sqlc-ci
      - name: Generate SQLC code
        run: make sqlc-generate-ci
      - name: Format generated code
        run: make fmt
      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi
      # PR の source（database/**/*.sql / docker/database/**/*.sql）が触られているかを判定。
      # 触られていない場合は generator 側（sqlc）のドリフトの可能性が高い。
      - name: Detect source modifications in this PR
        id: source_mod
        if: github.event_name == 'pull_request' && steps.gen_diff.outputs.has_diff == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=200 origin "${{ github.event.pull_request.base.ref }}" || true
          changed="$(git diff --name-only "$base_sha" "$head_sha" || true)"
          if echo "$changed" | grep -qE '^(database|docker/database)/.*\.sql$'; then
            echo "source_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_modified=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment generated artifacts result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- generated-artifacts-filelist -->';

            const hasDiff = ('${{ steps.gen_diff.outputs.has_diff }}' === 'true');
            const sourceModified = '${{ steps.source_mod.outputs.source_modified }}' === 'true';

            let files = [];
            if (hasDiff) {
              try {
                const raw = fs.readFileSync('/tmp/changed_files.txt', 'utf8').trim();
                files = raw ? raw.split('\n').filter(Boolean) : [];
              } catch (e) {
                files = ['(Failed to read changed_files.txt)'];
              }
            }

            const updatedAtJST = new Date().toLocaleString('ja-JP', {
              timeZone: 'Asia/Tokyo',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
            });

            const headSha =
              (context.payload.pull_request?.head?.sha)
              || process.env.GITHUB_SHA
              || context.sha;
            const shortSha = headSha.slice(0, 7);

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const commitUrl = `${repoUrl}/commit/${headSha}`;

            // 例: 🔖 Commit: [`1a2b3c4`](https://github.com/.../commit/1a2b3c4...)
            const commitLine = `🔖 Commit: [\`${shortSha}\`](${commitUrl})`;
            const updatedLine = `🕒 UpdatedAt: ${updatedAtJST} (JST)`;

            const diffTitle = sourceModified
              ? '## 🧾 Differences in database output have been detected (list of modified files)'
              : '## ⚠️ DB 生成物のドリフトを検知（本 PR で `database/` / `docker/database/` 配下の `.sql` は触られていません）';
            const diffAction = sourceModified
              ? 'Please run the database generation command locally (e.g., `make gen` / `make gen-query`) and commit the changes.'
              : '本 PR では SQL source が変更されていないため、generator 側（sqlc バージョン差 / base 側の古い生成物 等）のドリフトの可能性があります。`make gen-query` をローカル実行してコミットするか、`auto-generate-docs` 経由で base 側を更新してから rebase / merge してください。';
            const body = hasDiff
              ? [
                  marker,
                  diffTitle,
                  '',
                  commitLine,
                  '',
                  ...(files.length ? files.map(f => `- \`${f}\``) : ['(no changed files)']),
                  '',
                  diffAction,
                  '',
                  updatedLine,
                ].join('\n')
              : [
                  marker,
                  '## ✅ No differences in database output were detected',
                  '',
                  commitLine,
                  '',
                  'No differences in database output were found.',
                  '',
                  updatedLine,
                ].join('\n');

            // 既存コメントがあれば更新（スパム防止）
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
