name: Auto-generate Docs Pull Request

on:
  push:
    branches:
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generate-docs:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.ref_name, 'auto/docs-update/') && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password

    services:
      database:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy & Vendor
        run: make tidy-lib

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      - name: Generate OpenAPI bundle
        run: make gen-bundle-oapi

      - name: Generate OpenAPI docs
        run: make gen-api-docs

      - name: Migrate
        run: go run ./cmd/ migrate-up --database ${{ env.DB }}

      - name: Seed Database
        run: go run ./cmd/ db-seed --database ${{ env.DB }}

      - name: Generate Test Repo Docs
        run: make gen-test-repo

      - name: Generate ER Diagram
        run: make gen-db-schema-ci

      - name: Generate Portal Docs
        run: |
          make gen-portal-docs
          make gen-docs-json

      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER docs

      - name: Detect changes
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          git add -A
          # ノイズ（カバレッジカウントの揺れ / SchemaSpy 生成日時）を除外して、
          # 意味のある生成物に差分があるかをまず判定する。
          if ! git diff --cached --quiet -- . \
            ':(exclude)docs/coverage/index.html' \
            ':(exclude)docs/db-schema/index.html' \
            ':(exclude)docs/db-schema/info-html.txt'
          then
            echo "has_diff=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 上記が無差分でも、coverage に差があり、かつ今回の push に .go の変更が含まれていれば
          # 意味のあるカバレッジ更新とみなして PR を作成する。
          if ! git diff --cached --quiet -- docs/coverage/index.html; then
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              # 新規ブランチ作成等で前回 tip が取得できない場合は安全側で trigger する。
              echo "has_diff=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            if git diff --name-only "$BEFORE_SHA..$AFTER_SHA" -- '*.go' | grep -q .; then
              echo "has_diff=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "has_diff=false" >> $GITHUB_OUTPUT

      - name: Create PR
        if: steps.diff.outputs.has_diff == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(docs): auto update docs [skip ci]"
          branch: auto/docs-update/${{ github.ref_name }}-${{ github.run_id }}
          base: ${{ github.ref_name }}
          title: "chore(docs): sync generated artifacts"
          body: |
            ## 🤖 Auto-generated Docs Sync

            This PR contains only **generated artifacts**.

            ### 🔗 Source of truth
            All changes are derived from already reviewed sources:
            - OpenAPI definitions
            - SQL / database schema
            - Go code

            ### 📦 Included outputs
            - OpenAPI docs
            - ER diagram
            - Test repository docs
            - Portal docs / docs.json

            ### ⚠️ Notes
            - No manual edits are included
            - Safe to auto-merge if CI passes
            - This PR is for keeping generated outputs in sync with source changes

            Generated from: `${{ github.ref_name }}`
            Run ID: `${{ github.run_id }}`
          delete-branch: true
