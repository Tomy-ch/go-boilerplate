name: Auto-generate Docs

on:
  push:
    branches:
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generate-docs:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.ref_name, 'auto/docs-update/') && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    outputs:
      has_diff: ${{ steps.diff.outputs.has_diff }}

    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password

    services:
      database:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # `gen-test-repo` runs the whole suite for the coverage report, so this job needs the same
      # backing services `go-test.yaml` provides. Without them every Realtime Delivery package
      # fails on a connection that never answers, and the report is generated from a run that
      # never passed. Kept in step with the definitions there.
      dynamodb_local:
        # DynamoDB Local, the Realtime Delivery store. Service-container defaults: README.md § Notes.
        image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - "8000:8000"
        options: >-
          --health-cmd="curl -s -o /dev/null http://localhost:8000"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s
      goaws:
        # SNS / SQS emulator for the Realtime Delivery fan-out. Service-container defaults: README.md § Notes.
        image: admiralpiett/goaws:v0.5.4@sha256:18589afe16517751cc981354536c148854157a718bee9059494d6cdee3dc4e2d
        ports:
          - "4100:4100"
        options: >-
          --health-cmd="nc -z localhost 4100"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=5s

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: true
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            docker.io
            index.docker.io
            registry-1.docker.io
            auth.docker.io
            *.docker.io
            production.cloudflare.docker.com
            production.cloudfront.docker.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com
            dl-cdn.alpinelinux.org
            deb.debian.org
            security.debian.org
            apt.postgresql.org
            www.postgresql.org
            archive.ubuntu.com
            azure.archive.ubuntu.com
            security.ubuntu.com
            esm.ubuntu.com
            motd.ubuntu.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy & Vendor
        run: make tidy-lib

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      # Run through the node tool runner, not bare node: `tsx` and the script's dependencies live in the container.
      - name: Stamp OpenAPI version from release branch
        run: make stamp-openapi-version REF="${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Generate OpenAPI bundle
        run: make gen-bundle-oapi

      - name: Generate OpenAPI docs
        run: make gen-api-docs

      - name: Regenerate embedded spec (Go)
        run: make gen-go-code

      - name: Materialize ci env for embedding
        run: make materialize-env

      - name: Migrate
        run: go run ./cmd/ migrate-up --database "$DB"

      - name: Seed Database
        run: go run ./cmd/ db-seed --database "$DB"

      - name: Generate ER Diagram
        run: make gen-db-schema-ci

      - name: Generate test repository docs
        run: make gen-test-repo

      - name: Generate portal docs
        run: make gen-portal-docs

      - name: Generate docs.json
        run: make gen-docs-json

      - name: Build portal frontend
        run: make gen-portal-build

      - name: Generate godoc
        run: make gen-godoc

      - name: Fix permissions
        run: |
          sudo chown -R "$USER:$USER" docs internal openapi

      # The materialized env/.env is not generated output, so exclude it from the commit check.
      - name: Restore embedded env
        run: make restore-env

      - name: Strip nondeterministic noise & detect changes
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Whether this push contains .go changes (used to decide if a coverage update is meaningful).
          go_changed=false
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            go_changed=true
          elif git diff --name-only "$BEFORE_SHA..$AFTER_SHA" -- '*.go' | grep -q .; then
            go_changed=true
          fi

          git checkout -- docs/db-schema/index.html docs/db-schema/info-html.txt 2>/dev/null || true
          if [ "$go_changed" = "false" ]; then
            git checkout -- docs/coverage/index.html 2>/dev/null || true
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export the generated changes
        if: steps.diff.outputs.has_diff == 'true'
        run: git diff --cached --binary > generated.patch

      - name: Upload the generated changes
        if: steps.diff.outputs.has_diff == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-docs-patch
          path: generated.patch
          if-no-files-found: error
          retention-days: 1

  # The app's private key outlives the run, so it stays out of generate-docs: that job keeps sudo,
  # which can lift the egress filter.
  open-pr:
    needs: generate-docs
    if: needs.generate-docs.outputs.has_diff == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the generated changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: generated-docs-patch

      - name: Apply the generated changes
        run: |
          set -euo pipefail
          git apply --index --binary generated.patch
          rm generated.patch
          # The patch comes from a job that keeps sudo, so only the generated outputs may reach the pull request.
          outside="$(git diff --cached --name-only | grep -vE '^docs/(openapi|db-schema|coverage|godoc)/|^docs/portal/(docs\.json$|guides/|dist/)|^openapi/openapi(\.gen)?\.yaml$|\.gen\.go$' || true)"
          if [ -n "$outside" ]; then
            echo '::error::the generated patch touches paths outside the generated outputs:'
            printf '%s\n' "$outside"
            exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo '::error::the generated patch applied to nothing'
            exit 1
          fi

      # The secrets context is unavailable in `if:`, hence the detour through a run step output.
      - name: Check auto-PR app credentials
        id: app-config
        env:
          AUTO_PR_APP_ID: ${{ secrets.AUTO_PR_APP_ID }}
          AUTO_PR_APP_PRIVATE_KEY: ${{ secrets.AUTO_PR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AUTO_PR_APP_ID}" ] && [ -n "${AUTO_PR_APP_PRIVATE_KEY}" ]; then
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::warning::AUTO_PR_APP_ID / AUTO_PR_APP_PRIVATE_KEY are not configured; the pull request is opened with GITHUB_TOKEN, whose events start no workflow, so its required checks never report and the merge stays blocked.'
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
          fi

      # Why an app token rather than GITHUB_TOKEN: README.md § Notes.
      - name: Mint the auto-PR app token
        id: app-token
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.AUTO_PR_APP_ID }}
          private-key: ${{ secrets.AUTO_PR_APP_PRIVATE_KEY }}
          # An installation token carries the app's whole permission set unless it is narrowed here.
          # Pushing the branch and opening the pull request is the entire job.
          permission-contents: write
          permission-pull-requests: write

      - name: Create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Falls back to GITHUB_TOKEN when the app is not configured: the pull request still opens,
          # it just carries no checks. A skipped step leaves an empty output, which is falsy, so the
          # fallback is reached exactly when the token was not minted.
          token: ${{ steps.app-token.outputs.token || github.token }}
          commit-message: "Chore: auto update docs"
          branch: auto/docs-update/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "Chore: sync generated artifacts"
          body: |
            ## 🤖 Auto-generated Docs Sync

            This PR contains only **generated artifacts**.

            ### 🔗 Source of truth
            All changes are derived from already reviewed sources:
            - OpenAPI definitions (incl. `info.version` synced from the `release/vX.Y.Z` branch name)
            - SQL / database schema
            - Go code

            ### 📦 Included outputs
            - OpenAPI `info.version` (contract version `X.Y.Z`; no SHA — commit-level traceability lives in the runtime `/version`)
            - OpenAPI bundle (`openapi.gen.yaml`) + embedded validation spec (`validate.gen.go`)
            - OpenAPI docs
            - ER diagram
            - Test repository docs
            - Portal docs / docs.json
            - Portal frontend bundle (`docs/portal/dist/`)

            ### ⚠️ Notes
            - No manual edits are included
            - Safe to auto-merge if CI passes
            - This PR is for keeping generated outputs in sync with source changes

            Generated from: `${{ github.ref_name }}`
            Run ID: `${{ github.run_id }}`
          delete-branch: true
