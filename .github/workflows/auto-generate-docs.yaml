name: Auto-generate Docs

on:
  push:
    branches:
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generate-docs:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.ref_name, 'auto/docs-update/') && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password

    services:
      database:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy & Vendor
        run: make tidy-lib

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      - name: Stamp OpenAPI version from release branch
        run: node scripts/stamp-openapi-version.mjs

      - name: Generate OpenAPI bundle
        run: make gen-bundle-oapi

      - name: Generate OpenAPI docs
        run: make gen-api-docs

      - name: Regenerate embedded spec (Go)
        run: make gen-go-code

      - name: Materialize ci env for embedding
        run: make materialize-env

      - name: Migrate
        run: go run ./cmd/ migrate-up --database ${{ env.DB }}

      - name: Seed Database
        run: go run ./cmd/ db-seed --database ${{ env.DB }}

      - name: Generate ER Diagram
        run: make gen-db-schema-ci

      - name: Generate docs (parallel)
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/genlogs"
          mkdir -p "$LOG"

          ( make gen-test-repo )      > "$LOG/test-repo.log" 2>&1 & pid_test=$!
          ( make gen-portal-docs && make gen-docs-json && make gen-portal-build ) \
                                      > "$LOG/portal.log"    2>&1 & pid_portal=$!
          ( make gen-godoc )          > "$LOG/godoc.log"     2>&1 & pid_godoc=$!

          rc=0
          for pid in $pid_test $pid_portal $pid_godoc; do
            wait "$pid" || rc=1
          done

          for f in test-repo portal godoc; do
            echo "::group::$f"; cat "$LOG/$f.log"; echo "::endgroup::"
          done
          exit $rc

      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER docs internal openapi

      # 材料化した env/.env は生成物ではないため、コミット判定の対象から外す。
      - name: Restore embedded env
        run: make restore-env

      - name: Strip nondeterministic noise & detect changes
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # この push に .go 変更が含まれるか（意味のあるカバレッジ更新の判定に使う）。
          go_changed=false
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # 前回 tip が取れない（新規ブランチ等）場合は安全側で「変更あり」とみなす。
            go_changed=true
          elif git diff --name-only "$BEFORE_SHA..$AFTER_SHA" -- '*.go' | grep -q .; then
            go_changed=true
          fi

          # 非決定的ノイズ（再生成のたびに揺れる値）を PR コミットから除外する。【根本対応】
          # これらを残すと、各 auto-docs PR が異なるノイズ値を抱え、1 つが merge される度に
          # 他の PR が「SchemaSpy 生成日時 / カバレッジ実行回数」だけで衝突してしまう。
          # ここで戻す 3 ファイルは、従来から差分判定で除外していたノイズ集合と同一。
          #
          # SchemaSpy の概要 / メタ情報は生成日時のみが揺れる純ノイズ → 常に元へ戻す
          # （スキーマ自体の変更は diagrams/ や tables/ 等の別ファイルに反映されるため失われない）。
          git checkout -- docs/db-schema/index.html docs/db-schema/info-html.txt 2>/dev/null || true
          # coverage はカバレッジ実行回数が揺れる純ノイズ。ただし今回 push に .go 変更があれば
          # 意味のあるカバレッジ更新があり得るため残す。
          if [ "$go_changed" = "false" ]; then
            git checkout -- docs/coverage/index.html 2>/dev/null || true
          fi

          # ノイズ除去後に、コミットすべき差分が残っているかで PR 作成可否を判定する。
          git add -A
          if git diff --cached --quiet; then
            echo "has_diff=false" >> $GITHUB_OUTPUT
          else
            echo "has_diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.diff.outputs.has_diff == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(docs): auto update docs [skip ci]"
          branch: auto/docs-update/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "chore(docs): sync generated artifacts"
          body: |
            ## 🤖 Auto-generated Docs Sync

            This PR contains only **generated artifacts**.

            ### 🔗 Source of truth
            All changes are derived from already reviewed sources:
            - OpenAPI definitions (incl. `info.version` synced from the `release/vX.Y.Z` branch name)
            - SQL / database schema
            - Go code

            ### 📦 Included outputs
            - OpenAPI `info.version` (contract version `X.Y.Z`; no SHA — commit-level traceability lives in the runtime `/version`)
            - OpenAPI bundle (`openapi.gen.yaml`) + embedded validation spec (`validate.gen.go`)
            - OpenAPI docs
            - ER diagram
            - Test repository docs
            - Portal docs / docs.json
            - Portal frontend bundle (`docs/portal/dist/`)

            ### ⚠️ Notes
            - No manual edits are included
            - Safe to auto-merge if CI passes
            - This PR is for keeping generated outputs in sync with source changes

            Generated from: `${{ github.ref_name }}`
            Run ID: `${{ github.run_id }}`
          delete-branch: true
