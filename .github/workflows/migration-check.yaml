name: Migration Check

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'scripts/migration-lint/**'
      - 'go.mod'
      - 'go.sum'
      - 'pkg/xerrors/**'
      - '.github/workflows/migration-check.yaml'
      - '.makefiles/**/*.mk'
      - 'makefile'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            docker.io
            index.docker.io
            registry-1.docker.io
            auth.docker.io
            *.docker.io
            production.cloudflare.docker.com
            production.cloudfront.docker.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com
            dl-cdn.alpinelinux.org
            deb.debian.org
            security.debian.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run migration checks
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set +e

          RESULT_FILE=/tmp/migration_result.txt
          echo "" > $RESULT_FILE

          run_check () {
            CMD=$1
            NAME=$2

            echo "▶ $NAME" >> $RESULT_FILE
            $CMD >> $RESULT_FILE 2>&1
            CODE=$?

            if [ $CODE -ne 0 ]; then
              echo "❌ $NAME failed" >> $RESULT_FILE
              FAIL=1
            else
              echo "✅ $NAME passed" >> $RESULT_FILE
            fi

            echo "" >> $RESULT_FILE
          }

          FAIL=0

          run_check "make check-migration-up-version" "duplicate check (up)"
          run_check "make check-migration-down-version" "duplicate check (down)"
          run_check "make check-migration-up-gap" "gap check (up)"
          run_check "make check-migration-down-gap" "gap check (down)"

          echo "▶ pair check" >> $RESULT_FILE

          UP=$(for f in database/migrations/*.up.sql; do basename "$f"; done | cut -d'_' -f1 | sort)
          DOWN=$(for f in database/migrations/*.down.sql; do basename "$f"; done | cut -d'_' -f1 | sort)

          DIFF=$(diff <(echo "$UP") <(echo "$DOWN"))

          if [ -n "$DIFF" ]; then
            echo "❌ up/down mismatch detected" >> $RESULT_FILE
            echo "$DIFF" >> $RESULT_FILE
            FAIL=1
          else
            echo "✅ up/down pair check passed" >> $RESULT_FILE
          fi

          if [ $FAIL -ne 0 ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Migration check failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Migration check passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment migration result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- migration-check-result -->'
          status: ${{ steps.migration.outputs.status }}
          title: "${{ steps.migration.outputs.title || '## ⚠️ Migration Check: CUT OFF (no result produced)' }}"
          body-file: /tmp/migration_result.txt
          details-summary: 'migration check log'

      - name: Fail if migration check failed
        if: steps.migration.outputs.status != 'success'
        run: exit 1
