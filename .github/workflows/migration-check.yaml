name: Migration Check

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - '.github/workflows/migration-check.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  migration-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run migration checks
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set +e

          RESULT_FILE=/tmp/migration_result.txt
          echo "" > $RESULT_FILE

          run_check () {
            CMD=$1
            NAME=$2

            echo "▶ $NAME" >> $RESULT_FILE
            $CMD >> $RESULT_FILE 2>&1
            CODE=$?

            if [ $CODE -ne 0 ]; then
              echo "❌ $NAME failed" >> $RESULT_FILE
              FAIL=1
            else
              echo "✅ $NAME passed" >> $RESULT_FILE
            fi

            echo "" >> $RESULT_FILE
          }

          FAIL=0

          run_check "make check-migration-up-version" "duplicate check (up)"
          run_check "make check-migration-down-version" "duplicate check (down)"
          run_check "make check-migration-up-gap" "gap check (up)"
          run_check "make check-migration-down-gap" "gap check (down)"

          echo "▶ pair check" >> $RESULT_FILE

          UP=$(for f in database/migrations/*.up.sql; do basename "$f"; done | cut -d'_' -f1 | sort)
          DOWN=$(for f in database/migrations/*.down.sql; do basename "$f"; done | cut -d'_' -f1 | sort)

          DIFF=$(diff <(echo "$UP") <(echo "$DOWN"))

          if [ -n "$DIFF" ]; then
            echo "❌ up/down mismatch detected" >> $RESULT_FILE
            echo "$DIFF" >> $RESULT_FILE
            FAIL=1
          else
            echo "✅ up/down pair check passed" >> $RESULT_FILE
          fi

          if [ $FAIL -ne 0 ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Migration check failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Migration check passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment migration result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- migration-check-result -->'
          title: ${{ steps.migration.outputs.title }}
          body-file: /tmp/migration_result.txt
          details-summary: 'migration check log'

      - name: Fail if migration check failed
        if: steps.migration.outputs.status != 'success'
        run: exit 1
