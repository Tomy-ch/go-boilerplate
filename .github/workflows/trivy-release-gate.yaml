name: Release Dependency Scan

on:
  pull_request:
    branches:
      - develop
      - staging
      - production
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs-release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Trivy FS scan (JSON, include unfixed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: 'vuln'
          format: json
          ignore-unfixed: false
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: trivy-fs-release.json

      - name: Create Trivy summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          # total vulnerability count
          COUNT=$(jq '
            .Results
            | map(.Vulnerabilities // [])
            | flatten
            | length
          ' trivy-fs-release.json)

          # unfixed count
          UNFIXED=$(jq '
            .Results
            | map(.Vulnerabilities // [])
            | flatten
            | map(select((.FixedVersion // "") == ""))
            | length
          ' trivy-fs-release.json)

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "unfixed=${UNFIXED}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "title=## ✅ Release Dependency Scan: PASS (no vulnerabilities)" >> "$GITHUB_OUTPUT"
            echo "No vulnerabilities found." > trivy-fs-release-summary.md
            exit 0
          fi

          echo "title=## 🚨 Release Dependency Scan: FOUND (${COUNT}, unfixed ${UNFIXED})" >> "$GITHUB_OUTPUT"

          # Build markdown summary
          jq -r '
            .Results
            | map(.Vulnerabilities // [])
            | flatten
            | sort_by(.Severity) | reverse
            | .[]
            | "- [\(.Severity)] \(.PkgName // "unknown") `\(.InstalledVersion // "?")` → `\(.FixedVersion // "none")` (\(.VulnerabilityID))"
          ' trivy-fs-release.json > trivy-fs-release-summary.md

        shell: bash

      - name: Upload Trivy FS release report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-fs-release
          path: |
            trivy-fs-release.json
            trivy-fs-release-summary.md

      - name: Comment Trivy FS release result on PR
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-fs-release-result -->'
          title: ${{ steps.summarize.outputs.title }}
          body-file: trivy-fs-release-summary.md
          details-summary: '📄 Summary'
