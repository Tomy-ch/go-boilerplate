name: Codacy Scan

# Codacy over the first-party tree. It carries no engine of its own — it runs a set of
# open-source linters under one roof, with the rule selection held in the Codacy project.
# That is both the reason it is here and its main caveat: the configuration deciding what
# this workflow reports is not in version control, so a finding appearing or disappearing
# is not necessarily a code change.
#
# Report-only; the blocking verdict on first-party source stays with Opengrep and gosec.
# Scanning and reporting are separate jobs for the reason sonarqube.yaml gives.
#
# The tool images are pulled at run time on floating tags, outside
# `.github/actions-pin.toml` and outside `make pin-actions-check` — a known exception,
# recorded in this directory's README under "Codacy's floating tool images".

on:
  push:
    branches:
      - 'release/*'
      - develop
      - staging
      - production
    paths:
      - '.github/workflows/codacy.yaml'
      - '**/*.go'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.jsx'
  pull_request:
    paths:
      - '.github/workflows/codacy.yaml'
      - '**/*.go'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.jsx'
  schedule:
    # Monday 18:00 UTC — behind every scanner that reads files on its own runner. Codacy's
    # tool images move on floating tags, so an unchanged tree can produce a different result
    # from one week to the next, which is exactly what a scheduled run is for.
    - cron: '0 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # See sonarqube.yaml: the credential check is a job of its own because the `secrets` context
  # is not available to a job-level `if:`, and a missing token has to leave the run green.
  # A pull request from a fork never receives repository secrets, and this repository is a
  # public template whose forks are the point.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.token.outputs.configured }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Resolve Codacy credentials
        id: token
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CODACY_PROJECT_TOKEN:-}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::CODACY_PROJECT_TOKEN is not configured, so the Codacy scan is skipped. Register the secret to enable it."
          fi
        shell: bash

  codacy:
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      count: ${{ steps.summarize.outputs.count }}
      detail: ${{ steps.detail.outputs.markdown }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80
            api.codacy.com:443
            artifacts.codacy.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # run-gosec and run-staticcheck are deliberately left off. Enabling either makes the
      # action fetch an installer over `curl | sh` from a floating branch and a `latest`
      # artifact path — floating twice over, where the default path is floating once. gosec
      # already runs as a gate through go-lint.yaml, from a version mise.toml pins.
      #
      # max-allowed-issues is set to the action's own maximum so a finding cannot fail the
      # job: this workflow reports, and the count that matters is the one in the summary
      # below.
      - name: Codacy analysis
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          format: sarif
          output: codacy.sarif
          max-allowed-issues: 2147483647

      - name: Create Codacy summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          # The action writes nothing when it finds nothing, so an absent file is a clean
          # scan rather than a failure. Normalising it here keeps the jq below from having
          # to distinguish the two.
          if [ ! -f codacy.sarif ]; then
            echo '{"runs":[]}' > codacy.sarif
          fi

          COUNT=$(jq '[(.runs // [])[] | (.results // [])[]] | length' codacy.sarif)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No findings." > codacy-summary.md
            exit 0
          fi

          # `level` is defaulted before the lookup rather than after: SARIF lets a result
          # omit it, and indexing an object with null is a jq runtime error that `//`
          # cannot catch.
          jq -r '
            [(.runs // [])[] | (.results // [])[]]
            | map(.level //= "warning")
            | sort_by({error: 0, warning: 1, note: 2}[.level] // 3)
            | .[]
            | "- [\(.level)] `\(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)` \(.ruleId // "?")\n  - \((.message.text // "") | gsub("\n"; " "))"
          ' codacy.sarif > codacy-summary.md
        shell: bash

      - name: Build detection detail
        id: detail
        if: ${{ steps.summarize.outputs.count != '0' }}
        uses: ./.github/actions/notify-detail
        with:
          summary-file: codacy-summary.md

      - name: Upload Codacy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codacy
          path: |
            codacy.sarif
            codacy-summary.md

  # The only job that writes outside this run, and the only one with no token. It runs
  # even when the scan failed: a scan that was cut off still has to say so on the pull
  # request, because a missing comment is indistinguishable from a clean scan.
  report:
    needs:
      - preflight
      - codacy
    if: ${{ always() && needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # The composite action below is read from the workspace, so the repository has to be
      # present even though nothing here scans it.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download Codacy report
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: codacy
          path: reports

      - name: Comment Codacy result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- codacy-result -->'
          status: "${{ needs.codacy.outputs.count == '0' && 'success' || 'findings' }}"
          title: "${{ needs.codacy.outputs.count == '' && '## ⚠️ Codacy Scan: CUT OFF (no result produced)' || (needs.codacy.outputs.count == '0' && '## ✅ Codacy: PASS (no findings)' || format('## ⚠️ Codacy: {0} finding(s)', needs.codacy.outputs.count)) }}"
          body-file: reports/codacy-summary.md
          details-summary: '📄 Summary'

      - name: Upload Codacy SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: reports/codacy.sarif
          category: codacy

  # A missing token leaves the scan skipped and the run green, and green is the right
  # answer: a setup gap is not a scan result, and a fork's pull request never receives
  # repository secrets. Silence is not — a pull request with no comment is indistinguishable
  # from one that was scanned and came back clean. This posts under the same marker the
  # result would use, so the notice and a verdict can never both stand.
  unconfigured-notice:
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'false' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Describe the gap
        id: gap
        run: |
          set -euo pipefail
          echo "title=## ⚠️ Codacy: NOT RUN (CODACY_PROJECT_TOKEN is not configured)" >> "$GITHUB_OUTPUT"
          cat > codacy-unconfigured.md <<'EOF'
          `CODACY_PROJECT_TOKEN` is not registered for this repository, so no analysis ran
          and this pull request carries no Codacy verdict. The run is green because a
          missing credential is a setup gap rather than a scan result — it is not evidence
          that the code is clean.

          A pull request from a fork always lands here: repository secrets are never
          exposed to one.
          EOF
        shell: bash

      - name: Comment the gap on PR
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- codacy-result -->'
          status: unconfigured
          title: "${{ steps.gap.outputs.title || '## ⚠️ Codacy: CUT OFF (no result produced)' }}"
          body-file: codacy-unconfigured.md

  # Deliberately no notify-detection. Codacy's baseline over an existing codebase is not
  # zero, and its floating tool images move that baseline on their own, so a weekly
  # notification keyed on "any finding" would fire every week regardless of what changed —
  # the shape of a notification people learn to ignore. ESLint and Bearer are unwired for
  # the same reason.
  #
  # A scheduled failure has no author watching it, so it is pushed to a human. cancelled
  # counts too: a job killed by a timeout or a runner fault reports cancelled rather than
  # failure. A skipped scan is not a failure — that is the unconfigured-token path, which
  # is deliberately green.
  notify-failure:
    needs: codacy
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.codacy.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: codacy
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
