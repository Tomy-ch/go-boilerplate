# Collect the week's Feedback Issues, cluster them, and score the clusters for a retrospective.
#
# The step this exists to protect is the re-measurement. ADR-0008 adopts the loop on the condition
# that a landed improvement is judged after an interval and can be simplified, reverted or deleted
# on that evidence; skipping it degrades the loop into the accumulator it was adopted to prevent.
# A step nobody is reminded to run is a step that stops being run, so it is scheduled rather than
# left to a `make` target somebody remembers on a Monday.
#
# Nothing here reads a model. The tally, the clustering key and the score are all counted from the
# observation blocks the issues already carry, which is why this runs on a plain runner while
# `closed-loop-summarize.yaml` needs a token. The reading half is done elsewhere, per window.
#
# The period is passed as absolute dates rather than derived from the run's clock, so a week whose
# run failed can be recomputed later and produce the same answer.
name: Closed Loop Weekly

on:
  #checkov:skip=CKV_GHA_7:ビルドではない。成果物を作らず run summary に書くだけで、下流が消費する出力が無いのでビルド再現性の前提が当たらない。from / to は落ちた週を後から同じ答えで取り直すための入力で、外すと「直近 7 日」しか計算できなくなる（冒頭の注記のとおり）。workflow_dispatch は write 権限を要するので渡せるのは信頼済みの人だけで、値は env 経由でクォートして渡している
  # 上の #checkov:skip は checkov 自身の判定からしか外れない。code scanning へは checkov.yaml の
  # SARIF フィルタが落とす（そちらの理由はワークフロー側のコメントにある）。
  schedule:
    # Monday 05:15 UTC — the next free slot in the weekly stagger (README.md § Scheduled runs).
    - cron: '15 5 * * 1'
  workflow_dispatch:
    inputs:
      from:
        description: Start date (YYYY-MM-DD). Defaults to seven days before `to`.
        required: false
        type: string
      to:
        description: End date (YYYY-MM-DD). Defaults to today.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: node npm:pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the script tree for scripts/
        run: pnpm install --dir scripts --frozen-lockfile

      # The report goes to the run summary rather than to an issue. It is a view over issues that
      # already exist, and writing it back as another issue would put it in the same list it
      # summarises — where the next run would then count it.
      - name: Collect and score
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          set -euo pipefail

          fence_for() {
            local longest len
            longest="$({ grep -a -o '`\{1,\}' "$1" || true; } | awk '{ if (length($0) > n) n = length($0) } END { print n + 0 }')"
            len=$(( longest + 1 ))
            if [ "$len" -lt 3 ]; then len=3; fi
            printf '%*s' "$len" '' | tr ' ' '\140'
          }

          pnpm --dir scripts run tsx scripts/closed-loop/weekly \
            ${FROM:+--from "${FROM}"} ${TO:+--to "${TO}"} > weekly.txt

          FENCE="$(fence_for weekly.txt)"
          {
            echo '## Closed Loop 週次'
            echo
            echo "${FENCE}txt"
            cat weekly.txt
            echo "${FENCE}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # See README.md § Notification triggers. A scheduled failure reaches nobody otherwise, and this
  # one is worse than a scanner's: the retrospective simply does not happen, and nothing says so.
  notify-failure:
    needs: weekly
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.weekly.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: closed-loop-weekly
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
