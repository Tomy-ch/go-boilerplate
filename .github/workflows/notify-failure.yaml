name: Notify Failure

# Reusable failure notification, called by the scanners that run on a weekly
# schedule. A PR failure is already visible to its author; a scheduled failure is
# not visible to anyone, so it needs to be pushed somewhere a human reads.
#
# This is the repository's only workflow_call; everything else shared between
# workflows is a composite action under .github/actions/. The difference is
# deliberate. A composite action would run as a step inside the scanner's own job,
# which means the Slack webhook would sit on the same runner that just unpacked
# vulnerable dependencies and container images. workflow_call always gets its own
# runner, so the only thing sharing a machine with the webhook is this file, whose
# permissions are contents: read and which never checks out the repository.
#
# The file is split in two on purpose:
#
#   1. "Build notification payload" and everything above it are transport-agnostic.
#      They decide WHAT failed and WHERE to look, and nothing more.
#   2. "Resolve notification backend" and "Send to Slack" are backend-specific, as is
#      the `slack-webhook-url` secret name in the workflow_call interface.
#
# Swapping Slack for another mechanism therefore touches those three places plus the
# `secrets:` line in each calling workflow — but never part 1. Keep that boundary
# intact when editing this file.
#
# The payload carries no scan output. The run URL is the only pointer, so a secret
# or a vulnerability detail can never reach the notification backend.

on:
  workflow_call:
    inputs:
      failed-job:
        description: 'Name of the job that failed, as written in the calling workflow.'
        required: true
        type: string
    secrets:
      slack-webhook-url:
        description: >-
          Slack incoming webhook URL. When it is not configured the notification is
          skipped and the run is left green: a missing webhook is a setup gap, not a
          scan failure, and must not mask the failure it was meant to report.
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Transport-agnostic. In a reusable workflow the github context belongs to the
      # caller, so the workflow name / trigger / run id below identify the scanner
      # that failed rather than this file.
      - name: Build notification payload
        id: payload
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          TRIGGER: ${{ github.event_name }}
          FAILED_JOB: ${{ inputs.failed-job }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # jq builds the JSON so that a value containing a quote or a newline cannot
          # break out of the payload.
          jq -n \
            --arg workflow "${WORKFLOW_NAME}" \
            --arg trigger "${TRIGGER}" \
            --arg job "${FAILED_JOB}" \
            --arg repo "${REPOSITORY}" \
            --arg ref "${REF_NAME}" \
            --arg url "${RUN_URL}" \
            '{
              text: "🚨 \($workflow) failed — \($repo) (\($ref))",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "🚨 *\($workflow)* failed\n*Repository:* \($repo)\n*Ref:* \($ref)\n*Trigger:* \($trigger)\n*Failed job:* \($job)"
                  }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: "<\($url)|View run logs>" }
                }
              ]
            }' > notification.json

          {
            echo "## 🚨 ${WORKFLOW_NAME} failed"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | ${REPOSITORY} |"
            echo "| Ref | ${REF_NAME} |"
            echo "| Trigger | ${TRIGGER} |"
            echo "| Failed job | ${FAILED_JOB} |"
            echo "| Run | ${RUN_URL} |"
          } >> "${GITHUB_STEP_SUMMARY}"
        shell: bash

      # Kept separate from the send step so that "is the backend configured?" is
      # answered without the secret ever reaching an `if:` expression.
      - name: Resolve notification backend
        id: backend
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
        run: |
          set -euo pipefail
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::No notification backend is configured (secret SLACK_WEBHOOK_URL is unset); skipping delivery."
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "> Notification was not delivered: secret \`SLACK_WEBHOOK_URL\` is unset." >> "${GITHUB_STEP_SUMMARY}"
          fi
        shell: bash

      # ---------------------------------------------------------------------------
      # Backend-specific: replace this step wholesale to notify somewhere else, and
      # leave "Build notification payload" untouched.
      # ---------------------------------------------------------------------------
      - name: Send to Slack
        if: ${{ steps.backend.outputs.configured == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
        run: |
          set -euo pipefail
          # --fail-with-body surfaces Slack's rejection reason; -sS keeps the log free
          # of a progress meter while still printing errors. Reading the URL from env
          # keeps it out of this file, though it still reaches curl's argv.
          curl --fail-with-body -sS \
            -X POST \
            -H 'Content-Type: application/json' \
            --data @notification.json \
            "${SLACK_WEBHOOK_URL}"
        shell: bash
