name: Actions Static Analysis

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - '.makefiles/security/zizmor.mk'
      - 'mise.toml'
  push:
    branches:
      - develop
      - staging
      - production
      - 'release/*'
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - '.makefiles/security/zizmor.mk'
      - 'mise.toml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            downloads.sqlc.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            *.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            dl-cdn.alpinelinux.org:443
            dl-cdn.alpinelinux.org:80
            deb.debian.org:443
            deb.debian.org:80
            security.debian.org:443
            security.debian.org:80

      # persist-credentials: false — nothing after checkout talks to git, and this
      # job holds security-events: write, so the job token must not be left behind
      # in .git/config.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cache: false — this job holds security-events: write. See README.md § Cache safety.
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.6.0
          install: false
          cache: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # The version is pinned in mise.toml, so it is never duplicated here.
      - name: Install zizmor
        run: mise install aqua:zizmorcore/zizmor

      # zizmor exits non-zero when it reports findings, so the exit codes are
      # captured instead of failing the step: the SARIF upload and the PR comment
      # must still run. The final gate step turns the captured status into a
      # workflow failure.
      #
      # Two passes on purpose:
      #   - SARIF keeps every finding so code scanning holds the full picture.
      #   - The gate/PR comment is limited to high severity, so CI fails on
      #     high-signal findings only. Exceptions live in .github/zizmor.yml.
      #
      # Both passes go through make so the gate definition lives in one place and
      # cannot drift from the pre-commit hook (.makefiles/security/zizmor.mk).
      # Going through make costs the tool's own exit code — make reports its own 2
      # for any failed recipe — so both captures below are read as "zero or not",
      # never for a specific value. -s guards the SARIF redirect against a recipe
      # that loses its @ prefix.
      #
      # GH_TOKEN enables the online audits (unpinned / stale / archived action
      # lookups), which need API access. The hook runs --offline and therefore
      # covers the offline audits only.
      - name: Run zizmor
        id: zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          set +e

          make -s actions-zizmor-sarif-ci > zizmor.sarif
          sarif_code=$?

          # zizmor writes its findings to stdout, so stderr is left on the job log
          # rather than merged in: zizmor.log becomes the PR comment body, and
          # make's own "*** [target] Error N" line does not belong there.
          make -s actions-zizmor-gate-ci | tee zizmor.log
          code=${PIPESTATUS[0]}

          set -e

          # --format sarif returns 0 even when it reports findings, so anything
          # non-zero here means the document was not produced.
          if [ "$sarif_code" -ne 0 ]; then
            echo "::warning::zizmor failed to produce SARIF (exit ${sarif_code})"
          fi

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Actions static analysis: PASS (zizmor)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## 🚨 Actions static analysis: FINDINGS (zizmor)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Upload zizmor report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zizmor
          path: |
            zizmor.sarif
            zizmor.log

      - name: Upload zizmor SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Comment zizmor result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- zizmor-result -->'
          status: ${{ steps.zizmor.outputs.status }}
          title: "${{ steps.zizmor.outputs.title || '## ⚠️ Actions Static Analysis: CUT OFF (no result produced)' }}"
          body-file: zizmor.log
          details-summary: 'zizmor log'

      - name: Fail if zizmor reported findings
        if: always() && steps.zizmor.outputs.status != 'success'
        run: exit 1

  # See README.md § Notification triggers (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: zizmor
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.zizmor.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: zizmor
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
