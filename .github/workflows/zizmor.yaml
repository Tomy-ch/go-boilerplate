name: Actions Static Analysis

on:
  pull_request:
    paths:
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - '.makefiles/security/zizmor.mk'
      - 'mise.toml'
  push:
    branches:
      - develop
      - staging
      - production
      - 'release/*'
    paths:
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - '.makefiles/security/zizmor.mk'
      - 'mise.toml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            docker.io
            index.docker.io
            registry-1.docker.io
            auth.docker.io
            *.docker.io
            production.cloudflare.docker.com
            production.cloudfront.docker.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com
            dl-cdn.alpinelinux.org
            deb.debian.org
            security.debian.org

      # persist-credentials: false — nothing after checkout talks to git, and this
      # job holds security-events: write, so the job token must not be left behind
      # in .git/config.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cache: false — this job holds security-events: write. See README.md § Cache safety.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:zizmorcore/zizmor
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The version is pinned in mise.toml, so it is never duplicated here.

      - name: Run zizmor
        id: zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          set +e

          make -s actions-zizmor-sarif-ci > zizmor.sarif
          sarif_code=$?

          # zizmor writes its findings to stdout, so stderr is left on the job log
          # rather than merged in: zizmor.log becomes the PR comment body, and
          # make's own "*** [target] Error N" line does not belong there.
          make -s actions-zizmor-gate-ci | tee zizmor.log
          code=${PIPESTATUS[0]}

          set -e

          # --format sarif returns 0 even when it reports findings, so anything
          # non-zero here means the document was not produced.
          if [ "$sarif_code" -ne 0 ]; then
            echo "::warning::zizmor failed to produce SARIF (exit ${sarif_code})"
          fi

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Actions static analysis: PASS (zizmor)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## 🚨 Actions static analysis: FINDINGS (zizmor)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Upload zizmor report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zizmor
          path: |
            zizmor.sarif
            zizmor.log

      - name: Upload zizmor SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Comment zizmor result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- zizmor-result -->'
          status: ${{ steps.zizmor.outputs.status }}
          title: "${{ steps.zizmor.outputs.title || '## ⚠️ Actions Static Analysis: CUT OFF (no result produced)' }}"
          body-file: zizmor.log
          details-summary: 'zizmor log'

      - name: Fail if zizmor reported findings
        if: always() && steps.zizmor.outputs.status != 'success'
        run: exit 1

  # See README.md § Notification triggers (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: zizmor
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.zizmor.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: zizmor
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
