name: Dependency Scan

on:
  pull_request:
    paths:
      - '.github/workflows/trivy-fs.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trivy FS scan (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: 'vuln'
          format: json
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: trivy-fs.json

      - name: Create Trivy summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail
          
          # total vulnerability count
          COUNT=$(jq '
            .Results
            | map(.Vulnerabilities // [])
            | flatten
            | length
          ' trivy-fs.json)
          
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "title=## ✅ Trivy FS: PASS (no vulnerabilities)" >> "$GITHUB_OUTPUT"
            echo "No vulnerabilities found." > trivy-fs-summary.md
            exit 0
          fi

          echo "title=## 🚨 Trivy FS: FOUND (${COUNT})" >> "$GITHUB_OUTPUT"

          # Build markdown summary
          jq -r '
            .Results
            | map(.Vulnerabilities // [])
            | flatten
            | sort_by({CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3,UNKNOWN:4}[.Severity] // 5)
            | .[]
            | "- [\(.Severity)] \(.PkgName // "unknown") `\(.InstalledVersion // "?")` → `\(.FixedVersion // "none")` (\(.VulnerabilityID))"
          ' trivy-fs.json > trivy-fs-summary.md

        shell: bash

      - name: Upload Trivy FS report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-fs
          path: |
            trivy-fs.json
            trivy-fs-summary.md

      - name: Comment Trivy FS result on PR
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-fs-result -->'
          title: ${{ steps.summarize.outputs.title }}
          body-file: trivy-fs-summary.md
          details-summary: '📄 Summary'

      - name: Trivy FS scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: 'vuln'
          format: sarif
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: trivy-fs.sarif

      - name: Upload Trivy FS SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
