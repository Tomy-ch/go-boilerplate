name: Dependency Vulnerability Scan Workflow

on:
  pull_request:
    paths:
      - '.github/workflows/trivy-fs.yaml'
      - '**/*.go'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Trivy FS scan (JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          format: json
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: trivy-fs.json

      - name: Create Trivy summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail
          
          # total vulnerability count
          COUNT=$(jq '
            .Results
            | map(.Vulnerabilities // [])
            | flatten
            | length
          ' trivy-fs.json)
          
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No vulnerabilities found." > trivy-fs-summary.md
            exit 0
          fi

          # Build markdown summary
          jq -r '
            .Results
            | map(.Vulnerabilities // [])
            | flatten
            | sort_by(.Severity) | reverse
            | .[]
            | "- [\(.Severity)] \(.PkgName // "unknown") `\(.InstalledVersion // "?")` → `\(.FixedVersion // "none")` (\(.VulnerabilityID))"
          ' trivy-fs.json > trivy-fs-summary.md

        shell: bash

      - name: Upload Trivy FS report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs
          path: |
            trivy-fs.json
            trivy-fs-summary.md

      - name: Comment Trivy FS result on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const marker = '<!-- trivy-fs-result -->';
            const count = Number('${{ steps.summarize.outputs.count }}' || '0');

            const updatedAtJST = new Date().toLocaleString('ja-JP', {
              timeZone: 'Asia/Tokyo',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
            });

            const headSha =
              (context.payload.pull_request?.head?.sha)
              || process.env.GITHUB_SHA
              || context.sha;
            const shortSha = headSha.slice(0, 7);

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const commitUrl = `${repoUrl}/commit/${headSha}`;

            const read = (p) => {
              try { return fs.readFileSync(p, 'utf8').trim(); }
              catch (e) { return '(summary not found)'; }
            };

            const trimLog = (txt) => {
              const MAX = 45000; // コメント上限対策
              if (txt.length <= MAX) return txt;
              return txt.slice(0, MAX) + '\n... (truncated)';
            };

            const title = (count === 0)
              ? '✅ Trivy FS: PASS (no vulnerabilities)'
              : `🚨 Trivy FS: FOUND (${count})`;

            const summary = read('trivy-fs-summary.md');

            const body = [
              marker,
              `## ${title}`,
              '',
              `- Total vulnerabilities: **${count}**`,
              `- 🔖 Commit: [\`${shortSha}\`](${commitUrl})`,
              `- 🕒 UpdatedAt: ${updatedAtJST} (JST)`,
              '',
              '<details><summary>📄 Summary</summary>',
              '',
              trimLog(summary),
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
