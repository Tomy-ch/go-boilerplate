name: Release OSV Scan

# Blocking half of the OSV double gate. osv-scanner.yaml reports on every
# dependency-touching PR without ever failing; this one runs on a PR that promotes into
# a deploy branch and fails on HIGH or above, so a vulnerability is decided on at the
# promotion boundary instead of blocking unrelated feature work.
#
# Deliberately carries no `paths` filter: a promotion PR often changes nothing under
# go.mod or the npm lockfiles, yet it is exactly the moment the dependency state has to
# be re-judged — and a required check must run to be able to block.
#
# The `push` trigger covers the same boundary crossed the other way. A commit landing
# on a deploy branch directly is a promotion that skipped its promotion PR, which is
# precisely the case this gate exists to judge and the one case it would otherwise
# never see. It cannot block a commit that has already landed, so on push the failing
# job is a record rather than a gate — but a silent landing is the worse of the two.
on:
  push:
    branches:
      - develop
      - staging
      - production
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-release:
    # Why the trigger condition lives in a job: README.md § Required checks report on every pull request.
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON('["develop", "staging", "production"]'), github.base_ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            api.deps.dev
            osv-vulnerabilities.storage.googleapis.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:google/osv-scanner
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The scanner version is declared in mise.toml (SSOT) — never pinned here.

      - name: Scan with osv-scanner
        id: scan
        uses: ./.github/actions/osv-scan

      - name: Upload osv-scanner release report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osv-release-gate
          path: |
            osv-scanner.json
            osv-scanner.log
            osv-findings.json
            osv-scanner-summary.md

      - name: Comment OSV release gate result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- osv-release-gate-result -->'
          status: ${{ steps.scan.outputs.status }}
          title: "${{ steps.scan.outputs.title || '## ⚠️ Release OSV Scan: CUT OFF (no result produced)' }}"
          body-file: osv-scanner-summary.md
          details-summary: '📄 Summary'

      # An empty output (the scan never produced one) also fails, so a scanner or
      # parsing failure is never mistaken for a pass.
      - name: Fail if a blocking vulnerability was found
        if: always() && steps.scan.outputs.gating != '0'
        run: exit 1
