name: Generated Mock-Auth OpenAPI Artifacts Check

# `paths` lists the generated output as well as the inputs — see README.md for why.
on:
  pull_request:
    paths:
      # Inputs
      - '.github/workflows/gen-mock-auth-oapi-artifacts-check.yaml'
      - 'docker/mock-auth-server/openapi/**/*.yaml'
      - 'docker/mock-auth-server/orval.config.ts'
      - 'docker/mock-auth-server/redocly.yaml'
      - 'docker/mock-auth-server/package.json'
      - 'docker/mock-auth-server/package-lock.json'
      - 'docker/tools/package.json'
      - 'docker/tools/package-lock.json'
      - 'docker/tools/Dockerfile'
      - 'mise.toml'
      - '.makefiles/openapi/mock-auth.mk'
      # Generated output. `docker/mock-auth-server/openapi/openapi.gen.yaml` is already covered by
      # `docker/mock-auth-server/openapi/**/*.yaml` above.
      - 'docker/mock-auth-server/src/generated/**'
      - 'docs/openapi/mock-auth-server/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-mock-auth-oapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # fetch-depth: 0 so the PR's base and head commits are present locally. The default
      # shallow checkout fetches only the merge commit, so the `git diff` that classifies the
      # cause below cannot resolve either parent.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run Mock-Auth OpenAPI Bundle + zod codegen
        run: make gen-mock-auth-oapi

      - name: Run Mock-Auth OpenAPI Redoc docs
        run: make gen-mock-auth-oapi-docs

      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi

      # Classify the PR so the report can name the actual cause:
      #   - source_modified:   hand-written mock-auth-server source changed, so a forgotten
      #                        `make gen-mock-auth-oapi` is likely
      #   - artifact_modified: the generated output was edited directly, which is a rule violation
      #   - neither:           generator-side drift is the likely cause
      # The bundled spec and the zod schemas are generated output, so they are excluded from the
      # source set even though they live under `docker/mock-auth-server/`.
      - name: Detect source modifications in this PR
        id: source_mod
        if: github.event_name == 'pull_request' && steps.gen_diff.outputs.has_diff == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA-}"
          head_sha="${HEAD_SHA-}"
          # Surface a diff failure rather than degrading to an empty file list, which would
          # silently misreport every cause below as generator-side drift.
          if ! changed="$(git diff --name-only "$base_sha" "$head_sha")"; then
            echo "::warning::failed to diff ${base_sha}..${head_sha}; cause classification skipped"
            changed=""
          fi
          artifacts='^docker/mock-auth-server/(openapi/openapi\.gen\.yaml$|src/generated/)|^docs/openapi/mock-auth-server/'
          if echo "$changed" | grep -E '^docker/mock-auth-server/' | grep -qvE "$artifacts"; then
            echo "source_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_modified=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE "$artifacts"; then
            echo "artifact_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR comment body
        id: comment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HAS_DIFF: ${{ steps.gen_diff.outputs.has_diff }}
          SOURCE_MODIFIED: ${{ steps.source_mod.outputs.source_modified }}
          ARTIFACT_MODIFIED: ${{ steps.source_mod.outputs.artifact_modified }}
        run: |
          set -euo pipefail
          out=/tmp/gen-mock-auth-oapi-comment.md
          if [ "${HAS_DIFF-}" != "true" ]; then
            echo "title=## ✅ No differences in mock-auth OpenAPI generated output were detected" >> "$GITHUB_OUTPUT"
            echo "No differences in mock-auth OpenAPI generated output were detected." > "$out"
            exit 0
          fi
          if [ "${SOURCE_MODIFIED-}" = "true" ]; then
            echo "title=## 🧾 Differences in mock-auth OpenAPI generated output have been detected" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Run \`make gen-mock-auth-oapi\` locally and commit the changes." > "$out"
          elif [ "${ARTIFACT_MODIFIED-}" = "true" ]; then
            echo "title=## ✋ mock-auth OpenAPI generated output was edited directly" >> "$GITHUB_OUTPUT"
            printf '%s\n' "This PR changes mock-auth OpenAPI generated output without changing any hand-written source under \`docker/mock-auth-server/\`. Generated files must not be hand-edited (see \`AGENTS.md\`). Discard the edit, run \`make gen-mock-auth-oapi\` so the output comes from the generator, and commit that instead." > "$out"
          else
            echo "title=## ⚠️ Drift in mock-auth OpenAPI generated output detected (source unchanged)" >> "$GITHUB_OUTPUT"
            printf '%s\n' "This PR does not modify anything under \`docker/mock-auth-server/\`, so this may be generator-side drift (non-deterministic output, dependency version differences, etc.). Run \`make gen-mock-auth-oapi\` locally and commit the changes." > "$out"
          fi
          # Same computation as fenceFor in .github/actions/upsert-pr-comment/action.yaml, repeated
          # because that helper only wraps a body on the details-summary path and this call passes
          # the body through untouched.
          # `-a`: without it a single NUL byte makes grep report a binary match and print nothing,
          # collapsing the fence back to three backticks.
          fence_for() {
            local longest len
            longest="$({ grep -a -o '`\{1,\}' "$1" || true; } | awk '{ if (length($0) > n) n = length($0) } END { print n + 0 }')"
            len=$(( longest + 1 ))
            if [ "$len" -lt 3 ]; then len=3; fi
            printf '%*s' "$len" '' | tr ' ' '\140'
          }

          # A path may hold any byte but NUL and `/`, so a name carrying a backtick closes an inline
          # code span early and renders the rest as live Markdown under the bot's name — a mention
          # notifying third parties, a fabricated heading or link. Fencing the list instead, at a
          # length taken from the list itself, leaves no run able to close it.
          list=/tmp/gen-mock-auth-oapi-filelist.txt
          # The action's length cap slices a body without regard for fences and does not re-fence on
          # this path, so a list trimmed there would lose the closing fence. Trimming here, before
          # the fence is sized, keeps the block closed and stays under the 45000 character default.
          # The fence cannot outgrow that budget either: a backtick run never spans a `/`, so the
          # longest one a path can hold is bounded by NAME_MAX — 255 bytes — and the fence by 256.
          list_limit=40000
          head -c "$list_limit" /tmp/changed_files.txt > "$list"
          if [ "$(wc -c < /tmp/changed_files.txt)" -gt "$list_limit" ]; then
            printf '\n... (file list truncated)\n' >> "$list"
          fi
          fence="$(fence_for "$list")"
          {
            echo ""
            echo "${fence}text"
            cat "$list"
            echo "${fence}"
          } >> "$out"

      - name: Comment generated artifacts result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- generated-mock-auth-oapi-artifacts-filelist -->'
          status: "${{ steps.gen_diff.outputs.has_diff == 'false' && 'success' || 'drift' }}"
          title: "${{ steps.comment.outputs.title || '## ⚠️ Generated Mock-Auth OpenAPI Artifacts Check: CUT OFF (no result produced)' }}"
          body-file: /tmp/gen-mock-auth-oapi-comment.md

      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
