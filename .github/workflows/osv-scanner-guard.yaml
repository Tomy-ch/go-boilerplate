name: OSV Scan (required-check guard)

# Skip-guard companion for osv-scanner.yaml's `osv-diff` job. That job is
# declared in `.github/settings/branch-protection.json` as a required status check, but osv-scanner.yaml only triggers on a
# pull_request when it touches the dependency `paths`; a PR that changes no
# dependency manifest would never report the `osv-diff` context and would block
# merging forever.
#
# This workflow runs on the complementary set (`paths-ignore` mirrors
# osv-scanner.yaml's pull_request `paths`) and reports the same `osv-diff` context
# as an immediate success. When both run, GitHub requires every same-named check to
# pass, so this no-op can never mask a real osv-diff failure.

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/osv-scanner.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'scripts/pnpm-lock.yaml'
      - 'mock-auth-server/package-lock.json'
      - 'docs-viewer/pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: No dependency manifest changed — satisfy the required context
        run: echo "No dependency path changed; the required 'osv-diff' context is satisfied by this guard."
