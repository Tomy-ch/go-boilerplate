name: OSV Scan (required-check guard)

# Skip-guard companion for osv-scanner.yaml: reports the `osv-diff` required check as an immediate
# success on the complementary set (`paths-ignore` mirrors the filter on osv-scanner.yaml).
# Both files' filters must be edited together — see README.md § Required-check guard companions.

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/osv-scanner.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'scripts/pnpm-lock.yaml'
      - 'docs-viewer/pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: No dependency manifest changed — satisfy the required context
        run: echo "No dependency path changed; the required 'osv-diff' context is satisfied by this guard."
