name: SAST (required-check guard)

# Skip-guard companion for opengrep.yaml: reports the `sast` required check as an immediate
# success on the complementary set (`paths-ignore` mirrors the filter on opengrep.yaml).
# Both files' filters must be edited together — see README.md § Required-check guard companions.

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/opengrep.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'openapi/**'
      - 'database/**'
      - 'docs-viewer/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: No source paths changed — satisfy the required context
        run: echo "No SAST-scanned path changed; the required 'sast' context is satisfied by this guard."
