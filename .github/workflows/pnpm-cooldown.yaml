name: Pnpm Cooldown

# pnpm's resolver already guards the window on every install, so this workflow guards only the
# escape hatch's deadline (`minimumReleaseAgeExclude` / `.github/pnpm-cooldown-bypass.toml`).
# Why it splits that way: README.md § Pnpm Cooldown, and `docs/design/security.md` § pnpm.
#
# A deadline arrives without `pnpm-workspace.yaml` changing, so the pull-request trigger alone
# would never notice one expiring — the schedule is what collects them. The lockfiles are in the
# trigger paths too, because an exclusion whose version the lockfile no longer resolves is dead
# weight and should be reported when the resolution moves.

on:
  pull_request:
    paths:
      - '**/pnpm-workspace.yaml'
      - '**/pnpm-lock.yaml'
      - '.github/pnpm-cooldown-bypass.toml'
      - 'scripts/pnpm-cooldown/**'
      - '.github/workflows/pnpm-cooldown.yaml'
      - '.makefiles/**/*.mk'
      - 'makefile'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-cooldown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The check reads only files in the tree, so it needs no network of its own and no base
      # ref: an exclusion entry is valid or not on its own terms, and its deadline does not
      # depend on what the branch changed.
      - name: Check pnpm cooldown exclusions
        run: make pnpm-cooldown-check
