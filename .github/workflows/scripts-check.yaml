name: Scripts Check

# Type check and unit tests for the repository's TypeScript helper scripts (`scripts/**/*.ts`),
# plus the 1:1 test gate, which walks `docs-viewer` as well.
#
# Many of those scripts are gates, and they all fail in the same direction when broken: they stop
# finding things and report a clean run. Nothing downstream notices, because a gate that inspects
# nothing looks exactly like a repository with no violations. The decision logic sits beside each
# entry point, and in `scripts/lib/**` where it is shared, precisely so it can be exercised here
# without a repository to scan; these tests are what keeps a silent no-op from passing for a pass.
#
# `make go-lint` does not cover this: golangci-lint reads Go, and the Markdown / Actions lint jobs
# run these scripts rather than checking them.

on:
  pull_request:
    paths:
      - '.github/workflows/scripts-check.yaml'
      # The entry scripts sit directly under `scripts/` and the decision logic one level
      # down; both levels are spelled out so a change to either reaches this workflow.
      - 'scripts/*.ts'
      - 'scripts/**/*.ts'
      - 'scripts/**/*.mts'
      - 'scripts/tsconfig.json'
      - 'scripts/package.json'
      - 'scripts/pnpm-lock.yaml'
      - 'scripts/pnpm-workspace.yaml'
      # The 1:1 gate walks two packages beyond `scripts/`, so their sources have to reach this
      # workflow too — otherwise a new callable export lands untested and the PR adding it never
      # runs the gate that would have said so. These entries track the gate's own package list,
      # and `one-to-one.gate.test.ts` fails when they stop tracking it.
      - 'docs-viewer/src/**'
      - '.makefiles/node/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
            ::1
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            docker.io
            index.docker.io
            registry-1.docker.io
            auth.docker.io
            *.docker.io
            production.cloudflare.docker.com
            production.cloudfront.docker.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com
            dl-cdn.alpinelinux.org
            deb.debian.org
            security.debian.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: node npm:pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the script tree for scripts/
        run: pnpm install --dir scripts --frozen-lockfile

      # The 1:1 gate walks every TypeScript package from here, and it decides "is this export
      # callable" from the type checker. A package whose dependencies are absent resolves to
      # `any`, which has no call signatures — the gate would then require nothing and report a
      # clean run. It fails loudly on an unresolved import instead, so the trees have to be here.
      - name: Install the trees the 1:1 gate type-checks
        run: |
          set -euo pipefail
          pnpm install --dir docs-viewer --frozen-lockfile

      - name: Typecheck
        run: make scripts-typecheck-ci

      # The full variant: coverage with no cache, and the coverage thresholds in
      # `scripts/vitest.config.mts` are part of the gate. A new decision branch that nobody
      # exercises is exactly how these scripts start reporting a clean run, so an uncovered
      # branch fails here rather than being reported as a percentage nobody reads.
      - name: Test
        run: make scripts-test-ci
