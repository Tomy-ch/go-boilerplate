name: Golang Test

on:
  pull_request:
    # paths:
    #   - '**/*.go'
    #   - 'go.mod'
    #   - 'go.sum'
    #   - '**/*.sql'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-setup:
    uses: ./.github/workflows/golang-setup.yaml
    with:
      go-version: '1.24.4'
    permissions:
      contents: read
  test:
    needs: golangci-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    services:
      database:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s
    steps:
      - name: Fetch & Checkout repository
        uses: actions/checkout@v4
      - name: Initialize Database
        run: make db-init-test
      - name: Run Tests with Coverage
        run: go test ./... -coverprofile=coverage.out
      - name: Report Test Coverage
        uses: k1LoW/octocov-action@v1
