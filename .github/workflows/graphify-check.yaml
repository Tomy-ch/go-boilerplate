name: Graphify Check

on:
  pull_request:
    paths:
      - 'graphify-out/**'
      - '.gitignore'
      - '.agents/graphify/spec-pin.toml'
      - 'python/graphify.*'
      - 'scripts/graphify-check/**'
      - '.makefiles/graphify/export.mk'
      - '.github/workflows/graphify-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base ref must be resolvable for the BASE diff; the default shallow checkout
          # leaves it a bad object and the step degrades to "no output changed".
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tracked graphify artifacts carry no machine-local paths
        id: graphify
        shell: bash
        env:
          # BASE is passed only for a feature branch merging into a release line: a promotion
          # (release -> develop / staging / production) legitimately carries the graph forward, and
          # the sync branch is where the update is produced in the first place. A base that has no
          # output yet is the tool's own exception — the introduction conflicts with nothing.
          BASE_REF: ${{ github.event_name == 'pull_request'
            && startsWith(github.base_ref, 'release/')
            && !startsWith(github.head_ref, 'auto/graphify-update/')
            && format('origin/{0}', github.base_ref) || '' }}
        run: |
          set +e

          make graphify-check BASE="${BASE_REF}" 2>&1 | tee /tmp/graphify-check.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Graphify check: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Graphify check: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment graphify-check result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- graphify-check-result -->'
          status: ${{ steps.graphify.outputs.status }}
          title: "${{ steps.graphify.outputs.title || '## ⚠️ Graphify Check: CUT OFF (no result produced)' }}"
          body-file: /tmp/graphify-check.log
          details-summary: 'graphify-check log'

      - name: Fail if a tracked artifact is machine-local
        if: always() && steps.graphify.outputs.status != 'success'
        run: exit 1
