name: Sample Removal Check

# サンプル削除フローが壊れず、削除後のコアのみの状態でビルド・lint・テストが通り、削除ツール
# 自身も自消滅することを検証する。実行は repo の CI 慣習に合わせ「runner で直実行 + github サービス DB」
# を基本にし、DB を要さないファイル削除だけを node_tool_runner コンテナで行う（削除スクリプトの node
# 依存がコンテナイメージにのみ存在するため）。フレッシュ DB に対して「先に削除 → migrate-up」する
# ことで、適用されるのは core migration だけになり、DB リセットは不要になる。
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-removal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password
    services:
      database:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint / node を runner で直実行するため、go-lint.yaml と同様に mise で導入する。
      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install node & golangci-lint
        run: mise install node golangci-lint

      # 削除スクリプトの node 依存(commander 等)は docker/tools/package.json に定義され、
      # node_tool_runner イメージでは /app/scripts/node_modules へ install される。runner 直実行でも
      # 同じ構成を再現する（Dockerfile と同じ package.json を scripts/ へ置いて npm ci）。
      - name: Install script node deps
        run: |
          cp docker/tools/package.json docker/tools/package-lock.json docker/tools/.npmrc scripts/
          npm ci --ignore-scripts --prefix scripts

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      - name: Materialize ci env for embedding
        run: make materialize-env

      # サンプル削除の「ファイル削除 + マーカー除去 + ツール自消滅」を runner で直実行する
      # （DB を触らないため docker compose は不要）。
      - name: Remove sample files (delete + strip markers + self-destruct)
        run: node scripts/setup/remove-sample-api.mjs

      # マーカー除去でフィールド整列・インデントが崩れるため、実削除フロー同様に整形する
      # （実コマンドは gen-api gen-query fix lint を連鎖する。CI では gen を省くため fix のみ）。
      - name: Format after removal (make fix)
        run: make fix

      # フレッシュな test DB へ migrate-up。サンプル migration は既に消えているため core のみ適用される。
      - name: Migrate & seed core-only schema
        run: |
          go run ./cmd/ migrate-up --database "${DB}"
          go run ./cmd/ db-seed --database "${DB}"

      # ── 削除後のコアのみの状態を検証 ──

      - name: Verify build
        run: go build ./...

      - name: Verify lint
        run: make lint

      - name: Verify tests
        run: make test

      - name: Verify sample-removal tooling self-destructed
        run: |
          set -euo pipefail
          if make help 2>/dev/null | grep -q 'setup-remove-sample-api'; then
            echo "FAIL: setup-remove-sample-api target still present"
            exit 1
          fi
          for f in scripts/setup/remove-sample-api.mjs scripts/setup/lib/sample-api.mjs; do
            if [ -e "$f" ]; then
              echo "FAIL: $f was not self-deleted"
              exit 1
            fi
          done
          echo "tooling self-destruct: OK"

      - name: Verify no dangling sample references
        run: |
          set -euo pipefail
          if grep -rniE 'usercount|user_roles|prefecture' internal/ cmd/ --include='*.go' | grep -v '_test.go'; then
            echo "FAIL: dangling sample references found"
            exit 1
          fi
          echo "no dangling refs: OK"
