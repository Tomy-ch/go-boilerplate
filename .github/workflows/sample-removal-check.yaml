name: Sample Removal Check

on:
  workflow_dispatch:
  # Mirrors scripts/setup/remove-sample-api/sample-manifest.ts, plus what the rebuild reads.
  pull_request:
    paths:
      - '.github/workflows/sample-removal-check.yaml'
      - 'internal/**'
      - 'database/**'
      - 'openapi/**'
      - 'docs/**'
      - 'scripts/**'
      - '.makefiles/**'
      - 'makefile'
      - 'go.mod'
      - 'go.sum'
      - 'sqlc.yaml'
      - 'mise.toml'
      - 'env/.env'
      - 'env/.env.ci'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-removal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password
    services:
      database:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s
      dynamodb_local:
        # DynamoDB Local, the Realtime Delivery store. Service-container defaults: README.md § Notes.
        image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - "8000:8000"
        options: >-
          --health-cmd="curl -s -o /dev/null http://localhost:8000"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s
      goaws:
        # SNS / SQS emulator for the Realtime Delivery fan-out. Service-container defaults: README.md § Notes.
        image: admiralpiett/goaws:v0.5.4@sha256:18589afe16517751cc981354536c148854157a718bee9059494d6cdee3dc4e2d
        ports:
          - "4100:4100"
        options: >-
          --health-cmd="nc -z localhost 4100"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=5s
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: true
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
            ::1
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            docker.io
            index.docker.io
            registry-1.docker.io
            auth.docker.io
            *.docker.io
            production.cloudflare.docker.com
            production.cloudfront.docker.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com
            dl-cdn.alpinelinux.org
            deb.debian.org
            security.debian.org
            apt.postgresql.org
            www.postgresql.org
            archive.ubuntu.com
            azure.archive.ubuntu.com
            security.ubuntu.com
            esm.ubuntu.com
            motd.ubuntu.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: node npm:pnpm golangci-lint npm:markdownlint-cli2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install script node deps
        run: pnpm install --dir scripts --frozen-lockfile

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      - name: Materialize ci env for embedding
        run: make materialize-env

      - name: Remove sample files (delete + strip markers + self-destruct)
        run: pnpm --dir scripts run tsx scripts/setup/remove-sample-api/index.ts

      # Removal shrinks the hand-written spec, but it does not touch the embedded generated
      # one. Running build / lint / test without regenerating checks the tests against the
      # spec as it was *before* the removal: every test that reads the real spec (the security
      # allow-lists, Allow resolution, details opt-in) then passes while still carrying sample
      # paths, so this job would never see the leftovers it exists to catch. The user-facing
      # `make setup-remove-sample-api` regenerates immediately after deleting, so the order
      # here matches it.
      #
      # `gen-query` is deliberately not included: it dumps the schema of a live DB, which this
      # job only builds further down. Nothing reads its artifacts (`models.gen.go`,
      # `*.gen.sql.go`) from a test, and the code that did is deleted with the sample, so
      # `go build` covers the same ground.
      - name: Regenerate from the shrunken spec
        run: make gen-bundle-oapi gen-go-code

      - name: Format after removal (make go-fix)
        run: make go-fix

      # Stripping marker blocks edits Markdown structurally (READMEs, docs, the target
      # registry), and a block that swallows one line too many leaves a broken table, an
      # orphaned heading or an unclosed fence. `make go-fix` only formats Go, and the repo-wide
      # md-lint job only ever sees the state with the sample still in it.
      - name: Verify the stripped Markdown is still valid
        run: make md-markdownlint-ci

      # The skills point at where things go, so a sample-shaped path left in one dangles the
      # moment the sample is gone. markdownlint cannot see that: the link is well-formed, it
      # just leads nowhere. Nothing else runs this against the post-removal tree.
      - name: Verify the skills still resolve their references
        run: make md-skill-lint-ci

      - name: Migrate & seed core-only schema
        run: |
          go run ./cmd/ migrate-up --database "${DB}"
          go run ./cmd/ db-seed --database "${DB}"

      - name: Verify build
        run: go build ./...

      - name: Verify lint
        run: make go-lint

      - name: Verify tests
        run: make go-test

      - name: Verify sample removal (exact deletion + no dangling refs)
        run: pnpm --dir scripts run tsx scripts/setup/verify-sample-removal/index.ts

      # The verifier removes its own directory and the snapshot; the remover's directory and
      # this workflow go with the sample itself. Checking directories rather than files is what
      # keeps this honest: a module added later is covered without editing this list, and a path
      # left out here would pass silently forever. This file is named explicitly because it is
      # the one piece of the tooling that lives outside `scripts/setup/` — left behind, it would
      # keep invoking entrypoints that deleted themselves.
      - name: Verify verification tool self-destructed
        run: |
          set -euo pipefail
          for f in \
            scripts/setup/verify-sample-removal \
            scripts/setup/remove-sample-api \
            .github/workflows/sample-removal-check.yaml \
            scripts/setup/.sample-removal-snapshot.json; do
            if [ -e "$f" ]; then
              echo "FAIL: $f was not self-deleted"
              exit 1
            fi
          done
          echo "verification tool self-destruct: OK"
