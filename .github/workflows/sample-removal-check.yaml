name: Sample Removal Check

# サンプル削除フローが壊れず、削除後のコアのみの状態でビルド・lint・テストが通り、削除ツール
# 自身も自消滅することを検証する。実行は repo の CI 慣習に合わせ「runner で直実行 + github サービス DB」
# を基本にし、DB を要さないファイル削除だけを node_tool_runner コンテナで行う（削除スクリプトの node
# 依存がコンテナイメージにのみ存在するため）。フレッシュ DB に対して「先に削除 → migrate-up」する
# ことで、適用されるのは core migration だけになり、DB リセットは不要になる。
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-removal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password
    services:
      database:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      - name: Materialize ci env for embedding
        run: make materialize-env

      # サンプル削除の「ファイル削除 + マーカー除去 + ツール自消滅」だけをコンテナで実行する。
      # この段階は DB を一切触らないため、コンテナ内から DB へ到達する必要はない。
      # 出力(/app のマウント経由)は runner の作業ツリーへ反映され、後続ステップが post-removal を見る。
      - name: Remove sample files (delete + strip markers + self-destruct)
        run: docker compose run --rm node_tool_runner node scripts/setup/remove-sample-api.mjs

      # フレッシュな test DB へ migrate-up。サンプル migration は既に消えているため core のみ適用される。
      - name: Migrate & seed core-only schema
        run: |
          go run ./cmd/ migrate-up --database "${DB}"
          go run ./cmd/ db-seed --database "${DB}"

      # ── 削除後のコアのみの状態を検証 ──

      - name: Verify build
        run: go build ./...

      - name: Verify lint
        run: make lint

      - name: Verify tests
        run: make test

      - name: Verify sample-removal tooling self-destructed
        run: |
          set -euo pipefail
          if make help 2>/dev/null | grep -q 'setup-remove-sample-api'; then
            echo "FAIL: setup-remove-sample-api target still present"
            exit 1
          fi
          for f in scripts/setup/remove-sample-api.mjs scripts/setup/lib/sample-api.mjs; do
            if [ -e "$f" ]; then
              echo "FAIL: $f was not self-deleted"
              exit 1
            fi
          done
          echo "tooling self-destruct: OK"

      - name: Verify no dangling sample references
        run: |
          set -euo pipefail
          if grep -rniE 'usercount|user_roles|prefecture' internal/ cmd/ --include='*.go' | grep -v '_test.go'; then
            echo "FAIL: dangling sample references found"
            exit 1
          fi
          echo "no dangling refs: OK"
