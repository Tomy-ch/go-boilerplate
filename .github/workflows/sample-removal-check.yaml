name: Sample Removal Check

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-removal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password
    services:
      database:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            aquaproj.github.io:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            *.docker.io:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            apt.postgresql.org:80
            apt.postgresql.org:443
            www.postgresql.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install node, pnpm & golangci-lint
        run: mise install node npm:pnpm golangci-lint npm:markdownlint-cli2

      # `scripts/pnpm-workspace.yaml` carries the supply-chain policy (cooldown, allowBuilds,
      # trust policy) that the install must honour.
      - name: Install script node deps
        run: pnpm install --dir scripts --frozen-lockfile

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      - name: Materialize ci env for embedding
        run: make materialize-env

      - name: Remove sample files (delete + strip markers + self-destruct)
        run: pnpm --dir scripts run tsx scripts/setup/remove-sample-api/index.ts

      - name: Format after removal (make fix)
        run: make fix

      # Stripping marker blocks edits Markdown structurally (READMEs, docs, the target
      # registry), and a block that swallows one line too many leaves a broken table, an
      # orphaned heading or an unclosed fence. `make fix` only formats Go, and the repo-wide
      # md-lint job only ever sees the state with the sample still in it.
      - name: Verify the stripped Markdown is still valid
        run: make md-markdownlint-ci

      - name: Migrate & seed core-only schema
        run: |
          go run ./cmd/ migrate-up --database "${DB}"
          go run ./cmd/ db-seed --database "${DB}"

      - name: Verify build
        run: go build ./...

      - name: Verify lint
        run: make lint

      - name: Verify tests
        run: make test

      - name: Verify sample removal (exact deletion + no dangling refs)
        run: pnpm --dir scripts run tsx scripts/setup/verify-sample-removal/index.ts

      # The verifier removes its own directory and the snapshot; the remover's directory
      # goes with the sample itself. Checking directories rather than files is what keeps
      # this honest: a module added later is covered without editing this list, and a path
      # left out here would pass silently forever.
      - name: Verify verification tool self-destructed
        run: |
          set -euo pipefail
          for f in \
            scripts/setup/verify-sample-removal \
            scripts/setup/remove-sample-api \
            scripts/setup/.sample-removal-snapshot.json; do
            if [ -e "$f" ]; then
              echo "FAIL: $f was not self-deleted"
              exit 1
            fi
          done
          echo "verification tool self-destruct: OK"
