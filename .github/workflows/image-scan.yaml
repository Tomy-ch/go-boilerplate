name: Image Scan

on:
  pull_request:
    branches:
      - production
      - staging
      - develop
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # cache: false — this job holds security-events: write, so it must not
          # restore a tool cache that a less privileged workflow could have written.
          cache: false

      - name: Prepare vendor
        run: |
          go mod vendor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Define image tag
        id: meta
        run: |
          IMAGE="local/${GITHUB_REPOSITORY#*/}/app:${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/server/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}
          target: runtime
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.meta.outputs.image }}
          format: spdx-json
          output-file: sbom-spdx.json
          artifact-name: sbom-spdx.json
          upload-artifact: true

      - name: Summarize SBOM (Markdown)
        run: |
          set -euo pipefail
          FILE=sbom-spdx.json
          if [ ! -f "$FILE" ]; then
            echo "SBOM not found: $FILE" >&2
            exit 1
          fi
          NAME=$(jq -r '.name // "unknown"' "$FILE")
          CREATED=$(jq -r '.creationInfo.created // "unknown"' "$FILE")
          TOTAL_PKGS=$(jq -r '.packages | length' "$FILE")
          DIGEST=$(jq -r '[.packages[] | select(.primaryPackagePurpose=="CONTAINER") | .checksums[]? | select(.algorithm=="SHA256") | .checksumValue][0] // "unknown"' "$FILE")
          DISTRO=$(jq -r '[.packages[]?.externalRefs[]? | select(.referenceType=="purl") | .referenceLocator | capture("distro=(?<distro>[^&]+)").distro] | .[0] // "unknown"' "$FILE")
          GOVERSION=$(jq -r '(.packages[] | select(.name=="stdlib") | .versionInfo) // "unknown"' "$FILE")
          # Top 50 Go modules with versions
          jq -r '
            [ .packages[]
              | select(.name|type=="string")
              | select((.name|startswith("github.com/") or startswith("golang.org/") or startswith("go.uber.org/") or startswith("github.com/oapi-codegen/")))
              | {n:.name, v:(.versionInfo // "UNKNOWN")} ]
            | sort_by(.n)
            | .[0:50]
            | map("- `" + .n + "@" + .v + "`")
            | join("\n")
          ' "$FILE" > _gomods.md
          # Declared licenses histogram (top 25)
          jq -r '
            [ .packages[] | .licenseDeclared? | select(. != null and . != "NOASSERTION") ]
            | reduce .[] as $l ({}; .[$l] = ( .[$l] // 0 ) + 1)
            | to_entries | sort_by(-.value) | .[0:25]
            | map("- " + .key + ": " + (.value|tostring))
            | if length>0 then . else ["- (none)"] end
            | join("\n")
          ' "$FILE" > _licenses.md
          cat > sbom-summary.md << MD
          ## SBOM Summary (SPDX)
          **Image**: ${NAME}
          - Created: ${CREATED}
          - Image Digest (SHA256): \`${DIGEST}\`
          - Distro: ${DISTRO}
          - Total Packages: ${TOTAL_PKGS}
          - Go Toolchain: ${GOVERSION}
          ### Key Go Modules (top 50)
          $(cat _gomods.md)
          ### Declared Licenses (top 25)
          $(cat _licenses.md)
          MD
          echo "Generated sbom-summary.md" && wc -c sbom-summary.md

      - name: Comment SBOM result on PR
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- sbom-summary-spdx -->'
          body-file: sbom-summary.md

      - name: Upload SBOM summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-summary.md
          path: sbom-summary.md

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          # cache: false — this job holds security-events: write, so it must not
          # restore a tool cache that a less privileged workflow could have written.
          cache: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install trivy
        run: mise install aqua:aquasecurity/trivy

      # Scan flags live in .makefiles/security/trivy.mk, same as the filesystem
      # scans. -s keeps make from echoing the recipe into the output file.
      - name: Trivy image scan
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: make -s trivy-image-ci TRIVY_IMAGE="${IMAGE}" TRIVY_FORMAT=table > trivy-image-scan.txt
        shell: bash

      - name: Trivy image scan (SARIF)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: make -s trivy-image-ci TRIVY_IMAGE="${IMAGE}" TRIVY_FORMAT=sarif > trivy-image-scan.sarif
        shell: bash

      - name: Upload Trivy image SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: trivy-image-scan.sarif
          category: trivy-image

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-image-scan.txt
          path: trivy-image-scan.txt

      - name: Comment Trivy image scan result on PR
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-image-scan -->'
          body-file: trivy-image-scan.txt
          title: '## Trivy Image Scan (table)'
          details-summary: 'Image Scan Results'

      # On PRs this blocks promotion; on the weekly schedule it surfaces newly published fixable
      # CRITICAL/HIGH findings on already-merged images as a red scheduled run.
      # workflow_dispatch is exploratory, so it is not gated.
      - name: Trivy image scan (gate - fixable CRITICAL/HIGH)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: make trivy-image-gate-ci TRIVY_IMAGE="${IMAGE}"
        shell: bash

  # A scheduled failure has no author watching it, so it is pushed to a human.
  # PR / push failures are deliberately excluded: they are already visible.
  # cancelled counts too: a job killed by a timeout or a runner fault reports
  # cancelled rather than failure, and that is precisely the silent breakage this
  # notification exists to surface.
  notify-failure:
    needs: build
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.build.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: build
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
