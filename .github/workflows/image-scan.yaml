name: Image Scan

on:
  pull_request:
    branches:
      - production
      - staging
      - develop
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare vendor
        run: |
          go mod vendor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Define image tag
        id: meta
        run: |
          IMAGE="local/${GITHUB_REPOSITORY#*/}/app:${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/server/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}
          target: runtime
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.meta.outputs.image }}
          format: spdx-json
          output-file: sbom-spdx.json
          artifact-name: sbom-spdx.json
          upload-artifact: true

      - name: Summarize SBOM (Markdown)
        run: |
          set -euo pipefail
          FILE=sbom-spdx.json
          if [ ! -f "$FILE" ]; then
            echo "SBOM not found: $FILE" >&2
            exit 1
          fi
          NAME=$(jq -r '.name // "unknown"' "$FILE")
          CREATED=$(jq -r '.creationInfo.created // "unknown"' "$FILE")
          TOTAL_PKGS=$(jq -r '.packages | length' "$FILE")
          DIGEST=$(jq -r '[.packages[] | select(.primaryPackagePurpose=="CONTAINER") | .checksums[]? | select(.algorithm=="SHA256") | .checksumValue][0] // "unknown"' "$FILE")
          DISTRO=$(jq -r '[.packages[]?.externalRefs[]? | select(.referenceType=="purl") | .referenceLocator | capture("distro=(?<distro>[^&]+)").distro] | .[0] // "unknown"' "$FILE")
          GOVERSION=$(jq -r '(.packages[] | select(.name=="stdlib") | .versionInfo) // "unknown"' "$FILE")
          # Top 50 Go modules with versions
          jq -r '
            [ .packages[]
              | select(.name|type=="string")
              | select((.name|startswith("github.com/") or startswith("golang.org/") or startswith("go.uber.org/") or startswith("github.com/oapi-codegen/")))
              | {n:.name, v:(.versionInfo // "UNKNOWN")} ]
            | sort_by(.n)
            | .[0:50]
            | map("- `" + .n + "@" + .v + "`")
            | join("\n")
          ' "$FILE" > _gomods.md
          # Declared licenses histogram (top 25)
          jq -r '
            [ .packages[] | .licenseDeclared? | select(. != null and . != "NOASSERTION") ]
            | reduce .[] as $l ({}; .[$l] = ( .[$l] // 0 ) + 1)
            | to_entries | sort_by(-.value) | .[0:25]
            | map("- " + .key + ": " + (.value|tostring))
            | if length>0 then . else ["- (none)"] end
            | join("\n")
          ' "$FILE" > _licenses.md
          cat > sbom-summary.md << MD
          ## SBOM Summary (SPDX)
          **Image**: ${NAME}
          - Created: ${CREATED}
          - Image Digest (SHA256): \`${DIGEST}\`
          - Distro: ${DISTRO}
          - Total Packages: ${TOTAL_PKGS}
          - Go Toolchain: ${GOVERSION}
          ### Key Go Modules (top 50)
          $(cat _gomods.md)
          ### Declared Licenses (top 25)
          $(cat _licenses.md)
          MD
          echo "Generated sbom-summary.md" && wc -c sbom-summary.md

      - name: Comment SBOM result on PR
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- sbom-summary-spdx -->'
          body-file: sbom-summary.md

      - name: Upload SBOM summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-summary.md
          path: sbom-summary.md

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          scanners: 'vuln'
          format: table
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: trivy-image-scan.txt

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          scanners: 'vuln'
          format: sarif
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: trivy-image-scan.sarif

      - name: Upload Trivy image SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: trivy-image-scan.sarif
          category: trivy-image

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-image-scan.txt
          path: trivy-image-scan.txt

      - name: Comment Trivy image scan result on PR
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-image-scan -->'
          body-file: trivy-image-scan.txt
          title: '## Trivy Image Scan (table)'
          details-summary: 'Image Scan Results'

      - name: Trivy image scan (gate - fixable CRITICAL/HIGH)
        if: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          scanners: 'vuln'
          format: table
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
