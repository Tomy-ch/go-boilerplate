name: CodeQL Scan

# One matrix leg per CodeQL language. The legs share nothing but the config file at
# .github/codeql/codeql-config.yml, which is what keeps the query suite and the
# exclusion list from drifting between them.
#
#   go                    — the application itself; the only leg that needs a build.
#   javascript-typescript — docs-viewer / scripts, neither of which
#                           any other SAST reaches (opengrep.yaml covers Go).
#   actions               — the workflows in this directory. It overlaps zizmor and
#                           actionlint on purpose: they lint syntax and permissions,
#                           CodeQL follows data flow from an untrusted trigger input
#                           into a run: block, which the other two do not do.
#
# The path filter has to admit all three surfaces or a leg never fires on the change
# that concerns it.

on:
  push:
    branches:
      - 'release/*'
      - develop
      - staging
      - production
    paths:
      - '.github/workflows/code-ql.yaml'
      - '.github/codeql/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
  pull_request:
    paths:
      - '.github/workflows/code-ql.yaml'
      - '.github/codeql/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
  schedule:
    - cron: '15 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    # The legs run in parallel, but security-extended is a larger suite than the
    # default one and javascript-typescript has three workspaces to extract.
    timeout-minutes: 30
    # Scoped to this job rather than the workflow: notify-failure only forwards a
    # result to Slack and has no dashboard to write to.
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      # One language failing must not cancel the others: their SARIF uploads are
      # independent, and a cancelled leg leaves its category's alerts stale.
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript
          - actions
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            uploads.github.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go is the only language here that CodeQL builds; the other two are extracted
      # from source, so a toolchain they never invoke is not installed for them.
      - name: Setup Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # cache: false — this job holds security-events: write. See README.md § Cache safety.
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml
          # javascript-typescript and actions are extracted straight from source and
          # must say so, or CodeQL looks for a build that does not exist. Go keeps the
          # unset default and is built by the Autobuild step below.
          #
          # Negated on purpose: `cond && '' || X` always yields X, since an empty
          # string is falsy. The empty value has to sit in the falsy branch, and an
          # empty input reads as "not supplied" to the action.
          build-mode: ${{ matrix.language != 'go' && 'none' || '' }}

      - name: Autobuild
        if: ${{ matrix.language == 'go' }}
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      # Per-language category: code scanning keys a SARIF upload by it, so a shared
      # category would make each leg overwrite the previous one's alerts.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'

  # See README.md § Notification triggers (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: codeql
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.codeql.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: codeql
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
