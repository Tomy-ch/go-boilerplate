name: Pin Images Check

on:
  pull_request:
    paths:
      - 'docker/*/Dockerfile'
      - 'docker-compose*.yaml'
      - 'docker/images-pin.toml'
      - 'scripts/pin-images/**'
      - '.makefiles/docker/pin.mk'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-images-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            *.docker.io:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check base images are pinned
        id: pin
        shell: bash
        run: |
          set +e

          make pin-images-check 2>&1 | tee /tmp/pin-images.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Pin images: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Pin images: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment pin-images result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- pin-images-result -->'
          status: ${{ steps.pin.outputs.status }}
          title: "${{ steps.pin.outputs.title || '## ⚠️ Pin Images Check: CUT OFF (no result produced)' }}"
          body-file: /tmp/pin-images.log
          details-summary: 'pin-images log'

      - name: Fail if not pinned
        if: always() && steps.pin.outputs.status != 'success'
        run: exit 1
