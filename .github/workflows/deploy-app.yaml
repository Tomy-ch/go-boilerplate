name: Application Deployment Workflow

on:
  pull_request:
    branches:
      - production
      - staging
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: write
      id-token: write

    steps:
      - name: Fetch & Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Get release version
        id: meta_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 --first-parent 2>/dev/null || echo "none")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get revision (commit SHA)
        id: meta_revision
        run: |
          echo "revision=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Get build date
        id: meta_date
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Generate image tags
        id: meta_tags
        run: |
          VERSION="${{ steps.meta_version.outputs.version }}"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [[ "$VERSION" == "none" ]]; then
            IMAGE_TAG=$SHORT_SHA
          else
            IMAGE_TAG=${VERSION}-${SHORT_SHA}
          fi
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Define registry
        id: meta_registry
        run: |
          echo "Note: Please modify this section according to your environment"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$OWNER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        run: |
          echo "Login to container registry here (ECR/GCR/ACR/GHCR)"
          echo "Note: Please modify this section according to your environment"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate vendor
        run: |
          go mod tidy
          go mod vendor

      - name: Build and push Runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/server/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta_registry.outputs.registry }}/app:${{ steps.meta_tags.outputs.short_sha }}
            ${{ steps.meta_registry.outputs.registry }}/app:${{ steps.meta_tags.outputs.image_tag }}
            ${{ steps.meta_registry.outputs.registry }}/app:${{ steps.meta_version.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta_version.outputs.version }}
            REVISION=${{ steps.meta_revision.outputs.revision }}
            BUILD_DATE=${{ steps.meta_date.outputs.build_date }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta_version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta_revision.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta_date.outputs.build_date }}
            org.opencontainers.image.source=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push Migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/server/Dockerfile
          target: migration
          push: true
          tags: |
            ${{ steps.meta_registry.outputs.registry }}/app:${{ steps.meta_tags.outputs.short_sha }}-migration
            ${{ steps.meta_registry.outputs.registry }}/app:${{ steps.meta_tags.outputs.image_tag }}-migration
            ${{ steps.meta_registry.outputs.registry }}/app:${{ steps.meta_version.outputs.version }}-migration
          build-args: |
            VERSION=${{ steps.meta_version.outputs.version }}
            REVISION=${{ steps.meta_revision.outputs.revision }}
            BUILD_DATE=${{ steps.meta_date.outputs.build_date }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta_version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta_revision.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta_date.outputs.build_date }}
            org.opencontainers.image.source=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Define environment
        run: |
          if [[ "${{ github.ref_name }}" == "production" ]]; then
            echo "ENV=prd" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "ENV=stg" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      - name: Configure cloud credentials
        run: |
          echo "Configure authentication for target cloud environment"
          echo "Note: Please modify this section according to your environment"
          echo "- Must use environment-specific credentials"
          echo "- Should leverage OIDC / Workload Identity / Federated Identity"
          echo "- Must be executed before migration and deployment"
          echo "    - AWS: IAM Role (OIDC)"
          echo "    - GCP: Workload Identity Federation"
          echo "    - Azure: Federated Identity"

      - name: Run migration (one-time job)
        run: |
          echo "Run database migration as a one-time job before deployment"
          echo "Note: Please modify this section according to your environment"
          echo "- Must be executed exactly once per deployment"
          echo "- Should be triggered from CI or a job system"
          echo "- ENV will be passed to the container at runtime"
          echo "Example (local/docker run):"
          echo "docker run -e ENV=\${ENV} <image>-migration"
          echo "    - AWS: ECS RunTask / EKS (Kubernetes Job)"
          echo "    - GCP: Cloud Run Job/ GKE (Kubernetes Job)"
          echo "    - Azure: Container App Job / AKS(Kubernetes Job)"
          echo "- Must NOT be executed in container startup (entrypoint)"

      - name: Deploy application
        run: |
          echo "Deploy application after successful migration"
          echo "Note: Please modify this section according to your environment"
          echo "- Application must start in 'serve' mode only"
          echo "- Migration must be completed beforehand"
          echo "- ENV must be passed to the container"
          echo "Example (local/docker run):"
          echo "docker run -e ENV=\${ENV} <image>"
          echo "- Deployment mechanism depends on environment"
          echo "    - AWS: ECS / EKS / App Runner (set ENV in task definition / pod spec)"
          echo "    - GCP: Cloud Run / GKE (set ENV in service / pod)"
          echo "    - Azure: Container Apps / AKS (set ENV in container settings)"
