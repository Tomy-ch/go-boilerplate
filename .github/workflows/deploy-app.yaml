name: Deploy App

on:
  push:
    branches:
      - production
      - staging
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: migration
            suffix: "-migration"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Get release version
        id: meta_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 --first-parent 2>/dev/null || echo "none")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get build date
        id: meta_date
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Define build environment
        id: meta_env
        run: |
          if [[ "${{ github.ref_name }}" == "production" ]]; then
            echo "app_env=prd" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "app_env=stg" >> $GITHUB_OUTPUT
          else
            echo "app_env=dev" >> $GITHUB_OUTPUT
          fi

      # WARN: 署名 / attestation は後段すべてこの meta_registry を参照する（ghcr.io はハードコードしていない）。
      #       他レジストリ（ECR / Artifact Registry / ACR 等）へ移す場合は、この registry 値と
      #       下の Login to registry を差し替えるだけで署名はそのまま対象レジストリへ付く。
      - name: Define registry
        id: meta_registry
        run: |
          echo "Note: Please modify this section according to your environment"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$OWNER" >> $GITHUB_OUTPUT

      - name: Generate image tags
        id: meta_tags
        env:
          VERSION: ${{ steps.meta_version.outputs.version }}
          REGISTRY: ${{ steps.meta_registry.outputs.registry }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "tags<<${DELIM}"
            echo "${REGISTRY}/app:${SHORT_SHA}${SUFFIX}"
            if [[ "$VERSION" != "none" ]]; then
              echo "${REGISTRY}/app:${VERSION}-${SHORT_SHA}${SUFFIX}"
              echo "${REGISTRY}/app:${VERSION}${SUFFIX}"
            fi
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # WARN: 他レジストリへ移行する場合はこのステップを差し替えること
      #       （ECR: aws ecr get-login-password / GCP: gcloud auth / ACR: az acr login 等）。
      #       後段のビルド/署名/attestation はここで確立した認証セッションに依存する。
      - name: Login to registry
        run: |
          echo "Login to container registry here (ECR/GCR/ACR/GHCR)"
          echo "Note: Please modify this section according to your environment"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate vendor
        run: |
          go mod vendor

      - name: Build and push image (${{ matrix.target }})
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: docker/server/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta_tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta_version.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.meta_date.outputs.build_date }}
            APP_ENV=${{ steps.meta_env.outputs.app_env }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta_version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta_date.outputs.build_date }}
            org.opencontainers.image.source=${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.meta_registry.outputs.registry }}/app
          subject-digest: ${{ steps.build.outputs.digest }}
          # WARN: push-to-registry は attestation を OCI 1.1 referrer としてレジストリへ添付する。
          #       GitHub Attestation store への記録はレジストリ非依存で常に行われるが、この referrer 添付は
          #       対象レジストリが OCI referrer 対応の場合のみ成功する。非対応レジストリでは false にし、
          #       GitHub 側の記録（+ cosign 署名）のみで検証する構成にフォールバックすること。
          push-to-registry: true

      - name: Sign image (cosign keyless)
        env:
          IMAGE_DIGEST_REF: ${{ steps.meta_registry.outputs.registry }}/app@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_DIGEST_REF}"

      # NOTE: image-scan.yaml の SBOM とは目的が異なる意図的な重複。
      #       image-scan.yaml は PR ゲートとしてローカルビルド(push:false)を対象にスキャン/レポートする。
      #       こちらは push 済み digest を対象に attestation へ添付する。どちらか一方を消さないこと。
      - name: Generate SBOM (SPDX) for pushed image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.meta_registry.outputs.registry }}/app@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ steps.meta_registry.outputs.registry }}/app
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.target }}.spdx.json
          # WARN: 上記 Attest build provenance と同じく OCI referrer 添付。非対応レジストリでは false にする。
          push-to-registry: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure cloud credentials
        run: |
          echo "Configure authentication for target cloud environment"
          echo "Note: Please modify this section according to your environment"
          echo "- Must use environment-specific credentials"
          echo "- Should leverage OIDC / Workload Identity / Federated Identity"
          echo "- Must be executed before migration and deployment"
          echo "    - AWS: IAM Role (OIDC)"
          echo "    - GCP: Workload Identity Federation"
          echo "    - Azure: Federated Identity"

      - name: Run migration (one-time job)
        run: |
          echo "Run database migration as a one-time job before deployment"
          echo "Note: Please modify this section according to your environment"
          echo "- Must be executed exactly once per deployment"
          echo "- Should be triggered from CI or a job system"
          echo "- ENV はブランチ別イメージにビルド時固定済み（実行時注入は不要）"
          echo "Example (local/docker run):"
          echo "docker run <image>-migration"
          echo "    - AWS: ECS RunTask / EKS (Kubernetes Job)"
          echo "    - GCP: Cloud Run Job/ GKE (Kubernetes Job)"
          echo "    - Azure: Container App Job / AKS(Kubernetes Job)"
          echo "- Must NOT be executed in container startup (entrypoint)"

      - name: Deploy application
        run: |
          echo "Deploy application after successful migration"
          echo "Note: Please modify this section according to your environment"
          echo "- Application must start in 'serve' mode only"
          echo "- Migration must be completed beforehand"
          echo "- ENV はイメージにビルド時固定済み（実行時注入は不要）"
          echo "Example (local/docker run):"
          echo "docker run <image>"
          echo "- Deployment mechanism depends on environment"
          echo "    - AWS: ECS / EKS / App Runner"
          echo "    - GCP: Cloud Run / GKE"
          echo "    - Azure: Container Apps / AKS"
