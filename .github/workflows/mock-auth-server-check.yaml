name: Mock-Auth Server Check

# mock-auth-server（疑似 OIDC provider）の型チェック・テストと、golden JWKS のドリフト検知を行う。
# golden JWKS 生成（gen:jwks）は鍵ストア（jose）を import するため node_tool_runner コンテナでは解決できず、
# 既存の "Generated Mock-Auth OpenAPI Artifacts Check"（openapi bundle + zod）とは別ジョブとして、
# provider の node_modules を持つ環境で回す。

on:
  pull_request:
    paths:
      - '.github/workflows/mock-auth-server-check.yaml'
      - 'docker/mock-auth-server/**'
      - 'internal/integration/testdata/jwks/**'
      - 'mise.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-auth-server-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docker/mock-auth-server
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install node
        run: mise install node

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Regenerate golden JWKS
        run: npm run gen:jwks

      - name: Fail on golden JWKS drift
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- \
            docker/mock-auth-server/fixtures/jwks \
            internal/integration/testdata/jwks; then
            echo "::error::golden JWKS が最新ではありません。'npm run gen:jwks'（docker/mock-auth-server 配下）を実行して差分をコミットしてください。"
            exit 1
          fi
