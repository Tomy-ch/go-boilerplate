name: Mock-Auth Server Check

on:
  pull_request:
    paths:
      - '.github/workflows/mock-auth-server-check.yaml'
      - 'mock-auth-server/**'
      - 'internal/integration/testdata/jwks/**'
      - 'mise.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-auth-server-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mock-auth-server
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install node
        run: mise install node

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Regenerate golden JWKS
        run: npm run gen:jwks

      - name: Fail on golden JWKS drift
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- \
            mock-auth-server/fixtures/jwks \
            internal/integration/testdata/jwks; then
            echo "::error::golden JWKS is out of date. Run 'npm run gen:jwks' in mock-auth-server and commit the diff."
            exit 1
          fi
