name: Grype Scan

# Grype over the same dependency manifests trivy-fs.yaml reads, against Anchore's own database
# and matcher. See README.md § Overlapping surfaces for why that redundancy is bought.
#
# It scans the directory rather than an image. Scanning an image would re-examine what
# image-scan.yaml already sends through Trivy — the same artifact, one layer removed
# from the manifests a pull request actually edits.
#
# Report-only, like trivy-fs.yaml: `--fail-on` is deliberately unset, and the blocking
# verdict on a dependency state stays with the release gates.
#
# Accepted findings live in .grype.yaml, which grype reads from the working directory, and
# each entry there carries the evidence that makes it a false positive — the same shape as
# .trivyignore.yaml. A change to it belongs in this workflow's trigger below, since nothing
# else re-runs the scan it alters.

on:
  push:
    branches:
      - 'release/*'
      - develop
      - staging
      - production
    paths:
      - '.github/workflows/grype.yaml'
      - '.grype.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/pnpm-lock.yaml'
      - 'docs-viewer/pnpm-lock.yaml'
  pull_request:
    paths:
      - '.github/workflows/grype.yaml'
      - '.grype.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/pnpm-lock.yaml'
      - 'docs-viewer/pnpm-lock.yaml'
  schedule:
    # A newly published advisory turns unchanged code into a finding, so the weekly run
    # earns its place.
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    outputs:
      count: ${{ steps.summarize.outputs.count }}
      detail: ${{ steps.detail.outputs.markdown }}

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            grype.anchore.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:anchore/grype
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The version is pinned in mise.toml (SSOT) — never duplicated here.

      - name: Grype scan
        env:
          # Grype checks for a newer release of itself on every run, and that check goes to
          # toolbox-data.anchore.io — a different host from the vulnerability database at
          # grype.anchore.io. The version is pinned in mise.toml, so the answer could not be
          # acted on; switching the check off is cheaper than allow-listing a second host to
          # carry a reply nobody reads, and it keeps the run summary free of a denied
          # connection that would train a reader to ignore denied connections.
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          grype dir:. \
            --exclude './vendor/**' \
            --exclude './**/node_modules/**' \
            --exclude './docs/**' \
            -o json=grype.json \
            -o sarif=grype.sarif
        shell: bash

      - name: Create Grype summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          COUNT=$(jq '(.matches // []) | length' grype.json)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "title=## ✅ Grype: PASS (no vulnerabilities)" >> "$GITHUB_OUTPUT"
            echo "No vulnerabilities found." > grype-summary.md
            exit 0
          fi

          echo "title=## 🚨 Grype: FOUND (${COUNT})" >> "$GITHUB_OUTPUT"

          # The severity is defaulted before the lookup, not after: indexing an object with
          # null is a jq runtime error, which `//` cannot catch.
          jq -r '
            (.matches // [])
            | sort_by({Critical:0,High:1,Medium:2,Low:3,Negligible:4,Unknown:5}[.vulnerability.severity // "Unknown"] // 6)
            | .[]
            | "- [\(.vulnerability.severity)] \(.artifact.name) `\(.artifact.version)` → `\((.vulnerability.fix.versions // []) | join(", ") | if . == "" then "none" else . end)` (\(.vulnerability.id))"
          ' grype.json > grype-summary.md
        shell: bash

      - name: Build detection detail
        id: detail
        if: ${{ steps.summarize.outputs.count != '0' }}
        uses: ./.github/actions/notify-detail
        with:
          summary-file: grype-summary.md

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grype
          path: |
            grype.json
            grype.sarif
            grype-summary.md

      - name: Comment Grype result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- grype-result -->'
          status: "${{ steps.summarize.outputs.count == '0' && 'success' || 'findings' }}"
          title: "${{ steps.summarize.outputs.title || '## ⚠️ Grype Scan: CUT OFF (no result produced)' }}"
          body-file: grype-summary.md
          details-summary: '📄 Summary'

      - name: Upload Grype SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: grype.sarif
          category: grype

  # Report-only, so a finding leaves the job green and failure mode can never fire for
  # one. On a pull request the finding is already in a comment addressed to the author;
  # on the weekly run there is no author and no change, which is the case nothing else
  # surfaces.
  notify-detection:
    needs: grype
    if: ${{ github.event_name == 'schedule' && needs.grype.outputs.count != '' && needs.grype.outputs.count != '0' }}
    uses: ./.github/workflows/notify.yaml
    with:
      detected: Grype found ${{ needs.grype.outputs.count }} vulnerabilities
      details: ${{ needs.grype.outputs.detail }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # See README.md § Notification triggers (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: grype
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.grype.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: grype
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
