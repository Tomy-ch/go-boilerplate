name: Egress Check

on:
  pull_request:
    paths:
      - '.github/workflows/*.yaml'
      - '.github/egress.toml'
      - 'scripts/egress/**'
      - 'go.mod'
      - 'go.sum'
      - 'pkg/xerrors/**'
      - '.makefiles/github/egress.mk'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  egress-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the egress steps match the SSOT
        id: egress
        shell: bash
        run: |
          set +e

          make egress-check 2>&1 | tee /tmp/egress.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Egress: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Egress: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment egress result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- egress-result -->'
          status: ${{ steps.egress.outputs.status }}
          title: "${{ steps.egress.outputs.title || '## ⚠️ Egress Check: CUT OFF (no result produced)' }}"
          body-file: /tmp/egress.log
          details-summary: 'egress log'

      - name: Fail if drifted
        if: always() && steps.egress.outputs.status != 'success'
        run: exit 1
