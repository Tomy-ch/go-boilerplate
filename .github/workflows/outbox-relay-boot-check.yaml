name: Outbox Relay Boot Check

on:
  pull_request:
    paths:
      - '.github/workflows/outbox-relay-boot-check.yaml'
      - 'cmd/**.go'
      - 'internal/**.go'
      - 'pkg/**.go'
      - '*.go'
      - 'env/.env.ci'
      - 'env/.env'
      - 'go.mod'
      - 'go.sum'
      - '.makefiles/**/*.mk'
      - 'makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  outbox-relay-boot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # One channel's failure must not hide the other's (ADR-0091).
      fail-fast: false
      matrix:
        include:
          - channel: realtime
            endpoint_outbox: ''
          - channel: http
            # The http publisher only parses this URL at construction; nothing dials it during boot,
            # so an unroutable address is enough to assemble the graph. `Load` does not overwrite a
            # variable the process already has, so this wins over the empty value in env/.env.ci.
            endpoint_outbox: 'http://127.0.0.1:9/outbox'
    name: outbox-relay-boot-check (${{ matrix.channel }})
    env:
      ENV: ci
      ENDPOINT_OUTBOX: ${{ matrix.endpoint_outbox }}
    services:
      database:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            docker.io
            index.docker.io
            registry-1.docker.io
            auth.docker.io
            *.docker.io
            production.cloudflare.docker.com
            production.cloudfront.docker.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com
            dl-cdn.alpinelinux.org
            deb.debian.org
            security.debian.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Materialize ci env for embedding
        run: make materialize-env

      - name: Build relay
        run: go build -o ./bin/relay ./cmd/

      # The sentinels below are the fx event logger's (internal/di/fx_event_logger.go) — rename those log
      # messages and this check silently weakens into "the process stayed alive". Why this entrypoint's
      # check is shaped differently from the job / worker ones, and why every channel is covered rather
      # than one: ADR-0091 (ci-real-graph-boot-check).
      - name: Boot the ${{ matrix.channel }} relay and expect a clean lifecycle
        run: |
          set -uo pipefail

          ./bin/relay outbox-relay --channel='${{ matrix.channel }}' > relay.log 2>&1 &
          relay_pid=$!

          started=0
          for i in {1..45}; do
            if grep -q "Application started" relay.log 2>/dev/null; then
              started=1
              break
            fi
            if ! kill -0 "${relay_pid}" 2>/dev/null; then
              echo "FAIL: the relay exited before the lifecycle started"
              echo "----- relay output -----"
              cat relay.log || true
              echo "------------------------"
              exit 1
            fi
            echo "Waiting for the relay lifecycle... ($i)"
            sleep 2
          done

          if [ "${started}" -ne 1 ]; then
            echo "FAIL: 'Application started' never appeared (DI construction or an OnStart hook is stuck)"
            echo "----- relay output -----"
            cat relay.log || true
            echo "------------------------"
            kill "${relay_pid}" 2>/dev/null || true
            exit 1
          fi

          kill -TERM "${relay_pid}" 2>/dev/null || true
          wait "${relay_pid}"
          stop_code=$?

          echo "----- relay output -----"
          cat relay.log || true
          echo "------------------------"

          if ! grep -q "Application stopped" relay.log; then
            echo "FAIL: the relay did not shut down through the fx lifecycle"
            exit 1
          fi

          if [ "${stop_code}" -ne 0 ]; then
            echo "FAIL: the relay exited ${stop_code} on SIGTERM"
            exit 1
          fi

          echo "OK: the ${{ matrix.channel }} relay booted (DI / DB constructed) and shut down cleanly"
