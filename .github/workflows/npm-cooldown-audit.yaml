name: npm Cooldown Audit

# The npm `min-release-age` cooldown in each .npmrc is evaluated only while npm
# resolves dependencies (npm install / update). Every CI job and image build here
# uses `npm ci`, which just replays the lockfile and never resolves, so a lockfile
# produced with the cooldown switched off passes CI without a single symptom.
# This workflow is the detector for that blind spot.
#
# It NEVER fails the build. Bypassing the cooldown is a tech-lead / architect call
# — reacting to a CRITICAL advisory is a legitimate use — and a hard gate would
# block exactly the case the bypass exists for. The scope is policy drift:
# accidents, convention rot, and a change in npm's own behaviour. It is not a
# defence against someone with commit access, who can delete this file in the same
# change; enforcement of the "tech-lead only" rule lives in CODEOWNERS.
on:
  pull_request:
    paths:
      - '.github/workflows/npm-cooldown-audit.yaml'
      - 'scripts/npm-cooldown/**'
      - '**/package-lock.json'
      - '**/.npmrc'
  push:
    branches:
      - develop
      - staging
      - production
      - 'release/*'
    paths:
      - '.github/workflows/npm-cooldown-audit.yaml'
      - 'scripts/npm-cooldown/**'
      - '**/package-lock.json'
      - '**/.npmrc'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-cooldown-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      findings: ${{ steps.audit.outputs.findings }}
      detail: ${{ steps.detail.outputs.markdown }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # A pull request is audited against its base, so the finding names exactly the
      # entries this change introduces, and the PR comment survives as the record
      # even after those versions age out of the cooldown window. The scheduled run
      # audits every entry instead, as a second net for anything that slipped in
      # through a path this trigger set does not cover.
      - name: Resolve audit base
        id: base
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_REF}" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=200 origin "${BASE_REF}"
          echo "base=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"

      - name: Audit npm cooldown compliance
        id: audit
        shell: bash
        env:
          AUDIT_BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail

          args=(audit --github --summary-out=npm-cooldown-summary.md)
          if [ -n "${AUDIT_BASE}" ]; then
            args+=(--base="${AUDIT_BASE}")
          fi

          go run ./scripts/npm-cooldown "${args[@]}"

          # The tool writes `findings=<n>` into $GITHUB_OUTPUT itself; read it back
          # from that file, since a write there is not visible as a shell variable
          # within the same step.
          findings=$(grep -E '^findings=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)

          if [ "${findings:-0}" != "0" ]; then
            echo "title=## ⚠️ npm cooldown: 違反 ${findings} 件（ブロックはしません）" >> "$GITHUB_OUTPUT"
          else
            echo "title=## ✅ npm cooldown: PASS" >> "$GITHUB_OUTPUT"
          fi

      # The notification has to name the offending entries itself, so that the message
      # alone answers what was bypassed.
      - name: Build detection detail
        id: detail
        if: ${{ steps.audit.outputs.findings != '' && steps.audit.outputs.findings != '0' }}
        uses: ./.github/actions/notify-detail
        with:
          summary-file: npm-cooldown-summary.md

      # This audit is expected to find nothing for its whole life, which once argued for
      # commenting on every run — a detector that only ever speaks on a finding offers no
      # evidence it still works. The check run carries that evidence just as well, and it
      # carries it for the thirty-odd checks a pull request runs rather than for this one.
      - name: Comment npm cooldown result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- npm-cooldown-result -->'
          status: "${{ steps.audit.outputs.findings == '0' && 'success' || 'findings' }}"
          title: "${{ steps.audit.outputs.title || '## ⚠️ npm Cooldown Audit: CUT OFF (no result produced)' }}"
          body-file: npm-cooldown-summary.md
          details-summary: '📄 Summary'

      - name: Upload npm cooldown summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-cooldown
          path: npm-cooldown-summary.md

  # The two passive output paths above do not reach the role that owns the decision:
  # a PR comment only reaches whoever opens that PR, and a ::warning:: annotation dies
  # with the run's log retention. Bypassing the cooldown is a tech-lead / architect
  # call, so a finding has to be pushed to them wherever it was introduced — which is
  # why this fires on every trigger, not only the scheduled run.
  #
  # Fires on a finding only. The counterpart below fires when the scanner itself broke;
  # neither covers the other, because this workflow is non-blocking by design and a
  # finding therefore leaves the audit job green.
  notify-detection:
    needs: npm-cooldown-audit
    if: ${{ needs.npm-cooldown-audit.outputs.findings != '' && needs.npm-cooldown-audit.outputs.findings != '0' }}
    uses: ./.github/workflows/notify.yaml
    with:
      detected: npm cooldown bypass detected (${{ needs.npm-cooldown-audit.outputs.findings }} findings)
      details: ${{ needs.npm-cooldown-audit.outputs.detail }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # A scheduled failure has no author watching it, so it is pushed to a human.
  # PR / push failures are deliberately excluded: they are already visible.
  # cancelled counts too: a job killed by a timeout or a runner fault reports
  # cancelled rather than failure, and that is precisely the silent breakage this
  # notification exists to surface.
  notify-failure:
    needs: npm-cooldown-audit
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.npm-cooldown-audit.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: npm-cooldown-audit
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
