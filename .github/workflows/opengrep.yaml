name: SAST

# Opengrep (a Semgrep fork) over the repository's own source. It complements the
# dependency scanners: those ask "is a library we pull in known-vulnerable", this
# asks "does the code we wrote contain a vulnerable pattern".
#
# Scope is deliberately narrow, and each exclusion was chosen against a measured
# full-repository run rather than guessed:
#
#   - Only hand-written source is scanned: internal / pkg / cmd / database / openapi
#     on the Go side, and docs-viewer / scripts on the TypeScript
#     side. A whole-repo run returned 347 findings, 335 of which were plaintext-HTTP
#     links inside the generated SchemaSpy HTML under docs/db-schema/.
#   - Dockerfiles are NOT scanned here even though the rulesets cover them. Every
#     Dockerfile finding duplicated a Trivy DS-0002 result, and trivy-config.yaml
#     already owns that surface with its own gate and its own documented
#     exceptions. Two gates on one finding is one gate too many.
#   - Generated Go, the bundled OpenAPI, the orval-generated zod schemas and the
#     dependency / build directories of the TypeScript workspaces are excluded: they
#     are not editable, so a finding there is not actionable.
#
# The Go scope holds a zero-finding baseline, which is the point — a new finding is
# signal rather than something to scroll past. Accepted exceptions are pinned in
# source with `// nosemgrep: <rule-id>` next to the reason, so they stay visible at
# the code and still reach code scanning as suppressed SARIF results.
#
# The scan runs twice on purpose — once for JSON (the gate and the PR comment) and
# once for SARIF (code scanning). The two invocations must carry an identical
# --config / --exclude / target set, or the gate and the alert list describe
# different scans.

on:
  push:
    branches:
      - 'release/*'
      - develop
      - staging
      - production
    paths:
      - '.github/workflows/opengrep.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'openapi/**'
      - 'database/**'
      # The TypeScript workspaces. Without these the TS rulesets below would only
      # ever run on the weekly schedule, never on the change that introduced the
      # pattern.
      - 'docs-viewer/**'
      - 'scripts/**'
      - 'mise.toml'
  pull_request:
  schedule:
    # New rules can turn existing code into a finding, so a scheduled run earns its place
    # even when nothing changed.
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Why the trigger condition lives in a job: README.md § Required checks report on every pull request.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net

      # fetch-depth: 0 so the PR's base and head commits are present locally. The filter
      # below compares them with `git diff`; the default shallow checkout fetches only the
      # merge commit, so neither parent resolves.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # An empty token selects `git diff` over the compare API. The API refuses a
          # large diff outright (`this diff is taking too long to generate`), and a filter
          # that reaches no verdict runs every gated job instead of skipping it.
          token: ''
          filters: |
            relevant:
              - '.github/workflows/opengrep.yaml'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'openapi/**'
              - 'database/**'
              - 'docs-viewer/**'
              - 'scripts/**'
              - 'mise.toml'

  sast:
    needs: changes
    # Fail open — README.md § Required checks report on every pull request.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            semgrep.dev
            *.semgrep.dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:opengrep/opengrep
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The version is pinned in mise.toml (SSOT) — never duplicated here.

      - name: Opengrep scan (JSON)
        run: |
          opengrep scan \
            --config p/golang \
            --config p/javascript \
            --config p/typescript \
            --config p/owasp-top-ten \
            --taint-intrafile \
            --exclude '*.gen.go' \
            --exclude '*.sql.go' \
            --exclude '*_mock.go' \
            --exclude 'openapi.gen.yaml' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'coverage' \
            --exclude 'src/generated' \
            --json \
            --output opengrep.json \
            internal pkg cmd database openapi \
            docs-viewer scripts
        shell: bash

      - name: Create SAST summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          # Findings live under .results[]; severity is nested in .extra. Suppressed
          # findings are already absent from the JSON (they survive only in SARIF).
          TOTAL=$(jq '(.results // []) | length' opengrep.json)
          GATING=$(jq '[(.results // [])[] | select(.extra.severity == "ERROR")] | length' opengrep.json)

          echo "gating=${GATING}" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ SAST: PASS (no findings)" >> "$GITHUB_OUTPUT"
            echo "No findings." > opengrep-summary.md
          else
            # A non-gating finding still goes on the pull request: it does not block, but it is
            # a finding in the code under review, and no other surface puts it in front of the
            # author. Only the empty result is quiet.
            echo "status=findings" >> "$GITHUB_OUTPUT"
            if [ "$GATING" -eq 0 ]; then
              echo "title=## ⚠️ SAST: ${TOTAL} finding(s), none gating" >> "$GITHUB_OUTPUT"
            else
              echo "title=## 🚨 SAST: ${GATING} ERROR of ${TOTAL} finding(s)" >> "$GITHUB_OUTPUT"
            fi

            jq -r '
              (.results // [])
              | sort_by({ERROR: 0, WARNING: 1, MEDIUM: 2, INFO: 3}[.extra.severity] // 4)
              | .[]
              | "- [\(.extra.severity)] `\(.path):\(.start.line)` \(.check_id)\n  - \(.extra.message | gsub("\n"; " "))"
            ' opengrep.json > opengrep-summary.md
          fi

          cat opengrep-summary.md >> "${GITHUB_STEP_SUMMARY}"
        shell: bash

      - name: Upload SAST report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: opengrep
          path: |
            opengrep.json
            opengrep-summary.md

      - name: Comment SAST result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- sast-result -->'
          status: ${{ steps.summarize.outputs.status }}
          title: "${{ steps.summarize.outputs.title || '## ⚠️ SAST: CUT OFF (no result produced)' }}"
          body-file: opengrep-summary.md
          details-summary: '📄 Summary'

      # opengrep still emits findings suppressed by an in-source `// nosemgrep`,
      # tagging them with suppressions[].kind = inSource. GitHub code scanning does
      # NOT honour that tag — the alert lands as state=open with no dismissal — so an
      # accepted exception would sit in the alert list forever and defeat the
      # zero-baseline this workflow relies on. They are therefore dropped before the
      # upload, which also matches the JSON the gate above reads (suppressions are
      # already applied there). The exception stays visible where it belongs: next to
      # the code, with the rule id and the reason.
      - name: Opengrep scan (SARIF)
        if: always()
        run: |
          set -euo pipefail

          opengrep scan \
            --config p/golang \
            --config p/javascript \
            --config p/typescript \
            --config p/owasp-top-ten \
            --taint-intrafile \
            --exclude '*.gen.go' \
            --exclude '*.sql.go' \
            --exclude '*_mock.go' \
            --exclude 'openapi.gen.yaml' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'coverage' \
            --exclude 'src/generated' \
            --sarif \
            --output opengrep-raw.sarif \
            internal pkg cmd database openapi \
            docs-viewer scripts

          jq '.runs[]?.results |= map(select((.suppressions // []) | length == 0))' \
            opengrep-raw.sarif > opengrep.sarif
        shell: bash

      - name: Upload SAST SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: opengrep.sarif
          category: opengrep

      # ERROR is Semgrep's high-severity band. WARNING findings are reported but do
      # not block: they are advisory patterns whose applicability depends on
      # context, and blocking on them would push contributors toward blanket
      # suppression.
      - name: Fail if a gating finding was found
        if: always() && steps.summarize.outputs.gating != '0'
        run: exit 1

  # See README.md § Notification triggers (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: sast
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.sast.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: sast
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
