name: Generated Database Artifacts Check (required-check guard)

# Skip-guard companion for gen-db-artifacts-check.yaml: reports the `generate-db-check` required
# check as an immediate success on the complementary set (`paths-ignore` mirrors the filter on
# gen-db-artifacts-check.yaml).
# Both files' filters must be edited together — see README.md § Required-check guard companions.

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/gen-db-artifacts-check.yaml'
      - '.github/actions/setup-postgres/**'
      - 'database/**/*.sql'
      - 'docker/database/**/*.sql'
      - '.makefiles/**/*.mk'
      - 'sqlc.yaml'
      - 'mise.toml'
      - 'internal/cli/dumpschema/**'
      - 'internal/cli/mergedml/**'
      - 'cmd/dump_schema.go'
      - 'cmd/merge_dml.go'
      - 'internal/infrastructure/rdb/sqlc/gen/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-db-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: No database generation input or output changed — satisfy the required context
        run: echo "No database generation path changed; the required 'generate-db-check' context is satisfied by this guard."
