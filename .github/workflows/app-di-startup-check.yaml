name: Application Boot Verification

on:
  pull_request:
    paths:
      - '.github/workflows/app-di-startup-check.yaml'
      - 'cmd/server/**.go'
      - 'internal/**.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-setup:
    uses: ./.github/workflows/golang-setup.yaml
    permissions:
      contents: read

  app-boot-check:
    needs: golangci-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ENV: ci
      PORT: 8080
    services:
      database:
        image: postgres:17.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start server
        run: |
          set -euo pipefail
          # `cmd/server/main.go` がエントリポイントの前提
          # 標準出力/標準エラーをログに残して、失敗時に原因を追えるようにする
          if [ -d ./cmd/server ] && [ -f ./cmd/server/main.go ]; then
            MAIN_PKG=./cmd/server
          elif [ -d ./cmd ] && [ -f ./cmd/main.go ]; then
            MAIN_PKG=./cmd
          else
            echo "Cannot find main package under ./cmd"
            echo "--- cmd tree ---"
            find ./cmd -maxdepth 3 -type f -name 'main.go' -print || true
            exit 1
          fi

          go run "$MAIN_PKG" serve > server.log 2>&1 &
          echo $! > server.pid

          # すぐ落ちていないか軽く確認
          sleep 1
          if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
            echo "Server process exited immediately"
            echo "--- server.log ---"
            cat server.log || true
            exit 1
          fi


      - name: Wait for /ready endpoint
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if curl -fsS "http://localhost:${PORT}/ready" > /dev/null; then
              echo "Readiness check OK"
              exit 0
            fi

            # 途中でプロセスが死んでいたら即ログを出して落とす
            if [ -f server.pid ] && ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "Server process is not running (attempt: $i)"
              echo "--- server.log ---"
              tail -n 200 server.log || true
              exit 1
            fi

            echo "Waiting for server... ($i)"
            sleep 2
          done

          echo "Readiness check failed"
          echo "--- server.log (tail) ---"
          tail -n 200 server.log || true
          exit 1

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
            wait "$(cat server.pid)" || true
          fi
