name: Job Boot Verification

on:
  pull_request:
    paths:
      - '.github/workflows/job-boot-check.yaml'
      - 'cmd/**.go'
      - 'internal/cli/job/**.go'
      - 'internal/di/**.go'
      - 'internal/controller/job/**.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job-boot-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ENV: ci
    services:
      database:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # 特定のサンプルジョブ名に依存しないため、存在しないジョブ名で起動する。
      # ここで「unknown job」エラーに到達できる＝ cobra → cmd/main.go → DI グラフ構築 → DB 接続 →
      # ジョブランナーの dispatch まで、実バイナリ経路が起動できたことの証左になる。
      # DB 接続や DI 構築の失敗で落ちた場合は出力に「unknown job」が含まれないので区別できる。
      - name: Boot job entrypoint and expect "unknown job"
        run: |
          set -uo pipefail
          set +e
          output="$(go run ./cmd/ job __ci_boot_check_no_such_job__ 2>&1)"
          code=$?
          set -e

          echo "----- job output -----"
          echo "${output}"
          echo "----------------------"

          if [ "${code}" -eq 0 ]; then
            echo "FAIL: 未知ジョブなのに exit 0 が返った（dispatch が機能していない可能性）"
            exit 1
          fi

          if ! echo "${output}" | grep -q "unknown job"; then
            echo "FAIL: non-zero 終了だが 'unknown job' 経路ではない（起動/DI/DB 接続の失敗の可能性）"
            exit 1
          fi

          echo "OK: ジョブのエントリポイントが起動（DI/DB 構築）し、未知ジョブを正しく拒否した"
