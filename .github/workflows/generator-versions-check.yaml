name: Generator Versions Check

on:
  push:
    branches:
      - production
      - staging
      - develop
  pull_request:
    paths:
      - '.github/workflows/generator-versions-check.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-setup:
    uses: ./.github/workflows/golang-setup.yaml
    permissions:
      contents: read

  generate-tools-check:
    needs: golangci-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
    steps:
      - name: Fetch & Checkout repository
        uses: actions/checkout@v5

      - name: Capture committed generator versions
        id: prev_versions
        run: |
          # コミット済みの generator-versions.txt を退避
          if git show HEAD:docs/meta/generator-versions.txt > /tmp/prev_generator_versions.txt 2>/dev/null; then
            echo "has_prev=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run generator versions update (make gen-tools-meta)
        run: make gen-tools-meta

      - name: Check git diff
        id: diff_check
        continue-on-error: true
        run: |
          if ! git diff --quiet; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            echo "Generated files are not up-to-date. Please run 'make gen' and commit changes."
            echo "::group::Git status"
            git status
            echo "::endgroup::"
            echo "::group::Git diff"
            git diff
            echo "::endgroup::"
            exit 1
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "No diff detected."
          fi

      - name: Show changed files
        if: steps.diff_check.outputs.has_diff == 'true'
        run: |
          echo "Changed files:"
          git diff --name-only

      - name: Comment generator versions on PR
        if: github.event_name == 'pull_request' && steps.diff_check.outputs.has_diff == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // 古い方（HEAD の内容）
            let prev = '';
            if ('${{ steps.prev_versions.outputs.has_prev }}' === 'true') {
              try {
                prev = fs.readFileSync('/tmp/prev_generator_versions.txt', 'utf8');
              } catch (e) {
                prev = '(コミット済みの generator-versions.txt の読み込みに失敗しました)';
              }
            } else {
              prev = '(コミット済みの generator-versions.txt は存在しませんでした)';
            }

            // 新しい方（CI で make gen / make gen-tools-meta した後の内容）
            let current = '';
            try {
              current = fs.readFileSync('docs/meta/generator-versions.txt', 'utf8');
            } catch (e) {
              current = '(CI 実行時の generator-versions.txt の読み込みに失敗しました)';
            }

            const body = [
              '## 🔍 Generated Artifacts Differences Detected',
              '',
              '@${{ github.event.pull_request.user.login }}',
              '',
              'This pull request introduces differences in auto-generated artifacts.',
              'Please update the generated files in your local environment and commit the changes.',
              '',
              'Below is the generator version comparison:',
              '',
              '---',
              '',
              '### Before (HEAD version of `docs/meta/generator-versions.txt`)',
              prev,
              '',
              '---',
              '',
              '### After (CI-regenerated `docs/meta/generator-versions.txt`)',
              current,
              '',
              '**Action required:**',
              '',
              '- Run `make tools-rebuild` locally to rebuild tool containers.',
              '- Run `make gen` or `make gen-tools-meta` to regenerate artifacts.',
              '- Commit the updated files.',
              '',
              'The CI will pass once the generated artifacts are synchronized.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
      - name: Fail job if diff exists
        if: steps.diff_check.outputs.has_diff == 'true'
        run: exit 1

      - name: Done
        if: steps.diff_check.outputs.has_diff == 'false'
        run: echo "✅ Generated artifacts are up-to-date."
