name: Scripts Test

# Unit tests for the Go tools under scripts/. They are excluded from the coverage gate
# (GO_TEST_EXCLUDE), so `make test` never runs them and each tool's own workflow only
# `go run`s the tool — without this job the tests would run nowhere.

on:
  pull_request:
    paths:
      - '.github/workflows/scripts-test.yaml'
      - 'scripts/**/*.go'
      - '.makefiles/go/test.mk'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # actions-shellcheck's tests shell out to the real shellcheck; without it they would
      # skip themselves and this job would pass while checking less than it claims. The
      # runner ships a shellcheck of its own, but mise holds the pinned version.
      - name: Install shellcheck
        run: mise install shellcheck

      - name: Run scripts tests
        id: scripts-test
        shell: bash
        run: |
          set +e

          make test-scripts 2>&1 | tee /tmp/scripts-test.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Scripts test: PASS (go test ./scripts/...)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Scripts test: FAIL (go test ./scripts/...)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment scripts test result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- scripts-test-result -->'
          title: ${{ steps.scripts-test.outputs.title }}
          body-file: /tmp/scripts-test.log
          details-summary: 'Scripts test log'

      - name: Fail if scripts tests failed
        if: always() && steps.scripts-test.outputs.status != 'success'
        run: exit 1
