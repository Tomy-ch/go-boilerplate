name: Go Test

on:
  pull_request:
    paths:
      - '.github/workflows/go-test.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '**/*.sql'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      ENV: ci
      DB: test
      DB_USER: postgres
      DB_PASSWORD: postgres-password
    services:
      database:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
          POSTGRES_DB: test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup DB
        uses: ./.github/actions/setup-postgres
        with:
          db: ${{ env.DB }}
          user: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          init_sql: docker/database/sql/004-init-extensions-test-db.sql

      - name: Materialize ci env for embedding
        run: make materialize-env

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # actions-shellcheck's tests shell out to the real shellcheck. The runner ships one of its
      # own, but mise.toml holds the pinned version the tool is checked against.
      - name: Install shellcheck
        run: mise install shellcheck

      # scripts/ is excluded from the coverage targets, so its tests need their own step. It runs
      # before the DB-backed steps because these tools need neither a database nor the coverage gate.
      # REQUIRE_SHELLCHECK turns the tests that need shellcheck from self-skipping into failing: a
      # skip is invisible in the default output, so a failed install would leave this step green
      # while checking less than it reports.
      - name: Run scripts tool tests
        env:
          REQUIRE_SHELLCHECK: '1'
        run: make test-scripts

      # Measured against its own threshold and its own profile, and reported as a warning rather
      # than a failure. These tools are build/CI tooling, not part of what ships: a gap here says
      # nothing about the product, so letting it block a merge would stop work for a reason
      # unrelated to the change under review. The shipped code keeps its hard gate below.
      - name: Report scripts tool coverage
        env:
          REQUIRE_SHELLCHECK: '1'
        run: make cover-scripts

      - name: Initialize Database Table
        run: go run ./cmd/ migrate-up --database ${{ env.DB }}

      - name: Seed Database
        run: go run ./cmd/ db-seed --database ${{ env.DB }}

      - name: Run Tests with Coverage
        run: make test-cover-ci

      - name: Report Test Coverage
        uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1

      - name: Coverage gate
        run: make cover-gate
