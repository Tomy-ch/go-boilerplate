name: Go Module Check

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: "1.26.0"

jobs:
  mod-check:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch & Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache: true
          cache-dependency-path: |
            **/go.sum

      - name: Download Dependencies
        run: go mod download

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify modules build graph
        run: go list -mod=readonly ./...
