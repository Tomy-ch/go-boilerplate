name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    # Pre-gate on the github context only, so unrelated comments never start a runner. It
    # grants no authority — that is the action's own write-permission check.
    # See README.md Notes ("`claude.yaml` authorization").
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # contents stays read-only: it is the blast radius of a prompt injection carried in a
      # fork PR. See README.md Notes ("`claude.yaml` authorization").
      contents: read
      pull-requests: write
      issues: write
      actions: read
      # `claude-code-action` reaches GitHub through a token it mints itself, by exchanging this
      # workflow's OIDC identity with the Claude GitHub App. Without the permission the exchange
      # fails and the action stops before the model runs. It grants no repository access of its
      # own — only the right to request a JWT that names this workflow.
      id-token: write
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            api.anthropic.com
            *.anthropic.com
            statsig.anthropic.com
            sentry.io
            *.ingest.sentry.io

      # A fork inherits this workflow but not the secret, so skip quietly rather
      # than failing red. The secrets context is unavailable in `if:`, hence the
      # detour through a run step output.
      - name: Check configuration
        id: config
        env:
          CLAUDE_CODE_TOKEN: ${{ secrets.CLAUDE_CODE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_CODE_TOKEN}" ]; then
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::notice::CLAUDE_CODE_TOKEN is not configured; skipping.'
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        if: steps.config.outputs.configured == 'true'
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1.0.206
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_TOKEN }}
          claude_args: "--max-turns 15"
