name: Secret Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks
        run: mise install gitleaks

      - name: Run gitleaks
        id: gitleaks
        shell: bash
        run: |
          set +e

          make secret-scan-ci 2>&1 | tee /tmp/gitleaks.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Secret scan: PASS (gitleaks)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Secret scan: FAIL (gitleaks)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment secret scan result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- secret-scan-result -->'
          title: ${{ steps.gitleaks.outputs.title }}
          body-file: /tmp/gitleaks.log
          details-summary: 'gitleaks log'

      - name: Fail if gitleaks failed
        if: always() && steps.gitleaks.outputs.status != 'success'
        run: exit 1
