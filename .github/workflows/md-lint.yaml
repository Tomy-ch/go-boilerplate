name: Markdown Lint

# `make md-lint` is wired into the lefthook pre-commit hook only, so `--no-verify` and edits
# made through the GitHub web UI reach a merge unchecked. Every stage runs here.
#
# Neither stage needs the node_tool_runner container: markdownlint-cli2 is a mise npm-backend
# tool like any other, and the script tree `scripts/pnpm-lock.yaml` pins costs a few seconds
# to install here.
#
# A broken mermaid diagram reaches the documentation portal, and markdownlint never looks inside
# a fence — the mermaid stage is the only thing standing in front of it.
#
# No `paths` filter, deliberately. The Markdown checks read every `.md` in the repo, and
# `skill-lint.ts` additionally resolves the paths and make targets its prose quotes against the
# whole tree, so renaming `docs/rules.md` or moving a file under `internal/` breaks it without
# touching anything a filter could name.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  md-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            docker.io
            index.docker.io
            registry-1.docker.io
            auth.docker.io
            *.docker.io
            production.cloudflare.docker.com
            production.cloudfront.docker.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com
            dl-cdn.alpinelinux.org
            deb.debian.org
            security.debian.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: node npm:pnpm npm:markdownlint-cli2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the script tree for scripts/
        run: pnpm install --dir scripts --frozen-lockfile

      - name: Run Markdown lint
        id: md-lint
        shell: bash
        run: |
          set +e

          make md-lint-ci 2>&1 | tee /tmp/md-lint.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Markdown lint: PASS (markdownlint + mermaid + skill-lint)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Markdown lint: FAIL (markdownlint + mermaid + skill-lint)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # The checkout must be as clean as it was before the lint, or a later reader cannot tell a
      # real drift from this job's own leftovers. `scripts/node_modules` is ignored, so anything
      # reported here is something this job put in a tracked path.
      - name: Verify the working tree is clean
        run: git status --porcelain --untracked-files=all | tee /tmp/md-lint-dirty.log && test ! -s /tmp/md-lint-dirty.log

      - name: Comment Markdown lint result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- md-lint-result -->'
          status: ${{ steps.md-lint.outputs.status }}
          title: "${{ steps.md-lint.outputs.title || '## ⚠️ Markdown Lint: CUT OFF (no result produced)' }}"
          body-file: /tmp/md-lint.log
          details-summary: 'md-lint log'

      - name: Fail if Markdown lint failed
        if: always() && steps.md-lint.outputs.status != 'success'
        run: exit 1
