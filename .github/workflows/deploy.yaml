name: Deploy Workflow

on:
  pull_request:
    branches:
      - production
      - staging
      - develop
  push:
    paths:
      - '.github/workflows/deploy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Execute the build
        run: echo "Please write the implementation here."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Execute the deployment
        run: echo "Please write the implementation here."
