name: ESLint Scan

# ESLint with eslint-plugin-security over the three TypeScript workspaces. What it adds
# over CodeQL's javascript-typescript leg and Opengrep's p/typescript rules is
# ecosystem-specific knowledge those two do not encode: a RegExp built from a
# non-literal, a comparison that leaks timing, `child_process` reached from application
# code, a Buffer constructed without assertions.
#
# One workflow with a leg per workspace rather than three workflows, mirroring
# code-ql.yaml. The three trees resolve independently — docs-viewer and scripts each own
# a pnpm-workspace.yaml and its own lockfile — so a shared install is not
# available, but a shared verdict is not wanted either: `fail-fast: false` keeps one
# leg's failure from cancelling the others and leaving their categories stale.
#
# **Report-only, and every rule in the preset is a warning.** The baseline was left
# untriaged at adoption so that suppressing a rule would be a decision taken against
# measured numbers rather than a guess. It has since been measured, and all 140 findings
# scripts carried came from four rules that key on the SHAPE of an argument rather than
# on where its value came from: whether a path handed to `fs` is a literal, whether an
# index is computed, whether a `RegExp` is built from a variable, and how deeply a
# regex nests its quantifiers. scripts/ is repository tooling that reads the repository,
# so it trips all four by construction. They are off in scripts/eslint.config.js, where
# the reasoning and the counts sit; the rest of the preset still runs, and docs-viewer
# runs the preset whole because none of the four fires there.
#
# The one question of the four that has a real answer here — does a regex actually
# backtrack — is Sonar's S8786, which analyzes the pattern instead of counting its
# nesting. The ten it found are fixed rather than suppressed.
#
# Still report-only after that. Gating a pull request on a scanner whose preset can grow
# overnight would fail changes that touched none of it — the weekly run below exists for
# exactly that growth.
#
# There is no pull-request comment. The findings go to code scanning, where an alert
# introduced by the change under review surfaces on the diff — the same arrangement
# code-ql.yaml uses.
#
# ESLint ships no SARIF formatter and @microsoft/eslint-formatter-sarif is not usable
# here: it declares `eslint: ^8.9.0` and `jschardet: latest`, so adopting it would nest
# an end-of-life ESLint 8 in all three lockfiles and leave one dependency unbounded. The
# JSON report is mapped below instead, as zap-api-scan.yaml already does for ZAP.
#
# **This job executes code the pull request controls, which the other scanners do not.** A
# flat config is a module ESLint imports, so `eslint.config.js` — a file any pull request
# may edit — runs inside this job; Grype and DevSkim are compiled binaries that only read.
# The permissions below are the whole containment: no `pull-requests: write` (nothing here
# comments), no `id-token`, no secret reaching any step, and bullfrog refusing egress with sudo removed.
# Adding a permission to this job means deciding first whether a pull-request author
# should have it.

on:
  push:
    branches:
      - 'release/*'
      - develop
      - staging
      - production
    paths:
      - '.github/workflows/eslint.yaml'
      - 'docs-viewer/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/eslint.yaml'
      - 'docs-viewer/**'
      - 'scripts/**'
  schedule:
    # A preset update turns unchanged code into a finding, which is what the weekly run
    # is for.
    - cron: '45 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      # One workspace failing must not cancel the others: their SARIF uploads are
      # independent, and a cancelled leg leaves its category's alerts stale.
      fail-fast: false
      matrix:
        workspace:
          - docs-viewer
          - scripts

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: node npm:pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the workspace tree
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: pnpm install --dir "${WORKSPACE}" --frozen-lockfile
        shell: bash

      # Invoked through the package script rather than the binary, so the scanned target
      # is declared once in package.json and the local run and this job cannot drift.
      # Going through `run` also keeps pnpm-workspace.yaml's verifyDepsBeforeRun active,
      # which reaching into node_modules/.bin would bypass.
      #
      # That script writes into `node_modules/`, which is not squeamishness about a
      # stray file: several of this repository's own checks walk the source tree, and a
      # report left in the workspace root gets read as source. It embeds excerpts of
      # every file it flagged, so the removal markers quoted inside it register as real
      # ones and `marker-baseline` and the sample-removal manifests all fail. Everything
      # already skips `node_modules`, which makes it the one place the report is inert.
      #
      # Exit code 1 means ESLint found problems and 2 means ESLint itself could not run —
      # a broken config, an unparsable file. Only the second is this job's failure.
      - name: ESLint scan
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          set -uo pipefail
          pnpm --dir "${WORKSPACE}" run lint:security:json
          code=$?
          if [ "${code}" -ge 2 ]; then
            echo "::error::ESLint could not complete in ${WORKSPACE} (exit ${code})"
            exit "${code}"
          fi
        shell: bash

      # ESLint reports absolute paths; code scanning anchors an alert only to a
      # repository-relative one.
      - name: Convert the ESLint report to SARIF
        if: always()
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          set -euo pipefail

          report="${WORKSPACE}/node_modules/.eslint-report.json"
          if [ ! -f "${report}" ]; then
            echo "::error::ESLint produced no JSON report; the scan did not complete"
            exit 1
          fi

          jq --arg root "${GITHUB_WORKSPACE}/" --arg ws "${WORKSPACE}" '
            def level: {"2": "error", "1": "warning"}[(.severity | tostring)] // "note";

            [ .[] as $f | ($f.messages // [])[] | . + { uri: ($f.filePath | ltrimstr($root)) } ] as $msgs
            | {
                "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                version: "2.1.0",
                runs: [
                  {
                    tool: {
                      driver: {
                        name: ("ESLint (" + $ws + ")"),
                        informationUri: "https://eslint.org/",
                        rules: (
                          $msgs
                          | map(.ruleId // "eslint/fatal")
                          | unique
                          | map({ id: ., properties: { tags: ["security"] } })
                        )
                      }
                    },
                    results: (
                      $msgs
                      | map({
                          ruleId: (.ruleId // "eslint/fatal"),
                          level: level,
                          message: { text: .message },
                          locations: [
                            {
                              physicalLocation: {
                                artifactLocation: { uri: .uri },
                                region: {
                                  startLine: (.line // 1),
                                  startColumn: (.column // 1)
                                }
                              }
                            }
                          ]
                        })
                    )
                  }
                ]
              }
          ' "${report}" > eslint.sarif

          echo "${WORKSPACE}: $(jq '.runs[0].results | length' eslint.sarif) finding(s)" >> "${GITHUB_STEP_SUMMARY}"
        shell: bash

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eslint-${{ matrix.workspace }}
          path: |
            ${{ matrix.workspace }}/node_modules/.eslint-report.json
            eslint.sarif

      # Per-workspace category: code scanning keys a SARIF upload by it, so a shared
      # category would make each leg overwrite the previous one's alerts.
      - name: Upload ESLint SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: eslint.sarif
          category: eslint-${{ matrix.workspace }}

  # See README.md § Notification triggers (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: eslint
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.eslint.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: eslint
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
