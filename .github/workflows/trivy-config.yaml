name: Config Scan

# Trivy misconfiguration scanning for Dockerfiles, kept out of trivy-fs.yaml on
# purpose. The two share a tool and nothing else: this one has a different target
# (Dockerfiles, not dependency manifests), a different path filter, and a different
# gate (HIGH+ blocks here, while dependency findings are reported and gated at
# release time). Folding it into the dependency scan would also break that
# workflow's summary, which counts .Results[].Vulnerabilities and would have to
# start distinguishing .Misconfigurations from it.
#
# docker-compose files are NOT covered: Trivy ships no compose checks, so the
# scanner detects only the five Dockerfiles under docker/. hadolint
# (docker-lint.yaml) lints the same files for style and correctness; this workflow
# is the security-policy layer over them.

on:
  push:
    branches:
      - 'release/*'
      - develop
      - staging
      - production
    paths:
      - '.github/workflows/trivy-config.yaml'
      - '.makefiles/security/trivy.mk'
      - '.trivyignore.yaml'
      - 'docker/**/Dockerfile'
      - 'mise.toml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Why the trigger condition lives in a job: README.md § Required checks report on every pull request.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net

      # fetch-depth: 0 so the PR's base and head commits are present locally. The filter
      # below compares them with `git diff`; the default shallow checkout fetches only the
      # merge commit, so neither parent resolves.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # An empty token selects `git diff` over the compare API. The API refuses a
          # large diff outright (`this diff is taking too long to generate`), and a filter
          # that reaches no verdict runs every gated job instead of skipping it.
          token: ''
          filters: |
            relevant:
              - '.github/workflows/trivy-config.yaml'
              - '.makefiles/security/trivy.mk'
              - '.trivyignore.yaml'
              - 'docker/**/Dockerfile'
              - 'mise.toml'

  trivy-config:
    needs: changes
    # Fail open — README.md § Required checks report on every pull request.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:aquasecurity/trivy
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy config scan (JSON)
        run: make -s trivy-config-ci TRIVY_FORMAT=json > trivy-config.json
        shell: bash

      - name: Create Trivy config summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          # trivy config emits one Result per detected config file; files with no
          # finding carry no Misconfigurations key at all, hence the // [] default.
          # Results itself is absent — not empty — when nothing was detected at all,
          # which a PR that deletes every Dockerfile would produce, so it needs the
          # same defaulting before being iterated.
          COUNT=$(jq '
            [(.Results // [])[] | .Misconfigurations // []]
            | flatten
            | length
          ' trivy-config.json)

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "title=## ✅ Config Scan: PASS (no HIGH+ misconfiguration)" >> "$GITHUB_OUTPUT"
            echo "No HIGH or CRITICAL misconfiguration found." > trivy-config-summary.md
            exit 0
          fi

          echo "title=## 🚨 Config Scan: FOUND (${COUNT})" >> "$GITHUB_OUTPUT"

          jq -r '
            (.Results // [])[]
            | .Target as $target
            | (.Misconfigurations // [])[]
            | "- [\(.Severity)] `\($target)` \(.ID) — \(.Title)\n  - \(.Resolution)"
          ' trivy-config.json > trivy-config-summary.md
        shell: bash

      - name: Upload Trivy config report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-config
          path: |
            trivy-config.json
            trivy-config-summary.md

      - name: Comment Trivy config result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-config-result -->'
          status: "${{ steps.summarize.outputs.count == '0' && 'success' || 'findings' }}"
          title: "${{ steps.summarize.outputs.title || '## ⚠️ Config Scan: CUT OFF (no result produced)' }}"
          body-file: trivy-config-summary.md
          details-summary: '📄 Summary'

      - name: Trivy config scan (SARIF)
        if: always()
        run: make -s trivy-config-ci TRIVY_FORMAT=sarif > trivy-config.sarif
        shell: bash

      # Its own category so misconfiguration alerts stay separable from the
      # dependency findings uploaded under trivy-fs.
      - name: Upload Trivy config SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-config.sarif
          category: trivy-misconfig

      # Unlike the dependency scan, a misconfiguration is introduced by the change
      # under review rather than inherited from an upstream advisory, so it blocks
      # here instead of being deferred to a release gate. Accepted exceptions live
      # in .trivyignore.yaml, pinned per path.
      - name: Fail if a HIGH+ misconfiguration was found
        if: always() && steps.summarize.outputs.count != '0'
        run: exit 1
