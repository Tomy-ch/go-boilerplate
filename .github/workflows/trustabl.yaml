name: Agent Config Scan

# Scans the AI-agent configuration — `.claude/agents/*.md` and
# `.claude/skills/*/SKILL.md` frontmatter and body, plus MCP server declarations.
# Report-only; the reason it does not gate is in README.md's Agent Config Scan
# section.
on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trustabl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net

      # persist-credentials: false — nothing after checkout talks to git, and the
      # step below hands the checkout to a third-party binary.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinning the action pins only the action. It downloads the engine binary
      # from the trustabl/trustabl releases at run time (`version` defaults to
      # `latest`), and the engine then clones the rule pack (`rules-ref` defaults
      # to the rules repository's default branch), so both float unless named
      # here. `rules-ref` resolves against branches and tags but never a commit,
      # so a re-pointed tag passes unseen; the engine logs the SHA it cloned.
      #
      # upload-sarif and comment-on-pr each cost a write scope — `security-events`
      # and `pull-requests` — handed to that binary, so both stay off and the
      # findings ride the step summary and the artifact instead.
      # `severity-threshold` / `risk-score-threshold` do not reach the failure the
      # action raises on the engine's own exit code (any medium+ finding), so
      # report-only takes `continue-on-error` too — README.md § Agent Config Scan.
      - name: Scan agent configuration
        continue-on-error: true
        uses: trustabl/trustabl-action@748a5fdd0c329a20c1f1b42efec47a4de6bede67 # v0.4.2
        with:
          version: v0.1.6
          rules-ref: v0.2.0
          upload-sarif: 'false'
          comment-on-pr: 'false'
          annotations: 'false'
          upload-artifact: 'true'
          artifact-name: trustabl
          severity-threshold: none
          risk-score-threshold: '0'
