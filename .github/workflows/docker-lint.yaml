name: Dockerfile Lint

on:
  pull_request:
    paths:
      - 'docker/**/Dockerfile'
      - '.hadolint.yaml'
      - 'mise.toml'
      - '.makefiles/docker/lint.mk'
      - '.github/workflows/docker-lint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
            ::1
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: hadolint
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run hadolint
        id: hadolint
        shell: bash
        run: |
          set +e

          make docker-lint-ci 2>&1 | tee /tmp/hadolint.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Dockerfile lint: PASS (hadolint)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Dockerfile lint: FAIL (hadolint)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment Dockerfile lint result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- dockerfile-lint-result -->'
          status: ${{ steps.hadolint.outputs.status }}
          title: "${{ steps.hadolint.outputs.title || '## ⚠️ Dockerfile Lint: CUT OFF (no result produced)' }}"
          body-file: /tmp/hadolint.log
          details-summary: 'hadolint log'

      - name: Fail if hadolint failed
        if: always() && steps.hadolint.outputs.status != 'success'
        run: exit 1
