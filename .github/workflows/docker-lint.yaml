name: Dockerfile Lint

on:
  pull_request:
    paths:
      - 'docker/**/Dockerfile'
      - '.hadolint.yaml'
      - 'mise.toml'
      - '.makefiles/docker/lint.mk'
      - '.github/workflows/docker-lint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            aquaproj.github.io:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install hadolint
        run: mise install hadolint

      - name: Run hadolint
        id: hadolint
        shell: bash
        run: |
          set +e

          make docker-lint-ci 2>&1 | tee /tmp/hadolint.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Dockerfile lint: PASS (hadolint)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Dockerfile lint: FAIL (hadolint)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment Dockerfile lint result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- dockerfile-lint-result -->'
          status: ${{ steps.hadolint.outputs.status }}
          title: "${{ steps.hadolint.outputs.title || '## ⚠️ Dockerfile Lint: CUT OFF (no result produced)' }}"
          body-file: /tmp/hadolint.log
          details-summary: 'hadolint log'

      - name: Fail if hadolint failed
        if: always() && steps.hadolint.outputs.status != 'success'
        run: exit 1
