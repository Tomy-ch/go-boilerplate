name: Sync Versions Check

on:
  pull_request:
    paths:
      - 'mise.toml'
      - 'go.mod'
      - 'docker/server/Dockerfile'
      - 'docker/tools/Dockerfile'
      - 'docker/**/README.md'
      - 'docker/**/README.ja.md'
      - 'scripts/sync-versions/**'
      - '.github/workflows/sync-versions-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-versions-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sync-versions
        run: go run ./scripts/sync-versions

      - name: Detect drift
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=drift" >> "$GITHUB_OUTPUT"
          {
            echo "mise.toml を正とした各ファイルへの同期に差分があります（mise.toml 更新の未反映、または下流ファイルの不整合な編集が原因）。"
            echo ""
            echo "ローカルで \`make sync-versions\` を実行してコミットしてください。"
            echo ""
            echo "差分のあるファイル一覧:"
            git diff --name-only | sed 's/^/  - /'
          } | tee /tmp/sync-versions-drift.md
          exit 1

      - name: Comment sync-versions result on PR
        if: github.event_name == 'pull_request' && failure() && steps.drift.outputs.status == 'drift'
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- sync-versions-drift -->'
          title: '## ❌ sync-versions: drift detected'
          body-file: /tmp/sync-versions-drift.md
