name: Sync Versions Check

on:
  pull_request:
    paths:
      - 'mise.toml'
      - 'go.mod'
      - 'docker/server/Dockerfile'
      - 'docker/tools/Dockerfile'
      - 'docker/**/README.md'
      - 'docker/**/README.ja.md'
      - 'scripts/sync-versions/**'
      - '.github/workflows/sync-versions-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-versions-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sync-versions
        run: go run ./scripts/sync-versions

      - name: Detect drift
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=drift" >> "$GITHUB_OUTPUT"
          {
            echo "mise.toml を正とした各ファイルへの同期に差分があります（mise.toml 更新の未反映、または下流ファイルの不整合な編集が原因）。"
            echo ""
            echo "ローカルで \`make sync-versions\` を実行してコミットしてください。"
            echo ""
            echo "差分のあるファイル一覧:"
            git diff --name-only | sed 's/^/  - /'
          } | tee /tmp/sync-versions-drift.md
          exit 1

      - name: Comment sync-versions result on PR
        if: github.event_name == 'pull_request' && failure() && steps.drift.outputs.status == 'drift'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- sync-versions-drift -->';
            const body = [
              marker,
              '## ❌ sync-versions: drift detected',
              '',
              fs.readFileSync('/tmp/sync-versions-drift.md', 'utf8'),
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
