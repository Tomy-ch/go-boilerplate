name: Sync Versions Check

on:
  pull_request:
    paths:
      - 'mise.toml'
      - 'go.mod'
      - 'docker/server/Dockerfile'
      - 'docker/tools/Dockerfile'
      - 'docker/**/README.md'
      - 'docker/**/README.ja.md'
      - 'scripts/sync-versions/**'
      - '.github/workflows/sync-versions-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-versions-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sync-versions
        run: go run ./scripts/sync-versions

      - name: Detect drift
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=drift" >> "$GITHUB_OUTPUT"
          {
            echo "There is drift when syncing each file from mise.toml (the source of truth) — caused by an unpropagated mise.toml update, or an inconsistent edit to a downstream file."
            echo ""
            echo "Run \`make sync-versions\` locally and commit the changes."
            echo ""
            echo "Files with drift:"
            git diff --name-only | sed 's/^/  - /'
          } | tee /tmp/sync-versions-drift.md
          exit 1

      - name: Comment sync-versions result on PR
        # This workflow comments only on drift, so the condition reads the drift status rather
        # than failure(): failure() is false when the job is cancelled, which would leave the
        # cut-off silent. An empty status means the detection never finished, so it comments.
        if: always() && github.event_name == 'pull_request' && steps.drift.outputs.status != 'ok'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- sync-versions-drift -->'
          title: '## ❌ sync-versions: drift detected'
          body-file: /tmp/sync-versions-drift.md
