name: Generated OpenAPI Artifacts Check

# `paths` lists the generated output as well as the inputs — see README.md for why.
on:
  pull_request:
    paths:
      # Inputs
      - '.github/workflows/gen-oapi-artifacts-check.yaml'
      - 'openapi/**/*.yaml'
      - '.makefiles/**/*.mk'
      - 'redocly.yaml'
      - 'docker/tools/Dockerfile'
      - 'mise.toml'
      # Generated output. `openapi/openapi.gen.yaml` is already covered by `openapi/**/*.yaml`
      # above. The docs HTML is named file-by-file so that the mock-auth-server docs under
      # `docs/openapi/mock-auth-server/` — generated by a different workflow — do not trigger this one.
      - 'docs/openapi/index.html'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-oapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            aquaproj.github.io:443
            nodejs.org:443
            registry.npmjs.org:443
            get.pnpm.io:443
            docker.io:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            *.docker.io:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      # fetch-depth: 0 so the PR's base and head commits are present locally. The default
      # shallow checkout fetches only the merge commit, so the `git diff` that classifies the
      # cause below cannot resolve either parent.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run OpenAPI Bundle
        run: make gen-bundle-oapi

      - name: Generate OpenAPI Docs
        run: make gen-api-docs

      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi

      # Classify the PR so the report can name the actual cause:
      #   - source_modified:   a hand-written spec under openapi/ changed, so a forgotten
      #                        `make gen-api` is likely
      #   - artifact_modified: the generated output was edited directly, which is a rule violation
      #   - neither:           generator-side drift (non-deterministic output / dependency update)
      #                        is more likely
      # `openapi/openapi.gen.yaml` is generated output, so it is excluded from the source set even
      # though it lives under `openapi/`.
      - name: Detect source modifications in this PR
        id: source_mod
        if: github.event_name == 'pull_request' && steps.gen_diff.outputs.has_diff == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA-}"
          head_sha="${HEAD_SHA-}"
          # Surface a diff failure rather than degrading to an empty file list, which would
          # silently misreport every cause below as generator-side drift.
          if ! changed="$(git diff --name-only "$base_sha" "$head_sha")"; then
            echo "::warning::failed to diff ${base_sha}..${head_sha}; cause classification skipped"
            changed=""
          fi
          if echo "$changed" | grep -E '^openapi/' | grep -qvE '^openapi/openapi\.gen\.yaml$'; then
            echo "source_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_modified=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^openapi/openapi\.gen\.yaml$|^docs/openapi/index\.html$'; then
            echo "artifact_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR comment body
        id: comment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HAS_DIFF: ${{ steps.gen_diff.outputs.has_diff }}
          SOURCE_MODIFIED: ${{ steps.source_mod.outputs.source_modified }}
          ARTIFACT_MODIFIED: ${{ steps.source_mod.outputs.artifact_modified }}
        run: |
          set -euo pipefail
          out=/tmp/gen-oapi-comment.md
          if [ "${HAS_DIFF-}" != "true" ]; then
            echo "title=## ✅ No differences in OpenAPI generated output were detected" >> "$GITHUB_OUTPUT"
            echo "No differences in OpenAPI generated output were detected." > "$out"
            exit 0
          fi
          # Disable SC2016: `make ...` in the notification message is shown literally (must not expand)
          # shellcheck disable=SC2016
          if [ "${SOURCE_MODIFIED-}" = "true" ]; then
            echo "title=## 🧾 Differences in OpenAPI generated output have been detected" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Run \`make gen-bundle-oapi && make gen-api-docs\` locally and commit the changes." > "$out"
          elif [ "${ARTIFACT_MODIFIED-}" = "true" ]; then
            echo "title=## ✋ OpenAPI generated output was edited directly" >> "$GITHUB_OUTPUT"
            printf '%s\n' "This PR changes OpenAPI generated output without changing any hand-written spec under \`openapi/\`. Generated files must not be hand-edited (see \`AGENTS.md\`). Discard the edit, run \`make gen-bundle-oapi && make gen-api-docs\` so the output comes from the generator, and commit that instead." > "$out"
          else
            echo "title=## ⚠️ Drift in OpenAPI generated output detected (openapi/ unchanged)" >> "$GITHUB_OUTPUT"
            printf '%s\n' "This PR does not modify anything under \`openapi/\`, so this may be generator-side drift (non-deterministic output, dependency version differences, stale generated artifacts on the base, etc.). Run \`make gen-bundle-oapi && make gen-api-docs\` locally and commit, or update the base via \`auto-generate-docs\` and then rebase / merge." > "$out"
          fi
          # Same computation as fenceFor in .github/actions/upsert-pr-comment/action.yaml, repeated
          # because that helper only wraps a body on the details-summary path and this call passes
          # the body through untouched.
          # `-a`: without it a single NUL byte makes grep report a binary match and print nothing,
          # collapsing the fence back to three backticks.
          fence_for() {
            local longest len
            longest="$({ grep -a -o '`\{1,\}' "$1" || true; } | awk '{ if (length($0) > n) n = length($0) } END { print n + 0 }')"
            len=$(( longest + 1 ))
            if [ "$len" -lt 3 ]; then len=3; fi
            printf '%*s' "$len" '' | tr ' ' '\140'
          }

          # A path may hold any byte but NUL and `/`, so a name carrying a backtick closes an inline
          # code span early and renders the rest as live Markdown under the bot's name — a mention
          # notifying third parties, a fabricated heading or link. Fencing the list instead, at a
          # length taken from the list itself, leaves no run able to close it.
          list=/tmp/gen-oapi-filelist.txt
          # The action's length cap slices a body without regard for fences and does not re-fence on
          # this path, so a list trimmed there would lose the closing fence. Trimming here, before
          # the fence is sized, keeps the block closed and stays under the 45000 character default.
          # The fence cannot outgrow that budget either: a backtick run never spans a `/`, so the
          # longest one a path can hold is bounded by NAME_MAX — 255 bytes — and the fence by 256.
          list_limit=40000
          head -c "$list_limit" /tmp/changed_files.txt > "$list"
          if [ "$(wc -c < /tmp/changed_files.txt)" -gt "$list_limit" ]; then
            printf '\n... (file list truncated)\n' >> "$list"
          fi
          fence="$(fence_for "$list")"
          {
            echo ""
            echo "${fence}text"
            cat "$list"
            echo "${fence}"
          } >> "$out"

      - name: Comment generated artifacts result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- generated-oapi-artifacts-filelist -->'
          status: "${{ steps.gen_diff.outputs.has_diff == 'false' && 'success' || 'drift' }}"
          title: "${{ steps.comment.outputs.title || '## ⚠️ Generated OpenAPI Artifacts Check: CUT OFF (no result produced)' }}"
          body-file: /tmp/gen-oapi-comment.md

      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
