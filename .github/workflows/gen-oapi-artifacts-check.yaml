name: Generated OpenAPI Artifacts Check

on:
  pull_request:
    paths:
      - '.github/workflows/gen-oapi-artifacts-check.yaml'
      - '**/*.go'
      - 'openapi/**/*.yaml'
      - '.makefiles/**/*.mk'
      - 'scripts/**/*.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-setup:
    uses: ./.github/workflows/golang-setup.yaml
    permissions:
      contents: read

  generate-oapi-check:
    needs: golangci-setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
    steps:
      - name: Fetch & Checkout repository
        uses: actions/checkout@v5

      - name: Run OpenAPI Bundle
        run: make gen-swagger

      - name: Generate OpenAPI Docs
        run: make gen-api-docs

      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi

      - name: Comment generated status on PR (diff/no-diff)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const marker = '<!-- generated-oapi-artifacts-filelist -->';

            const raw = fs.readFileSync('/tmp/changed_files.txt', 'utf8').trim();
            const files = raw ? raw.split('\n').filter(Boolean) : [];

            const updatedAtJST = new Date().toLocaleString('ja-JP', {
              timeZone: 'Asia/Tokyo',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
            });

            const headSha =
              (context.payload.pull_request?.head?.sha)
              || process.env.GITHUB_SHA
              || context.sha;
            const shortSha = headSha.slice(0, 7);
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const commitUrl = `${repoUrl}/commit/${headSha}`;

            const commitLine = `🔖 Commit: [\`${shortSha}\`](${commitUrl})`;
            const updatedLine = `🕒 最終更新時刻: ${updatedAtJST} (JST)`;

            let body;
            if (files.length > 0) {
              body = [
                marker,
                '## 🧾 OpenAPI生成物の差分が検出されました（変更ファイル一覧）',
                '',
                commitLine,
                '',
                ...files.map(f => `- \`${f}\``),
                '',
                'ローカルで `make gen` を実行して差分をコミットしてください。',
                '',
                updatedLine,
              ].join('\n');
            } else {
              body = [
                marker,
                '## ✅ OpenAPI生成物の差分は検出されませんでした',
                '',
                commitLine,
                '',
                'OpenAPI生成物の差分は検出されませんでした。',
                '',
                updatedLine,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
