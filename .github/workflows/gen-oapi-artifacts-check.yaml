name: Generated OpenAPI Artifacts Check

# `paths` lists the generated output as well as the inputs — see README.md for why.
on:
  pull_request:
    paths:
      # Inputs
      - '.github/workflows/gen-oapi-artifacts-check.yaml'
      - 'openapi/**/*.yaml'
      - '.makefiles/**/*.mk'
      - 'redocly.yaml'
      - 'docker/tools/Dockerfile'
      - 'mise.toml'
      # Generated output. `openapi/openapi.gen.yaml` is already covered by `openapi/**/*.yaml`
      # above. The docs HTML is named file-by-file so that the mock-auth-server docs under
      # `docs/openapi/mock-auth-server/` — generated by a different workflow — do not trigger this one.
      - 'docs/openapi/index.html'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-oapi-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # fetch-depth: 0 so the PR's base and head commits are present locally. The default
      # shallow checkout fetches only the merge commit, so the `git diff` that classifies the
      # cause below cannot resolve either parent.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run OpenAPI Bundle
        run: make gen-bundle-oapi

      - name: Generate OpenAPI Docs
        run: make gen-api-docs

      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi

      # Classify the PR so the report can name the actual cause:
      #   - source_modified:   a hand-written spec under openapi/ changed, so a forgotten
      #                        `make gen-api` is likely
      #   - artifact_modified: the generated output was edited directly, which is a rule violation
      #   - neither:           generator-side drift (non-deterministic output / dependency update)
      #                        is more likely
      # `openapi/openapi.gen.yaml` is generated output, so it is excluded from the source set even
      # though it lives under `openapi/`.
      - name: Detect source modifications in this PR
        id: source_mod
        if: github.event_name == 'pull_request' && steps.gen_diff.outputs.has_diff == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          # Surface a diff failure rather than degrading to an empty file list, which would
          # silently misreport every cause below as generator-side drift.
          if ! changed="$(git diff --name-only "$base_sha" "$head_sha")"; then
            echo "::warning::failed to diff ${base_sha}..${head_sha}; cause classification skipped"
            changed=""
          fi
          if echo "$changed" | grep -E '^openapi/' | grep -qvE '^openapi/openapi\.gen\.yaml$'; then
            echo "source_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_modified=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^openapi/openapi\.gen\.yaml$|^docs/openapi/index\.html$'; then
            echo "artifact_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR comment body
        id: comment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/gen-oapi-comment.md
          if [ "${{ steps.gen_diff.outputs.has_diff }}" != "true" ]; then
            echo "title=## ✅ No differences in OpenAPI generated output were detected" >> "$GITHUB_OUTPUT"
            echo "No differences in OpenAPI generated output were detected." > "$out"
            exit 0
          fi
          # Disable SC2016: `make ...` in the notification message is shown literally (must not expand)
          # shellcheck disable=SC2016
          if [ "${{ steps.source_mod.outputs.source_modified }}" = "true" ]; then
            echo "title=## 🧾 Differences in OpenAPI generated output have been detected" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Run \`make gen-bundle-oapi && make gen-api-docs\` locally and commit the changes." > "$out"
          elif [ "${{ steps.source_mod.outputs.artifact_modified }}" = "true" ]; then
            echo "title=## ✋ OpenAPI generated output was edited directly" >> "$GITHUB_OUTPUT"
            printf '%s\n' "This PR changes OpenAPI generated output without changing any hand-written spec under \`openapi/\`. Generated files must not be hand-edited (see \`AGENTS.md\`). Discard the edit, run \`make gen-bundle-oapi && make gen-api-docs\` so the output comes from the generator, and commit that instead." > "$out"
          else
            echo "title=## ⚠️ Drift in OpenAPI generated output detected (openapi/ unchanged)" >> "$GITHUB_OUTPUT"
            printf '%s\n' "This PR does not modify anything under \`openapi/\`, so this may be generator-side drift (non-deterministic output, dependency version differences, stale generated artifacts on the base, etc.). Run \`make gen-bundle-oapi && make gen-api-docs\` locally and commit, or update the base via \`auto-generate-docs\` and then rebase / merge." > "$out"
          fi
          # Disable SC2016: the `%s` that renders the filename as markdown code is literal (must not expand)
          # shellcheck disable=SC2016
          {
            echo ""
            while IFS= read -r f; do
              [ -n "$f" ] && printf -- "- \`%s\`\n" "$f"
            done < /tmp/changed_files.txt
          } >> "$out"

      - name: Comment generated artifacts result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- generated-oapi-artifacts-filelist -->'
          title: ${{ steps.comment.outputs.title }}
          body-file: /tmp/gen-oapi-comment.md

      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
