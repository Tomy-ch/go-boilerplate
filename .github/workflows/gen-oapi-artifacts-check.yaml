name: Generated OpenAPI Artifacts Check

on:
  pull_request:
    paths:
      - '.github/workflows/gen-oapi-artifacts-check.yaml'
      - 'openapi/**/*.yaml'
      - '.makefiles/**/*.mk'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-oapi-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ENV: ci
    steps:
      - name: Fetch & Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run OpenAPI Bundle
        run: make gen-bundle-oapi

      - name: Generate OpenAPI Docs
        run: make gen-api-docs

      - name: Detect generated changes (file list)
        id: gen_diff
        shell: bash
        run: |
          set -euo pipefail
          # 未追跡（新規生成）ファイルも検知するため index に取り込んでから差分を取る
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            printf "%s\n" "$files" > /tmp/changed_files.txt
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            : > /tmp/changed_files.txt
          fi

      # PR の source（openapi/ 配下）が触られているかを判定する。
      # 触られている場合は「make gen-api を忘れた」可能性が高く、触られていない
      # 場合は generator 側のドリフト（非決定的出力 / 依存更新）の可能性が高い。
      - name: Detect source modifications in this PR
        id: source_mod
        if: github.event_name == 'pull_request' && steps.gen_diff.outputs.has_diff == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=200 origin "${{ github.event.pull_request.base.ref }}" || true
          changed="$(git diff --name-only "$base_sha" "$head_sha" || true)"
          if echo "$changed" | grep -qE '^openapi/'; then
            echo "source_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment generated status on PR (diff/no-diff)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const marker = '<!-- generated-oapi-artifacts-filelist -->';

            const raw = fs.readFileSync('/tmp/changed_files.txt', 'utf8').trim();
            const files = raw ? raw.split('\n').filter(Boolean) : [];
            const sourceModified = '${{ steps.source_mod.outputs.source_modified }}' === 'true';

            const updatedAtJST = new Date().toLocaleString('ja-JP', {
              timeZone: 'Asia/Tokyo',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
            });

            const headSha =
              (context.payload.pull_request?.head?.sha)
              || process.env.GITHUB_SHA
              || context.sha;
            const shortSha = headSha.slice(0, 7);
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const commitUrl = `${repoUrl}/commit/${headSha}`;

            const commitLine = `🔖 Commit: [\`${shortSha}\`](${commitUrl})`;
            const updatedLine = `🕒 UpdatedAt: ${updatedAtJST} (JST)`;

            let body;
            if (files.length > 0) {
              const title = sourceModified
                ? '## 🧾 Differences in OpenAPI generated output have been detected (list of modified files)'
                : '## ⚠️ OpenAPI 生成物のドリフトを検知（本 PR で `openapi/` 配下は触られていません）';
              const action = sourceModified
                ? 'Please run `make gen-api` locally and commit the changes.'
                : '本 PR では `openapi/` 配下が変更されていないため、generator 側のドリフト（非決定的出力 / 依存バージョン差 / base 側の古い生成物 等）の可能性があります。`make gen-api` をローカル実行してコミットするか、`auto-generate-docs` 経由で base 側を更新してから rebase / merge してください。';
              body = [
                marker,
                title,
                '',
                commitLine,
                '',
                ...files.map(f => `- \`${f}\``),
                '',
                action,
                '',
                updatedLine,
              ].join('\n');
            } else {
              body = [
                marker,
                '## ✅ No differences in OpenAPI generated output were detected',
                '',
                commitLine,
                '',
                'No differences in OpenAPI generated output were detected.',
                '',
                updatedLine,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Fail if diff exists
        if: steps.gen_diff.outputs.has_diff == 'true'
        run: exit 1
