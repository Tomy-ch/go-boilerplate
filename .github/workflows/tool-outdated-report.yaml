name: Tool Version Report

# `tool-cooldown` gates a declared version against the window; neither it nor anything else notices
# that upstream has published a newer one. Without this, the pins in `mise.toml` and `python/*.in`
# sit still until somebody remembers to run `/tools-upgrade`. This reports so that remembering is
# not a person's job; it never applies an update.
#
# The report goes to an issue rather than a pull request because a notification carries no diff to
# maintain: it cannot conflict while it waits, and it closes itself once nothing is actionable.

on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            downloads.sqlc.dev
            nodejs.org
            registry.npmjs.org
            get.pnpm.io
            astral.sh
            pypi.org
            files.pythonhosted.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # `mise registry` is what resolves a short name to its backend, so mise has to be present
      # even though no tool is installed here.
      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The unauthenticated GitHub API allows 60 requests an hour per IP, which one run of this
      # survey does not fit into.
      - name: Survey upstream versions
        id: survey
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          go run ./scripts/tool-cooldown outdated --summary-out=tool-outdated.md
          cat tool-outdated.md >> "${GITHUB_STEP_SUMMARY}"

      # The issue is the notification, so it is created only while something is actionable and is
      # closed again once nothing is. Reusing one title as the identity key keeps a weekly schedule
      # from filing a new issue every Monday.
      - name: Create or update the report issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ACTIONABLE: ${{ steps.survey.outputs.actionable }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Tool Version Report: 窓を満たす更新があります';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);

            if (Number(process.env.ACTIONABLE) === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `窓を満たす更新が無くなったので閉じます。[実行](${runUrl})`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }

            const body = [
              '<!-- tool-outdated-report -->',
              fs.readFileSync('tool-outdated.md', 'utf8'),
              `実行: [${context.workflow}](${runUrl})`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
