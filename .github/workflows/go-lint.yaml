name: Go Lint

on:
  pull_request:
    paths:
      - '.github/workflows/go-lint.yaml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yaml'
      - '.golangci-full.yaml'
      - 'makefile'
      - '.makefiles/go/golangci-lint.mk'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    runs-on: ubuntu-latest
    # The only cutoff for this job: golangci-lint itself runs with its timeout disabled.
    # Measured setup ~2-4m + lint ~2.5m, so 30m leaves room for the repository to grow.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.0
          install: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install golangci-lint
        run: mise install golangci-lint

      - name: Check Go / golangci-lint version
        run: |
          go version
          golangci-lint version

      - name: Run golangci-lint
        id: golangci
        shell: bash
        run: |
          set +e

          # Go through make so the timeout budget lives in one place (see timeout-minutes above).
          # print-issued-lines / print-linter-name default to true in golangci-lint v2.
          make lint GOLANGCI_LINT_TIMEOUT=0 2>&1 | tee /tmp/golangci-lint.log

          code=${PIPESTATUS[0]}

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Go lint: PASS (golangci-lint)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Go lint: FAIL (golangci-lint)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment Go lint result on PR
        # always() is needed for the timeout case: a plain `if:` is implicitly `success() &&`,
        # so a cut-off job would skip this step and leave the partial log unreachable.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- golangci-lint-result -->'
          status: ${{ steps.golangci.outputs.status }}
          title: "${{ steps.golangci.outputs.title || '## ⚠️ Go Lint: CUT OFF (no result produced)' }}"
          body-file: /tmp/golangci-lint.log
          details-summary: 'golangci-lint log'

      - name: Fail if golangci-lint failed
        if: always()
        shell: bash
        run: |
          code='${{ steps.golangci.outputs.exit_code }}'
          # Empty means the run never reached its own exit: the job was cut off.
          if [ -z "$code" ]; then
            echo "golangci-lint did not finish; the job was cut off (see timeout-minutes)"
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "golangci-lint failed with exit code $code"
            exit 1
          fi
