name: Lockfile Integrity

# Guards against lockfile poisoning: an attacker who can edit a lockfile does not need to
# touch package.json at all, because the resolver fetches whatever the lockfile points at.
# The version and the integrity hash can look untouched while the tarball comes from
# somewhere else entirely.
#
# Both packages in the repository resolve with pnpm — `scripts/`
# and `docs-viewer/`, each with its own lockfile — so one check covers them.
#
# This is a different question from the vulnerability scanners. OSV and Trivy ask
# "is this package known-bad"; a poisoned lockfile names a package that is not
# known-bad at all, because the malicious artifact was never published to the
# registry under that name.
#
# Gating on purpose. There is no scheduled run: the lockfiles in the repository
# cannot change without a commit, so re-checking an unchanged tree weekly would
# only ever restate the previous answer.
#
# The `push` trigger is what keeps that reasoning honest. "A commit" is not the
# same set as "a pull request": a commit landing on a protected branch directly —
# because the ruleset does not require a PR, or because someone bypasses it —
# changes a lockfile without any pull_request event ever firing. Reviewing only
# the reviewed path is the blind spot a poisoned lockfile would be pushed through,
# so the same check runs on the push itself. It cannot block what has already
# landed; it makes the landing visible instead of silent.

on:
  push:
    branches:
      - develop
      - staging
      - production
      - 'release/*'
    paths:
      - '.github/workflows/lockfile-integrity.yaml'
      - 'scripts/pnpm-lock.yaml'
      - 'docs-viewer/pnpm-lock.yaml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Why the trigger condition lives in a job: README.md § Required checks report on every pull request.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net

      # fetch-depth: 0 so the PR's base and head commits are present locally. The filter
      # below compares them with `git diff`; the default shallow checkout fetches only the
      # merge commit, so neither parent resolves.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # An empty token selects `git diff` over the compare API. The API refuses a
          # large diff outright (`this diff is taking too long to generate`), and a filter
          # that reaches no verdict runs every gated job instead of skipping it.
          token: ''
          filters: |
            relevant:
              - '.github/workflows/lockfile-integrity.yaml'
              - 'scripts/pnpm-lock.yaml'
              - 'docs-viewer/pnpm-lock.yaml'

  lockfile-lint:
    needs: changes
    # Fail open — README.md § Required checks report on every pull request.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          collect-process-info: false
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.16.0.0/12
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The poisoning vector takes a particular shape here: pnpm-lock.yaml names no URL at
      # all for a registry package — the entry is `resolution: {integrity: ...}` and the host
      # comes from the resolver's configuration. An entry that carries any other key
      # (`tarball`, `directory`, a git reference) is fetching from somewhere the registry
      # settings never approved.
      #
      # `blockExoticSubdeps` in pnpm-workspace.yaml refuses those at install time. This step is
      # the committed-state counterpart: the setting protects the machine that runs install,
      # the check protects the reviewer looking at the diff.
      - name: Lint pnpm lockfiles
        id: pnpm-lint
        run: |
          set -uo pipefail

          : > lockfile-lint.log
          status=success

          for lockfile in scripts/pnpm-lock.yaml docs-viewer/pnpm-lock.yaml; do
            echo "### ${lockfile}" >> lockfile-lint.log

            if exotic=$(grep -n 'resolution: {' "${lockfile}" | grep -v 'resolution: {integrity:'); then
              echo "non-registry resolutions found:" >> lockfile-lint.log
              echo "${exotic}" >> lockfile-lint.log
              status=failure
            else
              total=$(grep -c 'resolution: {integrity:' "${lockfile}")
              echo "ok (${total} registry resolutions, no other resolution form)" >> lockfile-lint.log
            fi
            echo >> lockfile-lint.log
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"
        shell: bash

      # Computing the verdict here rather than inside the lint step keeps the PR comment
      # reachable: the lint step captures its status instead of aborting, so a finding still
      # produces a comment.
      - name: Summarize lockfile verdict
        id: verdict
        if: always()
        env:
          PNPM_STATUS: ${{ steps.pnpm-lint.outputs.status }}
        run: |
          set -uo pipefail

          if [ "${PNPM_STATUS}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Lockfile Integrity: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## 🚨 Lockfile Integrity: FAIL" >> "$GITHUB_OUTPUT"
          fi

          cat lockfile-lint.log >> "${GITHUB_STEP_SUMMARY}"
        shell: bash

      - name: Upload lockfile-lint log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lockfile-lint
          path: lockfile-lint.log

      - name: Comment lockfile result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- lockfile-integrity-result -->'
          status: ${{ steps.verdict.outputs.status }}
          title: "${{ steps.verdict.outputs.title || '## ⚠️ Lockfile Integrity: CUT OFF (no result produced)' }}"
          body-file: lockfile-lint.log
          details-summary: 'lockfile-lint log'

      # Gating with no severity threshold: a resolution either names the registry over
      # HTTPS (npm) or carries nothing but an integrity hash (pnpm), or it does not.
      - name: Fail if a lockfile finding was found
        if: always() && steps.verdict.outputs.status != 'success'
        run: exit 1
