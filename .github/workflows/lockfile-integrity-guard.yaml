name: Lockfile Integrity (required-check guard)

# Skip-guard companion for lockfile-integrity.yaml: reports the `lockfile-lint` required check as an immediate
# success on the complementary set (`paths-ignore` mirrors the filter on lockfile-integrity.yaml).
# Both files' filters must be edited together — see README.md § Required-check guard companions.

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/lockfile-integrity.yaml'
      - 'scripts/pnpm-lock.yaml'
      - 'docs-viewer/pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: No lockfile changed — satisfy the required context
        run: echo "No lockfile path changed; the required 'lockfile-lint' context is satisfied by this guard."
