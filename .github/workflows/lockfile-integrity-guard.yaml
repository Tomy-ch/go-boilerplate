name: Lockfile Integrity (required-check guard)

# Skip-guard companion for lockfile-integrity.yaml. The `lockfile-lint` job is
# declared in `.github/settings/branch-protection.json` as a required status check, but lockfile-integrity.yaml only triggers
# when the PR touches its `paths`; a PR that changes no lockfile would never report
# the `lockfile-lint` context and would block merging forever.
#
# This workflow runs on the complementary set (`paths-ignore` mirrors
# lockfile-integrity.yaml's pull_request `paths`) and reports the same
# `lockfile-lint` context as an immediate success. When both run, GitHub requires
# every same-named check to pass, so this no-op can never mask a real failure.

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/lockfile-integrity.yaml'
      - 'scripts/pnpm-lock.yaml'
      - 'mock-auth-server/pnpm-lock.yaml'
      - 'docs-viewer/pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: No lockfile changed — satisfy the required context
        run: echo "No lockfile path changed; the required 'lockfile-lint' context is satisfied by this guard."
