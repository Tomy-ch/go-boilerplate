# Dependabot 設定
#
# 対象エコシステム: Go modules / Docker / GitHub Actions の3種。
# cooldown: バージョンが公開されてから一定日数（patch=5 / minor=7 / major=30、
#           semver 分類外は default-days=5）経過するまで更新 PR を作成せず、初期不良の枯れを待つ。
# groups : 1 エコシステムあたり 1 PR にまとめ、更新 PR のノイズを抑制する。
#
# 注意: セキュリティアップデート（security update）は cooldown を通らず即時 PR が作成される。
#       これは脆弱性対応を遅延させないための Dependabot 仕様であり、承知の上で運用する。
version: 2
updates:
  # ---- Go modules ----
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      gomod:
        patterns:
          - "*"

  # ---- Docker ----
  # Dockerfile は docker/ 配下の3イメージに分かれているため directories で個別指定する。
  - package-ecosystem: "docker"
    directories:
      - "/docker/tools"
      - "/docker/server"
      - "/docker/document"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      docker:
        patterns:
          - "*"

  # ---- GitHub Actions ----
  # directory "/" でワークフロー（.github/workflows）と複合アクション（.github/actions）の双方を走査する。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      github-actions:
        patterns:
          - "*"
