# 各ジョブの先頭の bullfrog ステップの入力の SSOT。生成された with ブロックを手で編集してはならない。
# クラスの意味・追加手順・反映と検査のコマンドは .github/workflows/README.md の Runner Hardening 節。
#
# ホストはポートを持たないドメイン名で書く（bullfrog はポートで絞らない）。`*.example.com` は
# サブドメインだけに当たり apex を含まない。apex も要るなら別に並べる。
#
# sudo は既定で外す（enable-sudo: false）。残すジョブは job セクションに sudo = "<それが要る根拠>" を
# 書く。そのジョブでは遮断を外せるので、長命の secret と id-token を渡さない。理由は README の Runner Hardening 節。

# 全ジョブが許す IP。セクション名が IP か CIDR で、reason がそれを許す根拠と外す条件。
[ip."127.0.0.100"]
reason = "一部の hosted runner（westus2）では egress proxy の試験が resolv.conf の先頭をこのローカル転送役にする。bullfrog が信用する DNS サーバに無いので、許さないと名前解決が止まる。転送先の問い合わせも bullfrog の DNS 判定を通るので許すドメインは広がらない。外す条件は runner の resolv.conf が 127.0.0.53 だけを指すようになること"

[ip."172.16.0.0/12"]
reason = "docker の既定のアドレス帯。ホストからサービスコンテナへの接続（localhost の公開ポート）はコンテナの IP 宛てとして判定されるので、許さないと DB などに繋がらない。私設のアドレス帯で外への宛先は増えない。外す条件はサービスコンテナと公開ポートを使うジョブが無くなること"

[ip."::1"]
reason = "IPv6 のループバック。bullfrog の既定は 127.0.0.1 だけなので、localhost が ::1 に解決されると公開ポートへの接続が Blocked として残る。runner 自身であって外への宛先ではない"

