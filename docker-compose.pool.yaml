# プール serve 用 override（server.mk が .gobp-db-slot 検出時に重ねる）。app を per-worktree プロジェクト
# gobp-wt-N に分離し、共有 DB を host-gateway 経由で参照して並列 serve する。observability は起動せず
# （OTLP は best-effort）、dlv/pprof は複数 api_server と衝突するため publish しない。
services:
  api_server:
    ports: !override # dlv/pprof を落とし API ポートのみ公開
      - "${API_HOST_PORT:-8080}:8080"
    depends_on: !override # 自前 DB を起動させない
      mock_auth_server:
        condition: service_healthy
    # 共有 DB を host-gateway 経由で参照（loader.go は実行時 env を env/.env より優先）。
    environment:
      DB_HOST: host.docker.internal
      DB_NAME: ${DB_NAME_LOCAL:-local}
