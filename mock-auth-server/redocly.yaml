# Redocly 設定 / lint ルールセット（mock-auth-server ローカル）。`npm run lint:oapi` で openapi/openapi.yaml を検証する。
# ルートの redocly.yaml を踏襲しつつ、OAuth2 / OIDC の実ワイヤ形式に合わせて 3 点だけ調整している。
extends:
  - recommended

rules:
  # --- 構造・必須メタの強制（ルート踏襲） ---
  operation-operationId: error
  operation-operationId-unique: error
  operation-summary: error
  operation-description: off
  # OAuth の authorize / logout は 302 リダイレクト、keys/rotate は 501 スタブで 2xx を持たないため解除する。
  operation-2xx-response: off
  operation-4xx-response: off
  no-unused-components: error
  operation-tag-defined: error
  tag-description: error

  # --- このリポジトリの規約に合わせて抑制（ルート踏襲） ---
  security-defined: off # 代わりに rule/require-explicit-security で全 operation に security 明示を強制する
  info-license: off
  tags-alphabetical: off
  no-server-example.com: off

  # --- 命名 casing ---
  rule/operationId-PascalCase:
    severity: error
    subject:
      type: Operation
      property: operationId
    assertions:
      casing: PascalCase
  rule/require-explicit-security:
    severity: error
    subject:
      type: Operation
      property: security
    assertions:
      defined: true
