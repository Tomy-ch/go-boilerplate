get:
  operationId: OidcUserinfo
  tags:
    - oidc
  summary: UserInfo エンドポイント
  description: >
    Bearer access token を必須とし、対応する subject の claim を whitelist で返す。
    ID Token（typ != at+jwt）は拒否する。
  security:
    - BearerAuth: []
  responses:
    '200':
      description: UserInfo
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/UserInfo.yaml'
    '401':
      description: Bearer 不正・欠如、または access token でない
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/OAuthError.yaml'
