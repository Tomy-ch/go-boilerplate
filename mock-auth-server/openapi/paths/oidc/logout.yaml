post:
  operationId: OidcLogout
  tags:
    - oidc
  summary: ログアウト（RP-Initiated Logout）
  description: >
    session を破棄し、post_logout_redirect_uri が登録済みなら 302 で戻す（state 反映）。
    未登録の redirect や不正時は 400。
  security: []
  requestBody:
    required: false
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            id_token_hint:
              type: string
              description: ログアウト対象を示す ID Token（任意）。
            post_logout_redirect_uri:
              type: string
              format: uri
              description: 登録済みの post-logout リダイレクト先。
            state:
              type: string
  responses:
    '200':
      description: post_logout_redirect_uri 未指定時のログアウト完了
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - logged_out
    '302':
      description: post_logout_redirect_uri への redirect
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
    '400':
      description: post_logout_redirect_uri が未登録・不正
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/OAuthError.yaml'
