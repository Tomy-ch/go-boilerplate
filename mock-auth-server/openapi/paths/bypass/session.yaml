post:
  operationId: BypassSession
  tags:
    - bypass
  summary: 疑似ログインセッションの直接発行（テスト用）
  description: >
    authorize の UI を経ずに、subject に対するログイン済み session を直接作成する。
    logout / RP-Initiated Logout の試験に使う。dev-gate 限定。
  security: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            subject:
              type: string
              description: ログインさせる subject。省略時は fixture 先頭。
  responses:
    '200':
      description: 作成した session
      content:
        application/json:
          schema:
            type: object
            required:
              - session_id
              - subject
            properties:
              session_id:
                type: string
                description: 発行された session 識別子。
              subject:
                type: string
    '400':
      description: 不正なリクエスト
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/OAuthError.yaml'
