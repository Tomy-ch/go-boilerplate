type: object
description: >
  トークンレスポンス（RFC 6749 / OIDC Core）。access_token は RFC 9068（typ=at+jwt）、
  id_token は OIDC の ID Token。bypass 経路では固定 Profile の access_token を返す。
required:
  - access_token
  - token_type
  - expires_in
properties:
  access_token:
    type: string
    description: >
      RS256 署名の JWT アクセストークン（正常時は typ=at+jwt）。/bypass/token の異常系 Profile
      （id-token / wrong-issuer 等）ではこのフィールドに typ / aud / exp / 署名が意図的に改変された
      トークンが入る（Go 側検証の試験用）。

  token_type:
    type: string
    enum:
      - Bearer
    description: トークン種別。常に Bearer。
  expires_in:
    type: integer
    format: int32
    description: access_token の有効期間（秒）。
    example: 3600
  scope:
    type: string
    description: 付与されたスコープ（スペース区切り）。
    example: "openid profile email api.read api.write"
  id_token:
    type: string
    description: OIDC ID Token（openid スコープ時のみ）。
