          - 0034-uuidv7-identifiers
          - 0035-two-scale-quantity-model
          - 0036-domain-lexicon
      - title: DI / Config / Errors
        items:
          - 0037-uber-fx-di
          - 0038-fx-neutral-di-abstraction
          - 0039-env-gated-wiring
          - 0040-subsystem-typed-config-loaders
          - 0041-config-default-vs-required-governance
