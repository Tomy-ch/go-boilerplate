# --- portal viewer の構造制御 (manifest コピー処理は無視) ---
# scripts/portal/gen-docs-json.ts が読み取り、ビューアー上の見出し階層 (groups → sections → cards) を組み立てる。
# 上から順に表示される。auto-discovered な section id (architecture / project / maintenance /
# deployment / coverage / db-schema / godoc / openapi) も groups の section リストに含めて配置を決める。
meta:
  groups:
    - title: Get Started
      sections: [overview, get-started, make_commands, environment_variables, tutorial]
    - title: Architecture
      sections: [architecture, project, reference]
    - title: Decisions (ADR)
      sections: [adr]
    - title: Application Layers
      sections: [domain, usecase, controller, infrastructure]
    - title: Design
      sections: [data-access-pattern-design, rest-design, worker-design, job-design, outbox-design, idempotency-design, observability-design]
    - title: Wiring & Helpers
      sections: [di, context-helper, cli, pkg]
    - title: Cross-Cutting
      sections: [cross-cutting, integration]
    - title: Build / Operations
      sections: [docker, mock-auth-server, database, scripts, agent-config, ci, maintenance, deployment]
    - title: API Contracts
      sections: [external]

  # サイドバー下部に常設するリファレンスリンク (外部ツール / 生成ドキュメント)。
  # groups からは抜き、新タブで開く ↗ リンクとして固定表示される。
  reference_links: [openapi, godoc, db-schema, coverage]

  # 肥大セクションを section 内の役割で更にサブグループ化する。
  # キー = section id。値 = [{title, items: [guide_id, ...]}]。
  # guide_id = guides 配下の basename (.ja.md / .md を除いたもの) で、EN/JA 両方に作用する。
  # ここに含まれない item は末尾の "Other" サブグループに自動集約される。
  subgroups:
    controller:
      - title: Layer Top
        items: [controller]
      - title: Server & Handler
        items: [controller-server, controller-handler, controller-job, controller-worker]
      - title: HTTP Stack
        items:
          - controller-httpstack
          - controller-httpstack-errorhandler
          - controller-httpstack-oapi
          - controller-httpstack-oapi-auth
          - controller-httpstack-oapi-skipper
      - title: Error Response
        items: [controller-error-response]
    infrastructure:
      - title: Layer Top
        items: [infrastructure]
      - title: RDB
        items:
          - infrastructure-rdb
          - infrastructure-rdb-driver
          - infrastructure-rdb-pgerror
          - infrastructure-rdb-sqlc
          - infrastructure-rdb-repository
          - infrastructure-rdb-query-service
          - infrastructure-rdb-testkit
      - title: Auth
        items: [infrastructure-auth]
      - title: System
        items: [infrastructure-system]
    di:
      - title: Layer Top
        items: [di]
      - title: Modules
        items: [di-module, di-module-core]
      - title: Server
        items: [di-server, di-server-extension, di-server-hook]
      - title: Lifecycle
        items: [di-lifecycle, di-shutdowner]
      - title: Job
        items: [di-job]
    database:
      - title: Layer Top
        items: [database]
      - title: Migration (DDL)
        items: [database-migrations]
      - title: Query (DML)
        items: [sqlc-query-guide, sqlc-settings]
      - title: Seed
        items: [database-seed]
    adr:
      - title: Index / Meta
        items: [README, template, 0000-record-architecture-decisions]
      - title: Foundational
        items:
          - 0001-avoid-lock-in
          - 0002-onion-architecture
          - 0003-interface-based-decoupling
          - 0004-modular-monolith
          - 0005-driving-adapters-not-split-axis
          - 0006-structural-safety-via-tooling
          - 0007-agents-md-operational-contract
          - 0008-agent-environment-alignment
          - 0009-long-running-agent-state
          - 0010-docs-as-canonical-source
      - title: Contract / OpenAPI
        items:
          - 0011-openapi-first
          - 0012-redocly-modular-spec-pipeline
          - 0013-oapi-codegen-strict-server
          - 0014-retain-generated-openapi
          - 0015-spec-driven-request-validation
          - 0016-validation-value-authority
          - 0017-boundary-value-ownership
          - 0018-metrics-endpoint-auth-exception
      - title: HTTP Layer
        items:
          - 0019-echo-http-framework
          - 0020-priority-ordered-middleware-chain
          - 0021-outbound-http-resilience
          - 0022-egress-ssrf-guard
      - title: Persistence & Data
        items:
          - 0023-sql-first-data-access
          - 0024-sqlc-type-safe-sql
          - 0025-merged-dml-schema-as-sqlc-input
          - 0026-append-only-immutable-migrations
          - 0027-sequential-migration-ids
          - 0028-master-data-via-migration
          - 0029-lightweight-cqrs
          - 0030-system-cqrs-dml-category
          - 0031-commandservice-atomicity-criterion
