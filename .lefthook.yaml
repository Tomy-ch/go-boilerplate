pre-commit:
  parallel: true
  commands:
    # 重い Go ゲート（lint / test）は 1 command に束ねる。lefthook は commands を parallel で
    # 走らせるため個別に並べると「窓の数 × フックの同時実行数」で負荷が乗算され、CPU 飽和が
    # 作業内容と無関係なテスト落ちに化ける。並列/逐次/CI委譲の判断は make 側（.makefiles/load.mk）が
    # 窓の数から決めるので、ここは委譲先を 1 つにするだけに留める。
    go-gates:
      glob: "*.go"
      run: make gate-go
    go-test-scripts:
      glob: "scripts/**/*.go"
      skip:
        - run: make -s gate-heavy-skip
      run: make test-scripts-cached
    sql-lint:
      glob: "*.sql"
      run: make sql-lint
    md-lint:
      glob: "*.md"
      run: make md-lint
    actions-lint:
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
        - "scripts/pr-comment-secret-lint.mjs"
        - "scripts/pr-comment-fence-lint.mjs"
        - "scripts/actions-cutoff-lint.mjs"
        - "scripts/actions-shellcheck/*.go"
      run: make actions-lint
    actions-zizmor:
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
        - ".github/zizmor.yml"
      run: make actions-zizmor
    oapi-lint:
      glob:
        - "openapi/**/*.yaml"
      run: make lint-oapi
    mock-auth-oapi-lint:
      glob:
        - "docker/mock-auth-server/openapi/**/*.yaml"
      run: make lint-mock-auth-oapi
    docker-lint:
      glob:
        - "docker/**/Dockerfile"
        - ".hadolint.yaml"
      run: make docker-lint
    pin-actions:
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
        - ".github/actions-pin.toml"
      run: make pin-actions-check
    pin-images:
      glob:
        - "docker/**/Dockerfile"
        - "docker-compose*.yaml"
        - "docker/images-pin.toml"
      run: make pin-images-check
    migration-check-version:
      glob: "database/migrations/*.sql"
      run: make check-migration-up-version check-migration-down-version
    migration-check-gap:
      glob: "database/migrations/*.sql"
      run: make check-migration-up-gap check-migration-down-gap

commit-msg:
  commands:
    commitlint:
      run: make commitlint COMMIT_MSG_FILE={1}

pre-push:
  parallel: true
  commands:
    # secret-scan は push 後では手遅れになるため、CI-first でも必ず手元に残す。
    secret-scan:
      run: make secret-scan
    go-gates:
      glob: "*.go"
      run: make gate-go-push
    # 生成物の再生成は docker のツールランナーを起こすため、窓が多いときは CI の
    # generate-go-check に委ねる（差分検出は CI でも等価に効く）。
    gen-go-check:
      glob:
        - "*.go"
        - "openapi/**/*.yaml"
      skip:
        - run: make -s gate-heavy-skip
      run: make gen-bundle-oapi gen-go-code && git diff --exit-code -- '*.gen.go' '*/mock/mock_*.go' '*_mock.go' openapi/openapi.gen.yaml
    tidy-check:
      glob:
        - "go.mod"
        - "go.sum"
      run: go mod tidy && git diff --exit-code go.mod go.sum
