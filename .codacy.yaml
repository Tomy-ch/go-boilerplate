---
# Scope for the Codacy analysis, read by the CLI in `.github/workflows/codacy.yaml` and by
# Codacy Cloud. Which linters run at all is held in the Codacy project rather than here;
# this file decides what they are given.
#
# Codacy Cloud reads this file from the default branch only, so an entry added on a pull
# request takes effect for the CLI immediately and for the Cloud analysis at merge.

# What Codacy analyses is the first-party tree: Go under `internal`, `pkg`, `cmd` and the
# two root files, TypeScript under `scripts`, `docs-viewer` and `mock-auth-server`. This
# reads as its inverse because the CLI has no allowlist — it decodes exactly `engines`,
# `exclude_paths` and `languages`, and ignores the `include_paths` the Cloud honours. A
# top-level directory added later is therefore analysed until it is named here.
#
# Everything below is owned by a gate of its own: `openapi` by spectral, `database` by
# sqlfluff, `docker` by hadolint, `.github` by zizmor and actionlint, `docs` by
# markdownlint. Codacy reporting on them a second time adds a finding, not a reader.
exclude_paths:
  - '.agents/**'
  - '.claude/**'
  - '.codex/**'
  - '.github/**'
  - '.makefiles/**'
  - '.vscode/**'
  - 'database/**'
  - 'docker/**'
  - 'docs/**'
  - 'env/**'
  - 'openapi/**'
  - 'python/**'
  - 'storage/**'
  - 'vendor/**'
  # Root-level configuration and prose. A single `*` stays inside one path segment, so
  # these reach the repository root only.
  - '*.js'
  - '*.md'
  - '*.properties'
  - '*.toml'
  - '*.yaml'
  # Generated output, rewritten by its generator rather than by a reviewer.
  - '**/*.gen.go'
  - '**/*.sql.go'
  - '**/*_mock.go'

engines:
  # PMD's only SQL grammar is PL/SQL, and the SQL here is PostgreSQL — `ON CONFLICT` alone
  # puts it outside that grammar, so every file fails to parse. Its other languages (Java,
  # Apex, Kotlin, Swift, JSP, Velocity) are absent from this repository, which leaves it no
  # input; PostgreSQL is sqlfluff's through `make sql-lint`.
  #
  # Held even though `database` is excluded above: the CLI cannot parse PMD's own
  # parse-failure output, and the exception it raises leaves the run hanging rather than
  # failing, so a `.sql` file appearing inside the first-party tree would stall it again.
  pmd:
    exclude_paths:
      - '**'

  # Codacy's Trivy reports a CycloneDX SBOM, which the CLI reads with the same parser it
  # uses for findings and cannot map — the hang PMD caused, from a second direction. The
  # dependency and image surfaces it covers are already gated by `trivy-fs.yaml`,
  # `trivy-config.yaml`, `image-scan.yaml`, `osv-scanner.yaml` and Dependabot, so the
  # analysis loses no ground it held alone.
  trivy:
    exclude_paths:
      - '**'
