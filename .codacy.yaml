---
# Scope for the Codacy analysis, read by the CLI in `.github/workflows/codacy.yaml` and by
# Codacy Cloud. Which linters run at all is held in the Codacy project rather than here;
# this file narrows what they are given.
#
# Codacy Cloud reads this file from the default branch only, so an entry added on a pull
# request takes effect for the CLI immediately and for the Cloud analysis at merge.
engines:
  # PMD's only SQL grammar is PL/SQL, and the SQL here is PostgreSQL — `ON CONFLICT` alone
  # puts it outside that grammar, so every file fails to parse. Its other languages (Java,
  # Apex, Kotlin, Swift, JSP, Velocity) are absent from this repository, which leaves it no
  # input; PostgreSQL is sqlfluff's through `make sql-lint`. The exclusion is the whole tree
  # rather than `**/*.sql` because there is nothing else for it to read.
  #
  # Keeping it pointed at the SQL was not an option: the CLI cannot parse PMD's own
  # parse-failure output, and the exception it raises leaves the run hanging rather than
  # failing, taking every tool still queued behind it with it.
  pmd:
    exclude_paths:
      - '**'
