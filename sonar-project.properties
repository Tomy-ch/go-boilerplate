sonar.projectKey=Tomy-ch_go-boilerplate
sonar.organization=tomy-ch
sonar.projectName=go-boilerplate

sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/src/generated/**,\
  **/*.gen.go,\
  **/*.sql.go,\
  **/*_mock.go,\
  **/openapi.gen.yaml,\
  docs/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts

# Coverage is enforced by the Go and TypeScript test workflows, each of which owns its own
# threshold. SonarQube receives no coverage reports, so exclude coverage from its quality gate
# while keeping every source file in the static-analysis and duplication scopes.
sonar.coverage.exclusions=**/*

# seed は同じ形の INSERT を並べたデータで、行が似ているのは重複ではなく形式である。重複検出だけを
# 外すのは、sonar.exclusions へ入れると解析ごと落ちて他の観点まで失うため（下のルール単位除外と
# 同じ理由）。データ以外は対象に残す。
# migrations も master data の INSERT と定型の DDL を並べた記録で、重なるのは同じく形式である。
# master data を持つテーブルが増えるたびに 1 ファイルずつ足すことになるため、ディレクトリ単位で外す。
# database/gen は DML の連結生成物で、元の SQL と同一内容になるため重複検出だけを外す。
# select_products は First / After と昇順 / 降順を sqlc の別クエリとして保持するため、共通する
# 検索条件が意図的に重なる。クエリの契約はそれぞれ異なるため、このファイルだけ重複検出から外す。
# select_purchases_feed も同じ形で、First / After を sqlc の別クエリとして保持する。この形は
# internal/infrastructure/rdb/repository/README.md の Keyset pagination が要求するもので
# （1 本へ畳むと入力によって実行計画が変わる文になる）、重なる述語は畳めない。
sonar.cpd.exclusions=database/seed/**,database/migrations/**,database/gen/**,database/dml/repository/product/select_products.sql,database/dml/query_service/purchase/select_purchases_feed.sql,internal/controller/handler/v1/carts/items/**

# ----- ルール単位の除外 -----
# パス単位ではなくルール単位で落とす。Dockerfile ごと除外すると、検証なしのダウンロード実行
# (S8482) のようにこのリポジトリで唯一 Sonar だけが見ている観点まで一緒に失われる。
sonar.issue.ignore.multicriteria=s6505docker,s6505actions,s8431,s6471docker,s1192dml,s1192gen,s4036closedloop

# 依存ライフサイクルスクリプトは各 pnpm-workspace.yaml の strictDepBuilds + allowBuilds が
# 制御し、宣言に無い依存が script を持ち込んだ時点で install を失敗させる。--ignore-scripts は
# その失敗を消してスクリプトを黙って飛ばすため、この指摘に従うと検知が無くなる。
sonar.issue.ignore.multicriteria.s6505docker.ruleKey=docker:S6505
sonar.issue.ignore.multicriteria.s6505docker.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.s6505actions.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.s6505actions.resourceKey=.github/workflows/*.yaml

# tag と digest の併記は docker/images-pin.toml の固定形式そのもので、make pin-images-check が
# その対応を照合する。どちらか片方に寄せると照合対象が消える。
sonar.issue.ignore.multicriteria.s8431.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.s8431.resourceKey=**/Dockerfile

# tool-runner と開発用ホットリロードの段は root 実行が要件で、mise を /root 配下へ置く構成と
# bind mount した作業ツリーへの書き込みがそれに依存する。resourceKey はパス単位でしか書けず、
# Dockerfile のパーサーは NOSONAR を解さないため、段だけを外す書き方が無い。ファイル単位で外す。
# runtime 段の root 実行そのものは hadolint の DL3066 と checkov の CKV_DOCKER_3 が引き続き見ており、
# この除外で失う観点は無い。
sonar.issue.ignore.multicriteria.s6471docker.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.s6471docker.resourceKey=**/Dockerfile

# 省略可能な絞り込みは sqlc の narg 名を「NULL 判定」と「条件本体」の双方へ書くため、1 条件につき
# 名前が最低 2 回、クエリを分岐させれば分岐の数だけ重なる。この名前は sqlc が生成する引数の識別子で
# あって値ではなく、SQL 側に括り出せる定数の宣言先が無い。特定の 1 ファイルの事情ではなく narg の
# 書き方そのものに由来するため、ディレクトリ単位で外す。上の cpd.exclusions と対象が重なっても
# 検出ルールが別なので、両方要る。
# database/gen は DML の連結生成物で同じ指摘がそのまま重複して出るため、重複の是非は連結元の
# DML 側だけで判断する。
sonar.issue.ignore.multicriteria.s1192dml.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.s1192dml.resourceKey=database/dml/**
sonar.issue.ignore.multicriteria.s1192gen.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.s1192gen.resourceKey=database/gen/**

# closed-loop は gh / git / claude を PATH 上の名前で起動する。S4036 が想定する脅威は「PATH に
# 書き込み可能なディレクトリが混ざっていて偽の実行ファイルを掴む」ことだが、その状況は攻撃者が
# 既にそのマシンでコードを実行できている状況であり、docs/design/security.md が
# *The developer endpoint* として明示的に対象外と宣言した範囲に入る。絶対パスへ寄せる回避は
# mise の shim を通す構成と噛み合わず、環境ごとに壊れる。
# このリポジトリの make ターゲットと .agents/**.sh も同じように名前で起動しており、ここだけを
# 直しても姿勢は変わらない。対象は closed-loop の入口 2 ファイルに限る。
sonar.issue.ignore.multicriteria.s4036closedloop.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.s4036closedloop.resourceKey=scripts/closed-loop/**
