# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yaml.
#
# The key and organization identify a project on sonarcloud.io, so they are boilerplate
# identity: a repository created from this template analyses the template's project until
# they are replaced. `make setup-replace-repository-reference` rewrites them and
# `make setup-remove-licensed-scanners` deletes this file, so neither path leaves it
# pointing elsewhere.
sonar.projectKey=Tomy-ch_go-boilerplate
sonar.organization=tomy-ch
sonar.projectName=go-boilerplate

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Mirrors opengrep.yaml's exclusions: generated code, vendored trees and build output are
# not editable here, so a finding in one is not actionable.
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/src/generated/**,\
  **/*.gen.go,\
  **/*.sql.go,\
  **/*_mock.go,\
  **/openapi.gen.yaml,\
  docs/**

# Sonar reports coverage and duplication separately for test code, which needs the split
# declared. Go's convention makes it mechanical.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts

# Vitest emits this alongside its terminal report. Sonar reads it to calculate coverage for
# TypeScript changed in a pull request; without the report, the quality gate sees 0% new code.
sonar.javascript.lcov.reportPaths=scripts/coverage/lcov.info
