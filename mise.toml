# ランタイム / ツールのバージョンを一元管理する SSOT。ここが持つのはバージョンの宣言だけで、
# ツールをどう実行するかは docs/rules.md の Toolchain Execution Rules が持つ。
#
# go / node / python の version は `make sync-versions` が go.mod・各 Dockerfile の
# FROM タグ・関連 README へ伝播する。短い名前で解決できないツールは backend を明示する。
#
# PyPI のツールだけはここに書かない。バージョンの宣言は python/*.in、推移依存まで含めた
# 解決結果と sha256 は python/*.txt が持つ（ADR-0077）。
min_version = "2026.6.0"

[tools]
# 言語ランタイム。make tool-cooldown-* の検査対象から意図的に外してあり（ADR-0086）、
# 昇格の判断は LTS を待つ方針が担う。
go = "1.26.5"
node = "24.18.0"
python = "3.14.6"

# Go ベース（標準レジストリで解決可）
oapi-codegen = "2.7.0"
sqlc = "1.31.1"
golangci-lint = "2.12.2"
actionlint = "1.7.12"
# actionlint が run スクリプトを検査するために PATH 上で参照する（同梱ではなく別バイナリ）
shellcheck = "0.11.0"
lefthook = "2.1.8"
air = "1.65.3"
golines = "0.13.0"
gofumpt = "0.10.0"
hadolint = "2.14.0"
gitleaks = "8.30.1"

# Go ベース（backend 明示）
"aqua:golang-migrate/migrate" = "4.19.1"
"go:go.uber.org/mock/mockgen" = "0.6.0"
"aqua:go-delve/delve" = "1.26.3"
"aqua:aquasecurity/trivy" = "0.69.3"
"aqua:google/osv-scanner" = "2.4.0"
# 最新は v0.116.1 だが公開 11 日でクールダウン 14 日に満たないため 1 つ前を採る。
"aqua:anchore/grype" = "0.116.0"
# 最新は v2.1.0 だが公開 5 日でクールダウン 14 日に満たないため 1 つ前を採る。
"aqua:Bearer/bearer" = "2.0.2"
"aqua:trufflesecurity/trufflehog" = "3.95.9"
# v0.4.15 が最新。以降リリースが無いだけで、これがクールダウンを満たす最新版である。
"aqua:goodwithtech/dockle" = "0.4.15"
"aqua:sonatype-nexus-community/nancy" = "2.1.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"
"go:github.com/cweill/gotests/gotests" = "1.9.0"
"go:golang.org/x/tools/gopls" = "0.22.0"
"go:github.com/josharian/impl" = "1.5.0"
"go:golang.org/x/tools/cmd/godoc" = "0.1.0-deprecated"
"go:codeberg.org/tslocum/godoc-static" = "1.0.0"
"go:github.com/google/capslock/cmd/capslock" = "0.3.2"

# Rust ベース（backend 明示）
"aqua:zizmorcore/zizmor" = "1.26.1"

# OCaml ベース（backend 明示）
# 最新は v1.26.0 だが公開 2 日でクールダウン 14 日に満たないため 1 つ前を採る。
"aqua:opengrep/opengrep" = "1.25.0"

# Node ベース
"npm:@redocly/cli" = "2.31.4"
"npm:markdownlint-cli2" = "0.22.1"
"npm:@commitlint/cli" = "21.0.2"
"npm:lockfile-lint" = "5.0.0"
# docs-viewer（ドキュメントポータルのビューアー）の依存解決に使う。aqua backend ではなく
# npm backend を指定するのは、pnpm の公開元が npm レジストリであり、cooldown の窓を
# レジストリ側（7 日）で測るのが実態に合うため。
"npm:pnpm" = "11.18.0"

# Python ベース
uv = "0.11.27"
# Python 実装だが実行環境を同梱した単体バイナリで配布されるため、python/*.in ではなく
# aqua backend で入れる。
# 最新は 3.3.9 だが公開 7 日でクールダウン 14 日に満たないため 1 つ前を採る。
"aqua:bridgecrewio/checkov" = "3.3.8"

# Docker イメージのバージョン。[tools] は mise の解決対象専用のため [env] で宣言する。
[env]
OTEL_LGTM_VERSION = "0.28.0"
