services:
  api-server:
    container_name: go-api-server
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: local
    tty: true
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8080:8080"   # APIポート
      - "2345:2345"   # デバッグ(dlv)ポート
    profiles:
      - development
  go-generator: # Goコード生成ツール
    container_name: go-code-generator
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: go-tools
    tty: true
    volumes:
      - .:/app
    working_dir: /app
    command: ["go", "generate", "-x", "./..."]
    depends_on:
      - swagger-bundler
    profiles:
      - development
      - generate
  swagger-bundler: # OpenAPIスキーマのバンドルツール
    container_name: swagger-oapi-bundler
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: node-tools
    tty: true
    volumes:
      - .:/app
    working_dir: /app
    command: ["swagger-cli","bundle", "openapi/openapi.yaml", "--type", "yaml", "-o", "openapi/openapi.gen.yaml"]
    profiles:
      - development
      - generate
  redoc-generator: # OpenAPIドキュメント生成ツール
    container_name: redoc-docs-generator
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: node-tools
    tty: true
    command: ["redocly", "build-docs", "openapi/openapi.yaml", "--output", "/app/openapi/docs/index.html"]
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - swagger-bundler
    profiles:
      - development
      - generate
