services:
# -------------------------------------
# 開発環境のサービス
# -------------------------------------
  api_server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: tooling
      secrets:
        - github_token
    ports:
      # ホスト公開ポートは DB スロットプール（cmd/db-slot）が worktree 毎に割り当てる（既定 8080/2345/6060）。
      # 複数 worktree で同時に make serve するための分離。コンテナ内部は常に固定。
      - "${API_HOST_PORT:-8080}:8080"   # APIポート
      - "${DLV_HOST_PORT:-2345}:2345"   # デバッグ(dlv)ポート
      - "${PPROF_HOST_PORT:-6060}:6060" # メトリクス(pprof)ポート
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    stdin_open: true
    working_dir: /app
    depends_on:
      database:
        condition: service_healthy
      mock_auth_server:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage_init:
        condition: service_completed_successfully
    profiles:
      - development

  database: # PostgreSQLデータベース
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    ports:
      # 固定ポートを持つ共有インフラ（database / observability / garage）は、全 checkout が
      # 単一プロジェクト gobp-shared の 1 インスタンスを共有する。worktree の並列化は
      # per-worktree のデータベース（wt<N>_local / wt<N>_test）で行う（cmd/db-slot）。
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./docker/database/sql:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    user: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - database
      - tools

  observability:
    image: grafana/otel-lgtm:0.28.0@sha256:10f48eb2f8670134df542177bb19536c55421b089e43f9dfc2a27d4c078204d8
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "3200:3200" # Tempo API（任意・スクリプト確認用）
    profiles:
      - development

  mock_auth_server: # 疑似 OIDC 認証サーバー（JWT Test Provider）
    build:
      context: .
      dockerfile: docker/mock-auth-server/Dockerfile
    ports:
      # mock 認証サーバーのホスト公開ポートもスロット毎に割り当てる（既定 4000、内部は常に 4000）。
      - "${MOCK_AUTH_HOST_PORT:-4000}:4000"
    environment:
      # issuer はホスト OS / ブラウザから参照する URL。JWKS 取得はコンテナ名で内部解決する
      # （Go 側 AUTH_JWKS_URL=http://mock_auth_server:4000/.well-known/jwks.json）。
      OIDC_PORT: "4000"
      OIDC_ISSUER: "http://localhost:4000"
      OIDC_AUDIENCE: "go-boilerplate-api"
      OIDC_CLIENT_ID: "go-boilerplate-client"
      # /bypass/* ・ /admin/* を有効化（opt-out。無効化は "disabled"）。本番モードでは server が起動を拒否する。
      MOCK_AUTH_DEV_ENDPOINTS: "enabled"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - auth

  garage: # S3 互換オブジェクトストレージ（ローカル開発用。テストは gofakes3 in-process を使う）
    build:
      context: .
      dockerfile: docker/garage/Dockerfile
    entrypoint: ["/usr/local/bin/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/garage", "-c", "/etc/garage.toml", "status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - tools

  garage_init: # Garage の初期プロビジョニング（レイアウト / バケット / アクセスキー・冪等・one-shot）
    build:
      context: .
      dockerfile: docker/garage/Dockerfile
    entrypoint: ["/bin/sh", "/usr/local/bin/garage-init.sh"]
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      # garage server が生成したノード鍵を CLI が読むため meta を共有する。
      - garage_meta:/var/lib/garage/meta
    environment:
      OBJECT_STORAGE_BUCKET: gobp-local
      OBJECT_STORAGE_ACCESS_KEY_ID: GK1234567890abcdef12345678
      OBJECT_STORAGE_SECRET_ACCESS_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
    restart: "no"
    profiles:
      - development
      - tools

# -------------------------------------
# 補助サービス
# -------------------------------------

  docs_viewer: # 開発用ドキュメントビューア
    build:
      context: .
      dockerfile: docker/document/Dockerfile
      target: document_viewer
    ports:
      # API スロットプール帯（8080+N）と衝突しないよう 7000 番台へ退避（内部は常に 80）。
      - "7001:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    profiles:
      - tools

  sql_editor:
    image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    ports:
      # API スロットプール帯（8080+N）と衝突しないよう 7000 番台へ退避（内部は常に 8081）。
      - "7000:8081"
    environment:
      DATABASE_URL: postgres://postgres:postgres-password@database:5432/local?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - tools
      - database

  er_diagram_generator: # ER図生成ツール
    image: schemaspy/schemaspy:7.0.2@sha256:c8f98116a5cfe4b00b379eeb23b2022cdea4c9192cbccb843a75049e752479b7
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5433:3000"
    volumes:
      - ./docker/database/schemaspy/schemaspy.properties:/schemaspy.properties
      - ./docs/er-diagram:/output
    profiles:
      - generate

# -------------------------------------
# ツールランナー
# user: root は必須。mise を /root 配下に配置しており、非 root では mise/各ツールを解決できないため。
# bind mount 経由の生成物は root 所有になるが、pkg/*/mock 等と同様に容認している。
# -------------------------------------

  go_tool_runner: # Goベースツールボックス
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: go_tools
      secrets:
        - github_token
    user: root
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ""
    profiles:
      - generate

  node_tool_runner: # Node.jsベースのツールボックス
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: node_tools
      secrets:
        - github_token
    user: root
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      # node_modules を匿名ボリュームで保持（バインドマウントの shadow 回避）
      - /app/scripts/node_modules
    working_dir: /app
    entrypoint: ""
    profiles:
      - generate

  python_tool_runner: # Pythonベースのツールボックス
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: python_tools
      secrets:
        - github_token
    user: root
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ""
    profiles:
      - generate

secrets:
  # mise が GitHub Releases API を認証付きで引くためのトークン（ビルド時のみ利用し、イメージには残らない）。
  # 値は make が解決して環境変数で渡す。空文字の場合はビルド側が未認証へフォールバックする。
  github_token:
    environment: GITHUB_TOKEN

volumes:
  pg_data:
    external: false
  garage_meta:
    external: false
  garage_data:
    external: false
