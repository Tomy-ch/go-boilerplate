services:
# -------------------------------------
# 開発環境のサービス
# -------------------------------------
  api_server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: tooling
    ports:
      - "8080:8080"   # APIポート
      - "2345:2345"   # デバッグ(dlv)ポート
      - "6060:6060"   # メトリクス(pprof)ポート
    volumes:
      - .:/app
    # OTel テレメトリ(traces/metrics)の送出口。別リポジトリの Grafana stack(Collector)へホスト経由で送る。
    # 既定は無効(OTEL_*_EXPORTER 未設定=no-op)。Grafana stack 起動後に
    #   OTEL_TRACES_EXPORTER=otlp OTEL_METRICS_EXPORTER=otlp docker compose --profile development up
    # のように渡すと、ホストに公開された Collector(既定 host.docker.internal:4318)へ送出する。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    tty: true
    stdin_open: true
    working_dir: /app
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - development

  database: # PostgreSQLデータベース
    image: postgres:18.3-bookworm
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./docker/database/sql:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    user: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    profiles:
      - development
      - database
      - tools

# -------------------------------------
# 補助サービス
# -------------------------------------

  docs_viewer: # 開発用ドキュメントビューア
    build:
      context: .
      dockerfile: docker/document/Dockerfile
      target: document_viewer
    ports:
      - "8082:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    profiles:
      - tools

  sql_editor:
    image: sosedoff/pgweb:latest
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://postgres:postgres-password@database:5432/local?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - tools

  er_diagram_generator: # ER図生成ツール
    image: schemaspy/schemaspy:latest
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5433:3000"
    volumes:
      - ./docker/database/schemaspy/schemaspy.properties:/schemaspy.properties
      - ./docs/er-diagram:/output
    profiles:
      - generate

# -------------------------------------
# ツールランナー
# user: root は必須。mise を /root 配下に配置しており、非 root では mise/各ツールを解決できないため。
# bind mount 経由の生成物は root 所有になるが、pkg/*/mock 等と同様に容認している。
# -------------------------------------

  go_tool_runner: # Goベースツールボックス
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: go_tools
    user: root
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ""
    profiles:
      - generate

  node_tool_runner: # Node.jsベースのツールボックス
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: node_tools
    user: root
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      # node_modules を匿名ボリュームで保持（バインドマウントの shadow 回避）
      - /app/scripts/node_modules
    working_dir: /app
    entrypoint: ""
    profiles:
      - generate

  python_tool_runner: # Pythonベースのツールボックス
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: python_tools
    user: root
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ""
    profiles:
      - generate

volumes:
  pg_data:
    external: false
