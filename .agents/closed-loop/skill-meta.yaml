# Closed loop — per-skill usage class and opportunity predicate.
#
# THIS FILE IS A SKILL ARTIFACT, NOT DOCUMENTATION. It is read by the closed-loop aggregation
# when it judges whether a skill is earning its place. Humans are not the audience; the
# human-facing output is the weekly report and the retrospective that follows it.
#
# Why this exists: call count alone is a trap. Measured over thirty days, 20 of the 42 skills in
# this repository were never invoked once — and that set is almost entirely `scaffold-*`,
# `go-upgrade`, `release-notes` and their kind. Those are not unused; they are skills whose
# occasion did not arise in that window. Deleting a skill because nobody called it would remove
# the whole scaffolding suite the first time a month passed without a new endpoint.
#
# So a skill is judged against its class, and where possible against its opportunities rather
# than its calls.
#
# usage_class
#   frequent     Judged on call count, unique sessions, and opportunity coverage.
#   situational  Judged on Called / Opportunity. Raw count means little.
#   lifecycle    Fires on an event (a release, a runtime upgrade). Judged per event, not per week.
#   automatic    Invoked by a hook or workflow rather than a person. Judged on success rate.
#   safety       Rare by design. Frequency is NOT the measure; being present when needed is.
#
# opportunity_predicate
#   A statement of "this window could have used the skill", written against what a window
#   already records: the tool calls in its transcript, the files it changed, and its pull
#   request. `null` means no such statement exists — and null is the honest answer far more
#   often than it is comfortable. There is no general way to observe an opportunity; it has to
#   be written per skill or not at all.
#
#   **These are prose, and nothing executes them yet.** They are written to be mechanically
#   evaluable — each names an observable fact rather than a judgement — but the evaluator does
#   not exist, so coverage is not computed and this file is read by people. Saying so here
#   matters: a reader who assumes the numbers are live would trust a coverage figure that is
#   not being produced.
#
#   Worked example, `commit`: the predicate is "a `git commit` appeared in the window's Bash
#   calls". Because `/commit` runs `git commit` internally, the meaningful set is the windows
#   where the commit happened WITHOUT the skill. Measured: 142 windows had a commit, 70 used the
#   skill, 72 did not — coverage ≈ 49 %. That number is the kind of finding this file exists for.
#
# Call counts are deliberately NOT recorded here. They are derived data the loop computes on
# every run; a hand-maintained copy would be stale the day after it was written.
#
# Field reference
#   skill                  directory name under `.claude/skills/`.
#   usage_class            one of the five above.
#   opportunity_predicate  prose, mechanically evaluable, or null.

skills:
