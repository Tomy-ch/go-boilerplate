# Which document governs an edit, keyed by where the edit lands.
#
# THIS FILE IS A HOOK ARTIFACT, NOT DOCUMENTATION. `doc-router.sh` reads it on every edit and
# names the matching documents to whoever is about to write. It is not a reading list for a
# human; the reading procedure is AGENTS.md's Task Execution Protocol, and this file never
# restates it.
#
# Line-based on purpose: the hook shell parses this on every edit and may not assume jq,
# a YAML parser, or any other dependency. One entry per line, `<glob> = <doc>[, <doc>...] # <why>`:
#
#   glob   A shell glob matched against the repository-relative path, `*` crossing `/`.
#          First match wins, so order from most specific to least.
#   doc    A repository-relative path that must exist. Checked by scripts/doc-ref-lint.
#   why    One clause naming the decision that document owns. It is emitted verbatim, so
#          write what the reader could not have guessed from the document's name.
#
# INCOMPLETENESS IS NOT A DEFECT. A path with no entry produces no output, and the agent
# resolves the question the way it does today — by opening the indexes per the protocol. So
# this file never needs to enumerate anything: add a line only where the name of the owning
# document does not contain the words someone would search for. A WRONG entry is the only
# defect, and the existence check catches the wrong half of it.
#
# The nearest ancestor README is NOT listed here. It is derived by walking up, so it needs
# no table and cannot go stale.

internal/infrastructure/rdb/* = docs/design/data-access-pattern.md # decides Repository vs QueryService vs CommandService for a given read or write
internal/usecase/* = docs/design/data-access-pattern.md # the same gate decides which of them a usecase may depend on
database/dml/* = docs/design/data-access-pattern.md # the DML categories are the same split, seen from the SQL side
database/migrations/* = docs/adr/0027-append-only-immutable-migrations.md, docs/adr/0028-sequential-migration-ids.md # existing migrations are immutable and the numbering is sequential
internal/controller/handler/* = docs/design/rest.md # timeouts, body limits, deadline budget and transaction retry are decided here, not per handler
internal/infrastructure/auth/* = docs/design/auth.md # authentication is fail-closed outside local/ci/test, by construction rather than by convention
internal/infrastructure/authz/* = docs/design/security.md # authorization denies by default, and the stub refuses to construct outside non-production
internal/controller/worker/* = docs/design/worker.md # pull-ack and graceful drain are the engine's contract, not the handler's choice
internal/controller/outbox/* = docs/design/outbox.md # relay, replay and GC are one lifecycle; a change to any of the three moves the others
internal/observability/* = docs/design/observability.md # what is emitted, and at which layer, is config-driven rather than call-site-driven
