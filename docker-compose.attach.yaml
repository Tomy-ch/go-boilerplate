# app 層の override（全 checkout / worktree 共通）。api_server / mock_auth_server だけを checkout 毎の
# compose プロジェクトへ起動し、固定ポートを持つ共有インフラ（database / observability / garage /
# elasticmq）は gobp-shared の 1 インスタンスを host-gateway 経由で参照する。ホスト公開ポートは DB スロット保持時に
# 8080+N / 4000+N へずれ、未取得なら既定値のままなので main checkout も同じ経路で起動できる。
services:
  api_server:
    ports: !override
      - "${API_HOST_PORT:-8080}:8080" # APIポート
      - "${DLV_HOST_PORT:-2345}:2345" # デバッグ(dlv)ポート
      - "${PPROF_HOST_PORT:-6060}:6060" # メトリクス(pprof)ポート
    depends_on: !override # 共有インフラは infra 層で起動済みのため app 層では待たない
      mock_auth_server:
        condition: service_healthy
    # 共有インフラへの接続先。loader.go は実行時 env を env/.env より優先するため、
    # コンテナ名前提の既定値（database / observability / garage）をホスト公開ポート経由に差し替える。
    environment:
      DB_HOST: host.docker.internal
      DB_NAME: ${DB_NAME_LOCAL:-local}
      OBS_OTLP_ENDPOINT: http://host.docker.internal:4318
      OBJECT_STORAGE_ENDPOINT: http://host.docker.internal:3900
      # sample-api:begin
      # SQS クライアントは BaseEndpoint を優先するため、ここを差し替えれば OUTBOX_QUEUE_URL の
      # ホスト部（elasticmq:9324）は接続先の解決に使われない。
      OUTBOX_QUEUE_ENDPOINT: http://host.docker.internal:9324
      # sample-api:end
      # token の iss は mock 認証サーバーのホスト公開 URL。スロット毎にポートがずれるため追従させる。
      AUTH_ISSUER: http://localhost:${MOCK_AUTH_HOST_PORT:-4000}

  mock_auth_server:
    environment:
      OIDC_ISSUER: http://localhost:${MOCK_AUTH_HOST_PORT:-4000}
